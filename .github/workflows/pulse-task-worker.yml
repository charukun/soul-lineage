name: PULSE task worker
on:
  push:
    branches: [fix/pulse-environment-consistency]
    paths:
      - '.task-tools/pulse-apply.mjs'
      - '.github/workflows/pulse-task-worker.yml'
permissions:
  contents: write
concurrency:
  group: pulse-task-worker
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'charukun/soul-lineage' && github.ref == 'refs/heads/fix/pulse-environment-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply checked task edits and run focused verification
        run: |
          node .task-tools/pulse-apply.mjs
          node --check scripts/deploy.mjs
          node --check scripts/vite-app.mjs
          node --check ops-board/worker.mjs
          node --check ops-board/public/app-board.js
          node --test tests/pulse-*.test.mjs tests/ops-applications.test.mjs tests/ops-board.test.mjs tests/deployment.test.mjs
          git diff --check
      - name: Commit application changes to the same feature branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/pulse-environment-consistency
          # Workflow updates use the separately authorized GitHub connector.
          # The Actions contents token must not attempt workflow-scope writes.
          git restore --source=HEAD -- .github/workflows
          rm .task-tools/pulse-apply.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete PULSE naming and three-environment application wiring'
          git push origin HEAD:refs/heads/fix/pulse-environment-consistency
          git rev-parse HEAD
