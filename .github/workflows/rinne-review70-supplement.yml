name: RINNE review 70 supplemental native play (temporary)
on:
  push:
    branches: [fix/rinne-playreview70-20260922]
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read
jobs:
  observe:
    if: contains(github.event.head_commit.message, '[rinne-review-before2]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Summarize exact-head state before specialist recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p review70-supplement
          npm run actions:summary -- --repo charukun/soul-lineage --sha "$GITHUB_SHA" --pr 1433 --output review70-supplement/actions-summary.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/review70-supplement.mjs
      - name: Preserve native evidence, including a failed observation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-review70-before-supplement-${{ github.sha }}
          path: review70-supplement/
          if-no-files-found: error
          retention-days: 14
