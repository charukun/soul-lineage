name: Read-only published Review acceptance
on:
  push:
    branches: [audit/review-plan-validation]
    paths: [.github/workflows/review-public-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: review-public-acceptance-37b2745
  cancel-in-progress: false
jobs:
  operate-public-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 37b2745982dfae0252d52b1cb13ee3a6af008839
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Operate actual published Lab and require exact source identity
        env:
          REVIEW_SITE_URL: https://rinne-visual-review.c-okamoto.workers.dev/
          REVIEW_EXPECTED_SHA: 37b2745982dfae0252d52b1cb13ee3a6af008839
        run: node tests/review-plan-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-public-acceptance
          path: test-results/review-plan/
          retention-days: 7
          if-no-files-found: error
