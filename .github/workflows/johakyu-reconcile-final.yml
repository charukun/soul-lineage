name: Johakyu one-shot develop reconcile
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-reconcile-final.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[johakyu-reconcile-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge current develop and leave no task workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Astra"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge --no-edit origin/develop
          rm -f .github/workflows/johakyu-reconcile-final.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(johakyu): remove one-shot reconcile workflow"
          fi
          git push origin HEAD:work/johakyu-p3-p7-20260921
