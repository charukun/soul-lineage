name: Apply Shino v7 PRIMARY hotfix

on:
  push:
    branches:
      - feat/shino-reference-v2-dcc
    paths:
      - scripts/patch-shino-v7-primary-binding.py
      - .github/workflows/shino-v7-primary-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PRIMARY gate fix
        run: python3 scripts/patch-shino-v7-primary-binding.py
      - name: Validate patched sources
        run: |
          python3 -m py_compile scripts/blender/refine-shino-reference-v2-v7.py
          grep -q "DEFORMATION gate" scripts/blender/refine-shino-reference-v2-v7.py
          ! grep -q "Correct body proportions with humanoid bone-length scaling" .github/workflows/shino-reference-dcc.yml
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/blender/refine-shino-reference-v2-v7.py .github/workflows/shino-reference-dcc.yml
          git stash push --include-untracked -m shino-v7-primary-hotfix
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git rm .github/workflows/shino-v7-primary-hotfix.yml scripts/patch-shino-v7-primary-binding.py
          git add scripts/blender/refine-shino-reference-v2-v7.py .github/workflows/shino-reference-dcc.yml
          git commit -m "fix(characters): keep PRIMARY binding visual-only"
          git push origin HEAD:${GITHUB_REF_NAME}
