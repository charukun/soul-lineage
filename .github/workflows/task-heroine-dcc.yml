name: Heroine DCC authoring (task scoped)
on:
  push:
    branches: ['dcc/heroine-dawn']
    paths:
      - 'assets/characters/heroine-dawn/**'
      - '.github/workflows/task-heroine-dcc.yml'
permissions:
  contents: write
concurrency:
  group: heroine-dcc-authoring
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare explicit DCC tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Author and inspect real model
        run: |
          mkdir -p generated/heroine-dawn
          blender --background --python assets/characters/heroine-dawn/build.py -- --source apps/review/public/library/model/c8827661105eef7b2bfbef3bc676d41a47625733/Rogue.glb --out generated/heroine-dawn
      - name: Collect task source context
        if: always()
        run: |
          mkdir -p generated/heroine-dawn/context
          git grep -l -E 'PROTAGONIST_VILLAGER_FEMALE|protagonist.villager.female|female-protagonist-rogue|sourceDisplay' -- '*.js' '*.mjs' '*.json' '*.md' > generated/heroine-dawn/context/paths.txt || true
          tar -czf generated/heroine-dawn/context/source-context.tgz --files-from generated/heroine-dawn/context/paths.txt
          cp package.json generated/heroine-dawn/context/root-package.json
          find scripts -iname '*dcc*' -o -iname '*blender*' -o -iname '*asset*origin*' > generated/heroine-dawn/context/tool-paths.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-dawn-${{ github.sha }}
          path: generated/heroine-dawn
          retention-days: 7
