name: Heroine DCC authoring (task scoped)
on:
  push:
    branches: ['dcc/heroine-dawn']
    paths:
      - 'assets/characters/heroine-dawn/**'
      - '.github/workflows/task-heroine-dcc.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: heroine-dcc-authoring
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct actual walking-clearance defect in reviewed DCC mesh
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p generated/heroine-dawn
          sudo apt-get update -qq > /tmp/heroine-apt.log 2>&1
          sudo apt-get install -y blender python3-numpy >> /tmp/heroine-apt.log 2>&1
          echo 'ebd2ca4c62c66e111f9f67f47c823e10e219c89e4ef76254728386365971aa96  assets/characters/heroine-dawn/source/HeroineDawn.blend' | sha256sum -c
          blender --background assets/characters/heroine-dawn/source/HeroineDawn.blend --python-exit-code 1 --python assets/characters/heroine-dawn/polish.py -- --source apps/review/public/library/model/c8827661105eef7b2bfbef3bc676d41a47625733/Rogue.glb --out generated/heroine-dawn > generated/heroine-dawn/dcc.log 2>&1 || { tail -70 generated/heroine-dawn/dcc.log; exit 1; }
          python3 assets/characters/heroine-dawn/publish-polish.py --out generated/heroine-dawn
      - name: Build actual Character Studio
        env:
          APP_ENV: dev
        run: |
          npm ci > generated/heroine-dawn/npm.log 2>&1 || { tail -70 generated/heroine-dawn/npm.log; exit 1; }
          npm run build --workspace @soul/character-studio > generated/heroine-dawn/build.log 2>&1 || { tail -90 generated/heroine-dawn/build.log; exit 1; }
          npx playwright install --with-deps chromium > generated/heroine-dawn/chromium.log 2>&1 || { tail -60 generated/heroine-dawn/chromium.log; exit 1; }
      - name: Observe real renderer and source animation clips
        env:
          APP_ENV: dev
        run: |
          npm exec --workspace @soul/character-studio -- vite --host 127.0.0.1 --port 5177 --strictPort > generated/heroine-dawn/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5177/ >/dev/null && break; sleep 1; done
          node assets/characters/heroine-dawn/observe.mjs generated/heroine-dawn > generated/heroine-dawn/browser.log 2>&1 || { tail -90 generated/heroine-dawn/browser.log; exit 1; }
          cat generated/heroine-dawn/browser.log
      - name: Commit allowlisted model repair and refreshed observations
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          out=Path('generated/heroine-dawn');i=json.loads((out/'integration.json').read_text());r=json.loads((out/'runtime/receipt.json').read_text());assert not r['errors'];assert r['modelSha256']==i['modelSha256'];assert len(r['poses'])==6
          dst=Path(i['qa'])/'runtime';shutil.copytree(out/'runtime',dst,dirs_exist_ok=True)
          p=Path(i['provenance']);v=json.loads(p.read_text());v['runtimeEvidence']=str(dst/'receipt.json');p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          p=Path('packages/characters/production/protagonist-villager-female-v1.production.json');v=json.loads(p.read_text());v['evidence']['runtimeObservation']={'receiptPath':str(dst/'receipt.json'),'modelSha256':i['modelSha256'],'humanApproval':False,'physicalDevicePerformance':'not-measured'};p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f apps/character-studio/heroine-motion-probe.js
          git diff --exit-code -- apps/review/public/library/model/c8827661105eef7b2bfbef3bc676d41a47625733/Rogue.glb packages/characters/src/kaykit-foundation.js
          mesh=$(node -p "JSON.parse(require('fs').readFileSync('generated/heroine-dawn/integration.json')).meshPath")
          old=$(node -p "JSON.parse(require('fs').readFileSync('generated/heroine-dawn/integration.json')).previousMeshPath")
          git add -f -- "$mesh" assets/characters/heroine-dawn/source docs/characters/qa/heroine-dawn-v1
          git add -u -- "$old"
          git add -- apps/review/public/library/provenance/heroine-dawn-v1.json packages/characters/src/reference-model-catalog.js packages/characters/production/protagonist-villager-female-v1.production.json apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json apps/character-studio/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '女主人公の歩行時スカート貫通を実モデルで修正し再観察'
          git push origin HEAD:dcc/heroine-dawn
          git rev-parse HEAD > generated/heroine-dawn/materialized-head.txt
          git diff HEAD^ HEAD --stat > generated/heroine-dawn/materialized-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-dawn-${{ github.sha }}
          path: generated/heroine-dawn
          retention-days: 7
