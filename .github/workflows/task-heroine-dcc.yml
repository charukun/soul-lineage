name: Heroine DCC authoring (task scoped)
on:
  push:
    branches: ['dcc/heroine-dawn']
    paths:
      - 'assets/characters/heroine-dawn/**'
      - '.github/workflows/task-heroine-dcc.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: heroine-dcc-authoring
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare explicit DCC tool
        run: |
          sudo apt-get update -qq > /tmp/heroine-apt.log 2>&1
          sudo apt-get install -y blender python3-numpy >> /tmp/heroine-apt.log 2>&1
      - name: Retrieve inspected immutable first-pass DCC source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p generated/heroine-round1 generated/heroine-dawn
          gh api repos/charukun/soul-lineage/actions/artifacts/10676142028/zip > /tmp/heroine-round1.zip
          echo 'accd830154c7c954ebfad2ff3fdaab11091c0bc9dd26aa2dd2ca628e0cdd58e3  /tmp/heroine-round1.zip' | sha256sum -c
          unzip -q /tmp/heroine-round1.zip -d generated/heroine-round1
          echo '59e0c87ce8b419810d5541ed1e91b220982f82614322fbea8a48b12f9e4a3716  generated/heroine-round1/HeroineDawn.glb' | sha256sum -c
      - name: Repair reviewed mesh defects and render
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background generated/heroine-round1/HeroineDawn.blend --python-exit-code 1 --python assets/characters/heroine-dawn/finalize.py -- --source apps/review/public/library/model/c8827661105eef7b2bfbef3bc676d41a47625733/Rogue.glb --out generated/heroine-dawn > generated/heroine-dawn/dcc.log 2>&1 || { tail -70 generated/heroine-dawn/dcc.log; exit 1; }
          for f in inspection.json HeroineDawn.glb HeroineDawn.blend front.png three-quarter.png side.png back.png face.png; do test -s generated/heroine-dawn/$f; done
          cat generated/heroine-dawn/inspection.json
      - name: Collect targeted runtime integration context
        if: always()
        run: |
          mkdir -p generated/heroine-dawn/context
          git grep -l -E 'selectKaykitModel|PROTAGONIST_VILLAGER_FEMALE|protagonist.villager.female|KAYKIT_DEFAULT_MODEL_ID' -- 'apps/rinne/**' 'packages/rendering/**' 'tests/**' > generated/heroine-dawn/context/paths.txt || true
          git ls-files scripts/vite-app.mjs scripts/verify-build.mjs packages/rendering/src/review-camera.js >> generated/heroine-dawn/context/paths.txt
          sort -u generated/heroine-dawn/context/paths.txt -o generated/heroine-dawn/context/paths.txt
          tar -czf generated/heroine-dawn/context/source-context.tgz --files-from generated/heroine-dawn/context/paths.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-dawn-${{ github.sha }}
          path: generated/heroine-dawn
          retention-days: 7
