name: RINNE body HUD session (temporary)
# Capability gap: this Chat has no repository filesystem/network or dispatch tool.
# Branch-only bridge to the existing repository evidence/summary scripts.
# Detach: delete this file before the final merge-owning work head; never merge it.
on:
  push:
    branches: [feat/rinne-body-charm-hud-20260922]
permissions:
  contents: read
jobs:
  context:
    if: contains(github.event.head_commit.message, '[body-hud-context]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b7e928572a17a87cd08a3c35d7d5cf446fdd7de0
          persist-credentials: false
      - name: Collect only body HUD source and evidence entrypoint index
        run: |
          mkdir -p /tmp/body-hud-context
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n');
          const wanted=new Set(['package.json','apps/rinne/package.json','apps/rinne/index.html','apps/rinne/src/combat-body-hud.js','apps/rinne/src/combat-body-hud.css','apps/rinne/src/rebuild/combat-choreography.js','scripts/actions-result-summary.mjs']);
          const matches=[];
          for(const f of files){
            if(!/\.(?:js|mjs|css|md|html|json)$/.test(f))continue;
            if(!/^(apps\/rinne\/src\/|tests\/|scripts\/browser\/|docs\/)/.test(f))continue;
            const text=fs.readFileSync(f,'utf8');
            if(/createCombatBodyHud|combatBodyHudModel|combat-body-hud-host/.test(text)){
              wanted.add(f);
              text.split('\n').forEach((line,i)=>{if(/createCombatBodyHud|combat-body-hud-host|\.flash\(/.test(line))matches.push(`${f}:${i+1}: ${line}`);});
            }
          }
          for(const f of wanted){if(!fs.existsSync(f))continue;const to=path.join('/tmp/body-hud-context',f);fs.mkdirSync(path.dirname(to),{recursive:true});fs.copyFileSync(f,to);}
          const index=files.filter(f=>/^(scripts\/browser\/|scripts\/.*(?:browser|evidence|staging)|docs\/.*(?:BROWSER|EVIDENCE|STAGING)|tests\/.*(?:body|combat)|apps\/rinne\/src\/.*(?:hud|style|battle))/.test(f));
          fs.writeFileSync('/tmp/body-hud-context/INDEX.txt',`source=b7e928572a17a87cd08a3c35d7d5cf446fdd7de0\n\n${matches.join('\n')}\n\n${index.join('\n')}\n`);
          console.log(fs.readFileSync('/tmp/body-hud-context/INDEX.txt','utf8'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rinne-body-hud-source-context
          path: /tmp/body-hud-context/
          retention-days: 3
