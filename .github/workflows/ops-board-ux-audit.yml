name: Ops Board read-only UX audit

on:
  push:
    branches: ['audit/ops-board-ux-20260912']
    paths: ['.github/workflows/ops-board-ux-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Extract the pinned read-only audit specification
        run: |
          mkdir -p /tmp/ops-audit
          curl -fsS --retry 2 https://raw.githubusercontent.com/charukun/soul-lineage/03b8bf58526ead84b83f5d151779f94942590a3f/.github/workflows/ops-board-ux-audit.yml > /tmp/ops-audit/spec.yml
          python3 - <<'PY'
          import pathlib, textwrap
          p = pathlib.Path('/tmp/ops-audit')
          text = (p / 'spec.yml').read_text()
          start = text.index("          import { chromium }")
          end = text.index('\n          JS\n', start)
          script = textwrap.dedent(text[start:end])
          old = 'recentActionFailures: state.recentActionFailures } } };'
          assert script.count(old) == 1
          script = script.replace(old, 'recentActionFailures: state.recentActionFailures } };')
          script = script.replace("includes('取得できません'), { timeout: 30000 }", "includes('取得できません'), null, { timeout: 30000 }")
          (p / 'review.mjs').write_text(script + '\n')
          PY
          node --check /tmp/ops-audit/review.mjs
      - name: Prepare isolated browser (no app build or deployment)
        working-directory: /tmp/ops-audit
        run: |
          npm install --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Operate public board without modifying services
        working-directory: /tmp/ops-audit
        run: node review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-board-public-browser-review
          path: /tmp/ops-audit/results/
          retention-days: 7
