name: Temporary Female Protagonist Materializer
on:
  push:
    branches:
      - feat/protagonist-female-v1-20260921
permissions:
  contents: write
jobs:
  materialize:
    if: \${{ !contains(github.event.head_commit.message, '[female-model-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender 4.0.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libice6
          curl -fL --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          echo "/tmp/blender-4.0.2-linux-x64" >> "$GITHUB_PATH"
      - name: Build female protagonist DCC source and GLB
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf generated/protagonist-villager-female-v1
          blender -b assets/characters/protagonist/villager-v1/source/ProtagonistVillagerV1.blend --python scripts/blender/build-protagonist-villager-female-v1.py -- --out generated/protagonist-villager-female-v1
          mkdir -p assets/characters/protagonist/villager-female-v1/source apps/rinne/public/simulator/assets docs/characters/qa/protagonist-villager-female-v1
          cp generated/protagonist-villager-female-v1/source/ProtagonistVillagerFemaleV1.blend assets/characters/protagonist/villager-female-v1/source/
          cp generated/protagonist-villager-female-v1/export/ProtagonistVillagerFemaleV1.glb apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb
          cp generated/protagonist-villager-female-v1/review/*.png docs/characters/qa/protagonist-villager-female-v1/
      - name: Audit and write manifests
        shell: bash
        run: |
          set -euxo pipefail
          blender -b assets/characters/protagonist/villager-female-v1/source/ProtagonistVillagerFemaleV1.blend --python scripts/blender/character-production-audit.py -- --character-id protagonist.villager.female.v1 --out docs/characters/qa/protagonist-villager-female-v1/blender-audit.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          glb=Path('apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb')
          blend=Path('assets/characters/protagonist/villager-female-v1/source/ProtagonistVillagerFemaleV1.blend')
          audit=json.loads(Path('docs/characters/qa/protagonist-villager-female-v1/blender-audit.json').read_text())
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          asset={'schema':'character-asset-integrity','version':1,'id':'protagonist.villager.female.v1','assetId':'character.protagonist-villager-female.v1','format':'glb','path':'./simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb','sha256':h(glb),'bytes':glb.stat().st_size,'productionStage':'PRIMARY','modelingMode':'dcc-blender','sourceBlendSha256':h(blend),'humanoidRig':'kaykit.Rig_Medium.v1','referencePath':'docs/characters/references/protagonist-villager-female-v1.svg','visualApproval':'pending','license':{'rigProvenance':'Derived from repository-local protagonist.villager.v1; KayKit Character Pack Adventures 1.0 Rig_Medium at revision 672074b73ba276876a19e8816ecdc5241817ab47, CC0-1.0.','surfaceAuthorship':'RINNE-authored DCC female variant; existing KayKit-derived surfaces retain CC0 provenance; silhouette, hair locks and waist cloth are RINNE-authored modifications.'}}
          Path('apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json').write_text(json.dumps(asset,ensure_ascii=False,indent=2)+'\n')
          prod={'schema':'character-production','version':2,'id':'protagonist.villager.female.v1','stage':'PRIMARY','modelingMode':'dcc-blender','license':'CC0-1.0','source':{'referencePaths':['docs/characters/references/protagonist-villager-female-v1.svg'],'meshPath':'apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb','integrityPath':'apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json','rigId':'kaykit.Rig_Medium.v1','rigProvenance':asset['license']['rigProvenance'],'dcc':{'tool':'Blender','version':audit.get('dcc',{}).get('version','4.0.2'),'sourcePath':str(blend),'sourceSha256':h(blend)}},'evidence':{'reference':{'intentLocked':True,'views':['front','side','back']},'blockout':{'views':['front','side','back','three-quarter'],'proportionsReviewed':True,'silhouetteReviewed':True,'reviewEvidence':'docs/characters/qa/protagonist-villager-female-v1/'},'primary':{'topologyReviewed':True,'uvReviewed':True,'separateSurfaces':['skin','hair','clothing','source-protagonist-kaykit-parts'],'auditPath':'docs/characters/qa/protagonist-villager-female-v1/blender-audit.json','meshObjects':audit['scene']['meshObjects'],'triangles':audit['scene']['triangles'],'materials':audit['scene']['materials']}},'status':{'visualApproval':'pending','productionReady':False,'licensePolicy':'allowed-cc0','distributionEligible':True,'note':'Female protagonist DCC variant preserves shared Rig_Medium gameplay contract. PRIMARY only; deformation, motion, polish, device performance and explicit human visual approval remain pending.'}}
          Path('packages/characters/production/protagonist-villager-female-v1.production.json').write_text(json.dumps(prod,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit generated DCC outputs
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/protagonist/villager-female-v1 apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.* docs/characters/qa/protagonist-villager-female-v1 packages/characters/production/protagonist-villager-female-v1.production.json
          git commit -m "feat(characters): materialize female protagonist [female-model-generated]"
          git push origin HEAD:feat/protagonist-female-v1-20260921
