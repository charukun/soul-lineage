name: Materialize archived motion packs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-motion-packs.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'fix/materialize-archived-motion-packs-20260920' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch pinned motion packs and verify Git blob IDs
        shell: bash
        run: |
          set -euo pipefail

          fetch_asset() {
            local target="$1"
            local url="$2"
            local expected="$3"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$url" --output "$target"
            local actual
            actual="$(git hash-object "$target")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Git blob mismatch: $target expected=$expected actual=$actual" >&2
              exit 1
            fi
            echo "verified $target $actual"
          }

          fetch_asset             'apps/review/public/library/motion/kaykit-tools/bc9db031f6608ce4b5e2b1c07f3cfae0c9b152a3.glb'             'https://raw.githubusercontent.com/GeorgeQLe/assets-kaykit-3d-characters/af08a62d3669370ec4636ae6314b38cdcd5dd759/assets/kaykit/character-animations-1.1/Animations/gltf/Rig_Medium/Rig_Medium_Tools.glb'             'bc9db031f6608ce4b5e2b1c07f3cfae0c9b152a3'

          fetch_asset             'apps/review/public/library/motion/quaternius-ual1/410b30c617cc3097f7d82e36d4c28ef130f66388.glb'             'https://raw.githubusercontent.com/richardanaya/metaverse-avatar/84fd636910bf713099010efbab7f3c84550f4bcb/anims/UAL1_Standard.glb'             '410b30c617cc3097f7d82e36d4c28ef130f66388'

          fetch_asset             'apps/review/public/library/motion/quaternius-ual2/dc684c2a664927964307e8eb7b27b0000ebf6a18.glb'             'https://raw.githubusercontent.com/richardanaya/metaverse-avatar/84fd636910bf713099010efbab7f3c84550f4bcb/anims/UAL2_Standard.glb'             'dc684c2a664927964307e8eb7b27b0000ebf6a18'

          fetch_asset             'apps/review/public/library/motion/mesh2motion-human-base/3c5b3258af3b982fb922bbc4008296ec4efa8814.glb'             'https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/3ce7f9d97d25e608b4779ce797da343775ded62b/static/animations/human-base-animations.glb'             '3c5b3258af3b982fb922bbc4008296ec4efa8814'

          fetch_asset             'apps/review/public/library/motion/mesh2motion-human-addon/b314ab1a99c546882786b44745915d97f32b6a88.glb'             'https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/3ce7f9d97d25e608b4779ce797da343775ded62b/static/animations/human-addon-animations.glb'             'b314ab1a99c546882786b44745915d97f32b6a88'

          rm -f .github/workflows/materialize-motion-packs.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'chore(motions): materialize archived motion packs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
