name: Task Hi3DGen materialization
on:
  push:
    branches: [feat/rinne-hi3dgen-pipeline-20260922]
permissions:
  contents: write
jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[hi3dgen-materialize]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare explicit specialist tools
        run: |
          python -m pip install -r scripts/tools/hi3dgen/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Generate original input and run accountless inference
        run: |
          mkdir -p .artifacts/hi3dgen
          python -m pip freeze > .artifacts/hi3dgen/python-environment.txt
          test -f assets/generated/hi3dgen/inputs/alchemy-flask.png || python scripts/tools/hi3dgen/sample.py assets/generated/hi3dgen/inputs/alchemy-flask.png
          python scripts/tools/hi3dgen/pipeline.py --request scripts/tools/hi3dgen/sample.request.json
      - name: Commit generated bytes to the same exact work branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          WORK_BRANCH: feat/rinne-hi3dgen-pipeline-20260922
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" --jq .object.sha)" = "$EXPECTED_HEAD"
          git add assets/generated/hi3dgen apps/review/public/library/experimental apps/review/public/library/manifest.json packages/assets/generated/experimental-assets.json
          git diff --cached --quiet && exit 0
          git -c user.name='RINNE Asset Materializer' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Materialize actual accountless Hi3DGen output and provenance'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git push origin "HEAD:refs/heads/$WORK_BRANCH"
          git rev-parse HEAD > .artifacts/hi3dgen/materialized-head.txt
      - name: Preserve actual inference receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hi3dgen-generation-${{ github.sha }}
          path: |
            .artifacts/hi3dgen/
            assets/generated/hi3dgen/inputs/
          include-hidden-files: true
          retention-days: 14
