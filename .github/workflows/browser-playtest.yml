name: Browser Playtest
run-name: Browser playtest ${{ inputs.ref }} [${{ inputs.apps }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to exercise
        required: true
        default: develop
        type: string
      apps:
        description: all or comma-separated rinne,village,demon
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  playtest:
    name: Real browser playtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve exact ref
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Exercise requested apps with native browser input
        env:
          BROWSER_PLAYTEST: ${{ inputs.apps }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ "${BROWSER_PLAYTEST,,}" = "affected" ]; then
            echo '::error::Manual Browser Playtest needs an explicit app list or all; affected has no comparison base.'
            exit 1
          fi
          node scripts/browser/pr-smoke.mjs "$HEAD_SHA" "$HEAD_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-playtest-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: test-results/pr-browser/
          if-no-files-found: error
          retention-days: 14
