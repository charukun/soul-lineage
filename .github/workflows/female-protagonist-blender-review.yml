name: Female Protagonist Blender Review

on:
  push:
    branches:
      - 'work/female-protagonist-blender-refinement-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-round:
    if: ${{ !contains(github.event.head_commit.message, '[skip-female-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: true
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri mesa-utils
          blender --version
      - name: Build round 1
        run: |
          rm -rf generated/female-protagonist/round1
          blender --background assets/characters/protagonist/villager-female-v1/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/polish-protagonist-villager-female-v1-r1.py -- \
            --out generated/female-protagonist/round1
      - name: Build round 2
        run: |
          rm -rf generated/female-protagonist/round2
          blender --background generated/female-protagonist/round1/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/polish-protagonist-villager-female-v1-r2.py -- \
            --out generated/female-protagonist/round2
      - name: Build round 3
        run: |
          rm -rf generated/female-protagonist/round3
          blender --background generated/female-protagonist/round2/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/polish-protagonist-villager-female-v1-r3.py -- \
            --out generated/female-protagonist/round3
      - name: Render round 3 fixed views
        run: |
          blender --background generated/female-protagonist/round3/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/inspect-protagonist-villager-female-v1.py -- \
            --out generated/female-protagonist/round3/review
      - name: Upload round 3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: female-protagonist-round3-${{ github.sha }}
          path: generated/female-protagonist/round3/
          if-no-files-found: error
