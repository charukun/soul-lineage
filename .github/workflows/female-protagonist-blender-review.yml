name: Female Protagonist Blender Review

on:
  push:
    branches:
      - 'work/female-protagonist-blender-refinement-20260921'

permissions:
  contents: write

jobs:
  character-studio-evidence:
    if: ${{ !contains(github.event.head_commit.message, '[skip-female-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.sha }}
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Start Character Studio
        run: |
          npm run dev --workspace @soul/character-studio > /tmp/character-studio.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/character-studio.log
          exit 1
      - name: Capture delivered female GLB in Character Studio
        run: |
          mkdir -p docs/characters/qa/protagonist-villager-female-v1/character-studio
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const out='docs/characters/qa/protagonist-villager-female-v1/character-studio';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context=await browser.newContext({viewport:{width:900,height:1000}});
          const page=await context.newPage();
          const consoleErrors=[];page.on('pageerror',e=>consoleErrors.push(e.message));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const response=await page.goto('http://127.0.0.1:5177/',{waitUntil:'domcontentloaded',timeout:60000});
          if(!response?.ok())throw new Error('Character Studio HTTP '+response?.status());
          await page.waitForFunction(()=>window.characterStudio?.review?.ready===true&&document.body.classList.contains('character-grid-ready'),null,{timeout:120000});
          await page.evaluate(()=>document.querySelector('[data-character-model="protagonist.villager.female.v1"]')?.click());
          await page.waitForFunction(()=>window.characterStudio?.review?.displayModelId==='protagonist.villager.female.v1'&&window.characterStudio.review.ready===true,null,{timeout:120000});
          const views=['front','side','back','face','overview'];
          for(const view of views){
            await page.evaluate(v=>window.characterStudio.review.aim(v),view);
            await page.waitForTimeout(500);
            await page.locator('#stage').screenshot({path:`${out}/${view==='overview'?'full-body':view}.png`});
          }
          const state=await page.evaluate(()=>({displayModelId:window.characterStudio.review.displayModelId,ready:window.characterStudio.review.ready,errors:[...window.characterStudio.review.errors],labels:[...document.querySelectorAll('.character-model-card-label')].map(n=>n.textContent)}));
          state.consoleErrors=consoleErrors;
          state.success=state.displayModelId==='protagonist.villager.female.v1'&&state.ready===true&&state.errors.length===0&&consoleErrors.length===0;
          writeFileSync(`${out}/receipt.json`,JSON.stringify(state,null,2)+'\n');
          if(!state.success)throw new Error(JSON.stringify(state));
          await browser.close();
          NODE
      - name: Commit Character Studio evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/characters/qa/protagonist-villager-female-v1/character-studio
          git commit -m "test: retain Character Studio female protagonist evidence [skip-female-review]"
          git push origin HEAD:work/female-protagonist-blender-refinement-20260921
      - name: Upload Character Studio evidence
        uses: actions/upload-artifact@v4
        with:
          name: female-protagonist-character-studio-${{ github.sha }}
          path: docs/characters/qa/protagonist-villager-female-v1/character-studio/
          if-no-files-found: error
