name: Temporary PR1203 Exact Asset Evidence
run-name: PR1203 specialist asset evidence from ${{ github.sha }}
on:
  push:
    branches: ['work/asset-library-expansion-20260921']
    paths: ['.github/workflows/asset-curation-proof-1203.yml']
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: asset-curation-proof-1203-c13591f1
  cancel-in-progress: false
jobs:
  evidence:
    if: ${{ contains(github.event.head_commit.message, '[asset-proof-1203]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      BASE_SHA: 0a1fdb20b63d5e8b60dbac7807dd936ed6619cec
    steps:
      - name: Resolve final workflow-free exact head
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:1203});
            if(pr.state!=='open'||!pr.draft||pr.base.ref!=='develop'||pr.head.ref!=='work/asset-library-expansion-20260921'||pr.head.repo.full_name!=='charukun/soul-lineage')throw new Error('Unexpected PR identity/state');
            const {data:ref}=await github.rest.git.getRef({...context.repo,ref:'heads/'+pr.head.ref});
            const {data:commit}=await github.rest.git.getCommit({...context.repo,commit_sha:ref.object.sha});
            if(commit.tree.sha!=='c13591f13e2fdca17155f97e2180febd7572d24e'||!commit.message.includes('[astra-validate]')||!commit.parents.some(p=>p.sha===context.sha))throw new Error('Final head not armed or changed');
            core.setOutput('head',ref.object.sha);
            core.info(`Tested exact head: ${ref.object.sha}`);
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.head }}
          fetch-depth: 256
          persist-credentials: false
      - name: Assert exact source and no temporary workflows
        env:
          TEST_HEAD: ${{ steps.source.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_HEAD"
          test ! -e .github/workflows/asset-curation-proof-1203.yml
          test ! -e .github/workflows/asset-library-materialize-20260921.yml
          test ! -e .github/workflows/asset-curation-native-20260921.yml
          test ! -e .github/workflows/asset-completion-20260921.yml
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify every existing library identity preserved
        run: node scripts/assets/verify-curation-preservation.mjs "$BASE_SHA"
      - name: Verify all assets and existing browser reviews
        run: node scripts/browser/curated-assets.mjs
      - name: Assert exact-head evidence and real HTML audio advancement
        env:
          TEST_HEAD: ${{ steps.source.outputs.head }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('.deploy-state/asset-curation-evidence/exact-head-receipt.json','utf8'));
          assert.equal(r.head,process.env.TEST_HEAD);
          assert.equal(r.status,'passed');
          assert.equal(r.assets.length,556);
          assert.ok(r.assets.every(a=>a.status==='passed'));
          assert.equal(r.assets.reduce((n,a)=>n+(a.animations?.length||0),0),165);
          assert.equal(r.errors.length,0);
          assert.equal(r.legacyPreparation?.status,'passed');
          for(const route of ['/review-objects','/review-sound','/review-motion','/review-effects'])assert.ok(r.ui.some(a=>a.route===route&&a.status==='passed'),route);
          const audio=r.ui.filter(a=>a.route==='/review-sound');
          assert.equal(audio.length,3);
          for(const a of audio){
            assert.ok(a.playback.playingEvents>0&&a.playback.advancingSamples>=2&&a.playback.maxCurrentTime>.01);
            assert.ok(a.playback.uiPlayingObserved&&a.playback.paused&&a.playback.loop);
            assert.equal(a.playback.url,a.url);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Exact head ${r.head}: all 556 assets,165 clips,old asset preservation,object/audio/retarget/VFX reviews passed. Audio required actual playing event AND advancing native clock AND visible state, with correct source and pause.\n\nNew own-origin requests use exact checkout materialized bytes before publication, not a claim of live DEV completion.\n`);
          NODE
      - name: Preserve exact-head receipts screenshots and trace
        if: always() && steps.source.outputs.head != ''
        uses: actions/upload-artifact@v4
        with:
          name: asset-curation-exact-head-${{ steps.source.outputs.head }}
          path: .deploy-state/asset-curation-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
