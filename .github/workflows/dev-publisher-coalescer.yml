name: DEV Publisher Coalescer
on:
  push:
    branches: [develop]
permissions:
  contents: read
  actions: write
concurrency:
  group: dev-publisher-coalescer
  cancel-in-progress: true
jobs:
  coalesce:
    name: Coalesce automatic DEV publishers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            const latestSha = branch.commit.sha;
            const activeStates = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
            const automatic = run => run.head_branch === 'develop' &&
              (run.event === 'push' ||
                (run.event === 'workflow_dispatch' && run.display_title === 'DEV Publisher (automatic)'));
            // One bounded snapshot replaces five status-specific workflow-run list calls.
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'deploy.yml',
              branch: 'develop',
              per_page: 100,
            });
            const active = data.workflow_runs.filter(run => activeStates.has(run.status) && automatic(run));
            // Do not kill a publisher that is already building/promoting. Restarting it makes
            // unrelated later merges delay the DEV version that was already minutes from usable.
            // Keep at most one running snapshot plus one latest queued snapshot.
            const running = active.filter(run => run.status === 'in_progress')
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const queued = active.filter(run => run.status !== 'in_progress');
            const latestQueued = queued.filter(run => run.head_sha === latestSha)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const keepQueued = latestQueued[0] || null;
            const cancel = queued.filter(run => run !== keepQueued);
            for (const run of cancel) {
              core.info(`Cancel queued redundant DEV publisher ${run.id} ${run.head_sha}; running publishers finish, queued latest is ${latestSha}`);
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }).catch(error => {
                if (![409, 422].includes(error.status)) throw error;
              });
            }
            core.summary.addRaw(`Latest develop: ${latestSha}\nAutomatic publishers scanned: ${active.length}\nRunning preserved: ${running.length}\nQueued latest preserved: ${keepQueued ? 1 : 0}\nQueued redundant cancelled: ${cancel.length}`).write();
