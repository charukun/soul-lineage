name: DEV Publisher Coalescer
on:
  push:
    branches: [develop]
permissions:
  contents: read
  actions: write
concurrency:
  group: dev-publisher-coalescer
  cancel-in-progress: true
jobs:
  coalesce:
    name: Cancel superseded DEV push publishers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            const latestSha = branch.commit.sha;
            const active = [];
            for (const status of ['queued', 'in_progress', 'waiting', 'requested', 'pending']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'deploy.yml',
                branch: 'develop',
                status,
                per_page: 100,
              }).catch(error => {
                if (error.status === 422) return { data: { workflow_runs: [] } };
                throw error;
              });
              active.push(...data.workflow_runs);
            }
            const stale = [...new Map(active.map(run => [run.id, run])).values()]
              .filter(run => run.event === 'push' && run.head_sha !== latestSha);
            for (const run of stale) {
              core.info(`Cancel superseded DEV publisher ${run.id} ${run.head_sha}; latest is ${latestSha}`);
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }).catch(error => {
                if (![409, 422].includes(error.status)) throw error;
              });
            }
            core.summary.addRaw(`Latest develop: ${latestSha}\nCancelled superseded push publishers: ${stale.length}`).write();
