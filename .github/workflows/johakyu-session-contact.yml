name: Johakyu contact source materialization
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-session-contact.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
      - name: Apply exact reviewed contact patch and remove task inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1939eb8a065d53d60b8624640b2e1c8947c6a64d HEAD
          test -z "$(git diff --name-only 1939eb8a065d53d60b8624640b2e1c8947c6a64d HEAD -- apps/rinne/src/rebuild/combat-core.js packages/tidebreak-combat/index.js)"
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('scripts/tasks/johakyu-p3-contact.patch')
          raw=p.read_text().replace('\n diff --git','\ndiff --git')
          assert hashlib.sha256(raw.encode()).hexdigest()=='3986962afe20b7f7f94e84786d46384384e39ddad6bced55ca3a702f2c073b06'
          p.write_text(raw)
          PY
          git apply --unidiff-zero --check scripts/tasks/johakyu-p3-contact.patch
          git apply --unidiff-zero scripts/tasks/johakyu-p3-contact.patch
          git rm -f scripts/tasks/johakyu-p3-contact.patch .github/workflows/johakyu-session-contact.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rinne/src/rebuild/combat-core.js packages/tidebreak-combat/index.js
          git commit -m 'fix(johakyu): preserve live exchanges across policy and real-time updates'
          git push origin HEAD:work/johakyu-p3-p7-20260921
          git rev-parse HEAD
