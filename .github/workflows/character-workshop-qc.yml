name: Character Workshop isolated quality review
on:
  push:
    branches: [review/character-workshop-qc-20260912]
permissions:
  contents: read
concurrency:
  group: character-workshop-isolated-qc
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8281167ef2f535f5e75a22f016d188b21b4a75b8
          persist-credentials: false
      - name: Export unchanged repository reference asset and license evidence
        run: |
          mkdir -p qc-output
          git rev-parse HEAD > qc-output/source-sha.txt
          sha256sum apps/rinne/public/simulator/assets/SHINO_review.vrm > qc-output/model-sha256.txt
          tar -czf qc-output/shino-reference.tgz apps/rinne/public/simulator/assets/SHINO_review.vrm apps/rinne/public/simulator/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: character-workshop-unchanged-reference
          path: qc-output
          retention-days: 3
