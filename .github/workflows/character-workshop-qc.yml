name: Character Workshop isolated quality review
on:
  push:
    branches: [review/character-workshop-qc-20260912]
permissions:
  contents: read
concurrency:
  group: character-workshop-isolated-qc
  cancel-in-progress: false
jobs:
  committed-character-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6fa2538106fd8ae12bf805393289c16a3339fc80
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the committed character data layer only
        run: |
          mkdir -p qc-output
          git rev-parse HEAD > qc-output/source-sha.txt
          node --version > qc-output/node-version.txt
          node --test packages/characters/tests/*.test.mjs | tee qc-output/character-tests.txt
          npm run check -- rinne village demon | tee qc-output/workspace-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-workshop-committed-qc-validation
          path: qc-output
          retention-days: 7
