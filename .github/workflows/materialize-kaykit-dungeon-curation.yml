name: Temporary KayKit Dungeon materializer
on:
  push:
    branches:
      - asset/kaykit-dungeon-curation-20260920
    paths:
      - .github/workflows/materialize-kaykit-dungeon-curation.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset/kaykit-dungeon-curation-20260920
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize pinned assets
        run: node scripts/materialize-kaykit-dungeon-curation.mjs
      - name: Verify materialized catalog
        run: node --test tests/review-object-library-self-hosted.test.mjs
      - name: Commit final materialized head and remove temporary materializer
        run: |
          rm .github/workflows/materialize-kaykit-dungeon-curation.yml
          rm scripts/materialize-kaykit-dungeon-curation.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize curated KayKit Dungeon assets [astra-validate]" -m "Astra-Test: tests/review-object-library-self-hosted.test.mjs" -m "Astra-Build: rinne"
          git push origin HEAD:asset/kaykit-dungeon-curation-20260920
