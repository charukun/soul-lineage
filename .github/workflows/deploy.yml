name: Deploy DEV and PROD
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      refresh_staging:
        description: 'Refresh pinned validation environments from the verified develop snapshot; retain Production'
        type: boolean
        required: false
        default: false
      full_verification:
        description: 'Run separate full regression / public WebGL2 / P2P diagnostics after DEV publication'
        type: boolean
        required: false
        default: false
      integration_cursor:
        description: 'Internal bounded Ready-queue scan cursor'
        type: string
        required: false
        default: '0'
      repair_scope:
        description: 'Internal browser repair recorder scope (empty or pr)'
        type: string
        required: false
        default: ''
      repair_conclusion:
        description: 'Internal browser result'
        type: string
        required: false
        default: ''
      repair_head_sha:
        description: 'Internal browser-tested head SHA'
        type: string
        required: false
        default: ''
      repair_pr_number:
        description: 'Internal source PR number'
        type: string
        required: false
        default: ''
      repair_run_url:
        description: 'Internal source Actions run URL'
        type: string
        required: false
        default: ''
      repair_artifact:
        description: 'Internal browser artifact name'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  repair-ticket:
    name: Record PR browser repair state
    if: github.event_name == 'workflow_dispatch' && inputs.repair_scope == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.repair_head_sha }}
          persist-credentials: false
      - name: Create/update machine-readable repair ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: ${{ inputs.repair_scope }}
          REPAIR_CONCLUSION: ${{ inputs.repair_conclusion }}
          REPAIR_HEAD_SHA: ${{ inputs.repair_head_sha }}
          REPAIR_PR_NUMBER: ${{ inputs.repair_pr_number }}
          REPAIR_RUN_URL: ${{ inputs.repair_run_url }}
          REPAIR_ARTIFACT: ${{ inputs.repair_artifact }}
        run: node scripts/browser-repair-ticket.mjs

  integrate:
    name: Integrate Ready PRs
    if: github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: integration-develop
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: write
    outputs:
      sha: ${{ steps.queue.outputs.sha }}
      verify: ${{ steps.queue.outputs.verify }}
      retry: ${{ steps.queue.outputs.retry }}
      cursor: ${{ steps.queue.outputs.cursor }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Evaluate Ready PRs and merge eligible heads as one batch
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_DIAGNOSTICS_PATH: .deploy-state/integration-diagnostics.json
          INTEGRATION_TIME_BUDGET_MS: '360000'
          INTEGRATION_EVALUATION_CURSOR: ${{ inputs.integration_cursor || '0' }}
        run: node scripts/integration.mjs
      - name: Refresh Ops Board after merge evaluation
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_BOARD_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$token"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $token" "${OPS_BOARD_URL}api/refresh" >/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            .deploy-state/integration.json
            .deploy-state/integration-diagnostics.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  integration-continuation:
    name: Continue bounded Ready scan
    needs: integrate
    if: >-
      always() && github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      needs.integrate.result == 'success' && needs.integrate.outputs.retry == 'true' &&
      needs.integrate.outputs.verify == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        env:
          CURSOR: ${{ needs.integrate.outputs.cursor }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy.yml',
              ref: 'develop',
              inputs: { integration_cursor: process.env.CURSOR || '0' }
            });

  publish:
    needs: integrate
    if: always() && (github.ref == 'refs/heads/main' || (needs.integrate.result == 'success' && (needs.integrate.outputs.verify == 'true' || inputs.refresh_staging == true)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      browser_outcome: ${{ steps.dev_browser.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest DEV and deployment coordinator
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.sha || 'develop' }}
          path: sources/dev
          persist-credentials: false
      - name: Checkout latest PROD source
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources/prod
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sources/dev/package-lock.json
            sources/prod/package-lock.json
      - name: Plan, build affected apps, retain unchanged published outputs
        id: assemble
        env:
          SITE_URL: https://charukun.github.io/soul-lineage/
          DEPLOY_DEV_ONLY: ${{ github.ref == 'refs/heads/develop' }}
          INITIALIZE_GAME_ENVIRONMENTS: 'true'
          REFRESH_STAGING: ${{ inputs.refresh_staging == true && github.ref == 'refs/heads/develop' }}
        run: node sources/dev/scripts/deploy.mjs sources/dev sources/prod _site "$SITE_URL"
      - name: Refuse a superseded develop snapshot before publishing
        if: github.ref == 'refs/heads/develop'
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ needs.integrate.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            if (data.commit.sha !== process.env.EXPECTED_SHA) core.setFailed('develop advanced; the next Integration run will publish it');
      - uses: actions/configure-pages@v5
        if: steps.assemble.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.assemble.outputs.changed == 'true'
        with:
          path: _site
      - name: Publish changed snapshot
        id: deployment
        if: steps.assemble.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public app URLs, assets and source commits
        if: steps.assemble.outputs.changed == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-live.mjs "$SITE_URL" _site
      - name: Focused DEV browser verification
        id: dev_browser
        if: github.ref == 'refs/heads/develop' && steps.assemble.outputs.changed == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-browser.mjs "$SITE_URL" _site .deploy-state/changed.json
      - name: Preserve DEV browser evidence
        if: always() && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: dev-browser-${{ needs.integrate.outputs.sha }}
          path: sources/dev/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail DEV publication result when focused browser verification failed
        if: steps.dev_browser.outcome == 'failure'
        run: exit 1
      - name: Preserve blocking Production browser verification
        if: github.ref == 'refs/heads/main' && steps.assemble.outputs.changed == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-browser.mjs "$SITE_URL" _site .deploy-state/changed.json
      - name: Keep the exact deployed snapshot for optional diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-published-snapshot
          path: |
            _site/deployment-manifest.json
            .deploy-state/changed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  browser-repair-state:
    name: Record DEV browser repair state
    needs: [integrate, publish]
    if: >-
      always() && github.ref == 'refs/heads/develop' && needs.integrate.result == 'success' &&
      (needs.publish.outputs.browser_outcome == 'success' || needs.publish.outputs.browser_outcome == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - name: Create/update machine-readable repair ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: develop
          REPAIR_CONCLUSION: ${{ needs.publish.outputs.browser_outcome }}
          REPAIR_HEAD_SHA: ${{ needs.integrate.outputs.sha }}
          REPAIR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPAIR_ARTIFACT: dev-browser-${{ needs.integrate.outputs.sha }}
        run: node scripts/browser-repair-ticket.mjs

  result:
    name: Record final develop result
    needs: [integrate, publish]
    if: always() && needs.integrate.result == 'success' && (needs.integrate.outputs.verify == 'true' || inputs.refresh_staging == true)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      actions: write
    steps:
      - uses: actions/github-script@v8
        env:
          FINAL_SHA: ${{ needs.integrate.outputs.sha }}
          RESULT: ${{ needs.publish.result }}
          RETRY: ${{ needs.integrate.outputs.retry }}
          CURSOR: ${{ needs.integrate.outputs.cursor }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.FINAL_SHA,
              context: 'integration/develop',
              state: process.env.RESULT === 'success' ? 'success' : 'failure',
              description: process.env.RESULT === 'success'
                ? 'Fast checks + DEV deploy + HTTP/source + focused browser verification passed'
                : 'DEV delivery/browser verification failed; automatic merges paused until repair',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (process.env.RESULT === 'success' && process.env.RETRY === 'true') {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'deploy.yml',
                ref: 'develop',
                inputs: { integration_cursor: process.env.CURSOR || '0' }
              });
            }
      - name: Refresh Ops Board after DEV deploy result
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_BOARD_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$token"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $token" "${OPS_BOARD_URL}api/refresh" >/dev/null || true

  full-verification:
    name: Optional full regression and public browser diagnostics
    needs: [integrate, publish, result]
    if: >-
      always() && github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      inputs.full_verification == true && needs.integrate.result == 'success' &&
      (needs.publish.result == 'success' || needs.integrate.outputs.verify == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full regression (separate from the DEV delivery gate)
        run: node scripts/validate.mjs full
      - name: Fetch and verify the published snapshot identity
        env:
          EXPECTED_SHA: ${{ needs.integrate.outputs.sha }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const response = await fetch(`https://charukun.github.io/soul-lineage/deployment-manifest.json?run=${process.env.GITHUB_RUN_ID}`);
          assert.equal(response.status, 200);
          const manifest = await response.json();
          assert.equal(manifest.validatedDevelop, process.env.EXPECTED_SHA, 'DEV has advanced; run diagnostics again on latest develop');
          fs.writeFileSync('.deploy-state/deployment-manifest.json', JSON.stringify(manifest));
          fs.writeFileSync('.deploy-state/changed.json', '[]');
          JS
      - name: Public Chromium / WebGL2
        env:
          INTEGRATION_FULL: 'true'
        run: node scripts/verify-browser.mjs https://charukun.github.io/soul-lineage/ .deploy-state .deploy-state/changed.json
      - name: Public three-player P2P raid
        run: node scripts/verify-p2p-browser.mjs https://charukun.github.io/soul-lineage/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record separate diagnostic result
        if: always()
        uses: actions/github-script@v8
        env:
          FINAL_SHA: ${{ needs.integrate.outputs.sha }}
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.FINAL_SHA,
              context: 'verification/full',
              state: process.env.RESULT === 'success' ? 'success' : 'failure',
              description: 'Full regression / public WebGL2 / P2P diagnostics; separate from DEV delivery',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });