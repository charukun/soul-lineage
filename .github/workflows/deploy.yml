name: Deploy DEV and PROD
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Publish current branch snapshot without running Integration'
        type: boolean
        required: false
        default: false
      rescue_mode:
        description: 'Compatibility route to Integration Controller scan'
        type: string
        required: false
        default: ''
      integration_cursor:
        description: 'Compatibility bounded Ready queue cursor'
        type: string
        required: false
        default: '0'
      refresh_staging:
        description: 'Refresh pinned validation environments from verified develop; retain Production'
        type: boolean
        required: false
        default: false
      full_verification:
        description: 'Run separate full regression / public WebGL2 / P2P diagnostics after DEV publication'
        type: boolean
        required: false
        default: false
      repair_scope:
        description: 'Internal browser repair recorder scope (empty or pr)'
        type: string
        required: false
        default: ''
      repair_conclusion:
        description: 'Internal browser result'
        type: string
        required: false
        default: ''
      repair_head_sha:
        description: 'Internal browser-tested head SHA'
        type: string
        required: false
        default: ''
      repair_pr_number:
        description: 'Internal source PR number'
        type: string
        required: false
        default: ''
      repair_run_url:
        description: 'Internal source Actions run URL'
        type: string
        required: false
        default: ''
      repair_artifact:
        description: 'Internal browser artifact name'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  repair-ticket:
    name: Record PR browser repair state
    if: github.event_name == 'workflow_dispatch' && inputs.repair_scope == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - name: Create/update machine-readable repair ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: ${{ inputs.repair_scope }}
          REPAIR_CONCLUSION: ${{ inputs.repair_conclusion }}
          REPAIR_HEAD_SHA: ${{ inputs.repair_head_sha }}
          REPAIR_PR_NUMBER: ${{ inputs.repair_pr_number }}
          REPAIR_RUN_URL: ${{ inputs.repair_run_url }}
          REPAIR_ARTIFACT: ${{ inputs.repair_artifact }}
        run: node scripts/browser-repair-ticket.mjs

  controller:
    name: Integration Controller
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.repair_scope != 'pr' &&
      inputs.publish_only != true && inputs.refresh_staging != true && inputs.full_verification != true
    uses: ./.github/workflows/integration-controller.yml
    with:
      rescue_mode: ${{ inputs.rescue_mode }}
      integration_cursor: ${{ inputs.integration_cursor }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    secrets: inherit

  mark-develop-pending:
    name: Mark DEV delivery pending
    if: >-
      github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      (github.event_name == 'push' || inputs.publish_only == true || inputs.refresh_staging == true || inputs.full_verification == true)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'integration/develop', state: 'pending',
              description: 'DEV Publisher: deploy, HTTP/source and focused browser verification pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

  pulse:
    name: Publish develop PULSE
    if: >-
      github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      (github.event_name == 'push' || inputs.publish_only == true || inputs.refresh_staging == true || inputs.full_verification == true)
    uses: ./.github/workflows/ops-board.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    secrets: inherit

  publish:
    name: Publish application snapshot
    if: >-
      inputs.repair_scope != 'pr' &&
      (github.event_name == 'push' || inputs.publish_only == true || inputs.refresh_staging == true || inputs.full_verification == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      browser_outcome: ${{ steps.dev_browser.outcome }}
      changed: ${{ steps.assemble.outputs.changed }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest DEV and deployment coordinator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/develop' && github.sha || 'develop' }}
          path: sources/dev
          persist-credentials: false
      - name: Checkout latest PROD source
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources/prod
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sources/dev/package-lock.json
            sources/prod/package-lock.json
      - name: Plan, build affected apps, retain unchanged published outputs
        id: assemble
        env:
          SITE_URL: https://charukun.github.io/soul-lineage/
          DEPLOY_DEV_ONLY: ${{ github.ref == 'refs/heads/develop' }}
          INITIALIZE_GAME_ENVIRONMENTS: 'true'
          REFRESH_STAGING: ${{ inputs.refresh_staging == true && github.ref == 'refs/heads/develop' }}
        run: node sources/dev/scripts/deploy.mjs sources/dev sources/prod _site "$SITE_URL"
      - name: Refuse a superseded develop snapshot before publishing
        if: github.ref == 'refs/heads/develop'
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            if (data.commit.sha !== process.env.EXPECTED_SHA) core.setFailed('develop advanced; the next DEV Publisher run owns the newer snapshot');
      - name: Deduplicate identical site bytes before artifact upload
        if: steps.assemble.outputs.changed == 'true'
        run: |
          mkdir -p .deploy-state
          node sources/dev/scripts/site-dedupe.mjs _site | tee .deploy-state/site-dedupe.json
      - uses: actions/configure-pages@v5
        if: steps.assemble.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.assemble.outputs.changed == 'true'
        with:
          path: _site
      - name: Publish changed snapshot
        id: deployment
        if: steps.assemble.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public app URLs, assets and source commits
        if: steps.assemble.outputs.changed == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-live.mjs "$SITE_URL" _site
      - name: Focused DEV browser verification
        id: dev_browser
        if: github.ref == 'refs/heads/develop' && steps.assemble.outputs.changed == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-browser.mjs "$SITE_URL" _site .deploy-state/changed.json
      - name: Preserve DEV browser evidence
        if: always() && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: dev-browser-${{ github.sha }}
          path: sources/dev/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail DEV publication result when focused browser verification failed
        if: steps.dev_browser.outcome == 'failure'
        run: exit 1
      - name: Preserve blocking Production browser verification
        if: github.ref == 'refs/heads/main' && steps.assemble.outputs.changed == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node sources/dev/scripts/verify-browser.mjs "$SITE_URL" _site .deploy-state/changed.json
      - name: Keep exact publication diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-published-snapshot
          path: |
            _site/deployment-manifest.json
            .deploy-state/changed.json
            .deploy-state/site-dedupe.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  browser-repair-state:
    name: Record DEV browser repair state
    needs: publish
    if: >-
      always() && github.ref == 'refs/heads/develop' &&
      (needs.publish.outputs.browser_outcome == 'success' || needs.publish.outputs.browser_outcome == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create/update machine-readable repair ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: develop
          REPAIR_CONCLUSION: ${{ needs.publish.outputs.browser_outcome }}
          REPAIR_HEAD_SHA: ${{ github.sha }}
          REPAIR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPAIR_ARTIFACT: dev-browser-${{ github.sha }}
        run: node scripts/browser-repair-ticket.mjs

  result:
    name: Record final develop result
    needs: publish
    if: >-
      always() && github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      (github.event_name == 'push' || inputs.publish_only == true || inputs.refresh_staging == true || inputs.full_verification == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: write
    steps:
      - uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.publish.result }}
        with:
          script: |
            if (['cancelled','skipped'].includes(process.env.RESULT)) {
              core.notice('Publication was cancelled or superseded; no failed DEV quality result is recorded.');
              return;
            }
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'integration/develop', state: process.env.RESULT === 'success' ? 'success' : 'failure',
              description: process.env.RESULT === 'success'
                ? 'DEV deploy + HTTP/source + focused browser verification passed'
                : 'DEV delivery/browser verification failed; automatic normal merges paused until repair',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - uses: actions/checkout@v6
        if: needs.publish.result == 'success'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Notify verified DEV delivery
        id: notify
        if: needs.publish.result == 'success'
        continue-on-error: true
        env:
          FINAL_SHA: ${{ github.sha }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node scripts/notify-delivery.mjs DEV_DEPLOYED
      - name: Record notification health
        if: needs.publish.result == 'success'
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ steps.notify.outputs.channel }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        with:
          script: |
            const channel = process.env.CHANNEL || (process.env.NOTIFY_OUTCOME === 'failure' ? 'failed' : 'not-configured');
            const state = channel === 'ntfy' ? 'success' : channel === 'not-configured' ? 'error' : 'failure';
            const description = channel === 'ntfy' ? 'ntfy smartphone delivery confirmed' : channel === 'not-configured'
              ? 'NTFY_TOPIC_URL is not configured; smartphone delivery unconfirmed'
              : 'ntfy delivery failed; GitHub remains authoritative';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'notification/ntfy', state, description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - name: Wake one recovery scan after verified DEV
        if: needs.publish.result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'deploy.yml', ref: 'develop', inputs: { rescue_mode: 'scan' } });
      - name: Refresh Ops Board after DEV deploy result
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_BOARD_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$token"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $token" "${OPS_BOARD_URL}api/refresh" >/dev/null || true

  canary:
    name: Control-plane end-to-end canary
    needs: [pulse, publish, result]
    if: >-
      always() && github.ref == 'refs/heads/develop' && needs.publish.result == 'success' &&
      needs.result.result == 'success' && needs.pulse.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify DEV / PULSE / notification evidence coherently
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ github.sha }}
          SITE_URL: https://charukun.github.io/soul-lineage/
          OPS_BOARD_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: node scripts/integration-control-canary.mjs

  full-verification:
    name: Optional full regression and public browser diagnostics
    needs: [publish, result]
    if: >-
      always() && github.ref == 'refs/heads/develop' && inputs.repair_scope != 'pr' &&
      inputs.full_verification == true && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full regression (separate from DEV delivery gate)
        run: node scripts/validate.mjs full
      - name: Fetch and verify published snapshot identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const response = await fetch(`https://charukun.github.io/soul-lineage/deployment-manifest.json?run=${process.env.GITHUB_RUN_ID}`);
          assert.equal(response.status, 200);
          const manifest = await response.json();
          assert.equal(manifest.validatedDevelop, process.env.EXPECTED_SHA, 'DEV has advanced; run diagnostics again on latest develop');
          fs.writeFileSync('.deploy-state/deployment-manifest.json', JSON.stringify(manifest));
          fs.writeFileSync('.deploy-state/changed.json', '[]');
          JS
      - name: Public Chromium / WebGL2
        env:
          INTEGRATION_FULL: 'true'
        run: node scripts/verify-browser.mjs https://charukun.github.io/soul-lineage/ .deploy-state .deploy-state/changed.json
      - name: Public three-player P2P raid
        run: node scripts/verify-p2p-browser.mjs https://charukun.github.io/soul-lineage/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record separate diagnostic result
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'verification/full', state: process.env.RESULT === 'success' ? 'success' : 'failure',
              description: 'Full regression / public WebGL2 / P2P diagnostics; separate from DEV delivery',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
