name: Johakyu task source checkout
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-resume-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: contains(github.event.head_commit.message, '[johakyu-resume-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export bounded source snapshots and merge inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/johakyu-source
          git fetch origin develop
          python3 - <<'PY'
          import pathlib, subprocess, json, zipfile
          out=pathlib.Path('/tmp/johakyu-source')
          def git(*args): return subprocess.check_output(['git',*args])
          work=git('rev-parse','HEAD').decode().strip()
          develop=git('rev-parse','origin/develop').decode().strip()
          base=git('merge-base',work,develop).decode().strip()
          prefixes=('apps/rinne/src/','apps/rinne/tests/','apps/review/src/','apps/review/tests/','packages/johakyu-combat/','packages/johakyu-presentation/','packages/tidebreak-combat/','packages/shared-ui/','scripts/browser/','scripts/astra/','docs/rinne/JOHAKYU_')
          exact={'AGENTS.md','package.json','package-lock.json','apps/rinne/package.json','apps/review/package.json','apps/rinne/vite.config.js','apps/review/vite.config.js','docs/rinne/MAIN_GAME.md','docs/BROWSER_PLAYTEST_ROUTING.md','docs/BROWSER_SELF_HEALING.md','scripts/astra-focused-validation.mjs','scripts/astra-fast-dev-contract.mjs','.github/workflows/astra-work-validation.yml'}
          changes=git('diff','--name-status',base,work).decode()
          upstream=git('diff','--name-status',base,develop).decode()
          changed={line.split('\t')[-1] for line in changes.splitlines()}
          exact.update(changed)
          with zipfile.ZipFile(out/'source-snapshots.zip','w',zipfile.ZIP_DEFLATED) as z:
            for label,ref in [('work',work),('develop',develop),('base',base)]:
              for path in git('ls-tree','-r','--name-only',ref).decode().splitlines():
                if path in exact or (label!='base' and path.startswith(prefixes)):
                  data=git('show',f'{ref}:{path}')
                  if len(data)>1000000: continue
                  z.writestr(f'{label}/{path}',data)
          receipt={'work':work,'develop':develop,'mergeBase':base,'workChanges':changes,'developChanges':upstream,'workTree':git('rev-parse',work+'^{tree}').decode().strip(),'developTree':git('rev-parse',develop+'^{tree}').decode().strip()}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: johakyu-current-source-recovery
          path: /tmp/johakyu-source/
          retention-days: 3
