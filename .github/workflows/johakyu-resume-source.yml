name: Johakyu task source checkout
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-resume-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: contains(github.event.head_commit.message, '[johakyu-resume-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Formal ordered P1 through P4 contract evidence
        run: |
          mkdir -p /tmp/johakyu-source
          node --test apps/review/tests/johakyu-observation.test.mjs > /tmp/johakyu-source/P1.txt
          node --test packages/johakyu-combat/test/sequence.test.mjs apps/review/tests/johakyu-sequence.test.mjs > /tmp/johakyu-source/P2.txt
          node --test packages/johakyu-combat/test/domain.test.mjs apps/review/tests/johakyu-physiology.test.mjs apps/rinne/tests/johakyu-physiology.test.mjs > /tmp/johakyu-source/P3.txt
          node --test packages/johakyu-combat/test/motion-contract.test.mjs apps/review/tests/johakyu-catalog.test.mjs apps/rinne/tests/johakyu-technique-contract.test.mjs apps/rinne/tests/johakyu-contact-clock.test.mjs > /tmp/johakyu-source/P4.txt
      - name: Native authored mesh and dependency receipt
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, zipfile,struct
          manifest=json.loads(pathlib.Path('apps/review/src/nocturne/manifest.json').read_text())
          report={}
          for name,row in manifest['models'].items():
            if not name.startswith(('adventurers/','skeletons/')): continue
            data=pathlib.Path('apps/review/public/library',row['path']).read_bytes()
            length,kind=struct.unpack_from('<II',data,12)
            doc=json.loads(data[20:20+length]);report[name]={'nodes':[n.get('name') for n in doc.get('nodes',[])],'meshes':[m.get('name') for m in doc.get('meshes',[])]}
          pathlib.Path('/tmp/johakyu-source/models.json').write_text(json.dumps(report,indent=2))
          pathlib.Path('/tmp/johakyu-source/head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          with zipfile.ZipFile('/tmp/johakyu-source/dependencies.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for p in pathlib.Path('node_modules/three').rglob('*'):
              if p.is_file(): archive.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: johakyu-phase-evidence-and-meshes
          path: /tmp/johakyu-source/
          retention-days: 3
