name: Integration Rescue
on:
  workflow_call:
permissions:
  contents: read
jobs:
  coordinator:
    name: Plan Rescue Wave
    if: github.repository == 'charukun/soul-lineage' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: integration-rescue-coordinator
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      issues: read
      statuses: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_workers: ${{ steps.plan.outputs.has_workers }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Bound queue scan and atomically reserve independent workers
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_CONFIGURED: 'true'
          MAX_RESCUE_CONCURRENCY: ${{ vars.MAX_RESCUE_CONCURRENCY || '4' }}
          MAX_RESCUE_ATTEMPTS: ${{ vars.MAX_RESCUE_ATTEMPTS }}
          RESCUE_DIAGNOSTICS_PATH: .deploy-state/rescue-api.json
          RESCUE_COORDINATOR: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/integration-rescue-coordinator.mjs
      - name: Notify Coordinator failure without depending on GitHub state availability
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node scripts/integration-rescue-return.mjs --coordinator-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-rescue-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy-state/rescue-*.json
          include-hidden-files: true
          retention-days: 7

  worker:
    name: Rescue PR ${{ matrix.pr }}
    needs: coordinator
    if: needs.coordinator.outputs.has_workers == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.coordinator.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.coordinator.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: integration-rescue-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      statuses: read
    env:
      RESCUE_PR: ${{ matrix.pr }}
      RESCUE_ID: ${{ matrix.rescueId }}
      RESCUE_WORKER_ID: ${{ matrix.workerId }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.head }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Recheck claim, head, develop, reviews and dependencies
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs prepare work "$RUNNER_TEMP/rescue/context.json"
      - name: Isolate validation from the immutable trusted wrapper
        run: |
          sudo useradd --create-home rescue-agent
          sudo chown -R "rescue-agent:$(id -gn)" work
          sudo chmod -R g+rwX work
          sudo chown -R root:root control
          sudo chmod -R a-w control
          rescue_parent="$GITHUB_WORKSPACE"
          while [ "$rescue_parent" != / ]; do
            sudo chmod o+x "$rescue_parent"
            rescue_parent="$(dirname "$rescue_parent")"
          done
          chmod a+rx "$RUNNER_TEMP" "$RUNNER_TEMP/rescue"
          chmod a+r "$RUNNER_TEMP/rescue/"*
      - name: Heartbeat the live worker lease
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node control/scripts/integration-rescue-worker.mjs heartbeat work "$RUNNER_TEMP/rescue/context.json" > "$RUNNER_TEMP/rescue/heartbeat.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rescue/heartbeat.pid"
      - name: Verify the safe base update and stage its exact commit for Work push
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_VALIDATION_USER: rescue-agent
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs finish work "$RUNNER_TEMP/rescue/context.json"
      - name: Preserve failure state and fence this lease
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs fail work "$RUNNER_TEMP/rescue/context.json"
      - name: Stop heartbeat
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rescue/heartbeat.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/rescue/heartbeat.pid")" 2>/dev/null || true
          fi
      - name: Return this worker immediately and notify actionable failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-return.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-rescue-pr-${{ matrix.pr }}-${{ matrix.rescueId }}
          path: ${{ runner.temp }}/rescue/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  return:
    name: Return repaired heads to normal Integration
    needs: [coordinator, worker]
    if: always() && needs.coordinator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: integration-rescue-return
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Aggregate return, delivery tracking and actionable notifications
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/integration-rescue-return.mjs

  code-health:
    name: Code Health maintenance
    needs: return
    if: always() && needs.return.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: code-health-maintenance
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    env:
      REPORT_FILE: ${{ runner.temp }}/code-health-report.json
      MARKER_FILE: ${{ runner.temp }}/code-health-task-start.md
      BODY_FILE: ${{ runner.temp }}/code-health-pr-body.md
      DISPATCH_FILE: ${{ runner.temp }}/code-health-dispatch.json
    steps:
      - name: Checkout current develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Audit source health
        id: audit
        run: |
          node scripts/code-health.mjs audit --json "$REPORT_FILE" --markdown "$GITHUB_STEP_SUMMARY"
          actionable=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(String(Boolean(r.summary?.actionable)));" "$REPORT_FILE")
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"
      - name: Check in-flight refactor and cooldown
        id: active
        if: steps.audit.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --base develop --limit 100 --json headRefName,createdAt,state)
          count=$(printf '%s' "$pulls" | jq '[.[] | select(.state == "OPEN" and (.headRefName | startswith("dispatch/code-health-")))] | length')
          latest=$(printf '%s' "$pulls" | jq -r '[.[] | select(.headRefName | startswith("dispatch/code-health-")) | .createdAt] | sort | last // ""')
          cooldown=false
          if [ -n "$latest" ]; then
            cooldown=$(node --input-type=module -e "const age=Date.now()-Date.parse(process.argv[1]); process.stdout.write(String(Number.isFinite(age) && age < 72*60*60*1000));" "$latest")
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "cooldown=$cooldown" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "An automatic Code Health refactor is already open; this audit will not create another." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$cooldown" = "true" ]; then
            echo "The previous automatic Code Health refactor is less than 72 hours old; this audit will not create another yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build focused refactor request
        id: request
        if: >-
          steps.audit.outputs.actionable == 'true' &&
          steps.active.outputs.count == '0' &&
          steps.active.outputs.cooldown != 'true'
        run: |
          node scripts/code-health-dispatch.mjs "$REPORT_FILE" "$MARKER_FILE" "$BODY_FILE" > "$DISPATCH_FILE"
          slug=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(r.slug);" "$DISPATCH_FILE")
          title=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(r.title);" "$DISPATCH_FILE")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Bootstrap one RINNE Dispatch Draft PR
        id: dispatch
        if: steps.request.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_GITHUB_TOKEN || secrets.RESCUE_GITHUB_TOKEN }}
          SLUG: ${{ steps.request.outputs.slug }}
          PR_TITLE: ${{ steps.request.outputs.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::Code Health found an actionable hotspot, but DISPATCH_GITHUB_TOKEN/RESCUE_GITHUB_TOKEN is not configured. Audit succeeded; automatic refactor was not started.'
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'Automatic dispatch skipped: event-capable handoff credential is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="dispatch/code-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SLUG}"
          marker=".task-start/code-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          mkdir -p .task-start
          cp "$MARKER_FILE" "$marker"
          git add "$marker"
          git commit -m 'chore: bootstrap automatic Code Health refactor'
          gh auth setup-git
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base develop --head "$branch" --title "$PR_TITLE" --body-file "$BODY_FILE")
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created one RINNE Dispatch Draft PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Record audit-only result
        if: >-
          steps.audit.outputs.actionable != 'true' ||
          steps.active.outputs.count != '0' ||
          steps.active.outputs.cooldown == 'true'
        run: |
          if [ "${{ steps.audit.outputs.actionable }}" != "true" ]; then
            echo 'No actionable hotspot crossed the configured threshold.' >> "$GITHUB_STEP_SUMMARY"
          fi
