name: Integration Rescue
on:
  workflow_call:
permissions:
  contents: read
jobs:
  coordinator:
    name: Plan Rescue Wave
    if: github.repository == 'charukun/soul-lineage' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: integration-rescue-coordinator
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      issues: read
      statuses: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_workers: ${{ steps.plan.outputs.has_workers }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Bound queue scan and atomically reserve independent workers
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_CONFIGURED: 'true'
          MAX_RESCUE_CONCURRENCY: ${{ vars.MAX_RESCUE_CONCURRENCY_V2 || '6' }}
          MAX_RESCUE_ATTEMPTS: ${{ vars.MAX_RESCUE_ATTEMPTS }}
          RESCUE_DIAGNOSTICS_PATH: .deploy-state/rescue-api.json
          RESCUE_COORDINATOR: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/integration-rescue-coordinator.mjs
      - name: Notify Coordinator failure without depending on GitHub state availability
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node scripts/integration-rescue-return.mjs --coordinator-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-rescue-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy-state/rescue-*.json
          include-hidden-files: true
          retention-days: 7

  virtual-train:
    name: Validate Virtual Integration Train
    needs: coordinator
    if: needs.coordinator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: integration-virtual-train
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Assemble independent exact-head PRs on an ephemeral branch
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_RESCUE_CONCURRENCY: ${{ needs.coordinator.outputs.max_parallel }}
          RESCUE_COORDINATOR: 'true'
        run: node scripts/integration-virtual-train.mjs plan .deploy-state/virtual-train.json
      - uses: actions/checkout@v6
        if: steps.plan.outputs.has_train == 'true'
        with:
          ref: ${{ steps.plan.outputs.branch }}
          path: train
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.plan.outputs.has_train == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: train/package-lock.json
      - name: Install synthetic train dependencies
        if: steps.plan.outputs.has_train == 'true'
        working-directory: train
        run: npm ci
      - name: Validate combined train tree
        id: fast
        if: steps.plan.outputs.has_train == 'true'
        continue-on-error: true
        working-directory: train
        env:
          TRAIN_BASE: ${{ steps.plan.outputs.base }}
          TRAIN_HEAD: ${{ steps.plan.outputs.commit }}
        run: node scripts/validate.mjs fast "$TRAIN_BASE" "$TRAIN_HEAD"
      - name: Install Chromium for combined affected smoke
        if: steps.plan.outputs.has_train == 'true' && steps.fast.outcome == 'success'
        working-directory: train
        run: npx playwright install --with-deps chromium
      - name: Browser-check the combined train tree
        id: browser
        if: steps.plan.outputs.has_train == 'true' && steps.fast.outcome == 'success'
        continue-on-error: true
        working-directory: train
        env:
          TRAIN_BASE: ${{ steps.plan.outputs.base }}
          TRAIN_HEAD: ${{ steps.plan.outputs.commit }}
        run: node scripts/browser/pr-smoke.mjs "$TRAIN_BASE" "$TRAIN_HEAD"
      - name: Record exact synthetic-tree evidence and remove ephemeral branch
        if: always() && hashFiles('.deploy-state/virtual-train.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_FAST: ${{ steps.fast.outcome || 'skipped' }}
          TRAIN_BROWSER: ${{ steps.browser.outcome || 'skipped' }}
          MAX_RESCUE_CONCURRENCY: ${{ needs.coordinator.outputs.max_parallel }}
        run: node scripts/integration-virtual-train.mjs finalize .deploy-state/virtual-train.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-virtual-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy-state/virtual-train.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  worker:
    name: Rescue PR ${{ matrix.pr }}
    needs: coordinator
    if: needs.coordinator.outputs.has_workers == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.coordinator.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.coordinator.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: integration-rescue-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      statuses: read
    env:
      RESCUE_PR: ${{ matrix.pr }}
      RESCUE_ID: ${{ matrix.rescueId }}
      RESCUE_WORKER_ID: ${{ matrix.workerId }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.head }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Recheck claim, head, develop, reviews and dependencies
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs prepare work "$RUNNER_TEMP/rescue/context.json"
      - name: Isolate validation from the immutable trusted wrapper
        run: |
          sudo useradd --create-home rescue-agent
          sudo chown -R "rescue-agent:$(id -gn)" work
          sudo chmod -R g+rwX work
          sudo chown -R root:root control
          sudo chmod -R a-w control
          rescue_parent="$GITHUB_WORKSPACE"
          while [ "$rescue_parent" != / ]; do sudo chmod o+x "$rescue_parent"; rescue_parent="$(dirname "$rescue_parent")"; done
          chmod a+rx "$RUNNER_TEMP" "$RUNNER_TEMP/rescue"
          chmod a+r "$RUNNER_TEMP/rescue/"*
      - name: Heartbeat the live worker lease
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node control/scripts/integration-rescue-worker.mjs heartbeat work "$RUNNER_TEMP/rescue/context.json" > "$RUNNER_TEMP/rescue/heartbeat.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rescue/heartbeat.pid"
      - name: Verify the safe base update and stage its exact commit for Work push
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_VALIDATION_USER: rescue-agent
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs finish work "$RUNNER_TEMP/rescue/context.json"
      - name: Preserve failure state and fence this lease
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-worker.mjs fail work "$RUNNER_TEMP/rescue/context.json"
      - name: Stop heartbeat
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rescue/heartbeat.pid" ]; then kill "$(cat "$RUNNER_TEMP/rescue/heartbeat.pid")" 2>/dev/null || true; fi
      - name: Return this worker immediately and notify actionable failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node control/scripts/integration-rescue-return.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-rescue-pr-${{ matrix.pr }}-${{ matrix.rescueId }}
          path: ${{ runner.temp }}/rescue/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  return:
    name: Return repaired heads to normal Integration
    needs: [coordinator, worker]
    if: always() && needs.coordinator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: integration-rescue-return
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Aggregate return, reconcile dependency stacks and notify actionable failures
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/integration-rescue-return.mjs
      - name: Signal quarantined exact heads for deep AI repair
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration-quarantine-signal.mjs
      - name: Record verified DEV delivery latency for all tracked PRs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration-flow-delivery.mjs