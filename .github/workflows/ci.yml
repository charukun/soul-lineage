name: PR Checks
# Validation and browser diagnostics are independent. Fast Lane may merge after the
# exact-head fast artifact succeeds; browser smoke continues asynchronously.
run-name: >-
  CI ${{ (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review","converted_to_draft"]'), github.event.action)) && 'validation' || 'observation' }} #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
env:
  NOTIFY_LOCALE: ${{ vars.NOTIFY_LOCALE || 'ja' }}
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review","converted_to_draft"]'), github.event.action)) && 'validation' || 'observation' }}
  cancel-in-progress: true
jobs:
  readiness:
    name: Resolve current PR state
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      ready: ${{ steps.current.outputs.ready }}
      draft: ${{ steps.current.outputs.draft }}
    steps:
      - id: current
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const current = pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha;
            core.setOutput('ready', current && !pr.draft);
            core.setOutput('draft', current && pr.draft);

  request-rescue:
    name: Request Rescue observation
    needs: readiness
    if: >-
      github.event.pull_request.base.ref == 'develop' && needs.readiness.outputs.ready == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
      statuses: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: scripts
      - name: Record Ready handoff without waiting for CI
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        with:
          script: |
            const { existsSync } = require('node:fs');
            if (!existsSync('scripts/implementation-handoff.mjs')) {
              core.notice('Handoff recorder is not on develop yet; existing Ready/Rescue events own this bootstrap PR.');
              return;
            }
            const { recordHandoff } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/implementation-handoff.mjs`);
            const result = await recordHandoff({ github, repo: context.repo,
              number: context.payload.pull_request.number,
              expectedHead: context.payload.pull_request.head.sha,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              notification: { url: process.env.NTFY_TOPIC_URL, token: process.env.NTFY_TOKEN },
              warn: message => core.warning(message) });
            core.summary.addRaw(JSON.stringify(result)).write();
      - uses: actions/github-script@v8
        with:
          script: |
            const file = await github.rest.repos.getContent({ ...context.repo, path: 'scripts/integration-rescue-coordinator.mjs', ref: 'develop' }).catch(error => {
              if (error.status === 404) return null;
              throw error;
            });
            if (file) await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'deploy.yml', ref: 'develop', inputs: { rescue_mode: 'scan' } });

  draft-check:
    name: Draft lightweight check
    needs: readiness
    if: github.event.pull_request.base.ref == 'develop' && needs.readiness.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace only (no install, build or deploy)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  build:
    name: Validate and build
    needs: readiness
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' &&
      needs.readiness.outputs.ready == 'true' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      effective_base: ${{ steps.base.outputs.sha }}
      stack_reused: ${{ steps.stack-fast.outputs.reuse }}
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts
            ops-board
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Reuse exact Rescue fast verification when the trusted evidence matches
        id: rescue-fast
        if: >-
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f control/scripts/integration-rescue-fast-evidence.mjs ]; then
            echo 'Trusted reuse verifier is not on develop yet; run normal fast CI for this bootstrap PR.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node control/scripts/integration-rescue-fast-evidence.mjs
      - name: Reuse exact parent stack evidence only when the parent head is an ancestor
        id: stack-fast
        if: >-
          steps.rescue-fast.outputs.reuse != 'true' &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f control/scripts/integration-stack-ci.mjs ]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'reason=STACK_NATIVE_BOOTSTRAP_FALLBACK' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node control/scripts/integration-stack-ci.mjs
      - name: Resolve exact validation base
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          STACK_REUSE: ${{ steps.stack-fast.outputs.reuse }}
          STACK_BASE: ${{ steps.stack-fast.outputs.base_sha }}
        run: |
          if [ "$STACK_REUSE" = "true" ] && [[ "$STACK_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$STACK_BASE" >> "$GITHUB_OUTPUT"
            echo "Stack-native CI: validate child delta from trusted parent $STACK_BASE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sha=$EVENT_BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Cheap gate-cost preflight before dependency install
        id: gate-cost
        if: steps.rescue-fast.outputs.reuse != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node control/scripts/integration-gate-cost.mjs work "$BASE_SHA" "$HEAD_SHA"
      - name: Resolve exact PR head and affected workspaces
        id: plan
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/affected.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
        working-directory: work
        if: >-
          steps.rescue-fast.outputs.reuse != 'true' &&
          (steps.plan.outputs.has_apps == 'true' || steps.plan.outputs.has_packages == 'true' || steps.plan.outputs.infrastructure == 'true')
      - name: Fast verification (shared tests run once)
        if: steps.rescue-fast.outputs.reuse != 'true'
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate.mjs fast "$BASE_SHA" "$HEAD_SHA"
      - name: Record PR/head identity for Integration
        working-directory: work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESCUE_FAST_REUSED: ${{ steps.rescue-fast.outputs.reuse }}
          RESCUE_RUN_ID: ${{ steps.rescue-fast.outputs.run_id }}
          RESCUE_TESTED_TREE: ${{ steps.rescue-fast.outputs.tested_tree }}
          STACK_FAST_REUSED: ${{ steps.stack-fast.outputs.reuse }}
          STACK_PARENT: ${{ steps.stack-fast.outputs.parent }}
          STACK_PARENT_HEAD: ${{ steps.stack-fast.outputs.parent_head }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('.deploy-state/pr-fast.json', JSON.stringify({pr:process.env.PR_NUMBER,head:process.env.HEAD_SHA,base:process.env.BASE_SHA,eventBase:process.env.EVENT_BASE_SHA,source:process.env.RESCUE_FAST_REUSED==='true'?'integration-rescue':process.env.STACK_FAST_REUSED==='true'?'stack-native-ci':'ci',rescueRun:process.env.RESCUE_RUN_ID||null,testedTree:process.env.RESCUE_TESTED_TREE||null,stackParent:process.env.STACK_PARENT||null,stackParentHead:process.env.STACK_PARENT_HEAD||null}));"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-fast-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: work/.deploy-state/pr-fast.json
          overwrite: true
          retention-days: 14

  integration-request:
    name: Request Integration
    needs: [readiness, build]
    if: >-
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'failure' ||
      (needs.build.result == 'skipped' && (github.event_name == 'pull_request_review' ||
      contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)))) &&
      github.event.pull_request.base.ref == 'develop' &&
      needs.readiness.outputs.ready == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'develop' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== context.payload.pull_request.head.sha) return;
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'deploy.yml', ref: 'develop' });

  browser:
    name: Affected browser smoke
    needs: build
    if: >-
      github.event_name == 'pull_request' && needs.build.result == 'success' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run affected mobile/WebGL browser smoke
        env:
          BASE_SHA: ${{ needs.build.outputs.effective_base || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/browser/pr-smoke.mjs "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-browser-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: test-results/pr-browser/
          if-no-files-found: ignore
          retention-days: 14

  browser-repair-dispatch:
    name: Dispatch browser repair state
    needs: [build, browser]
    if: >-
      always() && github.event_name == 'pull_request' && needs.build.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'failure') &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v8
        env:
          CONCLUSION: ${{ needs.browser.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT: pr-browser-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        with:
          script: |
            try {
              await github.rest.repos.getContent({ ...context.repo, path: 'scripts/browser-repair-ticket.mjs', ref: 'develop' });
            } catch (error) {
              if (error.status === 404) {
                core.notice('Browser repair recorder is not installed on develop yet; bootstrap dispatch skipped.');
                return;
              }
              throw error;
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'deploy.yml', ref: 'develop',
              inputs: {
                repair_scope: 'pr', repair_conclusion: process.env.CONCLUSION,
                repair_head_sha: process.env.HEAD_SHA, repair_pr_number: process.env.PR_NUMBER,
                repair_run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                repair_artifact: process.env.ARTIFACT
              }
            });
            // Compatibility wake for the bootstrap transition: the old develop Integration
            // may still require browser success. Once Fast Lane is live this becomes a harmless
            // extra event because current GitHub state is always re-read.
            if (process.env.CONCLUSION === 'success') {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'deploy.yml', ref: 'develop'
              });
            }
