name: CI
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Validate and build
    if: contains(fromJSON('["develop", "main"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Resolve exact PR head and affected workspaces
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/affected.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
        if: steps.plan.outputs.has_apps == 'true' || steps.plan.outputs.has_packages == 'true' || steps.plan.outputs.infrastructure == 'true'
      - name: Fast verification (shared tests run once)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate.mjs fast "$BASE_SHA" "$HEAD_SHA"
      - name: Record PR/head identity for Integration
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('.deploy-state/pr-fast.json', JSON.stringify({pr:process.env.PR_NUMBER,head:process.env.HEAD_SHA,base:process.env.BASE_SHA}));"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-fast-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .deploy-state/pr-fast.json
          overwrite: true
          retention-days: 14

  browser:
    name: Affected browser smoke
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run affected mobile/WebGL browser smoke
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/browser/pr-smoke.mjs "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-browser-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: test-results/pr-browser/
          if-no-files-found: ignore
          retention-days: 14

  browser-repair-state:
    name: Record browser repair state
    needs: [build, browser]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.build.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'failure') &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create/update machine-readable repair ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: pr
          REPAIR_CONCLUSION: ${{ needs.browser.result }}
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPAIR_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPAIR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPAIR_ARTIFACT: pr-browser-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: node scripts/browser-repair-ticket.mjs

  integration-request:
    name: Request Integration
    needs: [build, browser]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped') &&
      github.event.pull_request.base.ref == 'develop' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'develop' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== context.payload.pull_request.head.sha) return;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo, workflow_id: 'deploy.yml', ref: 'develop'
                });
                return;
              } catch (error) {
                if (attempt === 2 || (error.status && error.status < 500 && error.status !== 429)) throw error;
                await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
              }
            }
