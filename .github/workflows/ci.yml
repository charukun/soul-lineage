name: CI
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Resolve exact PR head and affected workspaces
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/affected.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci
        if: steps.plan.outputs.has_apps == 'true' || steps.plan.outputs.has_packages == 'true' || steps.plan.outputs.infrastructure == 'true'
      - name: Fast verification (shared tests run once; no browser or deployment)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate.mjs fast "$BASE_SHA" "$HEAD_SHA"
      - name: Record PR/head identity for Integration
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('.deploy-state/pr-fast.json', JSON.stringify({pr:process.env.PR_NUMBER,head:process.env.HEAD_SHA,base:process.env.BASE_SHA}));"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-fast-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .deploy-state/pr-fast.json
          overwrite: true
          retention-days: 14
  integration-request:
    name: Request Integration
    needs: build
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Existing deploy.yml is registered on main. Dispatch explicitly selects develop;
      # workflow_run/schedule would require changing the default branch's workflows.
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'deploy.yml', ref: 'develop'
            });
