name: PR Checks
# Develop PRs use deterministic no-test checks/build as the automatic gate.
# Draft develop events do not allocate validation runners; Ready exact heads own the gate.
# Tests and browser/gameplay verification are opt-in on develop and remain available on Production routes.
run-name: CI validation #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  request-rescue:
    name: Record Ready handoff
    if: >-
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.base.ref == 'develop' && github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: scripts
      - name: Record Ready handoff without waiting for CI
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        with:
          script: |
            const { existsSync } = require('node:fs');
            if (!existsSync('scripts/implementation-handoff.mjs')) {
              core.notice('Handoff recorder is not on develop yet; existing Ready/Integration events own this bootstrap PR.');
              return;
            }
            const { recordHandoff } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/implementation-handoff.mjs`);
            const result = await recordHandoff({ github, repo: context.repo,
              number: context.payload.pull_request.number,
              expectedHead: context.payload.pull_request.head.sha,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              notification: { url: process.env.NTFY_TOPIC_URL, token: process.env.NTFY_TOKEN },
              warn: message => core.warning(message) });
            core.summary.addRaw(JSON.stringify(result)).write();

  build:
    name: Validate and build
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      (github.event.pull_request.base.ref == 'develop' && github.event.pull_request.draft == false &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      effective_base: ${{ steps.base.outputs.sha }}
      stack_reused: ${{ steps.stack-fast.outputs.reuse }}
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts
            ops-board
            packages/world
            packages/assets
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Bind trusted DEV validator to exact PR dependencies
        if: github.event.pull_request.base.ref == 'develop'
        run: ln -s ../work/node_modules control/node_modules
      - name: Reuse exact Rescue fast verification when the trusted evidence matches
        id: rescue-fast
        if: >-
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f control/scripts/integration-rescue-fast-evidence.mjs ]; then
            echo 'Trusted reuse verifier is not on develop yet; run normal DEV CI for this bootstrap PR.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node control/scripts/integration-rescue-fast-evidence.mjs
      - name: Reuse exact parent stack evidence only when the parent head is an ancestor
        id: stack-fast
        if: >-
          steps.rescue-fast.outputs.reuse != 'true' &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f control/scripts/integration-stack-ci.mjs ]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'reason=STACK_NATIVE_BOOTSTRAP_FALLBACK' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node control/scripts/integration-stack-ci.mjs
      - name: Resolve exact validation base
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          STACK_REUSE: ${{ steps.stack-fast.outputs.reuse }}
          STACK_BASE: ${{ steps.stack-fast.outputs.base_sha }}
        run: |
          if [ "$STACK_REUSE" = "true" ] && [[ "$STACK_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$STACK_BASE" >> "$GITHUB_OUTPUT"
            echo "Stack-native CI: validate child delta from trusted parent $STACK_BASE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sha=$EVENT_BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch exact validation base only
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          # Bootstrap only while develop's trusted preflight still needs a merge base.
          if grep -Fq '${base}...${head}' ../control/scripts/integration-gate-cost.mjs; then
            depth=16
            while ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; do
              if [ "$depth" -gt 256 ]; then
                echo 'Unable to recover a merge base for the trusted legacy preflight' >&2
                exit 1
              fi
              git fetch --no-tags --deepen="$depth" origin "$HEAD_SHA"
              depth=$((depth * 2))
            done
          fi
      - name: Check exact patch whitespace
        if: github.event.pull_request.base.ref == 'develop'
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Cheap gate-cost preflight before dependency install
        id: gate-cost
        if: steps.rescue-fast.outputs.reuse != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node control/scripts/integration-gate-cost.mjs work "$BASE_SHA" "$HEAD_SHA"
      - name: Resolve exact PR head and affected workspaces
        id: plan
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$TARGET_BASE" = "develop" ]; then
            node ../control/scripts/affected.mjs "$BASE_SHA" "$HEAD_SHA" dev
          else
            node scripts/affected.mjs "$BASE_SHA" "$HEAD_SHA"
          fi
      - run: npm ci
        working-directory: work
        if: >-
          steps.rescue-fast.outputs.reuse != 'true' &&
          (github.event.pull_request.base.ref == 'main' || steps.plan.outputs.has_apps == 'true' || steps.plan.outputs.infrastructure == 'true')
      - name: DEV no-test validation or main fast verification
        if: steps.rescue-fast.outputs.reuse != 'true'
        working-directory: work
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$TARGET_BASE" = "develop" ]; then
            node ../control/scripts/validate.mjs dev "$BASE_SHA" "$HEAD_SHA"
          else
            node scripts/validate.mjs fast "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Record PR/head identity for Integration
        working-directory: work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESCUE_FAST_REUSED: ${{ steps.rescue-fast.outputs.reuse }}
          RESCUE_RUN_ID: ${{ steps.rescue-fast.outputs.run_id }}
          RESCUE_TESTED_TREE: ${{ steps.rescue-fast.outputs.tested_tree }}
          STACK_FAST_REUSED: ${{ steps.stack-fast.outputs.reuse }}
          STACK_PARENT: ${{ steps.stack-fast.outputs.parent }}
          STACK_PARENT_HEAD: ${{ steps.stack-fast.outputs.parent_head }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('.deploy-state/pr-fast.json', JSON.stringify({pr:process.env.PR_NUMBER,head:process.env.HEAD_SHA,base:process.env.BASE_SHA,eventBase:process.env.EVENT_BASE_SHA,source:process.env.RESCUE_FAST_REUSED==='true'?'integration-rescue':process.env.STACK_FAST_REUSED==='true'?'stack-native-ci':'ci',rescueRun:process.env.RESCUE_RUN_ID||null,testedTree:process.env.RESCUE_TESTED_TREE||null,stackParent:process.env.STACK_PARENT||null,stackParentHead:process.env.STACK_PARENT_HEAD||null}));"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-fast-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: work/.deploy-state/pr-fast.json
          overwrite: true
          retention-days: 14

  merge-ready:
    name: Merge verified Ready PRs
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.event.pull_request.base.ref == 'develop' && github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/integration-controller.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
      issues: write
    secrets: inherit

  pulse-result-refresh:
    name: Refresh PULSE after PR checks
    needs: [build, merge-ready]
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pulse-refresh.yml
    with:
      source_sha: ${{ github.event.pull_request.base.sha }}
      reason: pr-event
      fail_on_error: false
      record_public_status: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    secrets: inherit
