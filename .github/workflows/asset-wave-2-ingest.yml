name: Asset Wave 2 Ingest

on:
  push:
    branches:
      - feat/asset-wave-2-environment-vfx
    paths:
      - .github/workflows/asset-wave-2-ingest.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-wave-2-environment-vfx
          fetch-depth: 0
      - name: Fetch and verify curated upstream assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          nature_zip="$tmp/kenney_nature-kit.zip"
          nature_url='https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$nature_url" -o "$nature_zip"
          echo 'fa7974a0d342bfe63c38664ba9f8ec1a4aab8ea25f099bdc56870e33588c4d9d  '"$nature_zip" | sha256sum --check --strict
          unzip -q "$nature_zip" -d "$tmp/nature"

          nature_out='apps/village/public/assets/vendor/kenney-nature'
          mkdir -p "$nature_out"
          copy_nature() {
            local rel="$1" out="$2" expected="$3"
            local src
            src="$(find "$tmp/nature" -type f -path "*/$rel" -print -quit)"
            test -n "$src"
            cp "$src" "$nature_out/$out"
            echo "$expected  $nature_out/$out" | sha256sum --check --strict
          }
          copy_nature 'License.txt' 'License.txt' 'cb96b75e3560ac78d7a53ce6f083f4cdb5c53faea6141b62d63458dcfe1e4b9d'
          copy_nature 'Models/GLTF format/tree_oak.glb' 'tree_oak.glb' 'd7fd8773674928c50c11b66d12c636d49bdcc15a8b1c7fbb98e6f63a3439a3f3'
          copy_nature 'Models/GLTF format/tree_default.glb' 'tree_default.glb' '562d29638c902de3c7bee465d3a53bb77117efbc392ae04ed894faf6b5dc691d'
          copy_nature 'Models/GLTF format/rock_largeA.glb' 'rock_largeA.glb' '6dd15390fd96501dcd1454765a17ba61dbbd8d47705dfe5149c8dd92b353ce25'
          copy_nature 'Models/GLTF format/rock_smallA.glb' 'rock_smallA.glb' 'df9fff9d711e61370e8df0caa2514c89b8f8a8dc6c6fafaf4eb2ec79c5ae07c1'
          copy_nature 'Models/GLTF format/sign.glb' 'sign.glb' 'c658c21672ecd63c5d3e53f06f875d68e6509edb1ab7e3b75374df7c61e7dd0c'

          cat > "$nature_out/MANIFEST.json" <<'JSON'
          {
            "schema": 1,
            "pack": "Kenney Nature Kit",
            "version": "2.1",
            "license": "CC0-1.0",
            "officialPage": "https://kenney.nl/assets/nature-kit",
            "officialArchive": "https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip",
            "officialArchiveSha256": "fa7974a0d342bfe63c38664ba9f8ec1a4aab8ea25f099bdc56870e33588c4d9d",
            "files": {
              "License.txt": "cb96b75e3560ac78d7a53ce6f083f4cdb5c53faea6141b62d63458dcfe1e4b9d",
              "tree_oak.glb": "d7fd8773674928c50c11b66d12c636d49bdcc15a8b1c7fbb98e6f63a3439a3f3",
              "tree_default.glb": "562d29638c902de3c7bee465d3a53bb77117efbc392ae04ed894faf6b5dc691d",
              "rock_largeA.glb": "6dd15390fd96501dcd1454765a17ba61dbbd8d47705dfe5149c8dd92b353ce25",
              "rock_smallA.glb": "df9fff9d711e61370e8df0caa2514c89b8f8a8dc6c6fafaf4eb2ec79c5ae07c1",
              "sign.glb": "c658c21672ecd63c5d3e53f06f875d68e6509edb1ab7e3b75374df7c61e7dd0c"
            }
          }
          JSON

          particle_commit='ab7086639ee73be31abd87feb21bf1402d4e8144'
          particle_base="https://raw.githubusercontent.com/Calinou/kenney-particle-pack/$particle_commit/addons/kenney_particle_pack"
          particle_out='apps/demon/public/assets/vendor/kenney-particles'
          mkdir -p "$particle_out"
          fetch_particle() {
            local file="$1" expected_blob="$2"
            curl --fail --location --retry 3 --retry-delay 2 "$particle_base/$file" -o "$particle_out/$file"
            test "$(git hash-object "$particle_out/$file")" = "$expected_blob"
          }
          fetch_particle 'LICENSE.txt' 'e198510d3c6ac7e3dc4370f1f0861d8c617362e8'
          fetch_particle 'spark_05.png' 'e01086ab2deabdedfa85f48df5f1c40392c19723'
          fetch_particle 'slash_03.png' '31f250ab448fcd8c767a4960c6fbc7105b326fa5'
          fetch_particle 'smoke_05.png' '4a77199d4ddab9d6482d8285ed3cd962983d8ffa'
          fetch_particle 'flare_01.png' 'bd25bd874e47467e95d6623aa0364be1c619617a'

          cat > "$particle_out/MANIFEST.json" <<JSON
          {
            "schema": 1,
            "pack": "Kenney Particle Pack",
            "license": "CC0-1.0",
            "repository": "Calinou/kenney-particle-pack",
            "commit": "$particle_commit",
            "files": {
              "LICENSE.txt": "e198510d3c6ac7e3dc4370f1f0861d8c617362e8",
              "spark_05.png": "e01086ab2deabdedfa85f48df5f1c40392c19723",
              "slash_03.png": "31f250ab448fcd8c767a4960c6fbc7105b326fa5",
              "smoke_05.png": "4a77199d4ddab9d6482d8285ed3cd962983d8ffa",
              "flare_01.png": "bd25bd874e47467e95d6623aa0364be1c619617a"
            }
          }
          JSON

          rm -f .github/workflows/asset-wave-2-ingest.yml
          git status --short
      - name: Commit verified binary assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/village/public/assets/vendor/kenney-nature apps/demon/public/assets/vendor/kenney-particles .github/workflows/asset-wave-2-ingest.yml
          git commit -m 'chore(assets): curate Kenney nature and particle sources'
          git push origin HEAD:feat/asset-wave-2-environment-vfx
