name: Johakyu HUD foot reconcile
on:
  push:
    branches: ['fix/johakyu-hud-foot-labels-20260921']
    paths: ['.github/workflows/johakyu-hud-foot-reconcile.yml']
permissions: {contents: write}
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[johakyu-hud-foot-reconcile]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name Astra
          git config user.email actions@users.noreply.github.com
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge --no-edit origin/develop
          rm .github/workflows/johakyu-hud-foot-reconcile.yml
          git add -A
          git commit -m "chore(review): remove HUD foot reconcile workflow"
          git push origin HEAD:fix/johakyu-hud-foot-labels-20260921
