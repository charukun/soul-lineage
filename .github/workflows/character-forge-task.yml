name: Character Forge task authoring
on:
  push:
    branches: ['dispatch/character-create-forge-authoring']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SOURCE_SHA: 369ffdb16a80194d76a7e6c17e354a8fd7c36fdf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 369ffdb16a80194d76a7e6c17e354a8fd7c36fdf
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/assets/forge/requirements.txt
      - name: Build original multiview fixture
        run: |
          python scripts/character-forge/fixture.py generated/character-forge-fixture
          python packages/assets/forge/pipeline.py --sheet generated/character-forge-fixture/character-sheet.png --id forge-scout --name "Forge Scout" --provenance generated/character-forge-fixture/provenance.json
      - name: Materialize generated blobs and immutable tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          const api=process.env.GITHUB_API_URL+'/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={authorization:'Bearer '+process.env.GITHUB_TOKEN,'content-type':'application/json','x-github-api-version':'2022-11-28'};
          async function request(path,data){const r=await fetch(api+path,{method:data?'POST':'GET',headers,body:data?JSON.stringify(data):undefined});if(!r.ok)throw new Error(path+' '+r.status+' '+await r.text());return r.json();}
          async function files(path){const rows=[];for(const item of await readdir(path,{withFileTypes:true})){const p=path+'/'+item.name;if(item.isDirectory())rows.push(...await files(p));else rows.push(p);}return rows;}
          const paths=[...await files('packages/assets/characters/forge/forge-scout'),'packages/assets/generated/create-forge-registry.js'],tree=[];
          for(const path of paths){const content=await readFile(path);const blob=await request('/git/blobs',{content:content.toString('base64'),encoding:'base64'});tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const base=await request('/git/commits/'+process.env.SOURCE_SHA);
          const result=await request('/git/trees',{base_tree:base.tree.sha,tree});
          console.log('FORGE_GENERATED_TREE '+JSON.stringify({source:process.env.SOURCE_SHA,tree:result.sha,files:paths}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forge-generated-${{ env.SOURCE_SHA }}
          path: |
            packages/assets/characters/forge/forge-scout
            packages/assets/generated/create-forge-registry.js
