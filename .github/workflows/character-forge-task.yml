name: Character Forge task browser evidence
on:
  push:
    branches: ['dispatch/character-create-forge-authoring']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_SHA: 22ce6d2975198e05c2ee08d2c32b2fc5ea1469e0
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22ce6d2975198e05c2ee08d2c32b2fc5ea1469e0
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/character-create-forge-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-browser-${{ env.SOURCE_SHA }}
          retention-days: 30
          path: test-results/character-create-forge
