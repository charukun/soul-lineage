name: Develop Visual Review Validation

on:
  push:
    branches: [work/develop-visual-review]
    paths: [.github/validation/develop-review.request]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/develop-visual-review
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused review tests
        run: node --test apps/rinne/tests/develop-review.test.mjs tests/review-workflow.test.mjs
      - name: RINNE structural check
        run: node scripts/check.mjs rinne
      - name: Build fixed Review bundle
        run: npm run build:review
      - name: Remove one-shot validation files
        run: |
          rm .github/workflows/develop-review-validation.yml
          rm .github/validation/develop-review.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete develop review validation"
          git push origin HEAD:work/develop-visual-review
