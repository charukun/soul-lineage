name: Review battle camera exact-head validation

on:
  push:
    branches: [fix/validate-review-battle-camera-20260919]
    paths:
      - '.github/workflows/portal.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: aea76bdca045624adc8688a9a2e2e8f037aed909
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - run: npm ci
      - name: Focused camera state test
        run: node --test apps/rinne/tests/review-battle-state.test.mjs
      - name: Exact-head DEV check and RINNE build
        run: node scripts/validate.mjs dev origin/develop HEAD
