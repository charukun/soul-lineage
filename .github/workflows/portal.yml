name: Wayfinder Public Gallery

on:
  push:
    branches:
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
    paths:
      - 'portal/**'
      - 'wrangler.portal.jsonc'
      - 'wrangler.portal-legacy.jsonc'
      - '.github/workflows/portal.yml'
      - 'tests/portal.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: wayfinder-public-gallery
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fast gallery verification
        run: |
          node --check portal/public/app.js
          node --check portal/worker.mjs
          node --check portal/legacy-redirect.mjs
          node --test tests/portal.test.mjs
          grep -q 'WAYFINDER' portal/public/index.html
          grep -q 'PULSE SYNC' portal/public/index.html
          grep -q 'share-page' portal/public/index.html
          grep -q 'copy-page' portal/public/index.html
          grep -q 'favicon.svg' portal/public/index.html
          ! grep -q 'rel="manifest"' portal/public/index.html

      - name: Verify fallback catalog boundary
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('portal/catalog.json', 'utf8'));
          const text = JSON.stringify(catalog).toLowerCase();
          if (catalog.repository !== 'charukun/soul-lineage') process.exit(1);
          if (catalog.source !== 'fallback') process.exit(2);
          if (catalog.items?.length !== 1 || catalog.items[0].id !== 'ops-board') process.exit(3);
          if (/guilty|doit-yare|gg-sites/.test(text)) process.exit(4);
          JS

      - name: Prepare static catalog
        run: cp portal/catalog.json portal/public/catalog.json

      - name: Deploy Wayfinder to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.portal.jsonc

      - name: Use stable public URL
        id: public
        if: steps.deploy.outcome == 'success'
        run: |
          echo "url=https://wayfinder-gallery.c-okamoto.workers.dev/" >> "$GITHUB_OUTPUT"
          echo "WAYFINDER: https://wayfinder-gallery.c-okamoto.workers.dev/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed WAYFINDER against PULSE
        if: steps.public.outputs.url != ''
        env:
          PORTAL_URL: ${{ steps.public.outputs.url }}
          PULSE_STATE_URL: https://rinne-ops.c-okamoto.workers.dev/api/state
        run: |
          ready=false
          for attempt in $(seq 1 15); do
            code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/portal-index.html -w '%{http_code}' "$PORTAL_URL" || true)
            if [ "$code" = "200" ] && grep -q 'PULSE SYNC' /tmp/portal-index.html; then
              ready=true
              break
            fi
            echo "Waiting for Workers propagation ($attempt/15, HTTP $code)"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::WAYFINDER root did not become ready"
            exit 1
          fi

          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${PORTAL_URL}catalog.json" > /tmp/fallback-catalog.json
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "$PULSE_STATE_URL" > /tmp/pulse-state.json
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${PORTAL_URL}api/catalog" > /tmp/live-catalog.json

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const fallback = JSON.parse(fs.readFileSync('/tmp/fallback-catalog.json', 'utf8'));
          const pulse = JSON.parse(fs.readFileSync('/tmp/pulse-state.json', 'utf8'));
          const live = JSON.parse(fs.readFileSync('/tmp/live-catalog.json', 'utf8'));
          const text = JSON.stringify(live).toLowerCase();

          if (fallback.items?.length !== 1 || fallback.items[0].id !== 'ops-board') process.exit(1);
          if (pulse.repository !== 'charukun/soul-lineage' || !Array.isArray(pulse.applications)) process.exit(2);
          if (live.degraded || live.source !== 'PULSE' || live.repository !== 'charukun/soul-lineage') process.exit(3);
          if (!Array.isArray(live.items) || live.items.length < 1) process.exit(4);
          if (live.items.some(item => item.id === 'portal')) process.exit(5);
          if (/guilty|doit-yare|gg-sites/.test(text)) process.exit(6);
          if (!live.items.every(item => Array.isArray(item.links) && item.links.length > 0 && 'preview' in item)) process.exit(7);

          const expected = pulse.applications
            .filter(app => app?.id !== 'portal')
            .flatMap(app => app.targets || [])
            .map(target => target?.url)
            .filter(url => typeof url === 'string' && /^https:\/\//.test(url));
          const actual = live.items.flatMap(item => item.links || []).map(link => link.url);
          const normalize = values => [...new Set(values)].sort();
          if (JSON.stringify(normalize(actual)) !== JSON.stringify(normalize(expected))) process.exit(8);
          JS

          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${PORTAL_URL}favicon.svg" | grep -q '<svg'

      - name: Redirect legacy portal URL to Wayfinder
        if: steps.public.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.portal-legacy.jsonc

      - name: Verify legacy redirect
        if: steps.public.outputs.url != ''
        run: |
          location=$(curl -sSI --retry 6 --retry-delay 2 --retry-all-errors https://rinne-portal.c-okamoto.workers.dev/ | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2; exit}')
          test "$location" = "https://wayfinder-gallery.c-okamoto.workers.dev/"

      - name: Record public gallery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.public.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="WAYFINDER deployment failed"
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PUBLIC_URL" ]; then
            state=success
            description="WAYFINDER is live"
            target_url="$PUBLIC_URL"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=portal/public \
            -f description="$description" \
            -f target_url="$target_url"
