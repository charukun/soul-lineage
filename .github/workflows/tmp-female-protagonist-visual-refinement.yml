name: Temporary Female Protagonist Visual Refinement
on:
  push:
    branches:
      - fix/female-protagonist-visual-refinement-20260921
permissions:
  contents: write
jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[female-visual-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install Blender headless runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libice6
      - name: Refine female protagonist and render visual evidence
        run: |
          set -euxo pipefail
          rm -rf generated/protagonist-villager-female-v1
          blender -b assets/characters/protagonist/villager-v1/source/ProtagonistVillagerV1.blend --python scripts/blender/refine-protagonist-villager-female-v1.py -- --out generated/protagonist-villager-female-v1
          mkdir -p assets/characters/protagonist/villager-female-v1/source apps/rinne/public/simulator/assets docs/characters/qa/protagonist-villager-female-v1
          cp generated/protagonist-villager-female-v1/source/ProtagonistVillagerFemaleV1.blend assets/characters/protagonist/villager-female-v1/source/
          cp generated/protagonist-villager-female-v1/export/ProtagonistVillagerFemaleV1.glb apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb
          cp generated/protagonist-villager-female-v1/review/*.png docs/characters/qa/protagonist-villager-female-v1/
          cp generated/protagonist-villager-female-v1/build.json docs/characters/qa/protagonist-villager-female-v1/refinement-build.json
      - name: Commit generated model and evidence
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/protagonist/villager-female-v1/source/ProtagonistVillagerFemaleV1.blend apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb docs/characters/qa/protagonist-villager-female-v1
          git commit -m "art(characters): materialize refined female protagonist [female-visual-generated]"
          git push origin HEAD:fix/female-protagonist-visual-refinement-20260921
