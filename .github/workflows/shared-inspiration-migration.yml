name: Shared Inspiration Migration

on:
  push:
    branches:
      - work/shared-inspiration-catalog
    paths:
      - .github/migration/shared-inspiration.request

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/shared-inspiration-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace embedded catalog ownership
        run: node scripts/migrate-tidebreak-inspiration-catalog.mjs
      - name: Refresh workspace lockfile
        run: npm install --ignore-scripts
      - name: Verify shared catalog
        run: npm run test --workspace @soul/game-data
      - name: Verify Tidebreak integration
        run: npm run test --workspace @soul/tidebreak-combat
      - name: Commit deterministic migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tidebreak-combat/index.js package-lock.json
          git diff --cached --quiet && { echo "migration produced no commit"; exit 1; }
          git commit -m "refactor(tidebreak): consume shared inspiration catalog"
          git push origin HEAD:work/shared-inspiration-catalog
