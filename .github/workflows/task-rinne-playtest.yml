name: Temporary RINNE playtest (do not merge)
on:
  push:
    branches: [review/rinne-playtest-20260922]
    paths: [.github/workflows/task-rinne-playtest.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated browser tools
        run: |
          mkdir -p /tmp/rinne-review evidence
          npm install --prefix /tmp/rinne-review --ignore-scripts --no-audit --no-fund playwright@1.63.0
          /tmp/rinne-review/node_modules/.bin/playwright install --with-deps chromium
      - name: Observe published RINNE with real browser input
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          cat > /tmp/rinne-review/observe.mjs <<'JS'
          import {chromium} from 'playwright';
          import {writeFile, mkdir} from 'node:fs/promises';
          const out=process.env.EVIDENCE_DIR;
          const base='https://soul-lineage-rinne-dev.c-okamoto.workers.dev/';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1280,height:800},locale:'ja-JP',recordHar:{path:out+'/published.har.zip',content:'attach',mode:'full'},recordVideo:{dir:out+'/video',size:{width:1280,height:800}}});
          const page=await context.newPage();
          const events=[]; const notes=[];
          page.on('pageerror',e=>events.push({type:'pageerror',text:String(e)}));
          page.on('console',m=>{if(['error','warning'].includes(m.type()))events.push({type:m.type(),text:m.text()});});
          page.on('requestfailed',r=>events.push({type:'requestfailed',url:r.url(),error:r.failure()}));
          async function shot(name){
            const data=await page.evaluate(()=>({url:location.href,title:document.title,text:document.body.innerText,buttons:[...document.querySelectorAll('button,input,select,dialog')].filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height).map(e=>({tag:e.tagName,id:e.id,text:e.innerText,label:e.getAttribute('aria-label'),disabled:e.disabled,rect:e.getBoundingClientRect().toJSON()})),dataset:document.querySelector('#app')?.dataset,gameDataset:document.querySelector('#game-screen')?.dataset,storage:{...localStorage},globals:Object.keys(window).filter(k=>/rinne|soul|debug|world|game|state|runtime/i.test(k))}));
            await writeFile(out+'/'+name+'.json',JSON.stringify(data,null,2));
            await page.screenshot({path:out+'/'+name+'.png'});
            await writeFile(out+'/'+name+'.html',await page.content());
            console.log('OBSERVATION',name,JSON.stringify({text:data.text,buttons:data.buttons}));
          }
          async function click(selector){const el=page.locator(selector).first();if(await el.isVisible().catch(()=>false)){await el.click({timeout:4000});await page.waitForTimeout(400);return true;}return false;}
          try{
            const initial=await context.request.get(base+'version.json');await writeFile(out+'/version-before.json',await initial.text());
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2500);await shot('01-opening');
            await click('#title-screen');
            await page.waitForTimeout(1800);await shot('02-title');
            if(await click('#open-settings')){await shot('03-settings');await click('#close-settings');}
            if(await click('#open-village-code')){await shot('04-village-code');await click('#close-village-code');}
            await click('#new-life');await page.waitForTimeout(4000);await shot('05-new-life');
            for(let i=0;i<3;i++){
              const candidates=page.getByRole('button',{name:/^(生まれる|旅を始める|はじめる|始める|この人生を始める|決定|はい)$/});
              if(await candidates.count() && await candidates.first().isVisible()){await candidates.first().click();await page.waitForTimeout(1500);}
            }
            await page.waitForTimeout(8000);await shot('06-first-world');
            if(await page.locator('#game').isVisible()){
              await page.mouse.move(580,450);await page.mouse.down();await page.mouse.move(790,450,{steps:18});await page.waitForTimeout(1500);await page.mouse.up();
              await shot('07-first-movement');
            }
            await page.waitForTimeout(15000);await shot('08-birth-tour');
            for(let i=0;i<3;i++)await click('#clock-rate');
            await shot('09-clock-control');
            for(let i=0;i<5;i++){
              await page.waitForTimeout(12000);
              const talk=page.getByRole('button',{name:/^(話す|はなす|次へ|つづける|続ける)$/});
              if(await talk.count() && await talk.first().isVisible())await talk.first().click({timeout:3000}).catch(e=>notes.push(String(e)));
              await shot('10-progress-'+i);
            }
            await page.keyboard.press('Escape');
            await shot('11-escape');
            await page.setViewportSize({width:393,height:852});await page.waitForTimeout(1000);await shot('12-phone');
            await page.setViewportSize({width:852,height:393});await page.waitForTimeout(1000);await shot('13-landscape');
            await page.setViewportSize({width:1280,height:800});
            await writeFile(out+'/storage-state.json',JSON.stringify(await context.storageState(),null,2));
            const final=await context.request.get(base+'version.json');await writeFile(out+'/version-after.json',await final.text());
          }catch(e){notes.push(String(e.stack||e));await shot('error-state').catch(()=>{});console.log('OBSERVATION_ERROR',String(e.stack||e));}
          finally{await writeFile(out+'/diagnostics.json',JSON.stringify({events,notes},null,2));await context.close();await browser.close();}
          JS
          node /tmp/rinne-review/observe.mjs
      - name: Preserve bounded source context for interpreting observed screens
        if: always()
        run: tar -czf evidence/source-context.tar.gz apps/rinne/src scripts/browser apps/rinne/index.html apps/rinne/package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-playtest-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
