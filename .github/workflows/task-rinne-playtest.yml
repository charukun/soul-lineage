name: Temporary RINNE playtest (do not merge)
on:
  push:
    branches: [review/rinne-playtest-20260922]
    paths: [.github/workflows/task-rinne-playtest.yml]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rinne-native-session
          run-id: 35684109756
          github-token: ${{ github.token }}
          path: prior
      - name: Prepare bounded visible browser observation
        run: |
          mkdir -p /tmp/rinne-review evidence
          npm install --prefix /tmp/rinne-review --ignore-scripts --no-audit --no-fund playwright@1.63.0
          /tmp/rinne-review/node_modules/.bin/playwright install --with-deps chromium
          command -v Xvfb && command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg)
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.review/rinne-adult.mjs').read_text()
          s="import {execFileSync} from 'node:child_process';\n"+s
          s=s.replace('headless:true','headless:false')
          s=s.replace("recordVideo:{dir:out+'/video',size:{width:1280,height:800}}", "deviceScaleFactor:1")
          s=s.replace("'--disable-dev-shm-usage'", "'--disable-dev-shm-usage','--window-position=0,0','--window-size=1280,900'")
          s=s.replace("console.log('OBS',name,j.text);", "console.log('OBS',name,j.text);try{execFileSync('ffmpeg',['-hide_banner','-loglevel','error','-f','x11grab','-video_size','1280x900','-i',process.env.DISPLAY,'-frames:v','1','-y',out+'/'+name+'.png'],{timeout:5000});}catch(e){notes.push({capture:name,error:String(e)});}")
          s=s.replace("await safe('manor',async()=>{await go(-13,-1,'07-manor',5);await snap('08-manor-entrance');await tap('[data-action]');await snap('09-manor-action');await close();});", "await tap('[data-heart]');await snap('07-heart');await close();await tap('[data-techniques]');await snap('08-techniques');await close();await tap('[data-items]');await snap('09-items');await close();")
          s=s.replace("await snap('16-lineage');await close();", "await snap('16-lineage');await close();await tap('[data-menu]');await tap('[data-map]');await snap('17-map');await close();await tap('[data-body]');await page.setViewportSize({width:393,height:852});await snap('18-body-phone');await page.setViewportSize({width:852,height:393});await snap('19-body-landscape');await close();")
          s=s.replace("finally{await writeFile", "finally{await page.goto('about:blank',{timeout:3000}).catch(()=>{});await writeFile")
          Path('/tmp/rinne-review/observe.mjs').write_text(s)
          PY
      - name: Real window input and OS screenshots
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
          PRIOR_STATE: ${{ github.workspace }}/prior/storage-state.json
        run: |
          set +e
          timeout --signal=INT --kill-after=10s 330s xvfb-run -a -s '-screen 0 1280x900x24' node /tmp/rinne-review/observe.mjs
          result=$?
          printf '{"processExit":%s,"capture":"headed Chromium plus x11grab"}\n' "$result" > evidence/process-result.json
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-window-playtest
          path: evidence/
          retention-days: 7
          if-no-files-found: error
