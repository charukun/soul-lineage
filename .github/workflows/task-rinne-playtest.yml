name: Temporary RINNE playtest (do not merge)
on:
  push:
    branches: [review/rinne-playtest-20260922]
    paths: [.github/workflows/task-rinne-playtest.yml, .review/rinne-video.mjs]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated browser tools
        run: |
          mkdir -p /tmp/rinne-review evidence
          npm install --prefix /tmp/rinne-review --ignore-scripts --no-audit --no-fund playwright@1.63.0
          /tmp/rinne-review/node_modules/.bin/playwright install --with-deps chromium
          cp .review/rinne-video.mjs /tmp/rinne-review/observe.mjs
      - name: Native gameplay video observation
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: node /tmp/rinne-review/observe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-gameplay-video
          path: evidence/
          retention-days: 7
          if-no-files-found: error
