name: Nocturne External Assets
on:
  push:
    branches: [work/nocturne-external-assets]
    paths: ['apps/nocturne/**', '.github/workflows/nocturne-external-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocturne-external-assets
  cancel-in-progress: true
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/nocturne
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download original licensed models and audit their content
        run: python3 prepare.py
      - name: Build isolated game
        run: |
          npm install --workspaces=false --no-audit --no-fund --no-package-lock
          node build.mjs
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate desktop and mobile in Chromium
        run: |
          python3 -m http.server 4173 --directory public > /tmp/nocturne-server.log 2>&1 &
          node smoke.mjs http://127.0.0.1:4173
      - name: Publish only the dedicated Nocturne Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Wait for exact public build without authentication
        run: node verify-ready.mjs https://nocturne-autobattle.c-okamoto.workers.dev
      - name: Verify public URL without authentication
        run: node smoke.mjs https://nocturne-autobattle.c-okamoto.workers.dev --public
      - name: Preserve exact-head evidence and original asset bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ github.sha }}
          path: |
            apps/nocturne/public/
            apps/nocturne/evidence/
          if-no-files-found: warn
          retention-days: 14
