name: Materialize public GitHub asset expansion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-public-github-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/public-github-asset-expansion-20260916' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch pinned CC0 assets and verify Git blob IDs
        shell: bash
        run: |
          set -euo pipefail

          REPO='KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0'
          COMMIT='84fa4e91af6a88989be7c99e0891cede11f2ca38'
          RAW="https://raw.githubusercontent.com/${REPO}/${COMMIT}"
          GLTF_ROOT="$RAW/addons/kaykit_medieval_hexagon_pack/Assets/gltf"
          PROP_ROOT="$GLTF_ROOT/decoration/props"
          NATURE_ROOT="$GLTF_ROOT/decoration/nature"
          DEST='assets/vendor/public-github/kaykit-medieval-hexagon'

          fetch_asset() {
            local target="$1"
            local url="$2"
            local expected="$3"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$url" --output "$target"
            local actual
            actual="$(git hash-object "$target")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Git blob mismatch: $target expected=$expected actual=$actual" >&2
              exit 1
            fi
            echo "verified $target $actual"
          }

          fetch_pair() {
            local dir="$1"
            local name="$2"
            local bin_sha="$3"
            local gltf_sha="$4"
            local target_dir="$5"
            fetch_asset "$target_dir/$name.bin" "$dir/$name.bin" "$bin_sha"
            fetch_asset "$target_dir/$name.gltf" "$dir/$name.gltf" "$gltf_sha"
          }

          PROPS="$DEST/props"
          NATURE="$DEST/nature"

          fetch_pair "$PROP_ROOT" bucket_arrows 92b857290d59031624fbff3cdd475431db0145da 50425f30e7548723941559b3346ad9b9672952c9 "$PROPS"
          fetch_pair "$PROP_ROOT" ladder 338b356473713f1b1c659c8b565946d8f2bac073 9e82493a2c37449e7ac3f5c57c4efcbbc08d0031 "$PROPS"
          fetch_pair "$PROP_ROOT" resource_lumber 3e8789b829af828e4384f09758fcc6222d662a40 e92d5dd4012745fedc8d54de4fb22284ac408d69 "$PROPS"
          fetch_pair "$PROP_ROOT" resource_stone 0c5a0232d133f407dd8772f72458ca7654dd5818 95d9b504c4dc3cbd0a66dc6e61a9ccc3e0dc6c52 "$PROPS"
          fetch_pair "$PROP_ROOT" sack 8e428963ed7985d7100751e1e4673ab1cc898724 34cfaa315f34d6759ee714d3c76cd9855ee1701e "$PROPS"
          fetch_pair "$PROP_ROOT" target ca84e3dd509bfceddd72907765f94c057aca2237 67a0cf5fbd549ce9a528571c73e4c2437dc28b43 "$PROPS"
          fetch_pair "$PROP_ROOT" tent 182c7763f3fbfc2e091596612e2087d2fcd4d5d7 cf47e095e55f76d8f7d40ef13b3eb284d74c86c2 "$PROPS"
          fetch_pair "$PROP_ROOT" weaponrack eba2b52fed6ecac2297a66813b15e5ff075fbeda 53978c5b63f87bbc80643e9bd03a3c25cbfe63f2 "$PROPS"
          fetch_pair "$PROP_ROOT" wheelbarrow d694896837c76633c823005cf001ba8f3ade96a4 497a01a2f101e6d351e4a4bf471ecad91d020682 "$PROPS"

          fetch_pair "$NATURE_ROOT" tree_single_A a3baf092cbc2c649bbfc40b9ffe81d6b27dd60ea 0c230093dab0c16d5dd65974917fd95bd119eb04 "$NATURE"
          fetch_pair "$NATURE_ROOT" tree_single_B e548757b12d728fbe86291e86521624eedb014c0 174c5b4181ccf0e0c7d6cbf143bd5f0c6d9b4cd4 "$NATURE"
          fetch_pair "$NATURE_ROOT" rock_single_A f2201a5a7a3a7f9f41414134a093ca4223bee52f 5f073d602b53ec59fd623f5c2962fc0e2627c37f "$NATURE"
          fetch_pair "$NATURE_ROOT" rock_single_C 5a4a612c23f8965ec846aea8d98360293be50a5d 6d9895fdce1ab8ca25a4c379e66bf7b6530c304c "$NATURE"

          fetch_asset "$PROPS/hexagons_medieval.png" "$PROP_ROOT/hexagons_medieval.png" '14cdc253646e4dba3cb7a267a6f7399b78ba2231'
          fetch_asset "$NATURE/hexagons_medieval.png" "$NATURE_ROOT/hexagons_medieval.png" '14cdc253646e4dba3cb7a267a6f7399b78ba2231'
          fetch_asset "$DEST/LICENSE.txt" "$RAW/LICENSE.txt" 'db3b53b5425c48afc0f606bfc0de84e51d834e95'

          cat > "$DEST/MANIFEST.json" <<'JSON'
          {
            "version": 1,
            "materialized": true,
            "license": "CC0-1.0",
            "source": {
              "repository": "KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0",
              "commit": "84fa4e91af6a88989be7c99e0891cede11f2ca38"
            },
            "verification": "Every upstream file is verified with git hash-object against the Git blob ID at the pinned commit before commit.",
            "policy": "Curated shared visual candidates for Rinne, MURAAAAAAA and 尽喰廻遊. Import does not imply RUNTIME_READY, gameplay collision suitability, Production approval or human Visual Approval.",
            "assets": [
              {"id":"arrow-bucket","category":"prop","source":"bucket_arrows","apps":["rinne","village","demon"],"tags":["camp","archery","training"]},
              {"id":"ladder","category":"prop","source":"ladder","apps":["rinne","village","demon"],"tags":["settlement","work","ruin"]},
              {"id":"lumber-pile","category":"prop","source":"resource_lumber","apps":["rinne","village","demon"],"tags":["resource","construction","work"]},
              {"id":"stone-pile","category":"prop","source":"resource_stone","apps":["rinne","village","demon"],"tags":["resource","construction","ruin"]},
              {"id":"sack","category":"prop","source":"sack","apps":["rinne","village","demon"],"tags":["storage","market","camp"]},
              {"id":"training-target","category":"prop","source":"target","apps":["rinne","village","demon"],"tags":["training","guard","encounter"]},
              {"id":"tent","category":"prop","source":"tent","apps":["rinne","village","demon"],"tags":["camp","travel","encounter"]},
              {"id":"weapon-rack","category":"prop","source":"weaponrack","apps":["rinne","village","demon"],"tags":["weapon","training","guard"]},
              {"id":"wheelbarrow","category":"prop","source":"wheelbarrow","apps":["rinne","village","demon"],"tags":["work","construction","farm"]},
              {"id":"tree-a","category":"nature","source":"tree_single_A","apps":["rinne","village","demon"],"tags":["tree","forest","roadside"]},
              {"id":"tree-b","category":"nature","source":"tree_single_B","apps":["rinne","village","demon"],"tags":["tree","forest","roadside"]},
              {"id":"rock-a","category":"nature","source":"rock_single_A","apps":["rinne","village","demon"],"tags":["rock","terrain","ruin"]},
              {"id":"rock-c","category":"nature","source":"rock_single_C","apps":["rinne","village","demon"],"tags":["rock","terrain","ruin"]}
            ]
          }
          JSON

          rm -f .github/workflows/materialize-public-github-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'chore(assets): materialize shared CC0 medieval asset set'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"