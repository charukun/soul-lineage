name: Temporary Female Protagonist Visual Round
on:
  push:
    branches:
      - fix/female-protagonist-visual-refinement-20260921
permissions:
  contents: read
jobs:
  render:
    if: ${{ contains(github.event.head_commit.message, '[female-visual-round]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Blender headless runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libice6
          curl -fL --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          echo "/tmp/blender-4.0.2-linux-x64" >> "$GITHUB_PATH"
      - name: Refine female protagonist
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf generated/female-refined generated/female-visual-round
          blender -b assets/characters/protagonist/villager-female-v1/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/refine-protagonist-villager-female-v1.py -- \
            --out generated/female-refined
          blender -b generated/female-refined/source/ProtagonistVillagerFemaleV1.blend \
            --python scripts/blender/inspect-protagonist-villager-female-v1.py -- \
            --out generated/female-visual-round
      - name: Render generated GLB in Character Studio
        env:
          APP_ENV: dev
        shell: bash
        run: |
          set -euxo pipefail
          cp generated/female-refined/export/ProtagonistVillagerFemaleV1.glb apps/character-studio/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb
          cp generated/female-refined/export/ProtagonistVillagerFemaleV1.glb apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.glb
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          model=Path('generated/female-refined/export/ProtagonistVillagerFemaleV1.glb')
          blend=Path('generated/female-refined/source/ProtagonistVillagerFemaleV1.blend')
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          for target in [Path('apps/character-studio/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json'),Path('apps/rinne/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json')]:
            receipt=json.loads(target.read_text())
            receipt['sha256']=h(model); receipt['bytes']=model.stat().st_size; receipt['sourceBlendSha256']=h(blend)
            target.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+chr(10))
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace @soul/character-studio
          npm run preview --workspace @soul/character-studio >/tmp/character-studio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5277/ >/dev/null && break; sleep 1; done
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:792,height:1536},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:5277/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.masterCharacterReview?.ready===true,{timeout:30000});
          await page.waitForSelector('#character-review-picker [data-model-key="protagonist.villager.female.v1"]',{state:'visible',timeout:30000});
          await page.locator('#character-review-picker [data-model-key="protagonist.villager.female.v1"]').click();
          await page.waitForTimeout(6000);
          const diagnostic=await page.evaluate(()=>({
            displayModelId:window.masterCharacterReview?.displayModelId??null,
            ready:Boolean(window.masterCharacterReview?.ready),
            errors:[...(window.masterCharacterReview?.errors||[])],
            status:document.getElementById('status')?.textContent||''
          }));
          const {writeFileSync}=await import('node:fs');
          writeFileSync('generated/female-visual-round/character-studio-diagnostic.json',JSON.stringify(diagnostic,null,2)+'\\n');
          await page.screenshot({path:'generated/female-visual-round/character-studio.png',fullPage:true});
          await browser.close();
          if(!diagnostic.ready || diagnostic.displayModelId!=='protagonist.villager.female.v1' || diagnostic.errors.length) throw new Error('Character Studio model load failed: '+JSON.stringify(diagnostic));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: female-visual-round-${{ github.sha }}
          path: |
            generated/female-visual-round/
            generated/female-refined/build.json
            generated/female-refined/export/ProtagonistVillagerFemaleV1.glb
            generated/female-refined/source/ProtagonistVillagerFemaleV1.blend
          retention-days: 3
