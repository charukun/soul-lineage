name: Eclipse Original Motion Preparation
on:
  push:
    branches: [astra/eclipse-autobattle-20260919]
    paths: [.github/workflows/eclipse-motion-preparation.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download the author's CC0 animation archive and inspect original clips
        run: |
          mkdir -p motion browser-tools
          python - <<'PY'
          import urllib.request, pathlib, zipfile, hashlib, json, struct
          root=pathlib.Path('motion')
          url='https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip'
          data=urllib.request.urlopen(url,timeout=120).read()
          archive=root/'original-animation-library.zip'; archive.write_bytes(data)
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts: raise RuntimeError('Unsafe archive path')
              z.extractall(root/'originals')
          report={'archiveSource':url,'archiveSHA256':hashlib.sha256(data).hexdigest(),'files':[]}
          for f in root.rglob('*'):
              if f.suffix.lower() not in ['.glb','.gltf','.txt']:continue
              b=f.read_bytes();item={'path':str(f.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              if f.suffix.lower()=='.glb':
                  j=json.loads(b[20:20+struct.unpack_from('<I',b,12)[0]])
                  item.update(animations=[a.get('name') for a in j.get('animations',[])],nodes=[n.get('name') for n in j.get('nodes',[])])
              report['files'].append(item)
          (root/'metadata.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Prepare the browser automation CLI for offline local inspection
        run: |
          npm install --prefix browser-tools agent-browser@0.21.0
          tar -czf browser-tools.tgz browser-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-original-motion-and-browser-tools
          path: |
            motion
            browser-tools.tgz
          retention-days: 7
          compression-level: 6
