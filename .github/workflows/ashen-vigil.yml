name: Ashen Vigil build and public playtest
on:
  push:
    branches: ['work/ashen-vigil-external-only', develop]
    paths: ['apps/ashen-vigil/**', '.github/workflows/ashen-vigil.yml', 'package-lock.json']
permissions:
  contents: write
  statuses: write
concurrency:
  group: ashen-vigil-public
  cancel-in-progress: true
jobs:
  build-playtest-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate npm workspace lock for exact source
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          mkdir -p apps/ashen-vigil/evidence
          cp package-lock.json apps/ashen-vigil/evidence/root-package-lock.json
          git diff --stat -- package-lock.json
      - name: Preserve generated lock as immutable blob without updating any branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const content = fs.readFileSync('package-lock.json','utf8');
            const result = await github.rest.git.createBlob({...context.repo,content,encoding:'utf-8'});
            const receipt = {sha:result.data.sha,sourceCommit:context.sha,bytes:Buffer.byteLength(content),path:'package-lock.json',branchUpdated:false};
            fs.writeFileSync('apps/ashen-vigil/evidence/dependency-lock.json',JSON.stringify(receipt,null,2));
            core.notice(`DEPENDENCY_LOCK_BLOB=${result.data.sha}`);
      - name: Preserve dependency receipt before browser work
        uses: actions/upload-artifact@v4
        with:
          name: ashen-vigil-lock-${{ github.sha }}
          path: apps/ashen-vigil/evidence/
          retention-days: 7
      - name: Acquire and audit new authored assets
        run: python3 apps/ashen-vigil/prepare.py
      - name: Build and browser-test game
        run: |
          cd apps/ashen-vigil
          npm install --no-audit --no-fund --workspaces=false
          npx playwright install --with-deps chromium
          npm run build
          npm test
      - name: Publish isolated public game
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/ashen-vigil
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify anonymous public browser
        run: |
          cd apps/ashen-vigil
          node smoke.mjs https://ashen-vigil.c-okamoto.workers.dev/
      - name: Preserve assets, screenshots, source and exact-head report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashen-vigil-${{ github.sha }}
          path: |
            apps/ashen-vigil/public/
            apps/ashen-vigil/evidence/
            apps/ashen-vigil/dist/
            apps/ashen-vigil/src/
            apps/ashen-vigil/*.mjs
            apps/ashen-vigil/*.py
            apps/ashen-vigil/*.json
            apps/ashen-vigil/*.html
            apps/ashen-vigil/*.css
            apps/ashen-vigil/*.md
          retention-days: 14
      - name: Record task result
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,context:'ashen-vigil/playtest',state:process.env.RESULT==='success'?'success':'failure',description:'Asset audit, real browser test and isolated public deployment',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
