name: Task Female Rogue Observation
on:
  push:
    branches: [art/female-protagonist-kaykit-rogue-20260922]
    paths: [.github/workflows/task-female-rogue-acquire.yml]
permissions:
  contents: write
jobs:
  observe:
    if: contains(github.event.head_commit.message, '[female-observe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Apply replacement once and commit the real source changes
        run: |
          set -euo pipefail
          if ! grep -q 'protagonist-female-kaykit-rogue-original' packages/characters/src/reference-model-catalog.js; then
            python3 scripts/task-replace-female-rogue.py
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/character-studio/public/simulator/assets apps/rinne/public/simulator/assets packages/characters/src/reference-model-catalog.js packages/characters/production/protagonist-villager-female-v1.production.json assets/characters/protagonist docs/characters scripts/blender apps/character-studio/src/review/character/runtime.js apps/character-studio/tests/character-review-grid.test.mjs tests/protagonist-villager-dcc.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'art: replace rejected female protagonist with unchanged official CC0 Rogue'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run focused source and consumer checks
        run: |
          node --test packages/characters/tests/female-protagonist-source.test.mjs packages/characters/tests/active-reference-catalog.test.mjs apps/character-studio/tests/character-review-grid.test.mjs
          node --check packages/characters/src/reference-model-catalog.js
          node --check apps/character-studio/src/review/character/runtime.js
      - name: Build the real Character Studio
        run: |
          npm ci --ignore-scripts
          npm run build --workspace @soul/character-studio
      - name: Observe actual model and deformation views
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/character-studio >/tmp/female-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node scripts/task-observe-female-rogue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: female-rogue-observation
          path: /tmp/female-rogue-observation/
          if-no-files-found: warn
          retention-days: 7
