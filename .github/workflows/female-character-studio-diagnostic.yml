name: Female Character Studio Diagnostic
on:
  push:
    branches:
      - 'work/female-protagonist-blender-refinement-20260921'
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[character-studio-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start Character Studio
        run: |
          npm run dev --workspace @soul/character-studio > /tmp/character-studio.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5177/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/character-studio.log
          exit 1
      - name: Diagnose delivered female GLB
        run: |
          mkdir -p test-results/female-character-studio
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const out='test-results/female-character-studio';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context=await browser.newContext({viewport:{width:900,height:1000}});
          const page=await context.newPage();
          const consoleErrors=[], httpErrors=[], failedRequests=[], pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),location:m.location()})});
          page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
          page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
          const response=await page.goto('http://127.0.0.1:5177/',{waitUntil:'domcontentloaded',timeout:60000});
          if(!response?.ok())throw new Error('HTTP '+response?.status());
          await page.waitForFunction(()=>window.characterStudio?.review?.ready===true&&document.body.classList.contains('character-grid-ready'),null,{timeout:120000});
          await page.evaluate(()=>document.querySelector('[data-character-model="protagonist.villager.female.v1"]')?.click());
          await page.waitForFunction(()=>window.characterStudio?.review?.displayModelId==='protagonist.villager.female.v1'&&window.characterStudio.review.ready===true,null,{timeout:120000});
          await page.waitForTimeout(800);
          const state=await page.evaluate(()=>({displayModelId:window.characterStudio.review.displayModelId,ready:window.characterStudio.review.ready,errors:[...window.characterStudio.review.errors]}));
          for(const view of ['front','side','back','face','overview']){
            await page.evaluate(v=>window.characterStudio.review.aim(v),view);
            await page.waitForTimeout(300);
            await page.locator('#stage').screenshot({path:`${out}/${view==='overview'?'full-body':view}.png`});
          }
          const receipt={...state,consoleErrors,httpErrors,failedRequests,pageErrors};
          writeFileSync(`${out}/receipt.json`,JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          await browser.close();
          if(state.displayModelId!=='protagonist.villager.female.v1'||state.ready!==true||state.errors.length||pageErrors.length||failedRequests.length||httpErrors.length) process.exit(2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: female-character-studio-diagnostic-${{ github.sha }}
          path: test-results/female-character-studio/
          if-no-files-found: warn
