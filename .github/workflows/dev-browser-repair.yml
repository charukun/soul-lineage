name: DEV Browser Repair Verification

on:
  workflow_run:
    workflows: ["Deploy DEV and PROD"]
    types: [completed]
  issues:
    types: [edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  select-repair:
    name: Select published repair generation
    if: >-
      github.event_name == 'issues' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.ticket.outputs.needed }}
      issue: ${{ steps.ticket.outputs.issue }}
      sha: ${{ steps.ticket.outputs.sha }}
    steps:
      - name: Require a ready repair ticket on the exact published develop
        id: ticket
        uses: actions/github-script@v8
        with:
          script: |
            const parse = body => {
              const match = String(body || '').match(/<!-- browser-repair:v1\s*([\s\S]*?)-->/);
              if (!match) return null;
              try { return JSON.parse(match[1].trim()); } catch { return null; }
            };
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            const sha = branch.commit.sha;
            if (context.eventName === 'workflow_run' && context.payload.workflow_run?.head_sha !== sha) {
              core.notice('Ignoring superseded DEV publication run.');
              core.setOutput('needed', 'false');
              return;
            }
            const response = await fetch(`https://charukun.github.io/soul-lineage/deployment-manifest.json?repair=${context.runId}`, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) {
              core.notice(`Published DEV manifest unavailable: HTTP ${response.status}`);
              core.setOutput('needed', 'false');
              return;
            }
            const manifest = await response.json();
            if (manifest.validatedDevelop !== sha) {
              core.notice(`Published DEV is not exact current develop (${manifest.validatedDevelop || 'unknown'} != ${sha}).`);
              core.setOutput('needed', 'false');
              return;
            }
            let issues;
            if (context.eventName === 'issues') issues = [context.payload.issue];
            else issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const candidates = issues
              .filter(issue => !issue.pull_request && issue.state === 'open')
              .map(issue => ({ issue, state: parse(issue.body) }))
              .filter(item => item.state?.scope === 'develop' && item.state?.state === 'ready-for-integration')
              .sort((a, b) => new Date(b.issue.updated_at) - new Date(a.issue.updated_at));
            const eligible = [];
            for (const item of candidates) {
              const repairHead = item.state.repairPrHead || item.state.headSha;
              if (!/^[0-9a-f]{40}$/.test(repairHead || '')) continue;
              if (repairHead === sha) {
                eligible.push(item);
                continue;
              }
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({ ...context.repo, base: repairHead, head: sha });
                if (comparison.merge_base_commit?.sha === repairHead && ['ahead', 'identical'].includes(comparison.status)) eligible.push(item);
              } catch (error) {
                core.notice(`Repair #${item.issue.number} is not yet in current develop: ${error.message}`);
              }
            }
            if (!eligible.length) {
              core.notice('No merged develop browser repair is ready for final verification; normal DEV publication stays browser-free.');
              core.setOutput('needed', 'false');
              return;
            }
            core.setOutput('needed', 'true');
            core.setOutput('issue', String(eligible[0].issue.number));
            core.setOutput('sha', sha);

  browser-repair:
    name: Verify repaired DEV asynchronously
    needs: select-repair
    if: needs.select-repair.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dev-browser-repair-${{ needs.select-repair.outputs.issue }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select-repair.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Pin exact published DEV manifest
        env:
          EXPECTED_SHA: ${{ needs.select-repair.outputs.sha }}
        run: |
          mkdir -p .deploy-state
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const response = await fetch(`https://charukun.github.io/soul-lineage/deployment-manifest.json?repair=${process.env.GITHUB_RUN_ID}`);
          assert.equal(response.status, 200);
          const manifest = await response.json();
          assert.equal(manifest.validatedDevelop, process.env.EXPECTED_SHA, 'DEV advanced before repair verification; a newer trigger owns verification');
          fs.writeFileSync('.deploy-state/deployment-manifest.json', JSON.stringify(manifest));
          fs.writeFileSync('.deploy-state/changed.json', '[]');
          JS
      - name: Public browser verification for active repair only
        id: browser
        continue-on-error: true
        env:
          INTEGRATION_FULL: 'true'
          DEV_BROWSER_GATE: 'true'
        run: node scripts/verify-browser.mjs https://charukun.github.io/soul-lineage/ .deploy-state .deploy-state/changed.json
      - name: Preserve repair browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-browser-repair-${{ needs.select-repair.outputs.issue }}-${{ needs.select-repair.outputs.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record machine-readable repair result
        if: always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SCOPE: develop
          REPAIR_CONCLUSION: ${{ steps.browser.outcome }}
          REPAIR_HEAD_SHA: ${{ needs.select-repair.outputs.sha }}
          REPAIR_ISSUE_NUMBER: ${{ needs.select-repair.outputs.issue }}
          REPAIR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPAIR_ARTIFACT: dev-browser-repair-${{ needs.select-repair.outputs.issue }}-${{ needs.select-repair.outputs.sha }}
          REPAIR_VERIFIED: 'true'
        run: node scripts/browser-repair-ticket.mjs
      - name: Keep failed repair verification visible without blocking DEV publication
        if: steps.browser.outcome == 'failure'
        run: exit 1
