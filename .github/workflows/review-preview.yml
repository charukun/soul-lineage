name: Visual Review Preview

on:
  push:
    branches: [work/visual-review-lab-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-review-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:review
      - name: Deploy static Review Lab to Cloudflare Workers
        if: vars.REVIEW_PREVIEW_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.review.jsonc
