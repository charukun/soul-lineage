name: Visual Review Preview
# Dedicated review-only deployment; does not target develop, main, DEV, or Production.

on:
  push:
    branches: [work/visual-review-lab-v2]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: visual-review-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark Review Lab deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=visual-review/public \
            -f description="Visual Review Lab deployment is running" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:review
      - name: Verify Review Lab with mobile and desktop WebGL
        run: npm run test:review-browser
      - name: Deploy static Review Lab to Cloudflare Workers
        id: deploy
        if: vars.REVIEW_PREVIEW_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.review.jsonc | tee "$RUNNER_TEMP/review-deploy.log"
          node scripts/review-deployment-url.mjs "$RUNNER_TEMP/review-deploy.log"
      - name: Verify published Review Lab at the stable URL
        if: steps.deploy.outcome == 'success'
        env:
          REVIEW_PUBLIC_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:review-browser
      - name: Record Review Lab result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REVIEW_PUBLIC_URL: ${{ steps.deploy.outputs.url }}
        run: |
          state=failure
          description="Visual Review Lab deployment failed"
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ] && [ -n "$REVIEW_PUBLIC_URL" ]; then
            state=success
            description="Visual Review Lab is live"
            target_url="$REVIEW_PUBLIC_URL"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=visual-review/public \
            -f description="$description" \
            -f target_url="$target_url"
      - name: Retain Review Lab verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.sha }}
          path: artifacts/review-*/
          if-no-files-found: ignore
          retention-days: 14
