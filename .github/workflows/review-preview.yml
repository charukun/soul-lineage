name: Visual Review Preview
# Dedicated review-only deployment. The published Lab always builds the current develop source of truth.

on:
  push:
    branches: [work/visual-review-lab-v2]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: visual-review-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark Review Lab deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=visual-review/public \
            -f description="Visual Review Lab deployment is running" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout current develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build current RINNE review surfaces
        run: |
          npm run build:rinne
          test -f dist/rinne/review.html
          test -f dist/rinne/review-battle.html
          grep -q 'Rogue' dist/rinne/review-battle.html
          grep -q 'Knight' dist/rinne/review-battle.html
          cp dist/rinne/index.html dist/rinne/game.html
          cp dist/rinne/review.html dist/rinne/index.html
          git rev-parse HEAD > dist/rinne/review-source.txt

      - name: Prepare Review Lab worker config
        run: |
          cat > wrangler.review.jsonc <<'JSON'
          {
            "name": "rinne-visual-review",
            "compatibility_date": "2026-09-12",
            "workers_dev": true,
            "assets": {
              "directory": "./dist/rinne"
            }
          }
          JSON

      - name: Deploy current develop to Visual Review Lab
        id: deploy
        if: vars.REVIEW_PREVIEW_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.review.jsonc

      - name: Verify exact Review Lab source
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          expected="$(git rev-parse HEAD)"
          actual="$(curl -fsSL --retry 3 --retry-delay 2 https://rinne-visual-review.c-okamoto.workers.dev/review-source.txt | tr -d '\r\n')"
          test "$actual" = "$expected"
          curl -fsSL --retry 3 --retry-delay 2 https://rinne-visual-review.c-okamoto.workers.dev/review-battle.html | grep -q 'Rogue'
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Record Review Lab result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          state=failure
          description="Visual Review Lab deployment failed"
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            state=success
            description="Visual Review Lab is live from current develop"
            target_url="https://rinne-visual-review.c-okamoto.workers.dev/"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=visual-review/public \
            -f description="$description" \
            -f target_url="$target_url"
