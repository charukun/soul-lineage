name: Shino DCC sync diagnostics

on:
  push:
    branches:
      - feat/shino-reference-v2-dcc
    paths:
      - .github/workflows/shino-sync-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce merge conflicts
        run: |
          git fetch origin develop
          set +e
          git merge --no-commit --no-ff origin/develop
          rc=$?
          set -e
          mkdir -p /tmp/shino-sync
          git diff --name-only --diff-filter=U | tee /tmp/shino-sync/conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "/tmp/shino-sync/files/$(dirname "$path")"
            git show ":1:$path" > "/tmp/shino-sync/files/$path.base" 2>/dev/null || true
            git show ":2:$path" > "/tmp/shino-sync/files/$path.feature" 2>/dev/null || true
            git show ":3:$path" > "/tmp/shino-sync/files/$path.develop" 2>/dev/null || true
            cp "$path" "/tmp/shino-sync/files/$path.conflict" 2>/dev/null || true
          done < /tmp/shino-sync/conflicts.txt
          git status --short > /tmp/shino-sync/status.txt
          printf '%s\n' "$rc" > /tmp/shino-sync/merge-exit.txt
          git merge --abort || true
      - uses: actions/upload-artifact@v4
        with:
          name: shino-sync-conflicts
          path: /tmp/shino-sync
          if-no-files-found: error
          retention-days: 3
