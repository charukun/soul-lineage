name: Temporary Asset Finalization 20260921
run-name: Finalize additive asset tree ${{ github.sha }}
on:
  push:
    branches: ['work/asset-library-expansion-20260921']
    paths: ['.github/workflows/asset-curation-native-20260921.yml']
permissions:
  contents: write
concurrency:
  group: asset-curation-native-20260921
  cancel-in-progress: false
jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[asset-finalize]') && github.ref == 'refs/heads/work/asset-library-expansion-20260921' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile overlapping RINNE develop changes on the existing work branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/asset-library-expansion-20260921'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=256 origin develop:refs/remotes/origin/develop "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git switch -c "$GITHUB_REF_NAME"
          git merge --no-edit origin/develop
      - name: Register final provenance and prove all current develop payloads are retained
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('apps/review/public/library')
          manifest_path=root/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          base=json.loads(subprocess.check_output(['git','show','origin/develop:apps/review/public/library/manifest.json']))
          index={row['path']:row for row in manifest['files']}
          for row in base['files']:
            actual=index.get(row['path'])
            assert actual and actual['bytes']==row['bytes'] and actual['gitBlobSha']==row['gitBlobSha'], 'Existing asset removed or altered: '+row['path']
          ledger_path='provenance/curation-20260921.json'
          payload=(root/ledger_path).read_bytes()
          ledger=json.loads(payload)
          assert ledger['active'] and len(ledger['files'])==556 and all(row['active'] for row in ledger['files'])
          assert ledger['nativeValidation']['nativeClipCount']==165
          row={'path':ledger_path,'bytes':len(payload),'gitBlobSha':hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest(),'sha256':hashlib.sha256(payload).hexdigest()}
          assert ledger_path not in {item['path'] for item in base['files']}, 'Refuse replacement of unrelated develop provenance'
          manifest['files']=[item for item in manifest['files'] if item['path']!=ledger_path]+[row]
          manifest['files'].sort(key=lambda item:item['path'])
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          for item in ledger['files']:
            data=(root/item['runtimePath']).read_bytes()
            assert len(data)==item['byteLength'] and hashlib.sha256(data).hexdigest()==item['sha256'], item['id']
          print(json.dumps({'existingDevelopAssetsPreserved':len(base['files']),'newAssets':556,'nativeClips':165,'developSha':subprocess.check_output(['git','rev-parse','origin/develop']).decode().strip()}))
      - name: Remove task materializer workflows from the final work tree
        run: |
          set -euo pipefail
          git rm -- .github/workflows/asset-library-materialize-20260921.yml .github/workflows/asset-curation-native-20260921.yml
          git add -- apps/review/public/library/manifest.json
          git diff --cached --check
          git commit -m 'chore(assets): preserve develop assets and remove task-only materializer workflows'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf 'Prepared work head: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
