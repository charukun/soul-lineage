name: Branch Janitor

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete eligible merged short-lived branches. Leave false for dry-run.'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean merged short-lived branches
    if: github.repository == 'charukun/soul-lineage'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Delete only current-develop-contained branches with no open PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_JANITOR_APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
          BRANCH_JANITOR_LIMIT: '30'
          INTEGRATION_DIAGNOSTICS_PATH: .deploy-state/branch-janitor-api.json
        run: node scripts/branch-janitor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-janitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deploy-state/branch-janitor.json
            .deploy-state/branch-janitor-api.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
