# Task-scoped bulk/observation route; removed before the final Astra validation.
name: Task KayKit Library
on:
  push:
    branches: [work/kaykit-character-library-20260922]
    paths: [.github/workflows/task-kaykit-library.yml]
permissions:
  contents: read
jobs:
  acquire:
    if: contains(github.event.head_commit.message, '[kaykit-acquire]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Acquire only publisher-listed free downloads and inventory original archives
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, json, urllib.request, urllib.parse, http.cookiejar, re, hashlib, io
          out=pathlib.Path('/tmp/kaykit-acquire'); out.mkdir()
          summary=[]
          for slug,expected in [('kaykit-adventurers','15363167'),('kaykit-skeletons','15363145'),('prototype-bits','15362979')]:
            base='https://kaylousberg.itch.io/'+slug
            opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
            opener.addheaders=[('User-Agent','Mozilla/5.0')]
            item={'sourceUrl':base,'slug':slug,'expectedUploadId':expected}
            try:
              html=opener.open(base,timeout=45).read().decode()
              def token(text): return re.search(r'name="csrf_token"\s+value="([^"]+)"',text).group(1)
              def post(url,html,referer):
                return json.loads(opener.open(urllib.request.Request(url,data=urllib.parse.urlencode({'csrf_token':token(html)}).encode(),headers={'Referer':referer,'X-Requested-With':'XMLHttpRequest'}),timeout=45).read())
              link=post(base+'/download_url',html,base)['url']
              dl=opener.open(link,timeout=45).read().decode()
              ids=re.findall(r'data-upload_id="(\d+)"',dl)
              assert expected in ids, 'Expected free upload not listed by publisher'
              res=post(base+'/file/'+expected,dl,link)
              if 'url' not in res:
                item['downloadResponse']=res
                raise RuntimeError('Publisher did not return a free download URL')
              data=opener.open(res['url'],timeout=120).read(80*1024*1024+1)
              assert len(data)<80*1024*1024 and data[:2]==b'PK'
              archive=out/(slug+'.zip'); archive.write_bytes(data)
              item.update(sha256=hashlib.sha256(data).hexdigest(),byteLength=len(data),files=[])
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                for info in z.infolist():
                  item['files'].append({'path':info.filename,'bytes':info.file_size})
                  if not info.is_dir() and ('license' in info.filename.lower() or info.filename.lower().endswith('.glb')):
                    b=z.read(info); target=out/slug/info.filename; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(b)
              item['status']='acquired'
            except Exception as e: item.update(status='failed',error=str(e))
            summary.append(item)
          # Repository-native comparison inputs, not new third-party runtime sources.
          with zipfile.ZipFile(out/'existing-models-motion.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('apps/review/public/library').rglob('*.glb'):
              if '/motion/kaykit-' in str(p) or p.name.lower() in ['knight.glb','barbarian.glb','mage.glb','rogue.glb','rogue_hooded.glb','skeleton_warrior.glb','skeleton_rogue.glb','skeleton_mage.glb','skeleton_minion.glb']:
                z.write(p,str(p))
          (out/'acquisition.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps([{k:v for k,v in s.items() if k!='files'} for s in summary],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-acquire
          path: /tmp/kaykit-acquire/
          retention-days: 3
          if-no-files-found: error
