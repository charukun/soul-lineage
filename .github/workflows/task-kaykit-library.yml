# Task-scoped cancellation repair and final real-output observation; removed before final validation.
name: Task KayKit Library
on:
  push:
    branches: [work/kaykit-character-library-20260922]
    paths: [.github/workflows/task-kaykit-library.yml]
permissions:
  contents: write
jobs:
  observe:
    if: contains(github.event.head_commit.message, '[kaykit-observe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: dev
      APP_BRANCH: work/kaykit-character-library-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Correct the reproduced cancellation and thumbnail defects
        run: |
          set -euo pipefail
          if grep -q 'const job=jobs.shift();queuedKeys.delete(job.key);' apps/rinne/src/review/shared/runtime-thumbnail.js; then
            python3 scripts/task-kaykit-correct.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/rinne/src/review/shared/runtime-thumbnail.js apps/character-studio/src/review/character/main.js apps/rinne/src/review/motion/entrypoint.js apps/rinne/tests/review-kaykit-library.test.mjs scripts/browser/kaykit-library.mjs
            if ! git diff --cached --quiet; then
              git commit -m 'fix: tolerate cancelled thumbnail jobs and preserve native raster versus SVG rendering'
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install explicit browser validation dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build actual consumers and run focused checks
        run: |
          set -euo pipefail
          mkdir -p .deploy-state/kaykit-library
          npm run build --workspace @soul/rinne 2>&1 | tee .deploy-state/kaykit-library/build-rinne.log
          npm run build --workspace @soul/character-studio 2>&1 | tee .deploy-state/kaykit-library/build-studio.log
          npm run build --workspace @soul/review 2>&1 | tee .deploy-state/kaykit-library/build-review.log
          node --test packages/characters/tests/kaykit-library.test.mjs packages/characters/tests/kaykit-foundation.test.mjs apps/character-studio/tests/character-review-grid.test.mjs apps/rinne/tests/review-motion-protagonist.test.mjs apps/rinne/tests/review-kaykit-library.test.mjs apps/rinne/tests/review-thumbnail-cancellation.test.mjs packages/rendering/tests/kaykit-rig.test.mjs packages/rendering/tests/kaykit-runtime-model.test.mjs 2>&1 | tee .deploy-state/kaykit-library/focused-tests.log
      - name: Observe exact built characters and existing motions with real native UI input
        run: node scripts/browser/kaykit-library.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-library-observation
          path: .deploy-state/kaykit-library/
          retention-days: 3
          if-no-files-found: warn
