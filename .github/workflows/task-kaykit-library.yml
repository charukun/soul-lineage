# Task-scoped bounded correction and re-observation. Removed before final validation.
name: Task KayKit Library
on:
  push:
    branches: [work/kaykit-character-library-20260922]
    paths: [.github/workflows/task-kaykit-library.yml]
permissions:
  contents: write
jobs:
  observe:
    if: contains(github.event.head_commit.message, '[kaykit-observe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: dev
      APP_BRANCH: work/kaykit-character-library-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Apply the actual-output correction
        run: |
          set -euo pipefail
          python3 scripts/task-kaykit-correct.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rinne/src/review/motion/entrypoint.js apps/rinne/src/review/motion/source-runtime.js scripts/browser/kaykit-library.mjs scripts/browser/kaykit-library-probe.js scripts/assets/kaykit-current-20260922.json scripts/assets/materialize-kaykit-current.py packages/characters/generated/kaykit-current.json apps/review/public/library/provenance/kaykit-current-20260922.json apps/review/public/library/manifest.json
          git commit -m 'fix: render current character rasters, use real picker disclosure and record visual review'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install explicit browser validation dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build actual consumers and run focused checks
        run: |
          set -euo pipefail
          mkdir -p .deploy-state/kaykit-library
          npm run build --workspace @soul/rinne 2>&1 | tee .deploy-state/kaykit-library/build-rinne.log
          npm run build --workspace @soul/character-studio 2>&1 | tee .deploy-state/kaykit-library/build-studio.log
          npm run build --workspace @soul/review 2>&1 | tee .deploy-state/kaykit-library/build-review.log
          node --test packages/characters/tests/kaykit-library.test.mjs packages/characters/tests/kaykit-foundation.test.mjs apps/character-studio/tests/character-review-grid.test.mjs apps/rinne/tests/review-motion-protagonist.test.mjs apps/rinne/tests/review-kaykit-library.test.mjs packages/rendering/tests/kaykit-rig.test.mjs packages/rendering/tests/kaykit-runtime-model.test.mjs 2>&1 | tee .deploy-state/kaykit-library/focused-tests.log
      - name: Re-observe exact built characters and existing motions
        run: node scripts/browser/kaykit-library.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-library-observation
          path: .deploy-state/kaykit-library/
          retention-days: 3
          if-no-files-found: warn
