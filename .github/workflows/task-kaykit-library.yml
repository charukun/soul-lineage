# Task-scoped bulk/observation path. Removed before final Astra validation.
name: Task KayKit Library
on:
  push:
    branches: [work/kaykit-character-library-20260922]
    paths: [.github/workflows/task-kaykit-library.yml]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[kaykit-integrate]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      APP_BRANCH: work/kaykit-character-library-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: kaykit-acquire
          run-id: 35681283338
          github-token: ${{ github.token }}
          path: /tmp/kaykit-acquire
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize locked originals and integrate existing library consumers
        run: |
          set -euo pipefail
          python3 scripts/task-kaykit-integrate.py /tmp/kaykit-acquire
          python3 scripts/assets/materialize-kaykit-current.py /tmp/kaykit-acquire
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/assets/kaykit-current-20260922.json packages/characters/src/index.js packages/characters/generated/kaykit-current.json apps/review/public/library apps/character-studio/src/review/character/main.js apps/character-studio/src/review/character/grid.js apps/character-studio/src/review/character/grid.css apps/rinne/src/review/motion/models.js apps/rinne/src/review/motion/source-runtime.js apps/rinne/tests/review-motion-protagonist.test.mjs
          git commit -m 'feat: materialize ten current KayKit GLBs with official licenses and lazy canonical library'
          git push origin HEAD:${{ github.ref_name }}
      - name: Install dependencies for explicit browser and build validation
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify actual motion compatibility and generate existing-renderer thumbnails
        run: |
          set -euo pipefail
          node scripts/browser/kaykit-library.mjs --generate
          git add packages/characters/generated/kaykit-current.json apps/review/public/library/manifest.json apps/review/public/library/thumbnail/kaykit-current-20260922
          git commit -m 'art: materialize observed KayKit thumbnails and real shared-animation compatibility receipts'
          git push origin HEAD:${{ github.ref_name }}
      - name: Build all explicitly requested consumers and run focused regressions
        run: |
          set -euo pipefail
          mkdir -p .deploy-state/kaykit-library
          npm run build --workspace @soul/rinne 2>&1 | tee .deploy-state/kaykit-library/build-rinne.log
          npm run build --workspace @soul/character-studio 2>&1 | tee .deploy-state/kaykit-library/build-studio.log
          npm run build --workspace @soul/review 2>&1 | tee .deploy-state/kaykit-library/build-review.log
          node --test packages/characters/tests/kaykit-library.test.mjs packages/characters/tests/kaykit-foundation.test.mjs apps/character-studio/tests/character-review-grid.test.mjs apps/rinne/tests/review-motion-protagonist.test.mjs packages/rendering/tests/kaykit-rig.test.mjs packages/rendering/tests/kaykit-runtime-model.test.mjs 2>&1 | tee .deploy-state/kaykit-library/focused-tests.log
      - name: Observe exact built source in real review UIs
        run: node scripts/browser/kaykit-library.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-library-observation
          path: .deploy-state/kaykit-library/
          retention-days: 3
          if-no-files-found: warn
