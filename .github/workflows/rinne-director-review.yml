name: Rinne Director Review
on:
  push:
    branches: [fix/rinne-director-playability-loop]
    paths:
      - .github/workflows/rinne-director-review.yml
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: dev
      APP_BRANCH: fix/rinne-director-playability-loop
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile latest develop in the review workspace
        run: |
          git fetch origin develop
          git -c user.name=director-review -c user.email=director-review@invalid.example merge --no-edit origin/develop
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify director guidance rules
        run: node --test apps/rinne/tests/action-priority.test.mjs
      - name: Exercise complete life loop with native browser input
        env:
          RINNE_STORY_ARTIFACTS: test-results/rinne-story-full
        run: |
          # SwiftShader evidence capture can be slower than gameplay. Extend only
          # screenshot calls in this disposable review workspace; locator/action
          # timeouts in the actual scenario remain the authored 15 seconds.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/rinne/tests/story-browser.mjs')
          s=p.read_text()
          s=s.replace('page.screenshot({', 'page.screenshot({timeout:45000,')
          p.write_text(s)
          PY
          node apps/rinne/tests/story-browser.mjs
      - name: Capture focused 390x844 play and map evidence
        run: |
          mkdir -p test-results/rinne-director
          cat > test-results/rinne-director-capture.mjs <<'JS'
          import {chromium} from 'playwright';
          import {createServer} from 'vite';
          import {writeFile,mkdir} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const output='test-results/rinne-director';await mkdir(output,{recursive:true});
          const server=await createServer({configFile:'apps/rinne/vite.config.js',server:{host:'127.0.0.1',port:5193,strictPort:true,watch:null,hmr:false}});await server.listen();
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,reducedMotion:'reduce'}),page=await context.newPage();
          try{
            await page.goto('http://127.0.0.1:5193/#story');await page.waitForFunction(()=>window.__RINNE_TITLE__?.snapshot().state==='playing',null,{timeout:150000});
            const frame=page.frames().find(item=>item.url().includes('/simulator/index.html'));assert.ok(frame);
            await frame.locator('[data-action="gift:bell"]').click();await frame.locator('[data-action="gift:stone"]').click();await frame.locator('[data-action="release"]').click();
            await page.waitForTimeout(1200);
            const cdp=await context.newCDPSession(page),capture=async name=>{const result=await cdp.send('Page.captureScreenshot',{format:'jpeg',quality:78,fromSurface:true});await writeFile(`${output}/${name}.jpg`,Buffer.from(result.data,'base64'));};
            await capture('final-play-mobile');
            await frame.locator('#story-map').tap();await page.waitForTimeout(250);
            const destinations=await frame.locator('[data-destination]').evaluateAll(nodes=>nodes.map(node=>({id:node.dataset.destination,text:node.textContent.trim()})));
            assert.equal(destinations.filter(item=>item.id==='garden').length,1);assert.equal(destinations.filter(item=>item.text.includes('焚き火')).length,1);
            await writeFile(`${output}/final-map-destinations.json`,JSON.stringify(destinations,null,2));await capture('final-map-mobile');await cdp.detach();
          }finally{await browser.close();await server.close();}
          JS
          node test-results/rinne-director-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-director-review-${{ github.sha }}
          path: |
            test-results/rinne-director/
            test-results/rinne-story-full/
          if-no-files-found: error
          retention-days: 7
