name: Rinne Director Review
on:
  push:
    branches: [fix/rinne-director-playability-loop]
    paths:
      - .github/workflows/rinne-director-review.yml
permissions:
  contents: read
jobs:
  story-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: dev
      APP_BRANCH: fix/rinne-director-playability-loop
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify director guidance rules
        run: node --test apps/rinne/tests/action-priority.test.mjs
      - name: Preserve exact review sources
        run: |
          mkdir -p test-results/rinne-director/source
          cp apps/rinne/src/story/controller.js test-results/rinne-director/source/controller.js
          cp apps/rinne/src/story/interface.js test-results/rinne-director/source/interface.js
          cp apps/rinne/src/story/action-priority.js test-results/rinne-director/source/action-priority.js
          cp apps/rinne/tests/story-browser.mjs test-results/rinne-director/source/story-browser.mjs
      - name: Exercise main game with native browser input
        env:
          RINNE_STORY_ARTIFACTS: test-results/rinne-director
        run: |
          # Historical focused test used local environment keys. The disposable
          # runner copy follows the actual DEV keys without modifying product code.
          sed -i \
            -e 's/soul\.local\.rinne\.story\.v1/soul.dev.rinne.story.v1/g' \
            -e 's/soul\.local\.world\.mura\.v1/soul.dev.world.mura.v1/g' \
            apps/rinne/tests/story-browser.mjs
          # Seven large WebGL screenshots are useful evidence but can each wait on
          # a slow software-GPU readback. The full playthrough owns this pass; the
          # visual review already has baseline captures and gets a targeted capture
          # after the state/interaction path succeeds.
          perl -0pi -e "s/await page\.screenshot\(\{path:output\+'[^']+'\}\);//g" apps/rinne/tests/story-browser.mjs
          node apps/rinne/tests/story-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-director-review-${{ github.sha }}
          path: test-results/rinne-director/
          if-no-files-found: error
          retention-days: 7
