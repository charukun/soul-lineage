name: Temporary Public Asset Materializer 20260921
run-name: Materialize pinned CC0 assets on ${{ github.sha }}
on:
  push:
    branches: ['work/asset-library-expansion-20260921']
    paths:
      - '.github/workflows/asset-library-materialize-20260921.yml'
      - 'scripts/assets/materialize-curation.py'
      - 'scripts/assets/curation-20260921.json'
permissions:
  contents: write
concurrency:
  group: asset-library-materialize-20260921
  cancel-in-progress: false
jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[asset-materialize]') && github.ref == 'refs/heads/work/asset-library-expansion-20260921' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile current develop without touching main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/asset-library-expansion-20260921'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=256 origin develop:refs/remotes/origin/develop "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git switch -c "$GITHUB_REF_NAME"
          git merge --no-edit origin/develop
      - name: Verify and materialize selected public source binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/assets/materialize-curation.py scripts/assets/curation-20260921.json
      - name: Commit only asset payloads and provenance to the work branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/asset-library-expansion-20260921'
          git add -- apps/review/public/library packages/assets/generated/curated-library.json
          git diff --cached --stat | tail -4
          git commit -m 'feat(assets): materialize pinned CC0 additions with verified hashes [asset-materialized]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf 'Materialized work head: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
