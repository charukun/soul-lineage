name: Task-scoped RINNE approved UI workbench
on:
  push:
    branches: [feat/rinne-approved-storybook-20260922]
    paths: [.storybook-task-input.json]
permissions:
  contents: write
env:
  APP_ENV: dev
  APP_BRANCH: feat/rinne-approved-storybook-20260922
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read task mode
        run: echo "TASK_MODE=$(node -p 'JSON.parse(require("fs").readFileSync(".storybook-task-input.json")).mode')" >> "$GITHUB_ENV"
      - name: Prepare task browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet Pillow
      - name: Receive refined approved artwork
        if: env.TASK_MODE == 'materialize'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/rinne-storybook-receive.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/rinne-storybook-materialize.py')
          source=p.read_text().replace("source=urllib.request.urlopen(config['source'],timeout=60).read()", "source=Path('.storybook-source.zip').read_bytes()")
          exec(compile(source,str(p),'exec'),{'__name__':'__main__'})
          PY
      - name: Test canonical UI model
        if: env.TASK_MODE == 'compare'
        run: node --test apps/rinne/tests/storybook-model.test.mjs
      - name: Compare and refine approved UI
        if: env.TASK_MODE == 'compare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rinne-storybook-compare.mjs
      - name: Preserve failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rinne-storybook-failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-storybook-${{ github.sha }}
          path: .storybook-evidence/
          if-no-files-found: ignore
          retention-days: 14
