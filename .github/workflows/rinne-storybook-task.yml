name: Task-scoped RINNE approved UI workbench
on:
  push:
    branches: [feat/rinne-approved-storybook-20260922]
    paths: [.storybook-task-input.json]
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare task browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Receive approved attachment in a browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/rinne-storybook-receive.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/rinne-storybook-materialize.py')
          text=p.read_text().replace("source=urllib.request.urlopen(config['source'],timeout=60).read()", "source=Path('.storybook-source.zip').read_bytes()")
          exec(compile(text,str(p),'exec'),{'__name__':'__main__'})
          PY
      - name: Compare and refine approved UI
        if: hashFiles('.storybook-compare-enabled') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rinne-storybook-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-storybook-${{ github.sha }}
          path: .storybook-evidence/
          if-no-files-found: ignore
          retention-days: 14
