name: Task-scoped RINNE approved UI workbench
on:
  push:
    branches: [feat/rinne-approved-storybook-20260922]
    paths: [.storybook-task-input.json]
permissions:
  contents: write
env:
  APP_ENV: dev
  APP_BRANCH: feat/rinne-approved-storybook-20260922
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare task browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet Pillow
      - name: Test canonical UI model and browser contract
        run: node --test apps/rinne/tests/storybook-model.test.mjs apps/rinne/tests/browser-storybook-acceptance.test.mjs
      - name: Compare and refine approved UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rinne-storybook-compare.mjs
      - name: Preserve failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rinne-storybook-failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-storybook-${{ github.sha }}
          path: |
            .storybook-evidence/
            .artifacts/storybook-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
