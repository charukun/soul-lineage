name: Director playthrough 2026-09-12
on:
  push:
    branches: [review/director-playthrough-20260912]
    paths:
      - scripts/director-playthrough-20260912.mjs
      - .github/workflows/director-playthrough-20260912.yml
permissions:
  contents: read
concurrency:
  group: director-playthrough-20260912
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Perform isolated touch playthrough on public DEV
        run: node scripts/director-playthrough-20260912.mjs
      - name: Preserve director evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-playthrough-${{ github.run_id }}
          path: director-evidence/
          retention-days: 7
          if-no-files-found: error
