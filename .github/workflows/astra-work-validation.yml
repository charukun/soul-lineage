name: Astra Work Validation
run-name: Astra final-head validation ${{ github.ref_name }} ${{ github.sha }}

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
      - 'dispatch/**'
      - 'chore/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: astra-work-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ contains(github.event.head_commit.message, '[astra-validate]') }}
    name: Final-head focused test and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HEAD_SHA: ${{ github.sha }}
      APP_ENV: dev
    steps:
      - name: Checkout final work head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Fetch current develop
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - name: Record final-head validation pending
        uses: actions/github-script@v8
        with:
          script: |
            const target=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const contextName of ['astra/fast-dev-contract','astra/focused-validation']) {
              await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
                context:contextName,state:'pending',
                description:contextName.endsWith('contract')?'Fast DEV contract inspection is running':'Astra final-head validation is waiting for contract inspection',
                target_url:target});
            }
      - name: Enforce trusted Fast DEV contract before Actions work
        id: contract
        continue-on-error: true
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/fast-dev-contract.mjs"
          if [[ "$COMMIT_MESSAGE" == *"[astra-freshness-hardening]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-freshness-hardening
          elif [[ "$COMMIT_MESSAGE" == *"[astra-contract-restore]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-restore
          elif [[ "$COMMIT_MESSAGE" == *"[astra-contract-change]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-contraction
          elif git cat-file -e origin/develop:scripts/fast-dev-contract.mjs 2>/dev/null; then
            git show origin/develop:scripts/fast-dev-contract.mjs > "$trusted"
            node "$trusted" origin/develop HEAD
          else
            cp scripts/fast-dev-contract.mjs "$trusted"
            node "$trusted" origin/develop HEAD --bootstrap
          fi
      - name: Record Fast DEV contract clean
        if: steps.contract.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/fast-dev-contract',state:'success',description:'Fast DEV execution contract is clean',
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Record recoverable Fast DEV contract violation
        if: steps.contract.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const target=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/fast-dev-contract',state:'error',description:'FAST_DEV_CONTRACT_VIOLATION: repair same branch and revalidate',target_url:target});
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'error',description:'Skipped: Fast DEV contract expansion must be self-repaired first',target_url:target});
      - name: Install dependencies without branch lifecycle hooks
        if: steps.contract.outcome == 'success'
        run: npm ci --ignore-scripts
      - name: Check exact patch whitespace
        if: steps.contract.outcome == 'success'
        run: git diff --check origin/develop HEAD
      - name: Run changed focused tests
        if: steps.contract.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          const changed=execFileSync('git',['diff','--name-only','origin/develop','HEAD'],{encoding:'utf8'}).split('\n').filter(Boolean);
          const tests=[...new Set(changed.filter(path=>path.endsWith('.test.mjs')))];
          if(!tests.length){console.log('No changed Node tests selected; affected DEV checks/builds still run next.');process.exit(0);}
          console.log('Focused tests:',tests.join(', '));
          const result=spawnSync(process.execPath,['--test',...tests],{stdio:'inherit'});
          process.exit(result.status??1);
          NODE
      - name: Run final-head DEV checks and affected builds
        if: steps.contract.outcome == 'success'
        run: node scripts/validate.mjs dev origin/develop HEAD
      - name: Record final-head validation success
        if: success() && steps.contract.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const target=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data:develop}=await github.rest.repos.getBranch({...context.repo,branch:'develop'});
            const developSha=develop.commit.sha;
            const {data:comparison}=await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,basehead:`${developSha}...${process.env.HEAD_SHA}`
            });
            const fresh=comparison.status==='ahead'||comparison.status==='identical';
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/merge-freshness',state:fresh?'success':'error',
              description:fresh?'Validated head contains current develop':'ASTRA_STALE_DEVELOP: reconcile and revalidate',
              target_url:target});
            if(!fresh){
              await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
                context:'astra/focused-validation',state:'error',
                description:'ASTRA_STALE_DEVELOP: validation invalidated by newer develop',target_url:target});
              core.setFailed(`ASTRA_STALE_DEVELOP: current develop ${developSha} is not contained in validated head ${process.env.HEAD_SHA}`);
              return;
            }
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'success',description:'Astra final-head validation passed on current develop',
              target_url:target});
      - name: Record final-head validation failure
        if: failure() && steps.contract.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA || '')) return;
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'failure',description:'Astra final-head validation failed',
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
