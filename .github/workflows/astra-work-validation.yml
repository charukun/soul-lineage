name: Astra Work Validation
run-name: Astra final-head validation ${{ github.ref_name }} ${{ github.sha }}

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
      - 'dispatch/**'
      - 'chore/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: astra-work-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ contains(github.event.head_commit.message, '[astra-validate]') }}
    name: Final-head focused test and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HEAD_SHA: ${{ github.sha }}
      APP_ENV: dev
    steps:
      - name: Checkout final work head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Fetch current develop
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - name: Record final-head validation pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'pending',
              description: 'Astra final-head validation is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Install dependencies
        run: npm ci
      - name: Check exact patch whitespace
        run: git diff --check origin/develop HEAD
      - name: Detect source-motion review changes
        id: motion
        run: |
          if git diff --name-only origin/develop HEAD | grep -Eq '^apps/rinne/(src/(review-motion|motion-review-entrypoint)|tests/review-motion-library)|^scripts/(prepare-rinne-motion-library|browser/rinne-motion-library)'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run changed focused tests
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';

          const changed = execFileSync('git', ['diff', '--name-only', 'origin/develop', 'HEAD'], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          const tests = [...new Set(changed.filter(path => path.endsWith('.test.mjs')))];

          if (!tests.length) {
            console.log('No changed Node tests selected; affected DEV checks/builds still run next.');
            process.exit(0);
          }

          console.log('Focused tests:', tests.join(', '));
          const result = spawnSync(process.execPath, ['--test', ...tests], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
      - name: Run final-head DEV checks and affected builds
        run: node scripts/validate.mjs dev origin/develop HEAD
      - name: Install Chromium for source-motion review
        if: steps.motion.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser-check every registered source motion
        if: steps.motion.outputs.enabled == 'true'
        run: node scripts/browser/rinne-motion-library.mjs
      - name: Upload source-motion validation evidence
        if: ${{ always() && steps.motion.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rinne-motion-review-${{ github.sha }}
          path: |
            artifacts/motion-source-qa/
            artifacts/motion-browser/
          if-no-files-found: error
      - name: Record final-head validation success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'success',
              description: 'Astra final-head validation passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Record final-head validation failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA || '')) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'failure',
              description: 'Astra final-head validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
