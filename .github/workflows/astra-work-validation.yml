name: Astra Work Validation
run-name: Astra final-head validation ${{ github.ref_name }} ${{ github.sha }}

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
      - 'dispatch/**'
      - 'chore/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: astra-work-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ contains(github.event.head_commit.message, '[astra-validate]') }}
    name: Final-head focused validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.sha }}
      APP_ENV: dev
      ASTRA_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout exact work head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ contains(github.event.head_commit.message, '[astra-heavy-validation]') && '/*' || '*.js' }}
            *.mjs
            *.cjs
            package.json
            package-lock.json
            .github/workflows/astra-work-validation.yml
            scripts/
      - name: Recover bounded validation ancestry
        shell: bash
        run: |
          set -euo pipefail
          depth=8
          git fetch --no-tags --depth="$depth" origin             "develop:refs/remotes/origin/develop"             "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          while ! base="$(git merge-base origin/develop HEAD 2>/dev/null)"; do
            if [ "$depth" -ge 256 ]; then
              echo "Unable to recover merge-base within bounded Fast DEV history." >&2
              exit 1
            fi
            git fetch --no-tags --deepen="$depth" origin               "develop:refs/remotes/origin/develop"               "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            depth=$((depth * 2))
          done
          echo "VALIDATION_BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Enforce Fast DEV anti-expansion contract
        id: contract
        continue-on-error: true
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/fast-dev-contract.mjs"
          if [[ "$COMMIT_MESSAGE" == *"[astra-freshness-hardening]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-freshness-hardening
          elif [[ "$COMMIT_MESSAGE" == *"[astra-contract-restore]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-restore
          elif [[ "$COMMIT_MESSAGE" == *"[astra-contract-change]"* ]]; then
            node scripts/fast-dev-contract.mjs origin/develop HEAD --authorized-contraction
          elif git cat-file -e origin/develop:scripts/fast-dev-contract.mjs 2>/dev/null; then
            git show origin/develop:scripts/fast-dev-contract.mjs > "$trusted"
            node "$trusted" origin/develop HEAD
          else
            cp scripts/fast-dev-contract.mjs "$trusted"
            node "$trusted" origin/develop HEAD --bootstrap
          fi
      - name: Record recoverable Fast DEV contract violation
        if: steps.contract.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const target=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/fast-dev-contract',state:'error',description:'FAST_DEV_CONTRACT_VIOLATION: repair same branch and revalidate',target_url:target});
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'error',description:'Skipped: Fast DEV execution expansion must be repaired first',target_url:target});
      - name: Resolve Astra-selected focused validation
        id: focused-plan
        if: steps.contract.outcome == 'success'
        run: node scripts/astra-focused-validation.mjs plan
      - name: Set up exact validation Node only when dependency work exists
        if: steps.contract.outcome == 'success' && steps.focused-plan.outputs.needs_install == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies only when selected validation needs them
        if: steps.contract.outcome == 'success' && steps.focused-plan.outputs.needs_install == 'true'
        run: npm ci --ignore-scripts
      - name: Run Astra-selected focused validation
        if: steps.contract.outcome == 'success' && steps.focused-plan.outputs.has_work == 'true'
        run: node scripts/astra-focused-validation.mjs run
      - name: Record freshness and final-head success
        if: success() && steps.contract.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const cp=require('node:child_process'),path=require('node:path'),{pathToFileURL}=require('node:url');
            const target=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const git=(args,opts={})=>cp.execFileSync('git',args,{encoding:'utf8',...opts}).trim();
            const isAncestor=(a,b)=>{try{cp.execFileSync('git',['merge-base','--is-ancestor',a,b],{stdio:'ignore'});return true;}catch{return false;}};
            const ws=await import(pathToFileURL(path.join(process.cwd(),'scripts/workspaces.mjs')).href),nodes=ws.graph();
            const impact=(base,head)=>{
              const paths=git(['diff','--no-renames','--name-only','-z',base,head]).split('\0').filter(Boolean).filter(p=>p!=='AGENTS.md');
              const apps=ws.affectedForDev(nodes,paths),dependencyGraphChanged=paths.some(ws.workspaceManifestPath),rootBuildChanged=paths.some(ws.devGlobalBuildPath);
              const infrastructure=dependencyGraphChanged||rootBuildChanged;
              const packages=[...nodes.values()].filter(n=>n.group==='packages'&&paths.some(p=>p.startsWith(`${n.dir}/`)&&!p.endsWith('/README.md'))).map(n=>n.name);
              return {apps,packages,infrastructure,controlPlane:paths.some(ws.toolingPath)&&!infrastructure,paths};
            };
            git(['fetch','--no-tags','origin','develop:refs/remotes/origin/develop']);
            const developSha=git(['rev-parse','origin/develop']);
            let reusable=isAncestor(developSha,process.env.HEAD_SHA);
            let reason=reusable?'current-develop-contained':'';
            if(!reusable){
              const base=process.env.VALIDATION_BASE_SHA;
              if(!isAncestor(base,developSha)){
                reason='develop-history-diverged';
              }else{
                try{
                  git(['merge-tree','--write-tree',process.env.HEAD_SHA,developSha]);
                  const work=impact(base,process.env.HEAD_SHA), drift=impact(base,developSha);
                  const driftApps=new Set(drift.apps||[]), driftPackages=new Set(drift.packages||[]);
                  const appOverlap=(work.apps||[]).some(id=>driftApps.has(id));
                  const packageOverlap=(work.packages||[]).some(name=>driftPackages.has(name));
                  if(drift.infrastructure||drift.controlPlane) reason='develop-shared-control-changed';
                  else if(appOverlap||packageOverlap) reason='affected-scope-overlap';
                  else { reusable=true; reason='mergeable-independent-drift'; }
                }catch{ reason='merge-conflict'; }
              }
            }
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/fast-dev-contract',state:'success',description:'Fast DEV execution contract is clean',
              target_url:target});
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/merge-freshness',state:reusable?'success':'error',
              description:(reusable?(reason==='current-develop-contained'?'Validated head contains current develop':'Independent develop drift; validation reusable'):`ASTRA_REVALIDATE_REQUIRED: ${reason}`).slice(0,140),
              target_url:target});
            if(!reusable){
              await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
                context:'astra/focused-validation',state:'error',
                description:'Develop drift conflicts or overlaps validated impact; reconcile and revalidate',target_url:target});
              core.setFailed(`ASTRA_REVALIDATE_REQUIRED: ${reason}`);
              return;
            }
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'success',
              description:reason==='current-develop-contained'?'Astra-selected exact-head validation passed':'Astra validation reused across independent develop drift',
              target_url:target});
      - name: Record final-head validation failure
        if: failure() && steps.contract.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA || '')) return;
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.HEAD_SHA,
              context:'astra/focused-validation',state:'failure',description:'Astra-selected exact-head validation failed',
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
