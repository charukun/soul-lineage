name: Astra Work Validation
run-name: Astra focused validation ${{ github.ref_name }} ${{ github.sha }}

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
      - 'dispatch/**'
      - 'chore/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: astra-work-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Exact-head focused test and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact work head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Fetch current develop
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - name: Record focused validation pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'pending',
              description: 'Astra exact-head focused validation is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Install dependencies
        run: npm ci
      - name: Check exact patch whitespace
        run: git diff --check origin/develop HEAD
      - name: Run focused changed-workspace tests
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { existsSync, readdirSync } from 'node:fs';

          const changed = execFileSync('git', ['diff', '--name-only', 'origin/develop', 'HEAD'], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          const tests = new Set(changed.filter(path => path.endsWith('.test.mjs')));
          const dirs = new Set();

          for (const path of changed) {
            const app = path.match(/^apps\/([^/]+)\//)?.[1];
            const pkg = path.match(/^packages\/([^/]+)\//)?.[1];
            if (app) dirs.add(`apps/${app}/tests`);
            if (pkg) dirs.add(`packages/${pkg}/tests`);
          }

          for (const dir of dirs) {
            if (!existsSync(dir)) continue;
            for (const file of readdirSync(dir)) {
              if (file.endsWith('.test.mjs')) tests.add(`${dir}/${file}`);
            }
          }

          if (!tests.size) {
            console.log('No changed-workspace Node tests selected.');
            process.exit(0);
          }

          console.log('Focused tests:', [...tests].join(', '));
          const result = spawnSync(process.execPath, ['--test', ...tests], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
      - name: Run exact-head DEV checks and affected builds
        run: node scripts/validate.mjs dev origin/develop HEAD
      - name: Record focused validation success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'success',
              description: 'Astra exact-head focused validation passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Record focused validation failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA || '')) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              context: 'astra/focused-validation',
              state: 'failure',
              description: 'Astra exact-head focused validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
