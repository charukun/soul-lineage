name: Johakyu technique reconcile clean
on:
  push:
    branches: ['feat/johakyu-technique-system-review-20260922']
    paths: ['.github/workflows/johakyu-technique-reconcile-clean.yml']
permissions: {contents: write}
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[johakyu-technique-reconcile-clean]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name Astra
          git config user.email actions@users.noreply.github.com
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge --no-edit origin/develop
          rm .github/workflows/johakyu-technique-reconcile-clean.yml
          rm -f .github/workflows/johakyu-technique-reconcile.yml
          git add -A
          git commit -m "chore(review): remove technique reconcile workflows"
          git push origin HEAD:feat/johakyu-technique-system-review-20260922
