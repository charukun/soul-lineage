name: One-shot BGM150 focused validation

on:
  push:
    branches:
      - fix/bgm150-commercial-clearance-20260918
    paths:
      - '.github/workflows/bgm150-focused-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Validate source MIDIs and Production catalog
        run: node --test packages/audio/tests/source-midi.test.mjs packages/audio/tests/catalog.test.mjs
      - name: Bundle new license assets
        run: |
          printf '%s\n' "export const x=[new URL('./packages/audio/assets/licenses/MuseScore_General_License.txt',import.meta.url).href,new URL('./packages/audio/assets/licenses/MuseScore_General_Sample_Sources.csv',import.meta.url).href];" > .bgm-license-probe.mjs
          node --input-type=module -e "import {build} from 'vite'; await build({configFile:false,logLevel:'silent',build:{write:false,rolldownOptions:{input:'.bgm-license-probe.mjs'}}})"
          rm .bgm-license-probe.mjs
      - name: Bundle audio catalog module
        run: node --input-type=module -e "import {build} from 'vite'; await build({configFile:false,logLevel:'silent',build:{write:false,rolldownOptions:{input:'packages/audio/src/index.js'}}})"
      - name: Bundle audio URL module
        run: node --input-type=module -e "import {build} from 'vite'; await build({configFile:false,logLevel:'silent',build:{write:false,rolldownOptions:{input:'packages/audio/src/urls.js'}}})"
      - name: Prepare Rinne assets
        run: npm run prebuild --workspace @soul/rinne
      - name: Bundle Rinne
        run: npm exec --workspace @soul/rinne -- vite build
      - name: Strip retired Rinne assets
        run: node scripts/strip-retired-character-assets.mjs dist/rinne
      - name: Verify Rinne build
        run: node scripts/verify-build.mjs dist/rinne rinne
      - name: Build Village
        run: npm run build:village
      - name: Build Demon
        run: npm run build:demon
      - name: Diff hygiene
        run: git diff --check
      - name: Remove one-shot validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bgm150-focused-validation.yml
          git commit -m 'chore(audio): remove one-shot BGM validator'
          git push origin "HEAD:${GITHUB_REF_NAME}"
