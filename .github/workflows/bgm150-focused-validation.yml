name: One-shot BGM150 focused validation

on:
  push:
    branches:
      - fix/bgm150-commercial-clearance-20260918
    paths:
      - '.github/workflows/bgm150-focused-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Validate source MIDIs and Production catalog
        run: node --test packages/audio/tests/source-midi.test.mjs packages/audio/tests/catalog.test.mjs
      - name: Load Rinne app config
        run: node --input-type=module -e "const m=await import('./apps/rinne/vite.config.js'); if(!m.default)process.exit(2)"
      - name: Bundle Rinne main module graph
        run: node --input-type=module -e "import {build} from 'vite'; await build({configFile:false,logLevel:'silent',build:{write:false,rolldownOptions:{input:'apps/rinne/src/main.js'}}})"
      - name: Prepare Rinne assets
        run: npm run prebuild --workspace @soul/rinne
      - name: Write single-entry Rinne config
        run: |
          cat > apps/rinne/.bgm-single.config.mjs <<'EOF'
          import {appConfig} from '../../scripts/vite-app.mjs';
          import {fileURLToPath} from 'node:url';
          const config=appConfig('rinne',import.meta.url);
          config.build.rolldownOptions={input:{entry:fileURLToPath(new URL('./index.html',import.meta.url))}};
          export default config;
          EOF
      - name: Bundle Rinne main HTML
        run: npm exec --workspace @soul/rinne -- vite build --config .bgm-single.config.mjs
      - name: Remove single-entry config
        run: rm apps/rinne/.bgm-single.config.mjs
      - name: Strip retired Rinne assets
        run: node scripts/strip-retired-character-assets.mjs dist/rinne
      - name: Verify Rinne build
        run: node scripts/verify-build.mjs dist/rinne rinne
      - name: Build Village
        run: npm run build:village
      - name: Build Demon
        run: npm run build:demon
      - name: Diff hygiene
        run: git diff --check
      - name: Remove one-shot validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bgm150-focused-validation.yml
          git commit -m 'chore(audio): remove one-shot BGM validator'
          git push origin "HEAD:${GITHUB_REF_NAME}"
