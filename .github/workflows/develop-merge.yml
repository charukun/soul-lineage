name: Develop Merge Gate
on:
  workflow_call:
    inputs:
      rescue_mode:
        description: 'legacy scan input; scan runs the lightweight Repair executor while Fast Lane remains event-driven'
        type: string
        required: false
        default: ''
      merge_cursor:
        description: 'legacy compatibility input; Fast Lane does not maintain a queue cursor'
        type: string
        required: false
        default: '0'
    outputs:
      sha:
        description: 'Final develop SHA after this serialized Fast Lane pass'
        value: ${{ jobs.merge.outputs.sha }}
      verify:
        description: 'Legacy compatibility output; DEV verification never blocks Fast Lane'
        value: ${{ jobs.merge.outputs.verify }}
      retry:
        description: 'Whether another external wake may be useful'
        value: ${{ jobs.merge.outputs.retry }}
      cursor:
        description: 'Legacy compatibility cursor'
        value: ${{ jobs.merge.outputs.cursor }}
      merged_count:
        description: 'Number of exact heads merged by Fast Lane'
        value: ${{ jobs.merge.outputs.merged_count }}
permissions:
  contents: read
concurrency:
  group: develop-merge-writer
  cancel-in-progress: false

jobs:
  merge:
    name: Merge eligible Ready PRs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
      issues: write
    outputs:
      sha: ${{ steps.fast-lane.outputs.sha }}
      verify: ${{ steps.fast-lane.outputs.verify }}
      retry: ${{ steps.fast-lane.outputs.retry }}
      cursor: ${{ steps.fast-lane.outputs.cursor }}
      merged_count: ${{ steps.fast-lane.outputs.merged_count }}
      publication_outcome: ${{ steps.publication.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Merge every independently eligible exact head without waiting for DEV/browser
        id: fast-lane
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_DIAGNOSTICS_PATH: .deploy-state/integration-diagnostics.json
        run: node scripts/integration-fast-lane.mjs
      - name: Finalize Deep Repair issues for merged PRs
        if: ${{ !cancelled() && steps.fast-lane.outcome == 'success' && ((steps.fast-lane.outputs.merged_count != '' && steps.fast-lane.outputs.merged_count != '0') || inputs.rescue_mode == 'scan') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_DIAGNOSTICS_PATH: .deploy-state/integration-finalization-api.json
          DEEP_REPAIR_RECONCILE_MERGED: ${{ inputs.rescue_mode == 'scan' }}
        run: node scripts/integration-deep-repair-finalize.mjs .deploy-state/integration.json
      - name: Request latest DEV and PULSE publication without waiting
        id: publication
        if: ${{ !cancelled() && steps.fast-lane.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration-publication.mjs .deploy-state/integration.json
      - name: Notify integrated PRs separately from DEV delivery
        id: notify
        if: ${{ !cancelled() && steps.fast-lane.outputs.merged_count != '' && steps.fast-lane.outputs.merged_count != '0' }}
        continue-on-error: true
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node scripts/notify-delivery.mjs MERGED_TO_DEVELOP .deploy-state/integration.json
      - name: Record notification health without affecting merge success
        if: always() && steps.fast-lane.outputs.merged_count != '0'
        uses: actions/github-script@v8
        env:
          FINAL_SHA: ${{ steps.fast-lane.outputs.sha }}
          CHANNEL: ${{ steps.notify.outputs.channel }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        with:
          script: |
            const channel = process.env.CHANNEL || (process.env.NOTIFY_OUTCOME === 'failure' ? 'failed' : 'not-configured');
            const state = channel === 'ntfy' ? 'success' : channel === 'not-configured' ? 'error' : 'failure';
            const description = channel === 'ntfy' ? 'ntfy smartphone delivery confirmed' : channel === 'not-configured'
              ? 'NTFY_TOPIC_URL is not configured; smartphone delivery unconfirmed'
              : 'ntfy delivery failed; GitHub remains authoritative';
            if (/^[0-9a-f]{40}$/.test(process.env.FINAL_SHA || '')) await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.FINAL_SHA, context: 'notification/ntfy', state, description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-merge-report
          path: |
            .deploy-state/integration.json
            .deploy-state/integration-diagnostics.json
            .deploy-state/deep-repair-finalization.json
            .deploy-state/integration-finalization-api.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  pulse-fallback:
    name: Fallback refresh PULSE if publication wake failed
    needs: merge
    if: >-
      always() &&
      needs.merge.outputs.publication_outcome == 'failure' &&
      needs.merge.outputs.sha != ''
    uses: ./.github/workflows/pulse-refresh.yml
    with:
      source_sha: ${{ needs.merge.outputs.sha }}
      reason: develop-merge
      fail_on_error: false
      record_public_status: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    secrets: inherit

  stale-ready-refresh:
    name: Refresh non-overlapping stale Ready PRs
    needs: merge
    if: always() && needs.merge.result == 'success' && needs.merge.outputs.merged_count == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: write
    outputs:
      validation_has_work: ${{ steps.refresh.outputs.validation_has_work }}
      validation_matrix: ${{ steps.refresh.outputs.validation_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Merge-forward only dependency-free Ready PRs whose develop drift is scope-disjoint
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_DIAGNOSTICS_PATH: .deploy-state/integration-stale-refresh-api.json
        run: node scripts/integration-stale-ready-refresh.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-stale-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deploy-state/integration-stale-refresh.json
            .deploy-state/integration-stale-refresh-api.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  stale-ready-validate:
    name: Validate refreshed dependency-free heads
    needs: stale-ready-refresh
    if: needs.stale-ready-refresh.result == 'success' && needs.stale-ready-refresh.outputs.validation_has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stale-ready-refresh.outputs.validation_matrix) }}
    uses: ./.github/workflows/integration-exact-head-validation.yml
    with:
      pr: ${{ matrix.pr }}
      head: ${{ matrix.head }}
      base: ${{ matrix.base }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    secrets: inherit

  stale-ready-wake:
    name: Wake Fast Lane after refreshed-head validation
    needs: [stale-ready-refresh, stale-ready-validate]
    if: always() && needs.stale-ready-refresh.outputs.validation_has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy.yml',
              ref: 'develop',
            });

  repair:
    name: Fast Repair executor
    if: inputs.rescue_mode == 'scan'
    uses: ./.github/workflows/integration-rescue.yml
    permissions:
      contents: write
      pull-requests: read
      actions: write
      statuses: write
    secrets: inherit

  continue-dependent-chain:
    name: Wake next dependent Repair scan
    needs: [merge, repair]
    if: always() && needs.merge.result == 'success' && needs.merge.outputs.merged_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wake Fast Repair on the latest develop after a successful merge batch
        uses: actions/github-script@v8
        env:
          MERGED_COUNT: ${{ needs.merge.outputs.merged_count }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'develop' });
            core.info(`Fast Lane merged ${process.env.MERGED_COUNT}; wake dependent scan at ${branch.commit.sha}`);
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy.yml',
              ref: 'develop',
              inputs: { rescue_mode: 'scan', merge_cursor: '0' },
            });
