name: Battle2 shared frame specialist evidence (one shot)
on:
  push:
    branches: [fix/battle2-review-shell-20260921]
    paths: ['.github/workflows/battle2-shell-once.yml']
permissions:
  contents: read
jobs:
  shell-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/battle2-review-shell-20260921
          fetch-depth: 2
          persist-credentials: false
      - name: Record the exact checkout and arm only the final work head
        id: source
        run: |
          mkdir -p .battle2-evidence
          git rev-parse HEAD | tee .battle2-evidence/source-sha.txt
          if git log -1 --format=%B | grep -q '\[astra-validate\]'; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'Specialist path prepared. Rerun this job after removing the temporary workflow and arming the final head.'
          fi
      - uses: actions/setup-node@v6
        if: steps.source.outputs.armed == 'true'
        with:
          node-version: '24'
      - name: Build review and execute the existing specialist browser scenarios
        if: steps.source.outputs.armed == 'true'
        env:
          APP_ENV: dev
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test apps/review/tests/review-app.test.mjs apps/review/tests/battle2-shell.test.mjs
          npm run build --workspace @soul/review
          npx playwright install --with-deps chromium
          node apps/review/scripts/nocturne-browser.mjs
      - name: Preserve exact-source report screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle2-shell-${{ github.run_id }}-${{ github.run_attempt }}
          path: .battle2-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
