name: Temporary kuumetsu observation transport 20260922
# Task-scoped branch only. Never merge to develop/main. Read-only evidence audit.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: read
  issues: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f2266ceb84c39740559eac4b45696be7ed6d4394
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Canonical current Actions summary first
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mkdir -p final-audit && npm run actions:summary -- --repo charukun/soul-lineage --sha f2266ceb84c39740559eac4b45696be7ed6d4394 --pr 1345 --output final-audit/actions-summary.json > /tmp/actions-summary.log
      - uses: actions/download-artifact@v4
        with:
          name: kuumetsu-before-native-armed-994f61b
          run-id: 35647757372
          github-token: ${{ github.token }}
          path: /tmp/lineage-before
      - uses: actions/download-artifact@v4
        with:
          name: kuumetsu-lineage-after-1345
          run-id: 35650389669
          github-token: ${{ github.token }}
          path: /tmp/lineage-after
      - name: Compare unchanged browser evidence to same-state authority
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const load=p=>JSON.parse(readFileSync(p));
          const hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const before=load('/tmp/lineage-before/observation.json'),after=load('/tmp/lineage-after/observation.json');
          const originalComparison=load('/tmp/lineage-after/lineage-comparison.json');
          assert.deepEqual(before.conditions,after.conditions);
          const rows=[];
          for(const [label,data,sha,url] of [
            ['before',before,'994f61bd08dadf2bde8e4b83cef5e5a6c1978f5c','https://a349204c-soul-lineage-demon-dev.c-okamoto.workers.dev/'],
            ['after',after,'f2266ceb84c39740559eac4b45696be7ed6d4394','https://e9fa0ed1-soul-lineage-demon-dev.c-okamoto.workers.dev/']]){
            assert.equal(data.sourceSha,sha);assert.equal(data.version.commit,sha);assert.equal(data.url,url);
            assert.equal(data.success,true);assert.deepEqual(data.errors,[]);
            assert.equal(hash(`/tmp/lineage-${label}/observer.mjs`),'5ff7fe476f281a38e2355d9d35cb179e36c5797ec73ea850ad3a256de237346b');
            const stage=data.stages.find(s=>s.name==='05-lineage'),s=stage.snapshot,t=stage.text;
            assert.equal(s.eaten,2);assert.equal(s.profile.currentLife.eaten,0);assert.equal(s.finished,false);
            const carried=s.hunt.carried,hud=t.match(/^未確保 (\d+) · 帰還 (\d+)$/m);
            assert.ok(Number.isSafeInteger(carried)&&carried>0);assert.ok(hud);assert.equal(Number(hud[1]),carried);
            const display=Number(t.match(/^捕食 (\d+)$/m)?.[1]);
            if(label==='before'){assert.equal(display,0);assert.doesNotMatch(t,/今回の狩り/);}
            else{
              assert.equal(display,s.profile.currentLife.eaten+s.eaten);
              assert.ok(t.includes(`今回の狩り 捕食 ${s.eaten}`));
              assert.ok(t.includes(`終了した狩り ${s.profile.currentLife.eaten} ＋ 今回 ${s.eaten}`));
              const live=t.match(/^未確保の戦利品 (\d+) · 帰還で確保$/m);assert.ok(live);
              assert.equal(Number(live[1]),carried,'lineage unbanked amount must equal native snapshot, not a fixed encounter yield');
              const paused=data.stages.find(s=>s.name==='04-pause').snapshot;
              assert.deepEqual(s.profile,paused.profile,'opening lineage must not change persisted profile');
              assert.deepEqual(s.hunt,paused.hunt,'opening lineage must not change hunt authority');
            }
            rows.push({label,sourceSha:sha,reference:url,observedAt:stage.at,eaten:s.eaten,endedMeals:s.profile.currentLife.eaten,display,carried,hudCarried:Number(hud[1]),lineageImageSha256:hash(`/tmp/lineage-${label}/05-lineage.png`),failedRequests:data.failedRequests});
          }
          assert.equal(originalComparison.unbankedVisible,false,'retain the original fixed-four comparison failure');
          assert.equal(rows[1].carried,5,'this audit concerns the existing captured run, not a rerun chosen for a different result');
          writeFileSync('final-audit/evidence-audit.json',JSON.stringify({verdict:'supported',conditions:after.conditions,rows,observerByteIdentical:true,browserEvidenceModified:false,qualityGatesModified:false,originalComparison,correction:'Compare rendered unbanked amount to native snapshot.hunt.carried and HUD. Fresh procedural encounters yielded 4 before and 5 after; no reward/balance change is inferred.',visualReview:'Assistant inspected both 05-lineage.png screenshots in the conversation before this audit; live progress is visible without overlapping metrics or growth chips.'},null,2));
          console.log('Immutable read-side prediction supported; original failure retained; no browser rerun or app changes.');
          JS
      - name: Read fresh exact-head merge gate
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
            const head='f2266ceb84c39740559eac4b45696be7ed6d4394',base='29b88f5f077f645f52d27974540b420a1bbd9340';
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:1345})).data;
            const develop=(await github.rest.repos.getBranch({...context.repo,branch:'develop'})).data;
            const comparison=(await github.rest.repos.compareCommits({...context.repo,base:develop.commit.sha,head})).data;
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35650326852})).data;
            const statusResponse=(await github.rest.repos.getCombinedStatusForRef({...context.repo,ref:head})).data;
            const reviews=await github.paginate(github.rest.pulls.listReviews,{...context.repo,pull_number:1345,per_page:100});
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:1345,per_page:100});
            if(!comments.some(c=>c.id===5767040659&&c.body.includes('premerge-evidence:kuumetsu:kuumetsu-live-lineage-20260922')&&c.body.includes(head)))throw new Error('Missing inspected premerge evidence/learning record');
            const blockingDependencies=[pr.body,...comments.map(c=>c.body)].filter(body=>/^\s*(?:blocked by|depends on|hold|do not merge|manual merge only)\b/im.test(body||''));
            const snapshot={fetchedAt:new Date().toISOString(),expected:{headSha:head,developSha:base},pr,develop,comparison,run,statusResponse,reviews,blockingDependencies};
            const {evaluateMergeGate}=await import(pathToFileURL(path.resolve('.autonomous/lib/contract.mjs')).href);
            const gate=evaluateMergeGate(snapshot);
            const fresh=statusResponse.statuses.filter(s=>s.context==='astra/merge-freshness').sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
            if(fresh?.state!=='success'||fresh.target_url!==run.html_url){gate.eligible=false;gate.errors.push('LATEST_FRESHNESS_STATUS_REQUIRED');}
            fs.writeFileSync('final-audit/merge-gate-snapshot.json',JSON.stringify(snapshot,null,2));
            fs.writeFileSync('final-audit/merge-gate.json',JSON.stringify({...gate,fetchedAt:snapshot.fetchedAt,canonicalRunId:run.id,prDraft:pr.draft,reviewCount:reviews.length,blockingDependencyCount:blockingDependencies.length},null,2));
            core.info('MERGE_GATE '+JSON.stringify(gate));
            if(!gate.eligible)throw new Error('Repair same PR before Ready: '+gate.errors.join(', '));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-lineage-final-audit-1345
          path: final-audit
          retention-days: 14
