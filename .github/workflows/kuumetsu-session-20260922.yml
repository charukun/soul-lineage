name: Temporary kuumetsu first-combat agency final evidence 20260922
# Task-scoped ops branch only. Never merge this workflow to develop/main.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
  statuses: read
  pull-requests: read
env:
  SOURCE_SHA: 065cf7313b7812442a77b7ed87f9b9950a6a4638
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview: ${{ steps.publish.outputs.preview }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 065cf7313b7812442a77b7ed87f9b9950a6a4638
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require canonical exact-head validation
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'astra-work-validation.yml',head_sha:process.env.SOURCE_SHA,per_page:10})).data.workflow_runs;
            const run=runs.find(r=>r.head_sha===process.env.SOURCE_SHA&&r.event==='push'&&r.status==='completed');
            if(!run||run.conclusion!=='success')throw new Error('Canonical exact-head validation is not successful');
            const statuses=(await github.rest.repos.getCombinedStatusForRef({...context.repo,ref:process.env.SOURCE_SHA})).data.statuses;
            for(const name of ['astra/fast-dev-contract','astra/focused-validation','astra/merge-freshness']){
              const latest=statuses.filter(s=>s.context===name).sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
              if(latest?.state!=='success')throw new Error('Missing canonical success: '+name);
            }
            fs.mkdirSync('session-evidence',{recursive:true});
            fs.writeFileSync('session-evidence/canonical-validation.json',JSON.stringify({runId:run.id,url:run.html_url,head:run.head_sha,conclusion:run.conclusion},null,2));
      - name: Publish exact head through existing Per-App DEV Publish
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const started=Date.now(),seen=new Set();
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'dev-app-publish.yml',ref:'develop',inputs:{app:'demon',source_sha:process.env.SOURCE_SHA}});
            for(let attempt=0;attempt<48;attempt++){
              await new Promise(r=>setTimeout(r,15000));
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'dev-app-publish.yml',event:'workflow_dispatch',per_page:15})).data.workflow_runs.filter(r=>Date.parse(r.created_at)>=started-3000);
              for(const run of runs){
                if(seen.has(run.id))continue;
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:30})).data.jobs;
                const job=jobs.find(j=>j.name==='Publish demon DEV');
                if(!job||job.status!=='completed')continue;
                seen.add(run.id);
                const response=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
                const log=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');
                const versionId=log.match(/Current Version ID:\s*([0-9a-f-]{36})/i)?.[1];
                if(!versionId)continue;
                const preview='https://'+versionId.slice(0,8)+'-soul-lineage-demon-dev.c-okamoto.workers.dev/';
                const v=await(await fetch(new URL('version.json',preview))).json();
                if(v.commit!==process.env.SOURCE_SHA)continue;
                if(job.conclusion!=='success')throw new Error('Exact publication job failed: '+run.html_url);
                fs.writeFileSync('session-evidence/after-publication.json',JSON.stringify({runId:run.id,jobId:job.id,url:run.html_url,sourceSha:process.env.SOURCE_SHA,versionId,preview,version:v,commitMatched:true,verifiedAt:new Date().toISOString()},null,2));
                core.setOutput('preview',preview);core.info('IMMUTABLE_AFTER '+preview+' '+v.commit);return;
              }
            }
            throw new Error('Bounded exact-source publication wait elapsed');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-first-combat-agency-final-publish-1370
          path: session-evidence
          retention-days: 14
  observe:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 065cf7313b7812442a77b7ed87f9b9950a6a4638
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Load existing native kuumetsu observer
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            fs.writeFileSync('session-observe.mjs',Buffer.from(r.data.content,'base64'));
      - name: Same-condition immutable native After
        env:
          SOURCE_SHA: 065cf7313b7812442a77b7ed87f9b9950a6a4638
          PREVIEW_URL: ${{ needs.publish.outputs.preview }}
        run: mkdir -p session-evidence && cp session-observe.mjs session-evidence/observer.mjs && node session-observe.mjs > session-evidence/browser.log 2>&1
      - name: Evaluate first-combat agency success signals
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('session-evidence/observation.json'));
          const huntStages=d.stages.filter(s=>s.name==='02-hunt-entry'||s.name.startsWith('03-play-'));
          const text=huntStages.map(s=>s.text||'').join('\n');
          const combat=huntStages.find(s=>s.snapshot?.combat);
          const combatText=combat?.text||'';
          const result={
            sourceSha:d.sourceSha,
            sourceMatched:d.version?.commit===d.sourceSha,
            browserSuccess:d.success===true,
            automaticCombatObserved:!!combat,
            fightGuideShowsAutoCombat:text.includes('近づけば、自動戦闘'),
            fightGuideShowsSwipeSpacing:text.includes('スワイプ')&&text.includes('間合いを変える'),
            fightGuideShowsDisengage:text.includes('離れたい')&&text.includes('敵と逆へ距離を取る'),
            combatReadoutShowsAgency:combatText.includes('自動戦闘 · スワイプで間合い'),
            errors:d.errors||[],
            failedRequests:d.failedRequests||[],
            firstCombatStage:combat?.name||null,
            observedAt:combat?.at||d.observedAt,
            verdict:'supported'
          };
          if(!result.sourceMatched||!result.browserSuccess||!result.automaticCombatObserved||!result.fightGuideShowsAutoCombat||!result.fightGuideShowsSwipeSpacing||!result.fightGuideShowsDisengage||!result.combatReadoutShowsAgency||result.errors.length)result.verdict='inconclusive';
          writeFileSync('session-evidence/agency-comparison.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          if(result.verdict!=='supported')throw new Error('After did not support all first-combat agency success signals');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-first-combat-agency-final-after-1370
          path: session-evidence
          retention-days: 14
