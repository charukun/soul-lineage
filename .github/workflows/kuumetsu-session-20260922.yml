name: Temporary kuumetsu immutable observation 20260922
# Existing isolated hosted fallback. Session evidence only; never merge this ops branch.
on:
  push:
    branches: [ops/kuumetsu-three-20260922-041446]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
  statuses: read
  pull-requests: write
env:
  SOURCE_SHA: cdde492c4663c4f7e421db60e66721f757184e11
  PR_NUMBER: 1427
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cdde492c4663c4f7e421db60e66721f757184e11
          persist-credentials: false
      - name: Dispatch existing exact-source demon publication
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            if(context.repo.owner!=='charukun'||context.repo.repo!=='soul-lineage')throw Error('wrong repository');
            const startedAt=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'dev-app-publish.yml',ref:'develop',inputs:{app:'demon',source_sha:process.env.SOURCE_SHA}});
            core.setOutput('started_at',startedAt);
            const pr=await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)});
            const pattern=/<!-- autonomous-iteration-telemetry:v1:([A-Za-z0-9_-]+) -->/;
            const match=pr.data.body.match(pattern);if(!match)throw Error('telemetry absent');
            const t=JSON.parse(Buffer.from(match[1],'base64url').toString());
            const s=t.steps[t.currentStep];s.state='done';s.completedAt=startedAt;s.durationMs=Date.parse(startedAt)-Date.parse(s.startedAt);
            t.currentStep='causalValidation';t.updatedAt=startedAt;t.prNumber=pr.data.number;t.steps.causalValidation={...t.steps.causalValidation,state:'running',startedAt};
            t.improvementSummary='native状態投影と紙面内の二段組みで捕食・未確保・警戒を読める表示にする';
            t.changes=['native-stakes-projection','readable-stakes-composition'];
            t.changedPaths=['apps/demon/src/web/hunt-stakes-state.js','apps/demon/src/web/hunt-stakes-readability.css','apps/demon/src/web/hunt-flow-ui.js','apps/demon/tests/hunt-stakes-state.test.mjs'];
            await github.rest.pulls.update({...context.repo,pull_number:pr.data.number,body:pr.data.body.replace(pattern,`<!-- autonomous-iteration-telemetry:v1:${Buffer.from(JSON.stringify(t)).toString('base64url')} -->`)});
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Candidate causal preflight, not formal merge validation
        run: |
          mkdir -p session-evidence
          node --test apps/demon/tests/hunt-stakes-state.test.mjs | tee session-evidence/causal-preflight.log
          node --input-type=module -e "import {validateRecord} from './.autonomous/lib/contract.mjs';import {readFileSync} from 'node:fs';validateRecord(JSON.parse(readFileSync('.autonomous/kuumetsu/experiments/kuumetsu-hunt-stakes-legibility-20260922.json','utf8')));"
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Bind exact publication and reuse native observer
        uses: actions/github-script@v8
        env:
          PUBLISH_STARTED_AT: ${{ steps.publish.outputs.started_at }}
        with:
          script: |
            const fs=require('fs');
            const started=Date.parse(process.env.PUBLISH_STARTED_AT)-1000, seen=new Set();
            let publication=null;
            for(let attempt=0;attempt<40&&!publication;attempt++){
              const runs=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'dev-app-publish.yml',event:'workflow_dispatch',per_page:10});
              for(const r of runs.data.workflow_runs.filter(r=>Date.parse(r.created_at)>=started&&r.status==='completed'&&r.conclusion==='success'&&!seen.has(r.id))){
                const jobs=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:r.id,per_page:50});
                for(const j of jobs.data.jobs){
                  const log=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:j.id});
                  const text=typeof log.data==='string'?log.data:Buffer.from(log.data).toString('utf8');
                  const version=text.match(/Current Version ID:\s*([a-f0-9-]{36})/);
                  if(text.includes(process.env.SOURCE_SHA)&&version){publication={sourceSha:process.env.SOURCE_SHA,runId:r.id,runUrl:r.html_url,jobId:j.id,versionId:version[1],url:`https://${version[1].slice(0,8)}-soul-lineage-demon-dev.c-okamoto.workers.dev/`};break;}
                }
                seen.add(r.id);if(publication)break;
              }
              if(!publication)await new Promise(r=>setTimeout(r,15000));
            }
            if(!publication)throw Error('No exact-source immutable publication captured; retry the same source, never mutable latest');
            const version=await(await fetch(new URL('version.json',publication.url))).json();
            if(version.commit!==process.env.SOURCE_SHA)throw Error('immutable version identity mismatch');
            publication.version=version;publication.boundAt=new Date().toISOString();
            fs.writeFileSync('session-evidence/publication.json',JSON.stringify(publication,null,2));
            core.exportVariable('PREVIEW_URL',publication.url);core.info(JSON.stringify(publication));
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            let source=Buffer.from(r.data.content,'base64').toString('utf8');
            source=source.replace("if(await gate.isVisible()){await tap('#soul-brand-boot');", "if(await gate.isVisible()){await page.waitForFunction(()=>document.querySelector('#soul-brand-boot')?.classList.contains('armed'));await tap('#soul-brand-boot');");
            source=source.replace('presentation:window.__NIGHT_HUNT__?.presentationSnapshot?.()',"presentation:window.__NIGHT_HUNT__?.presentationSnapshot?.(),geometry:Object.fromEntries(['#objective','[data-goal]','[data-haul]','[data-pressure]','.life','#pause'].map(selector=>{const n=document.querySelector(selector),r=n?.getBoundingClientRect(),c=n&&getComputedStyle(n);return [selector,{text:n?.textContent,hidden:n?.hidden,rect:r?.toJSON(),color:c?.color,opacity:c?.opacity,clip:c?.clipPath}]}))");
            source=source.replace('if(held)await page.mouse.up();\n if(await page.locator',"if(held)await page.mouse.up();\n await page.setViewportSize({width:360,height:841});await capture('03-narrow');await page.setViewportSize({width:673,height:841});\n if(await page.locator");
            fs.writeFileSync('session-observe.mjs',source);fs.writeFileSync('session-evidence/observer.mjs',source);
            const pr=await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)});
            const pattern=/<!-- autonomous-iteration-telemetry:v1:([A-Za-z0-9_-]+) -->/;
            const t=JSON.parse(Buffer.from(pr.data.body.match(pattern)[1],'base64url').toString()),at=new Date().toISOString();
            t.steps.causalValidation.state='done';t.steps.causalValidation.completedAt=at;t.steps.causalValidation.durationMs=Date.parse(at)-Date.parse(t.steps.causalValidation.startedAt);
            t.currentStep='afterObservation';t.updatedAt=at;t.steps.afterObservation={...t.steps.afterObservation,state:'running',startedAt:at};
            await github.rest.pulls.update({...context.repo,pull_number:pr.data.number,body:pr.data.body.replace(pattern,`<!-- autonomous-iteration-telemetry:v1:${Buffer.from(JSON.stringify(t)).toString('base64url')} -->`)});
      - name: Iteration 1 immutable candidate native play
        run: node session-observe.mjs > session-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-three-20260922-041446-i1-after
          path: session-evidence
          retention-days: 14
