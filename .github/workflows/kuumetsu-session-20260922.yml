name: Temporary kuumetsu observation transport 20260922
# Task-scoped branch only; never merge into develop/main. No synthetic statuses or merges.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
  statuses: read
  pull-requests: read
env:
  SOURCE_SHA: b3bcad1bb2ed599fd40538abe5682d735b65f5d4
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview: ${{ steps.publish.outputs.preview }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b3bcad1bb2ed599fd40538abe5682d735b65f5d4
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Canonical Actions summary first
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mkdir -p session-evidence && npm run actions:summary -- --repo charukun/soul-lineage --sha "$SOURCE_SHA" --pr 1345 --output session-evidence/actions-initial.json > session-evidence/actions-initial.log
      - name: Wait only for this exact canonical validation
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            for(let attempt=0;attempt<24;attempt++){
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'astra-work-validation.yml',head_sha:process.env.SOURCE_SHA,per_page:5})).data.workflow_runs;
              const run=runs.find(r=>r.head_sha===process.env.SOURCE_SHA&&r.event==='push');
              if(run?.status==='completed'){
                fs.writeFileSync('session-evidence/canonical-run.json',JSON.stringify({id:run.id,url:run.html_url,head:run.head_sha,conclusion:run.conclusion,path:run.path},null,2));
                if(run.conclusion!=='success')throw new Error('Canonical exact-head validation failed; repair same PR');
                const statuses=(await github.rest.repos.getCombinedStatusForRef({...context.repo,ref:process.env.SOURCE_SHA})).data.statuses;
                for(const name of ['astra/fast-dev-contract','astra/focused-validation','astra/merge-freshness']){
                  if(statuses.find(s=>s.context===name)?.state!=='success')throw new Error('Missing canonical success: '+name);
                }
                core.info('CANONICAL_VALIDATED '+run.id+' '+run.head_sha);return;
              }
              await new Promise(r=>setTimeout(r,15000));
            }
            throw new Error('Bounded canonical validation wait elapsed');
      - name: Validate new v2 plan without rewriting legacy records
        run: |
          node --input-type=module - <<'JS'
          import{readFileSync}from'node:fs';import{validateRecord}from'./.autonomous/lib/contract.mjs';
          const r=JSON.parse(readFileSync('.autonomous/kuumetsu/experiments/kuumetsu-live-lineage-20260922.json'));
          validateRecord(r);if(r.receipt.pullRequest!==1345)throw new Error('PR binding mismatch');
          console.log('New schemaVersion 2 experiment valid on exact head');
          JS
      - name: Canonical final validation summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run actions:summary -- --repo charukun/soul-lineage --sha "$SOURCE_SHA" --pr 1345 --output session-evidence/actions-validated.json > session-evidence/actions-validated.log
      - name: Publish exact head through existing Per-App DEV Publish
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const started=Date.now(),seen=new Set();
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'dev-app-publish.yml',ref:'develop',inputs:{app:'demon',source_sha:process.env.SOURCE_SHA}});
            for(let attempt=0;attempt<48;attempt++){
              await new Promise(r=>setTimeout(r,15000));
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'dev-app-publish.yml',event:'workflow_dispatch',per_page:10})).data.workflow_runs.filter(r=>Date.parse(r.created_at)>=started-2000);
              for(const run of runs){
                if(seen.has(run.id))continue;
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:30})).data.jobs;
                const job=jobs.find(j=>j.name==='Publish demon DEV');
                if(!job||job.status!=='completed')continue;
                seen.add(run.id);
                const response=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
                const log=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');
                const versionId=log.match(/Current Version ID:\s*([0-9a-f-]{36})/i)?.[1];
                if(!versionId){if(log.includes(process.env.SOURCE_SHA))throw new Error('Exact-source publication failed: '+run.html_url);continue;}
                const preview=`https://${versionId.slice(0,8)}-soul-lineage-demon-dev.c-okamoto.workers.dev/`;
                const v=await(await fetch(new URL('version.json',preview))).json();
                if(v.commit!==process.env.SOURCE_SHA)continue;
                if(job.conclusion!=='success')throw new Error('Exact publication job did not succeed');
                fs.writeFileSync('session-evidence/after-publication.json',JSON.stringify({runId:run.id,jobId:job.id,url:run.html_url,sourceSha:process.env.SOURCE_SHA,versionId,preview,version:v,commitMatched:true,verifiedAt:new Date().toISOString()},null,2));
                core.setOutput('preview',preview);core.info('IMMUTABLE_AFTER '+preview+' '+v.commit);return;
              }
            }
            throw new Error('Bounded exact-source publication wait elapsed');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-lineage-validation-publish-1345
          path: session-evidence
          retention-days: 14
  observe:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b3bcad1bb2ed599fd40538abe5682d735b65f5d4
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Load byte-identical Before observer
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:'3a986068186dd91ad758cb6af33d8974c8cc4534'});
            const original=Buffer.from(r.data.content,'base64').toString();
            const source=original.replace("if(await gate.isVisible()){await tap('#soul-brand-boot');","if(await gate.isVisible()){await page.locator('#soul-brand-boot.armed').waitFor({state:'visible'});await tap('#soul-brand-boot');");
            const hash=crypto.createHash('sha256').update(source).digest('hex');
            if(hash!=='5ff7fe476f281a38e2355d9d35cb179e36c5797ec73ea850ad3a256de237346b')throw new Error('Before observer identity mismatch');
            fs.writeFileSync('session-observe.mjs',source);
      - name: Same-condition immutable native After
        env:
          PREVIEW_URL: ${{ needs.publish.outputs.preview }}
        run: mkdir -p session-evidence && cp session-observe.mjs session-evidence/observer.mjs && node session-observe.mjs > session-evidence/browser.log 2>&1
      - name: Record observed lineage comparison
        run: |
          node --input-type=module - <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';
          const d=JSON.parse(readFileSync('session-evidence/observation.json'));
          const s=d.stages.find(x=>x.name==='05-lineage');
          const result={sourceSha:d.sourceSha,sourceMatched:d.version.commit===d.sourceSha,browserSuccess:d.success,observedAt:s?.at,eaten:s?.snapshot?.eaten,persistedEndedMeals:s?.snapshot?.profile?.currentLife?.eaten,liveProgressVisible:/今回の狩り\s+捕食\s*2/.test(s?.text||''),breakdownVisible:(s?.text||'').includes('終了した狩り 0 ＋ 今回 2'),unbankedVisible:/未確保の戦利品\s+4/.test(s?.text||''),pageErrors:d.errors,visualReview:'pending assistant screenshot inspection'};
          writeFileSync('session-evidence/lineage-comparison.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          if(!result.sourceMatched||!result.browserSuccess||result.eaten!==2||result.persistedEndedMeals!==0||!result.liveProgressVisible||!result.breakdownVisible||!result.unbankedVisible||result.pageErrors.length)throw new Error('After did not support the prediction; inspect evidence and repair or record inconclusive');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-lineage-after-1345
          path: session-evidence
          retention-days: 14
