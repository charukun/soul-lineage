name: Temporary kuumetsu immutable observation 20260922
# Session-only invocation of the canonical status-first merge summary. Never merged.
on:
  push:
    branches: [ops/kuumetsu-three-20260922-041446]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  statuses: read
  actions: read
  pull-requests: write
env:
  SOURCE_SHA: de8fb38ec943bb06ce6afd1e14fabbb585bc9bb8
  PR_NUMBER: 1427
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: de8fb38ec943bb06ce6afd1e14fabbb585bc9bb8
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read the merge-owning statuses, without normal CI or DEV waiting
        uses: actions/github-script@v8
        with:
          script: |
            const pr=await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)});
            if(pr.data.head.sha!==process.env.SOURCE_SHA||pr.data.base.ref!=='develop'||pr.data.state!=='open')throw Error('PR coordinate changed');
            const marker=/<!-- autonomous-iteration-telemetry:v1:([A-Za-z0-9_-]+) -->/;
            let body=pr.data.body;
            if(pr.data.draft){
              const t=JSON.parse(Buffer.from(body.match(marker)[1],'base64url').toString());
              const adoption=await github.rest.issues.getComment({...context.repo,comment_id:5771508981});
              const head=await github.rest.git.getCommit({...context.repo,commit_sha:process.env.SOURCE_SHA});
              const advance=(from,to,at)=>{const s=t.steps[from];s.state='done';s.completedAt=at;s.durationMs=Date.parse(at)-Date.parse(s.startedAt);t.steps[to]={...t.steps[to],state:'running',startedAt:at};t.currentStep=to;t.updatedAt=at;};
              if(t.currentStep==='afterObservation'){advance('afterObservation','verdict',adoption.data.created_at);advance('verdict','astraValidation',head.data.committer.date);t.verdict='supported';}
              body=body.replace(marker,`<!-- autonomous-iteration-telemetry:v1:${Buffer.from(JSON.stringify(t)).toString('base64url')} -->`);
              await github.rest.pulls.update({...context.repo,pull_number:pr.data.number,body});
            }
            for(let i=0;i<36;i++){
              const response=await github.rest.repos.getCombinedStatusForRef({...context.repo,ref:process.env.SOURCE_SHA});
              const contexts=['astra/fast-dev-contract','astra/focused-validation','astra/merge-freshness'];
              const rows=contexts.map(c=>response.data.statuses.find(s=>s.context===c));
              if(rows.some(s=>['failure','error'].includes(s?.state)))throw Error(JSON.stringify(rows));
              if(rows.every(s=>s?.state==='success'))break;
              if(!pr.data.draft||i===35)throw Error('Exact-head validation not yet successful');
              await new Promise(r=>setTimeout(r,15000));
            }
      - name: Canonical merge summary, exactly once per invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p session-evidence
          npm run actions:summary -- --repo charukun/soul-lineage --sha "$SOURCE_SHA" --pr "$PR_NUMBER" --output session-evidence/actions-summary.json > session-evidence/summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-three-20260922-041446-i1-summary-${{ github.run_attempt }}
          path: session-evidence
          retention-days: 14
