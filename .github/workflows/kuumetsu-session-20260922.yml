name: Temporary kuumetsu immutable observation 20260922
# Existing task-scoped ops fallback. Never merge to develop/main.
# Recheck only because shared runtime/build input overlap required reconciliation.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
  statuses: read
  pull-requests: read
env:
  SOURCE_SHA: 2f13f313d20a1e609696599ec095030b8adbd4dd
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview: ${{ steps.publish.outputs.preview }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish integrated candidate through Per-App DEV Publish
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            fs.mkdirSync('session-evidence',{recursive:true});
            const started=Date.now(),seen=new Set();
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'dev-app-publish.yml',ref:'develop',inputs:{app:'demon',source_sha:process.env.SOURCE_SHA}});
            for(let attempt=0;attempt<48;attempt++){
              await new Promise(r=>setTimeout(r,15000));
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'dev-app-publish.yml',event:'workflow_dispatch',per_page:15})).data.workflow_runs.filter(r=>Date.parse(r.created_at)>=started-3000);
              for(const run of runs){
                if(seen.has(run.id))continue;
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:30})).data.jobs;
                const job=jobs.find(j=>j.name==='Publish demon DEV');
                if(!job||job.status!=='completed')continue;
                seen.add(run.id);
                const response=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
                const log=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');
                const versionId=log.match(/Current Version ID:\s*([0-9a-f-]{36})/i)?.[1];
                if(!versionId)continue;
                const preview='https://'+versionId.slice(0,8)+'-soul-lineage-demon-dev.c-okamoto.workers.dev/';
                const v=await(await fetch(new URL('version.json',preview))).json();
                if(v.commit!==process.env.SOURCE_SHA)continue;
                if(job.conclusion!=='success')throw new Error('Exact publication job failed: '+run.html_url);
                fs.writeFileSync('session-evidence/publication.json',JSON.stringify({runId:run.id,jobId:job.id,url:run.html_url,sourceSha:process.env.SOURCE_SHA,versionId,preview,version:v,commitMatched:true,verifiedAt:new Date().toISOString()},null,2));
                core.setOutput('preview',preview);core.info('IMMUTABLE_STAGING '+preview+' '+v.commit);return;
              }
            }
            throw new Error('Bounded exact-source publication wait elapsed');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-contact-integrated-publication
          path: session-evidence
          retention-days: 14
  observe:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Causal integration preflight only
        run: |
          mkdir -p session-evidence
          node --test apps/demon/tests/combat-exchange-readout.test.mjs apps/demon/tests/devour-feedback.test.mjs > session-evidence/preflight.log 2>&1
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {validateRecord} from './.autonomous/lib/contract.mjs';validateRecord(JSON.parse(readFileSync('.autonomous/kuumetsu/experiments/kuumetsu-combat-contact-ownership-20260922.json')));console.log('v3 plan valid');" >> session-evidence/preflight.log
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Same native route and read-only captures as candidate round
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            let source=Buffer.from(r.data.content,'base64').toString('utf8');
            source=source.replace("if(await gate.isVisible()){await tap('#soul-brand-boot');", "if(await gate.isVisible()){await page.waitForFunction(()=>document.querySelector('#soul-brand-boot')?.classList.contains('armed'));await tap('#soul-brand-boot');");
            source=source.replace("text:document.body.innerText,buttons:","readout:(()=>{const r=document.querySelector('#combat-exchange-readout');return r?{hidden:r.hidden,text:r.innerText,direction:r.dataset.contact,box:r.getBoundingClientRect().toJSON(),rows:[...r.querySelectorAll('.exchange-vitals')].map(n=>({side:n.dataset.side,name:n.querySelector('.exchange-name').textContent,amount:n.querySelector('.exchange-amount').textContent,meter:n.querySelector('progress').value}))}:null})(),text:document.body.innerText,buttons:");
            source=source.replace('let held=false,sawCombat=false,lastEaten=0;', 'let held=false,sawCombat=false,lastEaten=0;const seenContactKinds=new Set();');
            source=source.replace('await capture(`03-play-${String(i).padStart(2,\'0\')}`,important||i%4===0);',"const kind=await page.evaluate(()=>{const r=document.querySelector('#combat-exchange-readout');return r&&!r.hidden?(r.dataset.contact+(/防御/.test(r.innerText)?'-guard':'')):'';});const newKind=kind&&!seenContactKinds.has(kind);if(kind)seenContactKinds.add(kind);await capture(`03-play-${String(i).padStart(2,'0')}`,important||i%4===0||newKind);");
            fs.writeFileSync('session-observe.mjs',source);
      - name: Immutable integrated candidate native play
        env:
          PREVIEW_URL: ${{ needs.publish.outputs.preview }}
        run: cp session-observe.mjs session-evidence/observer.mjs && node session-observe.mjs > session-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-contact-integrated-observation
          path: session-evidence
          retention-days: 14
