name: Temporary kuumetsu observation transport 20260922
# Task-scoped control branch only. Never merge into develop/main.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 994f61bd08dadf2bde8e4b83cef5e5a6c1978f5c
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare browser
        run: npx playwright install --with-deps chromium > /tmp/kuumetsu-browser-install.log 2>&1
      - name: Immutable Before observation
        env:
          SOURCE_SHA: 994f61bd08dadf2bde8e4b83cef5e5a6c1978f5c
          PREVIEW_URL: https://a349204c-soul-lineage-demon-dev.c-okamoto.workers.dev/
        run: |
          mkdir -p session-evidence
          cat > session-observe.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const out='session-evidence';
          const sourceSha=process.env.SOURCE_SHA, url=process.env.PREVIEW_URL;
          const version=await (await fetch(new URL('version.json',url))).json();
          if(version.commit!==sourceSha)throw new Error(`immutable commit mismatch ${version.commit}`);
          const evidence={sourceSha,url,version,observedAt:new Date().toISOString(),conditions:{viewport:[673,841],deviceScaleFactor:1,hasTouch:true,renderer:'Chromium SwiftShader',profile:'fresh',route:'native brand tap > begin > canvas drag > controlled proximity combat probe'},stages:[],errors:[],failedRequests:[]};
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:673,height:841},deviceScaleFactor:1,hasTouch:true});
          await context.tracing.start({screenshots:true,snapshots:true});
          const page=await context.newPage();
          page.setDefaultTimeout(45000);
          page.on('pageerror',e=>evidence.errors.push(e.message));
          page.on('requestfailed',r=>evidence.failedRequests.push({url:r.url(),error:r.failure()?.errorText}));
          const capture=async name=>{
            const value=await page.evaluate(()=>({text:document.body.innerText,buttons:[...document.querySelectorAll('button')].filter(x=>x.getBoundingClientRect().width>0&&x.getBoundingClientRect().height>0).map(x=>({id:x.id,text:x.innerText,disabled:x.disabled})),snapshot:window.__NIGHT_HUNT__?.snapshot?.(),reviewKeys:Object.keys(window.__NIGHT_REVIEW__||{}),perf:window.__PERF__?.snapshot?.(),storage:Object.keys(localStorage).map(k=>({key:k,bytes:localStorage[k].length}))}));
            evidence.stages.push({name,at:new Date().toISOString(),...value});
            await page.screenshot({path:`${out}/${name}.png`,timeout:60000});
            console.log('OBSERVATION',name,JSON.stringify(value));
          };
          const tap=async selector=>{const el=page.locator(selector).first();await el.waitFor({state:'visible'});const box=await el.boundingBox();if(!box)throw new Error(`no hit box ${selector}`);await page.mouse.click(box.x+box.width/2,box.y+box.height/2);};
          try{
            await page.goto(`${url}?review=1`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2500);
            await capture('00-boot');
            await page.mouse.click(336,420);
            await page.waitForFunction(()=>window.__NIGHT_REVIEW__?.ready?.()===true,null,{timeout:120000});
            await capture('01-title');
            await tap('#begin');
            await page.waitForTimeout(3000);
            await capture('02-hunt-entry');
            await page.mouse.move(250,500);await page.mouse.down();await page.mouse.move(450,400,{steps:8});await page.mouse.up();
            await page.waitForTimeout(1500);
            await capture('03-native-movement');
            const index=await page.evaluate(()=>window.__NIGHT_HUNT__.snapshot().npcs.findIndex(n=>!n.dead&&!n.eaten&&n.role==='traveller'));
            if(index>=0){
              await page.evaluate(i=>window.__NIGHT_REVIEW__.nearHuman(i),index);
              for(let i=0;i<12;i++){
                const s=await page.evaluate(()=>{window.__NIGHT_REVIEW__.step(60);return window.__NIGHT_HUNT__.snapshot();});
                if(i===0||s.combat||s.devouring||s.eaten>0||s.finished){await capture(`04-probe-${i}`);}
                if(s.eaten>0||s.finished)break;
              }
            }
            if(await page.locator('#pause').isVisible()){await tap('#pause');await capture('05-pause-menu');}
            evidence.success=true;
          }catch(e){evidence.success=false;evidence.failure=e.stack;await capture('failure').catch(()=>{});process.exitCode=1;}
          finally{writeFileSync(`${out}/observation.json`,JSON.stringify(evidence,null,2));await context.tracing.stop({path:`${out}/trace.zip`});await browser.close();console.log('SUMMARY',JSON.stringify({sourceSha,url,success:evidence.success,failure:evidence.failure,stages:evidence.stages.map(s=>s.name),errors:evidence.errors}));}
          JS
          node session-observe.mjs > session-evidence/browser.log 2>&1
      - name: Preserve scoped source and recent receipts for review
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            fs.mkdirSync('session-evidence',{recursive:true});
            const history=JSON.parse(fs.readFileSync('.autonomous/kuumetsu/experiment-history.json'));
            const receipts=[];
            for(const h of history.recent){
              const e=JSON.parse(fs.readFileSync('.autonomous/kuumetsu/'+h.path));
              const n=e.receipt?.pullRequest;
              if(n){const r=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:n,per_page:100});receipts.push({experiment:h.id,pr:n,comments:r.filter(c=>c.body.includes('autonomous-receipt')||c.body.includes('doNotRetry')).map(c=>({url:c.html_url,body:c.body}))});}
            }
            fs.writeFileSync('session-evidence/recent-receipts.json',JSON.stringify(receipts,null,2));
            const files=cp.execFileSync('git',['ls-files','-z']).toString().split('\0').filter(p=>p&&/\.(?:mjs|cjs|js|ts|tsx|jsx|json|jsonc|md|yml|yaml|css|html)$/.test(p));
            fs.writeFileSync('/tmp/source-files',files.join('\0')+'\0');
            cp.execFileSync('tar',['-czf','session-evidence/source-context.tgz','--null','-T','/tmp/source-files']);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-before-994f61b
          path: session-evidence
          retention-days: 14
