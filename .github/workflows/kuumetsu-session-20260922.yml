name: Temporary kuumetsu immutable observation 20260922
# Existing task-scoped ops fallback; inspect only the one final validation.
# Never merge this ops workflow to develop/main.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: write
env:
  FINAL_HEAD: 25bb142c819e3c5d8a298efbc17f168a6b363e59
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FINAL_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Record adopted staging before final validation inspection
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
            const m=await import(pathToFileURL(path.join(process.cwd(),'scripts/autonomous-iteration-telemetry.mjs')).href);
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:1415})).data;
            let t=m.readIterationTelemetry(pr.body);if(!t)throw new Error('Existing telemetry missing');
            t=m.patchIterationTelemetry(t,{changes:['交戦相手と自分の生命を表示','実接触の向き・損傷・防御を表示'],verdict:'supported',improvementSummary:'交戦中の削り合いと接触方向をnative状態から読み取れるようにした。'});
            if(t.currentStep==='afterObservation')t=m.advanceIterationTelemetry(t,{to:'verdict',at:'2026-09-22T03:47:20.902Z'});
            if(t.currentStep==='verdict')t=m.advanceIterationTelemetry(t,{to:'astraValidation',at:'2026-09-22T03:47:21.487Z'});
            await github.rest.pulls.update({...context.repo,pull_number:1415,body:m.upsertIterationTelemetry(pr.body,t)});
            fs.mkdirSync('session-evidence',{recursive:true});fs.writeFileSync('session-evidence/telemetry.json',JSON.stringify(t,null,2));
      - name: Canonical actions summary first
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run actions:summary -- --repo charukun/soul-lineage --sha "$FINAL_HEAD" --pr 1415 --output session-evidence/summary-initial.json > session-evidence/summary-initial.log 2>&1
      - name: Wait only for the owned exact-head validation contexts
        id: owned
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),required=['astra/fast-dev-contract','astra/focused-validation','astra/merge-freshness'];
            for(let i=0;i<36;i++){
              const bundle=(await github.rest.repos.getCombinedStatusForRef({...context.repo,ref:process.env.FINAL_HEAD})).data;
              const states=Object.fromEntries(bundle.statuses.map(s=>[s.context,s.state]));
              fs.writeFileSync('session-evidence/owned-status.json',JSON.stringify(bundle,null,2));
              if(required.every(k=>states[k]==='success')){core.setOutput('success','true');return;}
              if(required.some(k=>['failure','error'].includes(states[k]))){core.setFailed('Owned validation failed; inspect canonical summary artifact');return;}
              await new Promise(r=>setTimeout(r,5000));
            }
            core.setFailed('Bounded exact-head validation wait elapsed');
      - name: Canonical final actions summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p session-evidence && npm run actions:summary -- --repo charukun/soul-lineage --sha "$FINAL_HEAD" --pr 1415 --output session-evidence/summary-final.json > session-evidence/summary-final.log 2>&1
      - name: Record focused validation boundary
        if: steps.owned.outputs.success == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),path=require('path'),{pathToFileURL}=require('url');
            const m=await import(pathToFileURL(path.join(process.cwd(),'scripts/autonomous-iteration-telemetry.mjs')).href);
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:1415})).data;
            let t=m.readIterationTelemetry(pr.body);
            if(t.currentStep==='astraValidation')t=m.advanceIterationTelemetry(t,{to:'freshness',patch:{validatedHead:process.env.FINAL_HEAD}});
            await github.rest.pulls.update({...context.repo,pull_number:1415,body:m.upsertIterationTelemetry(pr.body,t)});
            fs.writeFileSync('session-evidence/telemetry.json',JSON.stringify(t,null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-contact-final-validation-summary
          path: session-evidence
          retention-days: 14
