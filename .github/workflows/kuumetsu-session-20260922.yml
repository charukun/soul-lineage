name: Temporary kuumetsu immutable observation 20260922
# Reuse of the existing task-scoped observer lane. Never merge to develop/main.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
  statuses: read
  pull-requests: read
env:
  SOURCE_SHA: 9c2e5336db65546c0afe98d6365b860d41e1c0b1
  PREVIEW_URL: https://b24a67e7-soul-lineage-demon-dev.c-okamoto.workers.dev/
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9c2e5336db65546c0afe98d6365b860d41e1c0b1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Reuse exact demon publication and verify immutable identity
        run: |
          mkdir -p session-evidence
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          const version=await(await fetch(new URL('version.json',process.env.PREVIEW_URL))).json();
          if(version.commit!==process.env.SOURCE_SHA)throw new Error('Immutable Before commit mismatch');
          const receipt={sourceSha:process.env.SOURCE_SHA,versionId:'b24a67e7-a2b3-48cb-989c-9fb9ca5b1341',preview:process.env.PREVIEW_URL,publishRun:35673829796,publishJob:106576060078,artifactId:10671768428,reused:true,version,commitMatched:true,verifiedAt:new Date().toISOString()};
          writeFileSync('session-evidence/publication.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt));
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Load existing native kuumetsu observer
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            fs.writeFileSync('session-observe.mjs',Buffer.from(r.data.content,'base64'));
      - name: Immutable Before native browser observation
        run: cp session-observe.mjs session-evidence/observer.mjs && node session-observe.mjs > session-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-20260922-next-before
          path: session-evidence
          retention-days: 14
