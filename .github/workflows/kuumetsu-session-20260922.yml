name: Temporary kuumetsu observation transport 20260922
# Task-scoped control branch only. Never merge into develop/main.
on:
  push:
    branches: [ops/kuumetsu-observe-20260922-01]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 994f61bd08dadf2bde8e4b83cef5e5a6c1978f5c
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Load task-scoped native observer
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            fs.writeFileSync('session-observe.mjs',Buffer.from(r.data.content,'base64'));
      - name: Immutable native Before
        env:
          SOURCE_SHA: 994f61bd08dadf2bde8e4b83cef5e5a6c1978f5c
          PREVIEW_URL: https://a349204c-soul-lineage-demon-dev.c-okamoto.workers.dev/
        run: mkdir -p session-evidence && node session-observe.mjs > session-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-before-native-994f61b
          path: session-evidence
          retention-days: 14
