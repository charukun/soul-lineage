name: Temporary kuumetsu immutable observation 20260922
# Existing isolated hosted fallback; required reconciled-candidate recheck, never merged.
on:
  push:
    branches: [ops/kuumetsu-three-20260922-041446]
    paths: [.github/workflows/kuumetsu-session-20260922.yml]
permissions:
  contents: read
  actions: write
env:
  SOURCE_SHA: 88abf037eff4cb624634b6a88dd0e68b2aacea7d
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 88abf037eff4cb624634b6a88dd0e68b2aacea7d
          persist-credentials: false
      - name: Dispatch existing exact-source demon publication
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            core.setOutput('started_at',new Date().toISOString());
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'dev-app-publish.yml',ref:'develop',inputs:{app:'demon',source_sha:process.env.SOURCE_SHA}});
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: mkdir -p session-evidence && node --test apps/demon/tests/hunt-stakes-state.test.mjs | tee session-evidence/causal-preflight.log
      - run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Bind exact reconciled publication and reuse native observer
        uses: actions/github-script@v8
        env:
          PUBLISH_STARTED_AT: ${{ steps.publish.outputs.started_at }}
        with:
          script: |
            const fs=require('fs');
            const started=Date.parse(process.env.PUBLISH_STARTED_AT)-1000,seen=new Set();let publication=null;
            for(let attempt=0;attempt<40&&!publication;attempt++){
              const runs=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'dev-app-publish.yml',event:'workflow_dispatch',per_page:10});
              for(const r of runs.data.workflow_runs.filter(r=>Date.parse(r.created_at)>=started&&r.status==='completed'&&r.conclusion==='success'&&!seen.has(r.id))){
                const jobs=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:r.id,per_page:50});
                for(const j of jobs.data.jobs){
                  const log=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:j.id});
                  const text=typeof log.data==='string'?log.data:Buffer.from(log.data).toString('utf8');
                  const version=text.match(/Current Version ID:\s*([a-f0-9-]{36})/);
                  if(text.includes(process.env.SOURCE_SHA)&&version){publication={sourceSha:process.env.SOURCE_SHA,runId:r.id,runUrl:r.html_url,jobId:j.id,versionId:version[1],url:`https://${version[1].slice(0,8)}-soul-lineage-demon-dev.c-okamoto.workers.dev/`};break;}
                }
                seen.add(r.id);if(publication)break;
              }
              if(!publication)await new Promise(r=>setTimeout(r,15000));
            }
            if(!publication)throw Error('No exact immutable publication; retry same SHA');
            const version=await(await fetch(new URL('version.json',publication.url))).json();
            if(version.commit!==process.env.SOURCE_SHA)throw Error('immutable identity mismatch');
            publication.version=version;publication.boundAt=new Date().toISOString();
            fs.writeFileSync('session-evidence/publication.json',JSON.stringify(publication,null,2));
            core.exportVariable('PREVIEW_URL',publication.url);core.info(JSON.stringify(publication));
            const r=await github.rest.repos.getContent({...context.repo,path:'ops/kuumetsu-session-observe.mjs',ref:context.sha});
            let source=Buffer.from(r.data.content,'base64').toString('utf8');
            source=source.replace("if(await gate.isVisible()){await tap('#soul-brand-boot');", "if(await gate.isVisible()){await page.waitForFunction(()=>document.querySelector('#soul-brand-boot')?.classList.contains('armed'));await tap('#soul-brand-boot');");
            source=source.replace('presentation:window.__NIGHT_HUNT__?.presentationSnapshot?.()',"presentation:window.__NIGHT_HUNT__?.presentationSnapshot?.(),geometry:Object.fromEntries(['#objective','[data-goal]','[data-haul]','span[data-pressure]','.life','#pause'].map(selector=>{const n=document.querySelector(selector),r=n?.getBoundingClientRect(),c=n&&getComputedStyle(n);return [selector,{text:n?.textContent,hidden:n?.hidden,rect:r?.toJSON(),color:c?.color,opacity:c?.opacity,clip:c?.clipPath}]}))");
            source=source.replace('if(held)await page.mouse.up();\n if(await page.locator',"if(held)await page.mouse.up();\n await page.setViewportSize({width:360,height:841});await capture('03-narrow');await page.setViewportSize({width:673,height:841});\n if(await page.locator");
            fs.writeFileSync('session-observe.mjs',source);fs.writeFileSync('session-evidence/observer.mjs',source);
      - name: Required reconciled-candidate native recheck
        run: node session-observe.mjs > session-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuumetsu-three-20260922-041446-i1-recheck
          path: session-evidence
          retention-days: 14
