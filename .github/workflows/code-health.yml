name: Code Health

on:
  workflow_call:
    inputs:
      dispatch:
        description: Create one RINNE Dispatch Draft PR when an actionable hotspot exists
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-health-maintenance
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'charukun/soul-lineage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_FILE: ${{ runner.temp }}/code-health-report.json
      MARKER_FILE: ${{ runner.temp }}/code-health-task-start.md
      BODY_FILE: ${{ runner.temp }}/code-health-pr-body.md
      DISPATCH_FILE: ${{ runner.temp }}/code-health-dispatch.json
    steps:
      - name: Checkout current develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Audit source health
        id: audit
        run: |
          node scripts/code-health.mjs audit --json "$REPORT_FILE" --markdown "$GITHUB_STEP_SUMMARY"
          actionable=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(String(Boolean(r.summary?.actionable)));" "$REPORT_FILE")
          top_score=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(String(r.summary?.topScore || 0));" "$REPORT_FILE")
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"
          echo "top_score=$top_score" >> "$GITHUB_OUTPUT"

      - name: Check in-flight refactor and cooldown
        id: active
        if: steps.audit.outputs.actionable == 'true' && inputs.dispatch == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --base develop --limit 100 --json headRefName,createdAt,state)
          count=$(printf '%s' "$pulls" | jq '[.[] | select(.state == "OPEN" and (.headRefName | startswith("dispatch/code-health-")))] | length')
          latest=$(printf '%s' "$pulls" | jq -r '[.[] | select(.headRefName | startswith("dispatch/code-health-")) | .createdAt] | sort | last // ""')
          cooldown=false
          if [ -n "$latest" ]; then
            cooldown=$(node --input-type=module -e "const age=Date.now()-Date.parse(process.argv[1]); process.stdout.write(String(Number.isFinite(age) && age < 72*60*60*1000));" "$latest")
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "cooldown=$cooldown" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "An automatic Code Health refactor is already open; this audit will not create another." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$cooldown" = "true" ]; then
            echo "The previous automatic Code Health refactor is less than 72 hours old; this audit will not create another yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build focused refactor request
        id: request
        if: >-
          steps.audit.outputs.actionable == 'true' &&
          inputs.dispatch == true &&
          steps.active.outputs.count == '0' &&
          steps.active.outputs.cooldown != 'true'
        run: |
          node scripts/code-health-dispatch.mjs "$REPORT_FILE" "$MARKER_FILE" "$BODY_FILE" > "$DISPATCH_FILE"
          slug=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(r.slug);" "$DISPATCH_FILE")
          title=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(r.title);" "$DISPATCH_FILE")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Bootstrap one RINNE Dispatch Draft PR
        id: dispatch
        if: steps.request.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_GITHUB_TOKEN || secrets.RESCUE_GITHUB_TOKEN }}
          SLUG: ${{ steps.request.outputs.slug }}
          PR_TITLE: ${{ steps.request.outputs.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::Code Health found an actionable hotspot, but DISPATCH_GITHUB_TOKEN/RESCUE_GITHUB_TOKEN is not configured. Audit succeeded; automatic refactor was not started.'
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'Automatic dispatch skipped: event-capable handoff credential is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="dispatch/code-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SLUG}"
          marker=".task-start/code-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          mkdir -p .task-start
          cp "$MARKER_FILE" "$marker"
          git add "$marker"
          git commit -m 'chore: bootstrap automatic Code Health refactor'
          gh auth setup-git
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base develop --head "$branch" --title "$PR_TITLE" --body-file "$BODY_FILE")
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo ''
            echo '### Automatic refactor handoff'
            echo "Created one RINNE Dispatch Draft PR: $pr_url"
            echo "Branch: \`$branch\`"
            echo 'RINNE Dispatch handoff owns implementation; existing Integration owns Ready PR delivery.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record non-dispatch result
        if: >-
          steps.audit.outputs.actionable != 'true' ||
          inputs.dispatch != true ||
          steps.active.outputs.count != '0' ||
          steps.active.outputs.cooldown == 'true'
        run: |
          if [ "${{ steps.audit.outputs.actionable }}" != "true" ]; then
            echo 'No actionable hotspot crossed the configured threshold.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.dispatch }}" != "true" ]; then
            echo 'Audit-only call: an actionable hotspot exists, but dispatch=false.' >> "$GITHUB_STEP_SUMMARY"
          fi
