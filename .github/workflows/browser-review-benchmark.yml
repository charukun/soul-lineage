name: Browser Review Setup Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.number == 1329
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: browser-review/control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Launch smoke
        run: node -e "import('@playwright/test').then(async({chromium})=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});const p=await b.newPage();await p.goto('https://example.com');console.log(await p.title());await b.close()})"

  container:
    if: github.event.pull_request.number == 1329
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          ref: browser-review/control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Launch smoke
        run: node -e "import('@playwright/test').then(async({chromium})=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});const p=await b.newPage();await p.goto('https://example.com');console.log(await p.title());await b.close()})"
