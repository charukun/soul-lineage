name: Materialize RINNE medieval assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-rinne-medieval-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/materialize-rinne-medieval-assets-20260920' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fetch pinned CC0 assets and verify identity
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset() {
            local target="$1" url="$2" expected_blob="$3" expected_bytes="$4"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$url" --output "$target"
            local actual_blob actual_bytes
            actual_blob="$(git hash-object "$target")"
            actual_bytes="$(wc -c < "$target" | tr -d ' ')"
            [[ "$actual_blob" == "$expected_blob" ]] || { echo "blob mismatch $target" >&2; exit 1; }
            [[ "$actual_bytes" == "$expected_bytes" ]] || { echo "size mismatch $target" >&2; exit 1; }
