name: Task authoring - battle2 nine-strike block
on:
  push:
    branches: ['work/battle2-nine-strike-20260922']
    paths: ['.github/workflows/task-johakyu-burst-author.yml', '.task-johakyu-burst.mjs']
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[astra-validate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.task-johakyu-burst.mjs
            /.github/workflows/task-johakyu-burst-author.yml
            /apps/review/src/nocturne/johakyu-p7-review.js
            /apps/review/src/nocturne/johakyu-p7-controller.js
            /apps/review/src/nocturne/johakyu-burst-cadence.js
            /apps/review/src/battle2-version.js
            /apps/review/tests/johakyu-burst-cadence.test.mjs
      - name: Materialize task patch only
        run: node .task-johakyu-burst.mjs
      - name: Publish source objects to isolated result ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/battle2-nine-strike-20260922'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/review/src/nocturne/johakyu-p7-review.js apps/review/src/nocturne/johakyu-p7-controller.js apps/review/src/battle2-version.js
          git rm .task-johakyu-burst.mjs .github/workflows/task-johakyu-burst-author.yml
          git commit -m 'materialize(review): nine-strike burst source objects'
          git push origin HEAD:refs/heads/dispatch/battle2-nine-strike-result-20260922
          echo "MATERIALIZED_TREE=$(git rev-parse HEAD^{tree})"
          echo "MATERIALIZED_COMMIT=$(git rev-parse HEAD)"
