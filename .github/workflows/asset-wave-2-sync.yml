name: Asset Wave 2 Sync Develop

on:
  push:
    branches:
      - feat/asset-wave-2-environment-vfx
    paths:
      - .github/workflows/asset-wave-2-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-wave-2-environment-vfx
          fetch-depth: 0
      - name: Merge latest develop and remove bootstrap workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/asset-wave-2-sync.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/asset-wave-2-environment-vfx
