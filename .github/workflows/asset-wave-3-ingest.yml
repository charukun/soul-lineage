name: Asset Wave 3 Ingest

on:
  push:
    branches: [feat/asset-wave-3-final-intake]
    paths:
      - '.github/workflows/asset-wave-3-ingest.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/asset-wave-3-final-intake
          fetch-depth: 0
      - name: Fetch pinned upstream assets and commit
        shell: bash
        run: |
          set -euo pipefail
          LUCIDE_SHA=a79b2d131dab2bf20cb224bd0937b439a9c4fa99
          PARTICLE_SHA=ab7086639ee73be31abd87feb21bf1402d4e8144

          git init -q /tmp/lucide
          git -C /tmp/lucide remote add origin https://github.com/lucide-icons/lucide.git
          git -C /tmp/lucide fetch -q --depth 1 origin "$LUCIDE_SHA"
          git -C /tmp/lucide checkout -q FETCH_HEAD
          test "$(git -C /tmp/lucide rev-parse HEAD)" = "$LUCIDE_SHA"

          git init -q /tmp/particles
          git -C /tmp/particles remote add origin https://github.com/Calinou/kenney-particle-pack.git
          git -C /tmp/particles fetch -q --depth 1 origin "$PARTICLE_SHA"
          git -C /tmp/particles checkout -q FETCH_HEAD
          test "$(git -C /tmp/particles rev-parse HEAD)" = "$PARTICLE_SHA"

          mkdir -p packages/assets/src/icons/lucide
          cp /tmp/lucide/LICENSE packages/assets/src/icons/lucide/LICENSE.txt
          for name in menu sword heart sparkles flask-conical book-open backpack hammer map house settings-2 compass chevron-right shield crosshair x moon; do
            cp "/tmp/lucide/icons/${name}.svg" "packages/assets/src/icons/lucide/${name}.svg"
          done

          mkdir -p apps/demon/public/assets/vendor/kenney-particles
          for name in magic_01 circle_01 star_01 flame_01; do
            cp "/tmp/particles/addons/kenney_particle_pack/${name}.png" "apps/demon/public/assets/vendor/kenney-particles/${name}.png"
          done

          rm .github/workflows/asset-wave-3-ingest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/assets/src/icons/lucide apps/demon/public/assets/vendor/kenney-particles .github/workflows/asset-wave-3-ingest.yml
          git commit -m 'chore(assets): vendor final audited UI and VFX sources'
          git push origin HEAD:feat/asset-wave-3-final-intake
