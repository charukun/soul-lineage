name: Johakyu battle2 reconcile
on:
  push:
    branches: ['fix/johakyu-battle2-p7-review-20260921']
    paths: ['.github/workflows/johakyu-battle2-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[johakyu-battle2-reconcile]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Merge current develop and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Astra
          git config user.email actions@users.noreply.github.com
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge --no-edit origin/develop
          rm .github/workflows/johakyu-battle2-reconcile.yml
          git add -A
          git commit -m "chore(review): remove one-shot P7 reconcile workflow"
          git push origin HEAD:fix/johakyu-battle2-p7-review-20260921
