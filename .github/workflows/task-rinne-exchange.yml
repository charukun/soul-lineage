name: Task-scoped RINNE Exchange repair and recheck
on:
  push:
    branches: [work/astra-rinne-exchange-initiative-20260922]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Materialize bounded repair and reconcile observed develop
        shell: bash
        run: |
          set -euo pipefail
          python3 .task-rinne-exchange.py
          rm .task-rinne-exchange.py .github/workflows/task-rinne-exchange.yml
          git diff --check
          git config user.name 'OJARU'
          git config user.email '68882498+charukun@users.noreply.github.com'
          git add -A
          git commit -m 'fix(rinne): isolate secondary completion and authored parry target intent'
          git fetch --no-tags --depth=160 origin develop work/astra-rinne-exchange-initiative-20260922
          git merge --no-edit 651326736eb51cfd5dabd346efba4a8f4d461a0b
          git push origin HEAD:work/astra-rinne-exchange-initiative-20260922
          mkdir -p /tmp/exchange-final
          git show -s --format='%H%n%T%n%P' HEAD > /tmp/exchange-final/head.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Final authoring focused tests and build
        shell: bash
        run: |
          set -o pipefail
          node --test packages/johakyu-combat/test/exchange-policy.test.mjs packages/johakyu-combat/test/execution-capability.test.mjs packages/tidebreak-combat/test/exchange-runtime.test.mjs packages/tidebreak-combat/test/inspiration-window.test.mjs apps/review/tests/exchange-initiative.test.mjs apps/review/tests/johakyu-p7-review.test.mjs apps/rinne/tests/exchange-boundaries.test.mjs apps/rinne/tests/combat-sequence-hud.test.mjs | tee /tmp/exchange-final/preflight.log
          npm run build --workspace @soul/review | tee /tmp/exchange-final/build.log
      - name: One bounded repaired-source observation
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          cat > scripts/.task-exchange-observe.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const out='/tmp/exchange-final/observation';mkdirSync(out,{recursive:true});
          const sourceSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:960,height:720},deviceScaleFactor:1});
          const errors=[],rows=[],shots=[];page.on('pageerror',e=>errors.push(e.message));
          const receipt={sourceSha,kind:'bounded repaired-source authoring observation',url:'http://127.0.0.1:5276/battle2?evidence',rows,shots,errors,success:false};
          async function capture(name){await page.screenshot({path:`${out}/${name}.png`,animations:'disabled',timeout:120000});shots.push(name);}
          async function read(){return page.evaluate(()=>({meta:window.__BATTLE2__.review,actors:window.__BATTLE2__.actors,phase:document.getElementById('battle-phase').dataset.phase}));}
          try{
           await page.goto(receipt.url,{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>window.__BATTLE2__?.state==='BATTLE'||window.__BATTLE2__?.state==='ERROR',{},{timeout:120000});
           assert.equal(await page.evaluate(()=>window.__BATTLE2__.state),'BATTLE');
           const version=await (await page.request.get('http://127.0.0.1:5276/version.json')).json();assert.equal(version.commit,sourceSha);assert.equal(await page.evaluate(()=>window.__BATTLE2__.sourceSha),sourceSha);
           await capture('read');const seen=new Set();
           for(let i=0;i<95;i++){
            await page.evaluate(()=>window.__BATTLE2__.advance(.2));const row=await read();rows.push(row.meta);assert.equal(row.phase,row.meta.hudState);
            if(['jo','ha','kyu','zanshin'].includes(row.meta.hudState)&&!seen.has(row.meta.hudState)){seen.add(row.meta.hudState);await capture(`duel-${row.meta.hudState}`);}
            if(seen.size===4)break;
           }
           assert.deepEqual([...seen],['jo','ha','kyu','zanshin']);
           await page.locator('[data-battle-mode="oneVsThree"]').click();
           await page.waitForFunction(()=>window.__BATTLE2__?.state==='BATTLE'&&window.__BATTLE2__?.review?.mode==='oneVsThree',{},{timeout:120000});
           const phases=new Map(),rank={jo:0,ha:1,kyu:2};
           for(let i=0;i<21;i++){
            await page.evaluate(()=>window.__BATTLE2__.advance(.5));const row=await read(),m=row.meta;rows.push(m);assert.equal(row.phase,m.hudState);assert.equal(row.actors.length,4);
            if(m.exchangeMode==='pressure'&&m.initiativeId==='hero'&&m.hudState!=='maai'){assert.ok(rank[m.hudState]>=(phases.get(m.exchangeSerial)??-1));phases.set(m.exchangeSerial,rank[m.hudState]);}
           }
           await capture('squad-desktop');await page.setViewportSize({width:390,height:844});await page.evaluate(()=>window.__BATTLE2__.advance(.1));await capture('squad-mobile');
           receipt.mobile=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,hud:document.getElementById('battle-sequence-hud').getBoundingClientRect().toJSON()}));
           assert.ok(receipt.mobile.scroll<=receipt.mobile.viewport+1);assert.equal(errors.length,0);receipt.success=true;
          }catch(e){receipt.error=e.stack;try{await capture('failure');}catch{}process.exitCode=1;}finally{writeFileSync(`${out}/receipt.json`,JSON.stringify(receipt,null,2));await browser.close();}
          JS
          npm run preview --workspace @soul/review > /tmp/exchange-final/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f scripts/.task-exchange-observe.mjs' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:5276/version.json >/dev/null && break; sleep 1; done
          node scripts/.task-exchange-observe.mjs
      - name: Export source-bound receipt and source
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/exchange-final
          python3 - <<'PY'
          import pathlib,subprocess,tarfile
          with tarfile.open('/tmp/exchange-final/source.tar.gz','w:gz') as out:
            for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=pathlib.Path(name)
              if name and p.is_file() and p.suffix in {'.js','.mjs','.json','.md','.yml','.yaml','.css','.html'}:out.add(p,arcname=name,recursive=False)
          pathlib.Path('/tmp/exchange-final/head.txt').write_text(subprocess.check_output(['git','show','-s','--format=%H%n%T%n%P','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-exchange-final-authoring-${{ github.sha }}
          path: /tmp/exchange-final
          retention-days: 7
