name: Task-scoped RINNE Exchange materializer
on:
  push:
    branches: [work/astra-rinne-exchange-initiative-20260922]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Materialize and reconcile coherent product tree
        shell: bash
        run: |
          set -euo pipefail
          python3 .task-rinne-exchange.py
          rm .task-rinne-exchange.py .github/workflows/task-rinne-exchange.yml
          git diff --check
          git config user.name 'OJARU'
          git config user.email '68882498+charukun@users.noreply.github.com'
          git add -A
          git commit -m 'fix(rinne): materialize coherent exchange implementation (preflight only)'
          git fetch --no-tags --depth=160 origin develop work/astra-rinne-exchange-initiative-20260922
          git merge --no-edit cd1dc36110741cf61233a722af1c73b1ca21c469
          git push origin HEAD:work/astra-rinne-exchange-initiative-20260922
          mkdir -p /tmp/rinne-exchange-source
          git rev-parse HEAD | tee /tmp/rinne-exchange-source/head.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Dependency acquisition for bounded authoring observation
        run: npm ci --ignore-scripts
      - name: Focused authoring preflight
        shell: bash
        run: |
          set -o pipefail
          node --test packages/johakyu-combat/test/exchange-policy.test.mjs packages/johakyu-combat/test/execution-capability.test.mjs packages/tidebreak-combat/test/exchange-runtime.test.mjs packages/tidebreak-combat/test/inspiration-window.test.mjs apps/review/tests/exchange-initiative.test.mjs apps/review/tests/johakyu-p7-review.test.mjs apps/rinne/tests/exchange-boundaries.test.mjs apps/rinne/tests/combat-sequence-hud.test.mjs | tee /tmp/rinne-exchange-source/preflight.log
      - name: Build exact-source review bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build --workspace @soul/review | tee /tmp/rinne-exchange-source/build.log
      - name: Bounded source-bound battle2 observation
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          cat > scripts/.task-exchange-observe.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const out='test-results/exchange-observation';mkdirSync(out,{recursive:true});
          const sourceSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1280,height:900},deviceScaleFactor:1});
          const errors=[],rows=[],shots=[];page.on('pageerror',e=>errors.push(e.message));
          const receipt={sourceSha,kind:'source-bound authoring observation',url:'http://127.0.0.1:5276/battle2?evidence',rows,shots,errors,success:false};
          async function capture(name){await page.screenshot({path:`${out}/${name}.png`,fullPage:true});shots.push(name);}
          async function read(){return page.evaluate(()=>({meta:window.__BATTLE2__.review,actors:window.__BATTLE2__.actors,phase:document.getElementById('battle-phase').dataset.phase,metrics:window.__BATTLE2__.metrics}));}
          try{
           await page.goto(receipt.url,{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>window.__BATTLE2__?.state==='BATTLE'||window.__BATTLE2__?.state==='ERROR',{},{timeout:120000});
           assert.equal(await page.evaluate(()=>window.__BATTLE2__.state),'BATTLE');
           const version=await (await page.request.get('http://127.0.0.1:5276/version.json')).json();assert.equal(version.commit,sourceSha);assert.equal(await page.evaluate(()=>window.__BATTLE2__.sourceSha),sourceSha);
           await capture('01-read');const seen=new Set();
           for(let i=0;i<95;i++){
            await page.evaluate(()=>window.__BATTLE2__.advance(.2));const row=await read();rows.push({tick:i*12,...row.meta});assert.equal(row.phase,row.meta.hudState);
            if(['jo','ha','kyu','zanshin'].includes(row.meta.hudState)&&!seen.has(row.meta.hudState)){seen.add(row.meta.hudState);await capture(`duel-${row.meta.hudState}`);}
            if(seen.size===4)break;
           }
           assert.deepEqual([...seen],['jo','ha','kyu','zanshin']);
           await page.locator('[data-battle-mode="oneVsThree"]').click();
           await page.waitForFunction(()=>window.__BATTLE2__?.state==='BATTLE'&&window.__BATTLE2__?.review?.mode==='oneVsThree',{},{timeout:120000});
           await page.evaluate(()=>window.__BATTLE2__.advance(3));const squad=await read();assert.equal(squad.actors.length,4);assert.equal(squad.phase,squad.meta.hudState);rows.push(squad.meta);await capture('squad-desktop');
           await page.setViewportSize({width:390,height:844});await page.evaluate(()=>window.__BATTLE2__.advance(.1));await capture('squad-mobile');
           receipt.mobile=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,hud:document.getElementById('battle-sequence-hud').getBoundingClientRect().toJSON(),world:document.getElementById('world').getBoundingClientRect().toJSON()}));
           assert.ok(receipt.mobile.scroll<=receipt.mobile.viewport+1);assert.equal(errors.length,0);receipt.success=true;
          }catch(e){receipt.error=e.stack;await capture('failure');process.exitCode=1;}finally{writeFileSync(`${out}/receipt.json`,JSON.stringify(receipt,null,2));await browser.close();}
          JS
          npm run preview --workspace @soul/review > /tmp/rinne-exchange-source/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f scripts/.task-exchange-observe.mjs' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:5276/version.json >/dev/null && break; sleep 1; done
          node scripts/.task-exchange-observe.mjs
      - name: Export source and evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/rinne-exchange-source
          python3 - <<'PY'
          import pathlib, subprocess, tarfile, shutil
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes={'.js','.mjs','.cjs','.ts','.tsx','.jsx','.json','.html','.css','.md','.yml','.yaml'}
          with tarfile.open('/tmp/rinne-exchange-source/source.tar.gz','w:gz') as out:
            for name in paths:
              p=pathlib.Path(name)
              if not name or not p.is_file() or p.suffix not in suffixes: continue
              if name.startswith(('packages/','apps/rinne/','apps/review/','tests/','test/','tools/','scripts/','.github/')) or '/' not in name or name in ['docs/DEVELOPMENT.md','docs/DEVELOP_MERGE.md']:
                out.add(p,arcname=name,recursive=False)
          pathlib.Path('/tmp/rinne-exchange-source/head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          evidence=pathlib.Path('test-results/exchange-observation')
          if evidence.exists():shutil.copytree(evidence,'/tmp/rinne-exchange-source/observation',dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinne-exchange-authoring-${{ github.sha }}
          path: /tmp/rinne-exchange-source
          retention-days: 7
