name: Village public onboarding probe
on:
  push:
    branches: [probe/village-public-after-1233]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Probe actual DEV
        env: {URL: 'https://soul-lineage-village-dev.c-okamoto.workers.dev/'}
        run: |
          mkdir -p test-results/public
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';import fs from'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true});
          const p=await ctx.newPage(), errors=[],failed=[];
          p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
          const report={errors,failed};
          try{
            await p.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:60000});
            await p.locator('#soul-brand-boot.armed').waitFor({timeout:30000});
            report.bootLabel=await p.locator('#soul-brand-boot').getAttribute('aria-label');
            await p.locator('#soul-brand-boot').click();await p.waitForTimeout(500);
            report.commit=await p.locator('#game').getAttribute('data-commit');
            report.preReset={guide:await p.locator('#muraFirstRunGuide').count(),tutorial:await p.locator('#tutorial').isVisible().catch(()=>false)};
            await p.locator('#muraResetVillage').click();await p.locator('#muraResetConfirm [data-reset]').click();
            await p.waitForFunction(()=>window.village&&document.querySelector('#loading')?.hidden===true,null,{timeout:60000});
            await p.locator('#soul-brand-boot.armed').waitFor({timeout:30000});await p.locator('#soul-brand-boot').click();await p.waitForTimeout(500);
            await p.locator('#muraEnterVillage').click();await p.waitForTimeout(2000);
            report.afterEnter={guide:await p.locator('#muraFirstRunGuide').count(),visible:await p.locator('#muraFirstRunGuide').isVisible().catch(()=>false),stage:await p.locator('#muraFirstRunGuide').getAttribute('data-stage').catch(()=>null),finger:await p.locator('.muraFirstRunFinger').count(),tutorial:await p.locator('#tutorial').isVisible().catch(()=>false)};
            await p.screenshot({path:'test-results/public/after-enter.png',fullPage:true});
            if(report.afterEnter.guide){
              await p.locator('.muraFirstRunStart').click();await p.waitForTimeout(1200);
              report.build={stage:await p.locator('#muraFirstRunGuide').getAttribute('data-stage'),finger:await p.locator('.muraFirstRunFinger').count(),fingerHidden:await p.locator('.muraFirstRunFinger').getAttribute('hidden'),fingerBox:await p.locator('.muraFirstRunFinger').boundingBox()};
              await p.screenshot({path:'test-results/public/build-finger.png',fullPage:true});
            }
          }catch(e){report.exception=String(e)}
          await fs.writeFile('test-results/public/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));await browser.close();
          if(report.exception||errors.length||failed.length||!report.afterEnter?.guide||!report.afterEnter?.finger)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: village-public-onboarding-probe, path: test-results/public/, retention-days: 7}
