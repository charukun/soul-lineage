name: Camera Presentation specialist (task only)
run-name: Reconcile camera with shared 3D weapons c000b40c53e84db93e590ce4443a6eb4463f49ce
on:
  push:
    branches: [dispatch/camera-presentation-specialist-20260923]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v6
        with:
          ref: 9d293787895d6141a5f523c5de3fb34d24ee6aec
          path: work
          persist-credentials: false
      - name: Verify exact incoming renderer diff and materialize its merged blob
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../control/scripts/reconcile-camera-equipment.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera-equipment-reconcile
          path: /tmp/camera-equipment-reconcile
          retention-days: 7
