name: Camera Presentation specialist (task only)
run-name: Materialize observed camera corrections on 2053721f1f2809d8fe8a1344f2223d5d2fefd361
on:
  push:
    branches: [dispatch/camera-presentation-specialist-20260923]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts
            packages/rendering
      - uses: actions/checkout@v6
        with:
          ref: 2053721f1f2809d8fe8a1344f2223d5d2fefd361
          path: work
          persist-credentials: false
      - name: Materialize scoped code corrections as blobs only
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../control/scripts/materialize-camera-corrections.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera-corrections-source
          path: /tmp/camera-corrections
          retention-days: 7
