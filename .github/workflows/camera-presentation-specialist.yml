name: Camera Presentation specialist (task only)
run-name: Camera gameplay specialist PR1490 2053721f1f2809d8fe8a1344f2223d5d2fefd361
on:
  push:
    branches: [dispatch/camera-presentation-specialist-20260923]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
          sparse-checkout: scripts/browser
      - uses: actions/checkout@v6
        with:
          ref: 2053721f1f2809d8fe8a1344f2223d5d2fefd361
          path: work
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: work
      - run: npm run build:rinne && npm run build:review
        working-directory: work
      - run: npx playwright install --with-deps chromium
        working-directory: work
      - name: Native camera gameplay and Review evidence for exact head
        working-directory: work
        run: |
          cp ../control/scripts/browser/camera-playtest-task.mjs scripts/browser/camera-playtest-task.mjs
          node scripts/browser/camera-playtest-task.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-specialist-2053721f1f2809d8fe8a1344f2223d5d2fefd361
          path: work/test-results/camera-presentation
          retention-days: 14
