name: Camera Presentation specialist (task only)
run-name: Materialize camera task source on 67d33c8f1fd181cb6b82724bb2b8a58e0a757a96
on:
  push:
    branches: [dispatch/camera-presentation-specialist-20260923]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts
            apps/review
            apps/rinne
            packages/rendering
            docs/rendering
      - uses: actions/checkout@v6
        with:
          ref: 67d33c8f1fd181cb6b82724bb2b8a58e0a757a96
          path: work
          persist-credentials: false
      - name: Materialize task source as blobs only; Connector owns refs and merge
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../control/scripts/materialize-camera-task.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera-materialized-source
          path: /tmp/camera-materialized
          retention-days: 7
