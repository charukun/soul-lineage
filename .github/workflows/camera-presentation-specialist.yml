name: Camera Presentation specialist (task only)
run-name: Materialize alternate 3D camera bridge PR1490
on:
  push:
    branches: [dispatch/camera-presentation-specialist-20260923]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts
            packages/rendering
      - uses: actions/checkout@v6
        with:
          ref: d62bc23e13d2ad2d2f67011235582cb8d34f1271
          path: work
          persist-credentials: false
      - name: Materialize injected camera port as source blobs only
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../control/scripts/materialize-camera-driven-bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera-driven-bridge-source
          path: /tmp/camera-driven-bridge
          retention-days: 7
