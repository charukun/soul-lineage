name: Heroine visibility repair (task scoped)
on:
  push:
    branches: ['work/fix-heroine-visibility']
    paths: ['scripts/tasks/heroine-visibility/**', '.github/workflows/task-heroine-visibility.yml']
permissions:
  contents: read
concurrency:
  group: task-heroine-visibility
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Inspect reported public route and exact checkout
        run: |
          mkdir -p generated/heroine-visibility
          npm ci --ignore-scripts > generated/heroine-visibility/install.log 2>&1
          npx playwright install --with-deps chromium > generated/heroine-visibility/chromium.log 2>&1
          node scripts/tasks/heroine-visibility/inspect.mjs https://soul-lineage-character-studio-dev.c-okamoto.workers.dev/ public
          npm run build --workspace @soul/character-studio > generated/heroine-visibility/build.log 2>&1
          npm exec --workspace @soul/character-studio -- vite --host 127.0.0.1 --port 5177 --strictPort > generated/heroine-visibility/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5177/ >/dev/null && break; sleep 1; done
          node scripts/tasks/heroine-visibility/inspect.mjs http://127.0.0.1:5177/ checkout
      - name: Package bounded source and rendered output for diagnosis
        if: always()
        run: |
          git ls-files 'apps/character-studio/src/**' 'apps/character-studio/index.html' 'apps/character-studio/advanced.html' 'apps/character-studio/tests/**' 'packages/rendering/src/master-character*' 'packages/rendering/src/kaykit*' 'packages/rendering/src/review-camera*' 'packages/rendering/tests/*master*' 'packages/characters/src/**' 'packages/characters/tests/female*' 'packages/characters/production/protagonist-villager-female*' 'packages/assets/src/runtime-origin.js' 'apps/character-studio/public/simulator/assets/PROTAGONIST_VILLAGER_FEMALE_V1.asset.json' 'apps/review/public/library/provenance/heroine-dawn-v1.json' 'apps/review/public/library/model/3ced3b11942d57cd82763715c7196dfd4f53141e/HeroineDawn.glb' 'package.json' 'package-lock.json' '.github/workflows/astra-work-validation.yml' 'scripts/astra-focused-validation.mjs' 'scripts/github-actions-summary.mjs' > generated/heroine-visibility/source-files.txt
          tar -czf generated/heroine-visibility/source-context.tgz -T generated/heroine-visibility/source-files.txt
          if test -d dist/character-studio; then tar -czf generated/heroine-visibility/built-studio.tgz -C dist character-studio; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-visibility-${{ github.sha }}
          path: generated/heroine-visibility
          retention-days: 7
