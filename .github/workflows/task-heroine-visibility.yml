name: Heroine visibility repair (task scoped)
on:
  push:
    branches: ['work/fix-heroine-visibility']
    paths: ['scripts/tasks/heroine-visibility/**', '.github/workflows/task-heroine-visibility.yml']
permissions:
  contents: read
concurrency:
  group: task-heroine-visibility
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Build the repaired actual studio and run bounded regressions
        run: |
          mkdir -p generated/heroine-visibility
          npm ci --ignore-scripts > generated/heroine-visibility/install.log 2>&1
          node --test packages/rendering/tests/character-material-role.test.mjs packages/rendering/tests/master-character.test.mjs packages/rendering/tests/master-character-modular.test.mjs apps/character-studio/tests/character-workspace.test.mjs packages/characters/tests/female-protagonist-source.test.mjs > generated/heroine-visibility/tests.log 2>&1 || { cat generated/heroine-visibility/tests.log; exit 1; }
          npm run build --workspace @soul/character-studio > generated/heroine-visibility/build.log 2>&1 || { tail -80 generated/heroine-visibility/build.log; exit 1; }
          npx playwright install --with-deps chromium > generated/heroine-visibility/chromium.log 2>&1
      - name: Reproduce saved-state public failure then test native selection on the repaired build
        run: |
          python3 -m http.server 5177 --bind 127.0.0.1 --directory dist/character-studio > generated/heroine-visibility/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5177/ >/dev/null && break; sleep 1; done
          node scripts/tasks/heroine-visibility/verify.mjs > generated/heroine-visibility/browser.log 2>&1 || { cat generated/heroine-visibility/browser.log; exit 1; }
          cat generated/heroine-visibility/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-visibility-${{ github.sha }}
          path: generated/heroine-visibility
          retention-days: 7
