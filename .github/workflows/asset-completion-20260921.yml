name: Temporary Asset Completion 20260921
run-name: Complete PR1203 exact-head assets ${{ github.sha }}
on:
  push:
    branches: ['work/asset-library-expansion-20260921']
    paths: ['.github/workflows/asset-completion-20260921.yml']
permissions:
  contents: write
concurrency:
  group: asset-completion-20260921
  cancel-in-progress: false
jobs:
  complete:
    if: ${{ contains(github.event.head_commit.message, '[asset-complete]') && github.ref == 'refs/heads/work/asset-library-expansion-20260921' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Reconcile current develop on the same work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=256 origin develop:refs/remotes/origin/develop "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git switch -c "$GITHUB_REF_NAME"
          git merge --no-edit origin/develop
      - name: Remove this temporary workflow and create final exact head
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/asset-completion-20260921.yml
          git diff --cached --check
          git commit -m $'feat(assets): finalize curated library against latest develop [astra-validate]\n\nAstra-Check: packages/assets/src/curated-library.js\nAstra-Check: apps/rinne/src/review-curated-library.js\nAstra-Test: tests/curated-asset-library.test.mjs\nAstra-Build: rinne'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee /tmp/final-head
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install exact-head dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for explicit specialist browser evidence
        run: npx playwright install --with-deps chromium
      - name: Exact-head asset integrity test
        run: node --test tests/curated-asset-library.test.mjs
      - name: Exact-head RINNE build
        run: npm run build --workspace @soul/rinne
      - name: Exact-head parse render rig animation audio and review browser evidence
        run: node scripts/browser/curated-assets.mjs
      - name: Preserve exact-head browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr1203-exact-head-browser-${{ github.sha }}
          path: .deploy-state/asset-curation-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Push only the validated final head
        shell: bash
        run: |
          set -euo pipefail
          final="$(cat /tmp/final-head)"
          test "$(git rev-parse HEAD)" = "$final"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
