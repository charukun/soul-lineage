name: PULSE GitHub event wake

on:
  pull_request:
    branches: [develop]
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request_review:
    branches: [develop]
    types: [submitted, edited, dismissed]

permissions:
  contents: read

concurrency:
  group: pulse-event-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh PULSE snapshot
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pulse-refresh.yml
    with:
      source_sha: ${{ github.event.pull_request.base.sha }}
      reason: pr-event
      fail_on_error: false
      record_public_status: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    secrets: inherit
