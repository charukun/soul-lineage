name: Character25D task observation
on:
  push:
    branches: ['work/character25d-equipment-20260922']
permissions:
  contents: read
concurrency:
  group: character25d-task-observation
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Attachment invariants
        id: attachment
        continue-on-error: true
        run: node --test tests/character25d-equipment.test.mjs tests/character25d-runtime.test.mjs tests/character25d-disposal.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run predev --workspace @soul/rinne
      - name: Actual Lab and RINNE observation
        run: node scripts/browser/character25d-equipment.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: character25d-${{ github.sha }}
          path: test-results/character25d
          retention-days: 14
      - if: steps.attachment.outcome != 'success'
        run: exit 1
