name: Per-App DEV Publish

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      app:
        description: 'Publish one app from the selected/ref source'
        type: choice
        required: true
        options: [rinne, village, demon]
      source_sha:
        description: 'Optional exact source SHA/ref'
        type: string
        required: false

permissions:
  contents: read
  statuses: write

jobs:
  plan:
    name: Plan affected DEV apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve app matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_APP: ${{ inputs.app }}
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "apps=[\"$SELECTED_APP\"]" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/distribution-plan.mjs --base "$BEFORE_SHA" --head "$SOURCE_SHA"
          fi

  publish:
    name: Publish ${{ matrix.app }} DEV
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: per-app-dev-${{ matrix.app }}
      cancel-in-progress: true
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Mark app DEV pending
        uses: actions/github-script@v8
        env:
          APP: ${{ matrix.app }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.SOURCE_SHA,
              context:`dev/${process.env.APP}`,state:'pending',
              description:`${process.env.APP} per-app DEV build and publish pending`,
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - run: npm ci
      - name: Focused app validation
        env:
          APP: ${{ matrix.app }}
        run: node scripts/validate.mjs deploy "$APP"
      - name: Build immutable web-dev artifact
        env:
          APP: ${{ matrix.app }}
        run: npm run distribution:build -- --app "$APP" --target web-dev
      - name: Publish exact app artifact
        id: deploy
        env:
          APP: ${{ matrix.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config "wrangler.dev.$APP.jsonc"
      - name: Verify exact public app source
        id: verify
        env:
          APP: ${{ matrix.app }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/verify-published-app.mjs "$APP" "$SOURCE_SHA" web-dev
      - name: Preserve immutable app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.app }}-${{ inputs.source_sha || github.sha }}
          path: .artifacts/${{ matrix.app }}/web-dev/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record app DEV result
        if: always()
        uses: actions/github-script@v8
        env:
          APP: ${{ matrix.app }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const success=process.env.DEPLOY_OUTCOME==='success'&&process.env.VERIFY_OUTCOME==='success';
            await github.rest.repos.createCommitStatus({...context.repo,sha:process.env.SOURCE_SHA,
              context:`dev/${process.env.APP}`,state:success?'success':'failure',
              description:success?`${process.env.APP} DEV live and exact-source verified`:`${process.env.APP} DEV publish or verification failed`,
              target_url:success?`https://soul-lineage-${process.env.APP}-dev.c-okamoto.workers.dev/`:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
