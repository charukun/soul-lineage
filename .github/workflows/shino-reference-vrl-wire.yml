name: Wire Shino DCC into Visual Review Lab

on:
  push:
    branches:
      - feat/shino-reference-v2-dcc
    paths:
      - .github/workflows/shino-reference-vrl-wire.yml
      - scripts/wire-shino-reference-v2-review.py

permissions:
  contents: write

jobs:
  wire-vrl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Visual Review Lab DCC wiring
        run: python3 scripts/wire-shino-reference-v2-review.py

      - name: Fast focused validation
        run: |
          node --check apps/rinne/src/character-review.js
          node --check apps/rinne/src/character-workspace.js
          node --test \
            apps/rinne/tests/character-reference-model.test.mjs \
            packages/characters/tests/runtime-asset-audit.test.mjs

      - name: Commit runtime wiring on latest branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rinne/src/character-review.js apps/rinne/src/character-workspace.js apps/rinne/tests/character-reference-model.test.mjs
          git stash push --include-untracked -m shino-vrl-wiring
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git rm .github/workflows/shino-reference-vrl-wire.yml scripts/wire-shino-reference-v2-review.py
          git add apps/rinne/src/character-review.js apps/rinne/src/character-workspace.js apps/rinne/tests/character-reference-model.test.mjs
          git commit -m "feat(characters): load Shino DCC model in review lab"
          git push origin HEAD:${GITHUB_REF_NAME}
