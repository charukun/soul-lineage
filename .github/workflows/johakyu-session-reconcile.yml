name: Johakyu exact develop reconciliation
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-session-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64
      - name: Merge declared develop without conflict overrides and remove task runner
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=64 origin 51c8cfd8aced440b2c3cf57938953de2f28236a6
          git merge --no-ff --no-edit 51c8cfd8aced440b2c3cf57938953de2f28236a6
          git rm .github/workflows/johakyu-session-reconcile.yml
          git commit -m 'chore(johakyu): remove task reconciliation runner before formal P3 validation'
          git diff --check
          git push origin HEAD:work/johakyu-p3-p7-20260921
          git rev-parse HEAD
