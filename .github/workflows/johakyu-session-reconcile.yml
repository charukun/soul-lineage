name: Johakyu exact develop reconciliation
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-session-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64
      - name: Merge exact develop without conflict overrides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=64 origin 2463144f6db07fd349826b571789e805421e5d83
          git merge --no-ff --no-edit 2463144f6db07fd349826b571789e805421e5d83
          git rm .github/workflows/johakyu-session-reconcile.yml
          git commit -m 'chore(johakyu): remove task runner before P4 final-head validation'
          git diff --check
          git push origin HEAD:work/johakyu-p3-p7-20260921
          git rev-parse HEAD
