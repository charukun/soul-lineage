name: Johakyu P4 source materialization
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-session-p4.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
      - name: Materialize reviewed P4 implementation and remove temporary inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 76981bcfee5df542acf67497bd9e17cf8d641516 HEAD
          test -z "$(git diff --name-only 76981bcfee5df542acf67497bd9e17cf8d641516 HEAD -- apps/rinne/src/rebuild/combat-core.js packages/tidebreak-combat/shared-runtime-facade.js)"
          python3 scripts/tasks/johakyu-p4.py
          git rm scripts/tasks/johakyu-p4.py .github/workflows/johakyu-session-p4.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/review/src apps/rinne/src/rebuild packages/johakyu-combat/package.json packages/tidebreak-combat/shared-runtime-facade.js
          git commit -m 'feat(johakyu): P4 committed technique identity and canonical catalog trials'
          git push origin HEAD:work/johakyu-p3-p7-20260921
          git rev-parse HEAD
