name: Browser Review Cache Seed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-review-cache-seed.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: browser-review-cache-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated browser control plane
        uses: actions/checkout@v6
        with:
          ref: browser-review/control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install repository dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Resolve Playwright browser cache key
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore or reserve exact Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: browser-review-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Seed exact Playwright browser on cache miss
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
