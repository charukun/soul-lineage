name: Character Forge task-scoped authoring
run-name: Forge reconstruction ${{ github.sha }}
on:
  push:
    branches: [work/forge-upstream-fidelity-20260923]
permissions:
  contents: read
jobs:
  reconstruct:
    if: contains(github.event.head_commit.message, '[forge-generate]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: img2threejs/img2threejs
          ref: 6e60b5e22419464b4853e01ddb6c0e6f6659a733
          path: .forge-upstream
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: img2threejs/plugin-character
          ref: d8750638f9fc092714e7fcb4941053514455295d
          path: .forge-plugin
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install Pillow==11.3.0
      - name: Replay measured fixture through original upstream stages
        shell: bash
        run: |
          set -euo pipefail
          export FORGE_REPO="$GITHUB_WORKSPACE"
          export FORGE_WORKSPACE="$GITHUB_WORKSPACE/.artifacts/character-forge/canonical-scout-upstream"
          export FORGE_CACHE="$RUNNER_TEMP/forge-cache"
          export IMG2THREEJS_ROOT="$GITHUB_WORKSPACE/.forge-upstream"
          export IMG2THREEJS_PLUGIN="$GITHUB_WORKSPACE/.forge-plugin"
          mkdir -p .artifacts/character-forge
          python3 scripts/character-forge/upstream/fixtures/canonical_scout/intake_fixture.py
          python3 scripts/character-forge/upstream/fixtures/canonical_scout/geometry_fixture.py
          python3 scripts/character-forge/upstream/fixtures/canonical_scout/build_fixture.py
      - name: Actual browser captures of the exact upstream-generated factory
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$CHROMIUM_PATH"
          node scripts/character-forge/upstream/capture.mjs \
            .artifacts/character-forge/canonical-scout-upstream \
            img2threejs/passes/blockout/factory.ts \
            img2threejs/passes/blockout/captures clay
      - name: Package generated source, state, actual captures and failure receipts
        if: always()
        shell: bash
        run: |
          mkdir -p .forge-specialist
          python3 - <<'PY'
          import pathlib, zipfile, json, os
          with zipfile.ZipFile('.forge-specialist/reconstruction.zip','w',zipfile.ZIP_DEFLATED) as z:
            for prefix in ['.artifacts/character-forge','scripts/character-forge/upstream','packages/assets/forge/upstream']:
              for p in sorted(pathlib.Path(prefix).rglob('*')):
                if p.is_file() and not p.is_symlink() and '__pycache__' not in p.parts:
                  z.write(p,p.as_posix())
            z.writestr('identity.json',json.dumps({'sourceSha':os.environ['GITHUB_SHA'],'repository':'charukun/soul-lineage','upstream':'6e60b5e22419464b4853e01ddb6c0e6f6659a733','visualApproval':False}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-reconstruction-${{ github.sha }}
          path: .forge-specialist/reconstruction.zip
          if-no-files-found: error
          retention-days: 14
