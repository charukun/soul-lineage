name: Character Forge task-scoped authoring
run-name: Forge specialist ${{ github.sha }}
on:
  push:
    branches: [work/forge-upstream-fidelity-20260923]
permissions:
  contents: read
jobs:
  environment:
    if: contains(github.event.head_commit.message, '[forge-env]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect exact dependencies and remaining task contracts
        run: |
          mkdir -p .forge-specialist
          python3 - <<'PY'
          import pathlib, zipfile, json, os, hashlib
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('.forge-specialist/authoring-env.zip','w',zipfile.ZIP_DEFLATED) as z:
            for prefix in ['node_modules','packages/characters','scripts/blender']:
              for p in sorted((root/prefix).rglob('*')):
                if p.is_file() and not p.is_symlink() and not any(q in ['.git','.cache'] for q in p.parts):
                  z.write(p,p.relative_to(root).as_posix())
            z.writestr('identity.json',json.dumps({'repository':'charukun/soul-lineage','head':os.environ['GITHUB_SHA'],'lockSha256':hashlib.sha256((root/'package-lock.json').read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-authoring-env-${{ github.sha }}
          path: .forge-specialist/authoring-env.zip
          if-no-files-found: error
          retention-days: 14
