name: Materialize RINNE Kenney assets
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-rinne-kenney-assets.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/materialize-rinne-world-assets-20260920' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize pinned CC0 assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse
          source=pathlib.Path('apps/review/asset-imports/rinne-kenney-20260920.json')
          spec=json.loads(source.read_text())
          library=pathlib.Path('apps/review/public/library')
          provenance=[]
          for row in spec['records']:
              url=row['acquisitionUrl']
              data=urllib.request.urlopen(url,timeout=60).read()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if blob != row['gitBlobSha']:
                  raise SystemExit(f"git blob mismatch {row['id']} expected={row['gitBlobSha']} actual={blob}")
              if len(data) != row['byteLength']:
                  raise SystemExit(f"byteLength mismatch {row['id']} expected={row['byteLength']} actual={len(data)}")
              ext=pathlib.Path(row['path']).suffix.lower()
              rel=f"{row['kind']}/kenney/{row['pack']}/{row['gitBlobSha']}{ext}"
              target=library/rel
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              provenance.append({**row,'runtimeAssetPath':rel,'sha256':hashlib.sha256(data).hexdigest(),'byteLength':len(data)})
          pdir=library/'provenance'
          pdir.mkdir(parents=True,exist_ok=True)
          (pdir/'rinne-kenney-20260920.json').write_text(json.dumps({'schema':1,'importId':spec['importId'],'records':provenance},indent=2,ensure_ascii=False)+'\n')
          mpath=library/'manifest.json'
          manifest=json.loads(mpath.read_text())
          bypath={row['path']:row for row in manifest['files']}
          for row in provenance:
              bypath[row['runtimeAssetPath']]={'path':row['runtimeAssetPath'],'bytes':row['byteLength'],'gitBlobSha':row['gitBlobSha'],'sha256':row['sha256']}
          manifest['files']=sorted(bypath.values(),key=lambda row:row['path'])
          mpath.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          PY
          rm -f .github/workflows/materialize-rinne-kenney-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'chore(assets): materialize RINNE Kenney library'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
