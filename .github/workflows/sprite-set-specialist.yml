name: Sprite Set Specialist - task branch only
on:
  push:
    branches: [work/sprite-set-specialist-20260923]
    paths: [.github/workflows/sprite-set-specialist.yml]
permissions:
  contents: write
  statuses: write
concurrency:
  group: sprite-set-specialist-1492
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      SOURCE_SHA: d455921ced4eb7212e52402687cc857b3db6d3dd
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Preserve authored sprite color under the existing world lighting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .deploy-state/sprite-set-candidate
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('packages/assets/src/adapters/three/character-sprite-set.js');s=p.read_text()
          old='emissive:0xffffff,emissiveIntensity:.12'
          assert s.count(old)==1;s=s.replace(old,'emissive:0xffffff,emissiveIntensity:.35')
          old='material.map=assetTextures.get(clip.asset);if(firstMap)material.needsUpdate=true;'
          new='material.map=assetTextures.get(clip.asset);material.emissiveMap=material.map;if(firstMap)material.needsUpdate=true;'
          assert s.count(old)==1;s=s.replace(old,new)
          old='  const body=new THREE.Group(),mesh=new THREE.Mesh(geometry,material);'
          assert s.count(old)==1;s=s.replace(old,'  // Keep the pre-lit artwork readable in dim world lighting: colored texture fill, never a flat white emission that washes out its colors.\n'+old)
          p.write_text(s)
          tests=Path('packages/assets/tests/character-sprite-set-integration.test.mjs')
          tests.write_text(tests.read_text()+"\ntest('world-lighting fill uses the current sprite texture without extra allocations or white wash',async()=>{\n  const {actor,textures}=await actorFixture();\n  for(const action of Object.keys(sample.actions)){actor.play(action);actor.update({delta:.3});assert.ok(actor.mesh.material.map);assert.equal(actor.mesh.material.emissiveMap,actor.mesh.material.map);assert.equal(actor.mesh.material.emissiveIntensity,.35);}\n  assert.equal(textures.length,13);actor.dispose();assert.ok(textures.every(texture=>texture.disposals===1));\n});\n")
          previous=subprocess.check_output(['git','log','-1','--format=%B'],text=True)
          Path('/tmp/sprite-set-message').write_text('fix(sprite-set): preserve authored colors in RINNE world lighting [astra-validate] [astra-heavy-validation]\n\n'+previous.split('\n',1)[1])
          PY
          node --check packages/assets/src/adapters/three/character-sprite-set.js
          git diff --check
          git add -- packages/assets/src/adapters/three/character-sprite-set.js packages/assets/tests/character-sprite-set-integration.test.mjs
          git diff --cached --stat | tee .deploy-state/sprite-set-candidate/diff-stat.txt
          git diff --cached > .deploy-state/sprite-set-candidate/changes.patch
          git config user.name 'Sprite Set implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F /tmp/sprite-set-message
          git push origin HEAD:refs/heads/work/sprite-set-candidate-1492-r5
          sha=$(git rev-parse HEAD)
          echo "$sha" | tee .deploy-state/sprite-set-candidate/candidate-head.txt
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Register exact-source browser validation
        run: gh api repos/${{ github.repository }}/statuses/$SOURCE_SHA -f state=pending -f context=astra/sprite-set-browser -f description='Exact-source builds and real-input motion verification running' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Focused schema, Three ownership, proxy, color and compatibility tests
        run: node --test packages/assets/tests/character-sprite-set.test.mjs packages/assets/tests/character-sprite-set-integration.test.mjs tests/character25d-equipment.test.mjs
      - name: Build exact-source Review and RINNE
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm run build --workspace @soul/review
          npm run build --workspace @soul/rinne
      - name: Real UI actions, cameras, RINNE village and motion evidence
        run: node scripts/sprite-set/browser-playtest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-set-browser-${{ env.SOURCE_SHA }}
          path: |
            .deploy-state/sprite-set-candidate
            .deploy-state/sprite-set-browser-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
      - name: Publish actual exact-source result
        if: always()
        run: |
          state=failure
          if [ '${{ job.status }}' = success ]; then state=success; fi
          gh api repos/${{ github.repository }}/statuses/$SOURCE_SHA -f state="$state" -f context=astra/sprite-set-browser -f description='Sprite Set specialist builds / real-input browser result' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
