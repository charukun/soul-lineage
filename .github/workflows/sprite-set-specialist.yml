name: Sprite Set Specialist - task branch only
on:
  push:
    branches: [work/sprite-set-specialist-20260923]
    paths: [.github/workflows/sprite-set-specialist.yml]
permissions:
  contents: write
  statuses: write
concurrency:
  group: sprite-set-specialist-1492
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      SOURCE_SHA: 705ad6e3fc8d49eb717985f1f8848dd5bf919399
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Materialize normal boot-input and boundary-verification corrections
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .deploy-state/sprite-set-candidate
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scripts/sprite-set/browser-playtest.mjs');s=p.read_text()
          def change(old,new):
              global s
              assert s.count(old)==1, ('anchor count', s.count(old),old[:80])
              s=s.replace(old,new)
          change("  await rinne.mouse.click(640,350);await rinne.waitForTimeout(500);",
                 "  // The existing brand boot requires a deliberate tap after its assets are ready.\n  await rinne.locator('#soul-brand-boot.ready').click({timeout:120000});\n  await rinne.locator('#soul-brand-boot').waitFor({state:'hidden',timeout:30000});")
          change("if(await rinne.locator('#title-screen').getAttribute('data-intro')!=='idle'){await rinne.mouse.click(640,350);await rinne.waitForTimeout(500);}",
                 "if(await rinne.locator('#title-screen').getAttribute('data-intro')!=='idle'){await rinne.locator('#title-screen').click({position:{x:20,y:20}});await rinne.waitForTimeout(500);}")
          change("  assert.equal(new Set(views).size,8);await cameraInput(0);",
                 "  assert.equal(new Set(views).size,8);await cameraInput(0);\n  const boundary=[];for(const angle of [21,24,21,24]){await cameraInput(angle);boundary.push((await state()).actor.view);}assert.ok(boundary.every(view=>view==='front'));\n  await cameraInput(30);for(const angle of [24,21,24,21]){await cameraInput(angle);assert.equal((await state()).actor.view,'frontRight');}\n  note('real camera input retains both hysteresis sectors across boundary jitter',boundary);await cameraInput(0);")
          change("note('self-window command rejected',await gameState());",
                 "note('self-window command rejected',await gameState());\n  const stableViews=[];for(let i=0;i<10;i++){await rinne.waitForTimeout(100);stableViews.push((await gameState()).actor.view);}\n  const viewTransitions=stableViews.slice(1).filter((v,i)=>v!==stableViews[i]).length;assert.ok(viewTransitions<=1,'RINNE view must not flicker at rest');note('RINNE settled view stability',{stableViews,viewTransitions});")
          change("const note=(label,snapshot)=>receipt.steps.push({label,snapshot,at:new Date().toISOString()});",
                 "const note=(label,snapshot)=>{receipt.steps.push({label,snapshot,at:new Date().toISOString()});console.log('SPRITE_SET_STEP '+label);};")
          p.write_text(s)
          previous=subprocess.check_output(['git','log','-1','--format=%B'],text=True)
          Path('/tmp/sprite-set-message').write_text('test(sprite-set): follow real RINNE boot and verify boundary stability [astra-validate] [astra-heavy-validation]\n\n'+previous.split('\n',1)[1])
          PY
          node --check scripts/sprite-set/browser-playtest.mjs
          git diff --check
          git add -- scripts/sprite-set/browser-playtest.mjs
          git diff --cached --stat | tee .deploy-state/sprite-set-candidate/diff-stat.txt
          git diff --cached > .deploy-state/sprite-set-candidate/changes.patch
          git config user.name 'Sprite Set implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F /tmp/sprite-set-message
          git push origin HEAD:refs/heads/work/sprite-set-candidate-1492-r3
          sha=$(git rev-parse HEAD)
          echo "$sha" | tee .deploy-state/sprite-set-candidate/candidate-head.txt
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Register exact-source browser validation
        run: gh api repos/${{ github.repository }}/statuses/$SOURCE_SHA -f state=pending -f context=astra/sprite-set-browser -f description='Exact-source builds and real-input motion verification running' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Focused schema, Three ownership, proxy and compatibility tests
        run: node --test packages/assets/tests/character-sprite-set.test.mjs packages/assets/tests/character-sprite-set-integration.test.mjs tests/character25d-equipment.test.mjs
      - name: Build exact-source Review and RINNE
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm run build --workspace @soul/review
          npm run build --workspace @soul/rinne
      - name: Real UI actions, cameras, RINNE village and motion evidence
        run: node scripts/sprite-set/browser-playtest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-set-browser-${{ env.SOURCE_SHA }}
          path: |
            .deploy-state/sprite-set-candidate
            .deploy-state/sprite-set-browser-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
      - name: Publish actual exact-source result
        if: always()
        run: |
          state=failure
          if [ '${{ job.status }}' = success ]; then state=success; fi
          gh api repos/${{ github.repository }}/statuses/$SOURCE_SHA -f state="$state" -f context=astra/sprite-set-browser -f description='Sprite Set specialist builds / real-input browser result' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
