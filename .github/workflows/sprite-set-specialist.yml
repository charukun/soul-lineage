name: Sprite Set Specialist - task branch only
on:
  push:
    branches: [work/sprite-set-specialist-20260923]
    paths: [.github/workflows/sprite-set-specialist.yml]
permissions:
  contents: read
concurrency:
  group: sprite-set-specialist-1492
  cancel-in-progress: true
jobs:
  recover-browser-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release the stalled browser run so its actual progress log can be inspected
        run: |
          echo 'The preceding browser verification exceeded ten minutes in one step.'
          echo 'Canceling that observation does not pass or bypass the browser gate.'
          echo 'Inspect its terminal logs and retained evidence before retrying exact-source verification.'
