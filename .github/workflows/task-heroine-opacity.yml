name: Heroine opacity review (task scoped)
on:
  push:
    branches: ['fix/heroine-dawn-opacity']
    paths:
      - '.task-start/heroine-opacity/**'
      - '.github/workflows/task-heroine-opacity.yml'
      - 'assets/characters/heroine-dawn/opacity.py'
      - 'assets/characters/heroine-dawn/observe-opacity.mjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: heroine-opacity-authoring
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: dev
      PYTHONPATH: /usr/lib/python3/dist-packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare explicitly requested DCC and browser review
        run: |
          mkdir -p generated/heroine-opacity
          sudo apt-get update -qq > generated/heroine-opacity/apt.log 2>&1
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libegl-mesa0 libgl1-mesa-dri >> generated/heroine-opacity/apt.log 2>&1
          npm ci --ignore-scripts > generated/heroine-opacity/npm.log 2>&1
          npx playwright install --with-deps chromium > generated/heroine-opacity/chromium.log 2>&1
      - name: Restore and verify the completed immutable Before artifact
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .task-start/heroine-opacity/restore-before.py
      - name: Repair real editable mesh and materialize candidate
        timeout-minutes: 3
        run: bash .task-start/heroine-opacity/run.sh repair
      - name: Render the edited Blender source
        timeout-minutes: 6
        run: bash .task-start/heroine-opacity/run.sh render
      - name: Observe exact candidate from all requested angles and actions
        timeout-minutes: 10
        run: bash .task-start/heroine-opacity/run.sh after
      - name: Prepare same-repository delivery tree and check asset consistency
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .task-start/heroine-opacity/run.sh deliver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-opacity-${{ github.sha }}
          path: generated/heroine-opacity
          retention-days: 7
