name: Johakyu one-shot final materializer
on:
  push:
    branches: ['work/johakyu-p3-p7-20260921']
    paths: ['.github/workflows/johakyu-materialize-final.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[johakyu-materialize-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Recover partial new-file patch for exact continuation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/johakyu-partial
          cat .astra/johakyu-newfiles.part1 .astra/johakyu-newfiles.part2 | base64 -d > /tmp/johakyu-partial/newfiles.partial.gz
          gzip -dc /tmp/johakyu-partial/newfiles.partial.gz > /tmp/johakyu-partial/newfiles.partial.patch 2>/tmp/johakyu-partial/gzip.err || true
          wc -c /tmp/johakyu-partial/newfiles.partial.patch
          head -80 /tmp/johakyu-partial/newfiles.partial.patch
      - uses: actions/upload-artifact@v4
        with:
          name: johakyu-partial-newfiles
          path: /tmp/johakyu-partial/
          retention-days: 1
