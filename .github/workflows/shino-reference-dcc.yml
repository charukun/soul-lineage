name: Shino Reference DCC Build

on:
  push:
    branches:
      - feat/shino-reference-v2-dcc
    paths:
      - .github/workflows/shino-reference-dcc.yml
      - scripts/blender/build-shino-reference-v2.py
      - scripts/blender/run-shino-reference-v2.py
      - scripts/blender/refine-shino-reference-v2.py
      - scripts/blender/refine-shino-reference-v2-v3.py
      - scripts/blender/refine-shino-reference-v2-v4.py
      - scripts/blender/refine-shino-reference-v2-v5.py
      - scripts/blender/refine-shino-reference-v2-v6.py
      - scripts/blender/refine-shino-reference-v2-v7.py
      - scripts/blender/normalize-shino-reference-v2-transforms.py
      - scripts/blender/character-production-audit.py
      - scripts/patch-vrm-humanoid.py
      - scripts/finalize-shino-reference-v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shino-reference-v2-dcc
  cancel-in-progress: true

env:
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  build-dcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest branch head before DCC build
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1-mesa-dri libglx-mesa0
          blender --version
          xvfb-run -a blender --background --python-exit-code 1 --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Prepare audited rig input
        run: |
          rm -rf generated/shino-reference-v2
          mkdir -p generated/shino-reference-v2
          cp apps/rinne/public/simulator/assets/SHINO_review.vrm generated/shino-reference-v2/SHINO_review.glb

      - name: Build dedicated Shino Reference v2 DCC primary mesh
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            --python scripts/blender/run-shino-reference-v2.py -- \
            --source generated/shino-reference-v2/SHINO_review.glb \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Refine face and silhouette from audited high-density donor
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/refine-shino-reference-v2.py -- \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Correct donor placement and reference styling
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/refine-shino-reference-v2-v3.py -- \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Keep face static for PRIMARY review
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/refine-shino-reference-v2-v4.py -- \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Replace primitive skin with audited high-density basemesh
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/refine-shino-reference-v2-v5.py -- \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Replace unsafe donor body with coherent stylized PRIMARY body
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/refine-shino-reference-v2-v7.py -- \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/shino-reference-v2

      - name: Normalize authored detail transforms and re-export
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/normalize-shino-reference-v2-transforms.py -- \
            --blend generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --glb generated/shino-reference-v2/export/ShinoReferenceV2.glb

      - name: Restore VRM humanoid metadata
        run: |
          python3 scripts/patch-vrm-humanoid.py \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --input generated/shino-reference-v2/export/ShinoReferenceV2.glb \
            --output generated/shino-reference-v2/export/ShinoReferenceV2.vrm

      - name: Audit Blender source
        run: |
          xvfb-run -a blender --background --python-exit-code 1 generated/shino-reference-v2/source/ShinoReferenceV2.blend \
            --python scripts/blender/character-production-audit.py -- \
            --out generated/shino-reference-v2/blender-audit.json \
            --character-id shino.reference.v2

      - name: Install generated review assets
        run: |
          mkdir -p assets/characters/shino/reference-v2/source
          mkdir -p apps/rinne/public/simulator/assets
          mkdir -p docs/characters/qa/shino-reference-v2
          cp generated/shino-reference-v2/source/ShinoReferenceV2.blend assets/characters/shino/reference-v2/source/ShinoReferenceV2.blend
          cp generated/shino-reference-v2/export/ShinoReferenceV2.vrm apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.vrm
          cp generated/shino-reference-v2/review/*.png docs/characters/qa/shino-reference-v2/
          cp generated/shino-reference-v2/blender-audit.json docs/characters/qa/shino-reference-v2/blender-audit.json
          cp generated/shino-reference-v2/build.json docs/characters/qa/shino-reference-v2/build.json

      - name: Finalize exact hash and production manifest
        run: |
          python3 scripts/finalize-shino-reference-v2.py \
            --model apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.vrm \
            --blend assets/characters/shino/reference-v2/source/ShinoReferenceV2.blend \
            --audit docs/characters/qa/shino-reference-v2/blender-audit.json \
            --build docs/characters/qa/shino-reference-v2/build.json \
            --integrity-out apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.asset.json \
            --production-out packages/characters/production/shino-reference.production.json

      - name: Fast generated-asset sanity
        run: |
          python3 -m py_compile scripts/blender/build-shino-reference-v2.py scripts/blender/run-shino-reference-v2.py scripts/blender/refine-shino-reference-v2.py scripts/blender/refine-shino-reference-v2-v3.py scripts/blender/refine-shino-reference-v2-v4.py scripts/blender/refine-shino-reference-v2-v5.py scripts/blender/refine-shino-reference-v2-v6.py scripts/blender/refine-shino-reference-v2-v7.py scripts/blender/normalize-shino-reference-v2-transforms.py scripts/patch-vrm-humanoid.py scripts/finalize-shino-reference-v2.py
          test -s apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.vrm
          test -s apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.asset.json
          test -s assets/characters/shino/reference-v2/source/ShinoReferenceV2.blend
          test -s docs/characters/qa/shino-reference-v2/front.png
          test -s docs/characters/qa/shino-reference-v2/side.png
          test -s docs/characters/qa/shino-reference-v2/back.png
          test -s docs/characters/qa/shino-reference-v2/three-quarter.png

      - name: Commit generated DCC source and review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m dcc-generated-output
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git add \
            assets/characters/shino/reference-v2/source/ShinoReferenceV2.blend \
            apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.vrm \
            apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.asset.json \
            packages/characters/production/shino-reference.production.json \
            docs/characters/qa/shino-reference-v2
          if git diff --cached --quiet; then
            echo "Generated DCC assets are unchanged."
          else
            git commit -m "build(characters): refine Shino Reference v2 DCC assets v8"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload DCC review bundle
        uses: actions/upload-artifact@v4
        with:
          name: shino-reference-v2-dcc-review
          path: |
            generated/shino-reference-v2/review/*.png
            generated/shino-reference-v2/blender-audit.json
            generated/shino-reference-v2/build.json
            apps/rinne/public/simulator/assets/SHINO_REFERENCE_V2.asset.json
          if-no-files-found: error
          retention-days: 14
