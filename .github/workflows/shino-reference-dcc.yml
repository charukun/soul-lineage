name: Arcanist Atlas DCC Carrier

on:
  push:
    branches:
      - feat/shino-reference-v2-dcc
    paths:
      - .github/workflows/shino-reference-dcc.yml

permissions:
  contents: write

concurrency:
  group: arcanist-atlas-dcc-carrier
  cancel-in-progress: true

env:
  LIBGL_ALWAYS_SOFTWARE: "1"
  TARGET_BRANCH: dispatch/arcanist-atlas-dcc-run
  SOURCE_BRANCH: feat/arcanist-atlas-dcc

jobs:
  build-dcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reconcile latest develop and DCC authoring source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop "${SOURCE_BRANCH}" "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git merge --no-edit origin/develop
          git merge --no-edit "origin/${SOURCE_BRANCH}"
          rm -f .github/workflows/arcanist-atlas-dcc.yml
          rm -f .task-start/arcanist-atlas-dcc-run.md

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1-mesa-dri libglx-mesa0
          blender --version
          xvfb-run -a blender --background --python-exit-code 1 --python-expr "import bpy; print('Blender runtime', bpy.app.version_string)"

      - name: Prepare audited rig input
        run: |
          rm -rf generated/arcanist-atlas-dcc
          mkdir -p generated/arcanist-atlas-dcc
          cp apps/rinne/public/simulator/assets/SHINO_review.vrm generated/arcanist-atlas-dcc/SHINO_review.glb
          test "$(sha256sum docs/characters/references/npc-role-set/arcanist.avif | cut -d' ' -f1)" = "5930816e59424bcc17530ba9029d1231fb24ac88ee35ee5818f96e05e0978bd0"

      - name: Patch Blender 4 render-engine compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/blender/build-arcanist-atlas-dcc.py')
          source = path.read_text(encoding='utf-8')
          old = '''    engines = {item.identifier for item in scene.bl_rna.properties["render_engine"].enum_items}\n    scene.render.engine = "BLENDER_EEVEE_NEXT" if "BLENDER_EEVEE_NEXT" in engines else "BLENDER_EEVEE"'''
          new = '''    for engine in ("BLENDER_EEVEE_NEXT", "BLENDER_EEVEE", "BLENDER_WORKBENCH"):\n        try:\n            scene.render.engine = engine\n            break\n        except TypeError:\n            continue\n    else:\n        raise RuntimeError("No supported Blender render engine is available")'''
          if old not in source:
              raise SystemExit('Expected render-engine compatibility block not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Build Arcanist Atlas in Blender
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            --python scripts/blender/build-arcanist-atlas-dcc.py -- \
            --source generated/arcanist-atlas-dcc/SHINO_review.glb \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --out generated/arcanist-atlas-dcc

      - name: Restore Arcanist humanoid metadata
        run: |
          python3 scripts/patch-arcanist-atlas-vrm.py \
            --source-vrm apps/rinne/public/simulator/assets/SHINO_review.vrm \
            --input generated/arcanist-atlas-dcc/export/ArcanistAtlasDCC.glb \
            --output generated/arcanist-atlas-dcc/export/ArcanistAtlasDCC.glb
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          model = Path('generated/arcanist-atlas-dcc/export/ArcanistAtlasDCC.glb')
          build_path = Path('generated/arcanist-atlas-dcc/build.json')
          build = json.loads(build_path.read_text(encoding='utf-8'))
          build['glbSha256'] = hashlib.sha256(model.read_bytes()).hexdigest()
          build['humanoidMetadata'] = 'VRMC_vrm/1.0 restored from audited SHINO_review.vrm by bone name'
          build_path.write_text(json.dumps(build, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Audit generated Blender source
        run: |
          xvfb-run -a blender --background --python-exit-code 1 \
            generated/arcanist-atlas-dcc/source/ArcanistAtlasDCC.blend \
            --python scripts/blender/character-production-audit.py -- \
            --out generated/arcanist-atlas-dcc/blender-audit.json \
            --character-id arcanist.atlas-dcc.v1

      - name: Install generated DCC assets
        run: |
          mkdir -p assets/characters/arcanist/atlas-dcc/source
          mkdir -p apps/rinne/public/simulator/assets
          mkdir -p docs/characters/qa/arcanist-atlas-dcc
          cp generated/arcanist-atlas-dcc/source/ArcanistAtlasDCC.blend assets/characters/arcanist/atlas-dcc/source/ArcanistAtlasDCC.blend
          cp generated/arcanist-atlas-dcc/export/ArcanistAtlasDCC.glb apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.glb
          cp generated/arcanist-atlas-dcc/review/*.png docs/characters/qa/arcanist-atlas-dcc/
          cp generated/arcanist-atlas-dcc/blender-audit.json docs/characters/qa/arcanist-atlas-dcc/blender-audit.json
          cp generated/arcanist-atlas-dcc/build.json docs/characters/qa/arcanist-atlas-dcc/build.json

      - name: Finalize hashes and Production Pipeline manifest
        run: |
          python3 scripts/finalize-arcanist-atlas-dcc.py \
            --model apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.glb \
            --blend assets/characters/arcanist/atlas-dcc/source/ArcanistAtlasDCC.blend \
            --audit docs/characters/qa/arcanist-atlas-dcc/blender-audit.json \
            --build docs/characters/qa/arcanist-atlas-dcc/build.json \
            --integrity-out apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.asset.json \
            --production-out packages/characters/production/arcanist-atlas-dcc.production.json

      - name: Verify generated candidate
        run: |
          python3 -m py_compile scripts/blender/build-arcanist-atlas-dcc.py scripts/blender/character-production-audit.py scripts/finalize-arcanist-atlas-dcc.py scripts/patch-arcanist-atlas-vrm.py
          test -s assets/characters/arcanist/atlas-dcc/source/ArcanistAtlasDCC.blend
          test -s apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.glb
          test -s apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.asset.json
          test -s docs/characters/qa/arcanist-atlas-dcc/front.png
          test -s docs/characters/qa/arcanist-atlas-dcc/side.png
          test -s docs/characters/qa/arcanist-atlas-dcc/back.png
          test -s docs/characters/qa/arcanist-atlas-dcc/three-quarter.png
          node scripts/check-character-production.mjs
          git diff --check

      - name: Commit real Blender outputs to target branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(characters): generate Arcanist Atlas Blender DCC candidate"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload DCC review evidence
        uses: actions/upload-artifact@v4
        with:
          name: arcanist-atlas-dcc-review
          path: |
            generated/arcanist-atlas-dcc/review/*.png
            generated/arcanist-atlas-dcc/blender-audit.json
            generated/arcanist-atlas-dcc/build.json
            apps/rinne/public/simulator/assets/ARCANIST_ATLAS_DCC.asset.json
          if-no-files-found: error
          retention-days: 14
