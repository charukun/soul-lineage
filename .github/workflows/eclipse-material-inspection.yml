name: Eclipse Material Inspection
on:
  push:
    branches: [astra/eclipse-autobattle-20260919]
    paths: [.github/workflows/eclipse-material-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-fresh-models-and-exclusion-audit
          run-id: 35415633900
          github-token: ${{ github.token }}
          path: recovered
      - name: Print focused metadata
        run: |
          python - <<'PY'
          import pathlib,json,struct,re,hashlib
          root=pathlib.Path('recovered'); models=root/'originals'; report={}; tree=json.loads((root/'mirror-tree.json').read_text())
          print('===EXCLUDED SNAPSHOTS===')
          audit=json.loads((root/'audit/excluded-model-inventory.json').read_text())
          for ref,d in audit.items():
            print(ref,d['commit'],len(d['models']))
            for e in d['models']:print(e['path'],e['gitBlob'])
          print('===EXCLUDED SOURCE REFERENCES===')
          for f in (root/'audit').rglob('*'):
            if not f.is_file() or f.suffix not in ['.json','.js','.mjs','.ts','.md','.txt']:continue
            if 'tree.txt' in f.name or f.name=='excluded-model-inventory.json':continue
            lines=[]
            for line in f.read_text(errors='replace').splitlines():
              if re.search(r'quaternius|KayKit|sketchfab|agentkaerf|polyhaven|kenney|mixamo|cdn.*gl[bft]',line,re.I):lines.append(line[:450])
            if lines:print(str(f), '\n'.join(lines[:15]))
          print('===MODEL CANDIDATES===')
          for f in sorted(models.rglob('*')):
            if f.suffix not in ['.gltf','.glb']:continue
            data=f.read_bytes()
            try:j=json.loads(data[20:20+struct.unpack_from('<I',data,12)[0]]) if f.suffix=='.glb' else json.loads(data)
            except Exception as e:print(f,e);continue
            p=str(f.relative_to(models)); item={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'nodes':[n.get('name') for n in j.get('nodes',[])],'meshes':[m.get('name') for m in j.get('meshes',[])],'animations':[a.get('name') for a in j.get('animations',[])],'buffers':j.get('buffers',[]),'images':j.get('images',[])}
            report[p]=item
            if '/Modular Parts/' not in p:print(p, 'ANIM',item['animations'])
          print('===ANIMATION FILES IN SOURCE===')
          for e in tree['tree']:
            if 'Universal Animation' in e['path'] and e['type']=='blob':print(e['path'],e.get('size'))
          for p,item in report.items():
            if 'Female_Ranger.gltf' in p or 'Cute Animated' in p or 'Universal Animation' in p:
              print('DETAIL',p,json.dumps(item))
          pathlib.Path('compact').mkdir(exist_ok=True)
          pathlib.Path('compact/model-metadata.json').write_text(json.dumps(report,indent=2))
          pathlib.Path('compact/exclusion-audit.json').write_text(json.dumps(audit,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-compact-material-metadata
          path: compact
          retention-days: 7
