name: Village isolated playthrough review
# The one-off publication has completed. Evidence and replay scripts remain on
# this diagnostic branch; no future push can publish changes from this workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Show archived review and publication references
        run: |
          echo 'Village repair was published to feature branch fix/village-playthrough-stability.'
          echo 'Ready PR: https://github.com/charukun/soul-lineage/pull/90'
          echo 'Verified publication run: 34688473781'
          echo 'Game CI and DEV publication belong to the normal Integration flow.'
