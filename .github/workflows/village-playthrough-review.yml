name: Village isolated playthrough review
on:
  push:
    branches: [review/village-playthrough-20260912]
    paths: [.github/workflows/village-playthrough-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture exact public village assets without changing the deployment
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          root='https://charukun.github.io/soul-lineage/'
          out=pathlib.Path('review-snapshot');out.mkdir()
          def read(url):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Village-UX-Review/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:return r.read()
                  except Exception:
                      if attempt==2:raise
                      time.sleep(attempt+1)
          manifest=json.loads(read(root+'deployment-manifest.json?review='+str(time.time_ns())))
          entry=next(e for e in manifest['entries'] if e['app']=='village' and e['environment']=='dev')
          (out/'deployment-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          def fetch_file(f):
              rel=pathlib.PurePosixPath(f['path'])
              if rel.is_absolute() or '..' in rel.parts:raise ValueError('Unsafe manifest path')
              data=read(root+entry['path']+'/'+f['path'])
              if hashlib.sha256(data).hexdigest()!=f['sha256']:raise ValueError('Public hash mismatch: '+f['path'])
              dest=out/'village'/str(rel);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              return f['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:files=list(pool.map(fetch_file,entry['files']))
          (out/'capture.json').write_text(json.dumps({'url':root+entry['path']+'/', 'version':entry['version'],'verifiedFiles':len(files),'capturedAt':time.time(),'method':'GET only, every file SHA-256 verified'},ensure_ascii=False,indent=2))
          print(json.dumps(entry['version'],ensure_ascii=False));print('Verified files:',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: village-hash-verified-public-build
          path: review-snapshot/
          retention-days: 3
          compression-level: 1
