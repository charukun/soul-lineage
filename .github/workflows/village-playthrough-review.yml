name: Village isolated playthrough review
on:
  push:
    branches: [review/village-playthrough-20260912]
    paths: [.github/workflows/village-playthrough-review.yml]
permissions:
  contents: read
jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare standalone Playwright headless runtime
        run: |
          mkdir -p /tmp/village-browser
          npm install --prefix /tmp/village-browser playwright@1.55.1 --no-package-lock
          PLAYWRIGHT_BROWSERS_PATH=/tmp/village-browser/runtime /tmp/village-browser/node_modules/.bin/playwright install chromium --only-shell
          tar -czf /tmp/village-browser-runtime.tar.gz -C /tmp/village-browser runtime
      - uses: actions/upload-artifact@v4
        with:
          name: village-headless-browser-runtime
          path: /tmp/village-browser-runtime.tar.gz
          compression-level: 1
          retention-days: 3
