name: Village isolated playthrough review
on:
  push:
    branches: [review/village-playthrough-20260912]
    paths: [.github/workflows/village-playthrough-review.yml]
permissions:
  contents: read
jobs:
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/review
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated Chromium
        run: |
          mkdir -p /tmp/village-review
          cp scripts/review/village-playthrough.mjs /tmp/village-review/review.mjs
          npm install --prefix /tmp/village-review playwright@1.55.1 --no-package-lock
          /tmp/village-review/node_modules/.bin/playwright install --with-deps chromium
      - name: Operate the public DEV app in an isolated mobile profile
        env:
          REVIEW_OUT: ${{ github.workspace }}/playthrough
        run: node /tmp/village-review/review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-mobile-playthrough-evidence
          path: playthrough/
          if-no-files-found: error
          retention-days: 7
