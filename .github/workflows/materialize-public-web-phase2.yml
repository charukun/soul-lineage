name: Materialize Public Web Assets Phase 2
# Final one-shot trigger after catalog/docs and latest develop were synchronized.

on:
  push:
    branches:
      - feat/public-web-assets-phase2-20260916
    paths:
      - .github/workflows/materialize-public-web-phase2.yml

permissions:
  contents: write

concurrency:
  group: materialize-public-web-phase2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch audited public assets
        shell: bash
        run: |
          set -euo pipefail

          fetch_git_blob() {
            local url="$1"
            local expected="$2"
            local out="$3"
            mkdir -p "$(dirname "$out")"
            curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 "$url" -o "$out"
            local actual
            actual="$(git hash-object "$out")"
            if [ "$actual" != "$expected" ]; then
              echo "git blob mismatch for $out: expected=$expected actual=$actual" >&2
              exit 1
            fi
          }

          interface_base="https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/4596a49eaf5a533948d49a47467f606bcdea70ff/addons/kenney_interface_sounds"
          fetch_git_blob "$interface_base/confirmation_001.wav" "57b0731148815280947db27a3015c483c3fa24e7" "assets/vendor/public-web/kenney-interface-sounds/ui/confirm.wav"
          fetch_git_blob "$interface_base/error_001.wav" "edcf344ee212d13797f250eb5649ce55c655d825" "assets/vendor/public-web/kenney-interface-sounds/ui/error.wav"
          fetch_git_blob "$interface_base/select_001.wav" "9b87d500823213ccb556b286bef7164a44fcabe1" "assets/vendor/public-web/kenney-interface-sounds/ui/select.wav"
          fetch_git_blob "$interface_base/click_001.wav" "f7378a24b790c2ee6340db66c849e617bd315966" "assets/vendor/public-web/kenney-interface-sounds/ui/click.wav"
          fetch_git_blob "$interface_base/toggle_002.wav" "ff8109f06391972f86fa391403b429739d2f8386" "assets/vendor/public-web/kenney-interface-sounds/ui/toggle.wav"
          fetch_git_blob "$interface_base/LICENSE.txt" "1fc5acf8243a8ac899403e7297f8c5efdc4258f2" "assets/vendor/public-web/kenney-interface-sounds/LICENSE.txt"

          impact_base="https://raw.githubusercontent.com/Boyquotes/kenney-impact-sounds-for-godot/999dd1684873f8b020a3aa5b26e713da21688924/addons/kenney%20impact%20sounds"
          fetch_git_blob "$impact_base/impact_metal_heavy_000.ogg" "d4432f48b6ff5b4a501045ef0b8068963ef5530d" "assets/vendor/public-web/kenney-impact-sounds/combat/metal-heavy.ogg"
          fetch_git_blob "$impact_base/impact_punch_medium_000.ogg" "d8e0b890ae019533ec190dd2d1decce249ea556e" "assets/vendor/public-web/kenney-impact-sounds/combat/punch-medium.ogg"
          fetch_git_blob "$impact_base/impact_wood_heavy_000.ogg" "30fb995aab49d70e51b0c3a226fa45301ad4f760" "assets/vendor/public-web/kenney-impact-sounds/combat/wood-heavy.ogg"
          fetch_git_blob "$impact_base/impact_generic_light_000.ogg" "d0a32de2dfbe38e19e0297a047c7dfc77a7ab487" "assets/vendor/public-web/kenney-impact-sounds/combat/generic-light.ogg"
          fetch_git_blob "$impact_base/footstep_grass_000.ogg" "5b5ec879a5ca457d18ad01a81af805409e35207f" "assets/vendor/public-web/kenney-impact-sounds/footsteps/grass.ogg"
          fetch_git_blob "$impact_base/footstep_wood_000.ogg" "1a519c74dc71da391a93e033aa63eb641da80dd9" "assets/vendor/public-web/kenney-impact-sounds/footsteps/wood.ogg"
          fetch_git_blob "https://raw.githubusercontent.com/Boyquotes/kenney-impact-sounds-for-godot/999dd1684873f8b020a3aa5b26e713da21688924/LICENSE" "0e259d42c996742e9e3cba14c677129b2c1b6311" "assets/vendor/public-web/kenney-impact-sounds/LICENSE.txt"

          particle_base="https://raw.githubusercontent.com/Calinou/kenney-particle-pack/ab7086639ee73be31abd87feb21bf1402d4e8144/addons/kenney_particle_pack"
          fetch_git_blob "$particle_base/spark_04.png" "6eaf328696ec8640571a69318b6211223c14224e" "assets/vendor/public-web/kenney-particle-pack/vfx/spark.png"
          fetch_git_blob "$particle_base/slash_02.png" "307bd547f39287c39fc8e8aca020134592330433" "assets/vendor/public-web/kenney-particle-pack/vfx/slash.png"
          fetch_git_blob "$particle_base/smoke_05.png" "4a77199d4ddab9d6482d8285ed3cd962983d8ffa" "assets/vendor/public-web/kenney-particle-pack/vfx/smoke.png"
          fetch_git_blob "$particle_base/flare_01.png" "bd25bd874e47467e95d6623aa0364be1c619617a" "assets/vendor/public-web/kenney-particle-pack/vfx/flare.png"
          fetch_git_blob "$particle_base/magic_05.png" "67b3582a720af77b76916c06643a260834e2e37b" "assets/vendor/public-web/kenney-particle-pack/vfx/magic.png"
          fetch_git_blob "https://raw.githubusercontent.com/Calinou/kenney-particle-pack/ab7086639ee73be31abd87feb21bf1402d4e8144/addons/kenney_particle_pack/LICENSE.txt" "e198510d3c6ac7e3dc4370f1f0861d8c617362e8" "assets/vendor/public-web/kenney-particle-pack/LICENSE.txt"

          pbr_root="assets/vendor/public-web/polyhaven-medieval-blocks-05/1k"
          mkdir -p "$pbr_root"
          pbr_base="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/medieval_blocks_05"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 "$pbr_base/medieval_blocks_05_diff_1k.jpg" -o "$pbr_root/diffuse.jpg"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 "$pbr_base/medieval_blocks_05_nor_gl_1k.jpg" -o "$pbr_root/normal-gl.jpg"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 "$pbr_base/medieval_blocks_05_rough_1k.jpg" -o "$pbr_root/roughness.jpg"
          cat > "assets/vendor/public-web/polyhaven-medieval-blocks-05/LICENSE.txt" <<'EOF'
          Medieval Blocks 05 by Rob Tuytel / Poly Haven
          License: Creative Commons Zero 1.0 Universal (CC0-1.0)
          Canonical asset: https://polyhaven.com/a/medieval_blocks_05
          Canonical license: https://polyhaven.com/license
          Audited: 2026-09-16
          EOF

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('assets/vendor/public-web')
          files = [
              ('kenney-interface-sounds/ui/confirm.wav', 'Calinou/kenney-interface-sounds', '4596a49eaf5a533948d49a47467f606bcdea70ff', '57b0731148815280947db27a3015c483c3fa24e7', 'CC0-1.0'),
              ('kenney-interface-sounds/ui/error.wav', 'Calinou/kenney-interface-sounds', '4596a49eaf5a533948d49a47467f606bcdea70ff', 'edcf344ee212d13797f250eb5649ce55c655d825', 'CC0-1.0'),
              ('kenney-interface-sounds/ui/select.wav', 'Calinou/kenney-interface-sounds', '4596a49eaf5a533948d49a47467f606bcdea70ff', '9b87d500823213ccb556b286bef7164a44fcabe1', 'CC0-1.0'),
              ('kenney-interface-sounds/ui/click.wav', 'Calinou/kenney-interface-sounds', '4596a49eaf5a533948d49a47467f606bcdea70ff', 'f7378a24b790c2ee6340db66c849e617bd315966', 'CC0-1.0'),
              ('kenney-interface-sounds/ui/toggle.wav', 'Calinou/kenney-interface-sounds', '4596a49eaf5a533948d49a47467f606bcdea70ff', 'ff8109f06391972f86fa391403b429739d2f8386', 'CC0-1.0'),
              ('kenney-impact-sounds/combat/metal-heavy.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', 'd4432f48b6ff5b4a501045ef0b8068963ef5530d', 'CC0-1.0'),
              ('kenney-impact-sounds/combat/punch-medium.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', 'd8e0b890ae019533ec190dd2d1decce249ea556e', 'CC0-1.0'),
              ('kenney-impact-sounds/combat/wood-heavy.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', '30fb995aab49d70e51b0c3a226fa45301ad4f760', 'CC0-1.0'),
              ('kenney-impact-sounds/combat/generic-light.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', 'd0a32de2dfbe38e19e0297a047c7dfc77a7ab487', 'CC0-1.0'),
              ('kenney-impact-sounds/footsteps/grass.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', '5b5ec879a5ca457d18ad01a81af805409e35207f', 'CC0-1.0'),
              ('kenney-impact-sounds/footsteps/wood.ogg', 'Boyquotes/kenney-impact-sounds-for-godot', '999dd1684873f8b020a3aa5b26e713da21688924', '1a519c74dc71da391a93e033aa63eb641da80dd9', 'CC0-1.0'),
              ('kenney-particle-pack/vfx/spark.png', 'Calinou/kenney-particle-pack', 'ab7086639ee73be31abd87feb21bf1402d4e8144', '6eaf328696ec8640571a69318b6211223c14224e', 'CC0-1.0'),
              ('kenney-particle-pack/vfx/slash.png', 'Calinou/kenney-particle-pack', 'ab7086639ee73be31abd87feb21bf1402d4e8144', '307bd547f39287c39fc8e8aca020134592330433', 'CC0-1.0'),
              ('kenney-particle-pack/vfx/smoke.png', 'Calinou/kenney-particle-pack', 'ab7086639ee73be31abd87feb21bf1402d4e8144', '4a77199d4ddab9d6482d8285ed3cd962983d8ffa', 'CC0-1.0'),
              ('kenney-particle-pack/vfx/flare.png', 'Calinou/kenney-particle-pack', 'ab7086639ee73be31abd87feb21bf1402d4e8144', 'bd25bd874e47467e95d6623aa0364be1c619617a', 'CC0-1.0'),
              ('kenney-particle-pack/vfx/magic.png', 'Calinou/kenney-particle-pack', 'ab7086639ee73be31abd87feb21bf1402d4e8144', '67b3582a720af77b76916c06643a260834e2e37b', 'CC0-1.0'),
          ]
          manifest = {'auditDate': '2026-09-16', 'files': []}
          for rel, repo, commit, git_blob, license_id in files:
              data = (root / rel).read_bytes()
              manifest['files'].append({
                  'path': f'assets/vendor/public-web/{rel}',
                  'providerRepository': repo,
                  'commit': commit,
                  'gitBlob': git_blob,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'license': license_id,
              })
          pbr = {
              'diffuse.jpg': 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/medieval_blocks_05/medieval_blocks_05_diff_1k.jpg',
              'normal-gl.jpg': 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/medieval_blocks_05/medieval_blocks_05_nor_gl_1k.jpg',
              'roughness.jpg': 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/medieval_blocks_05/medieval_blocks_05_rough_1k.jpg',
          }
          for name, url in pbr.items():
              path = root / 'polyhaven-medieval-blocks-05/1k' / name
              manifest['files'].append({
                  'path': f'assets/vendor/public-web/polyhaven-medieval-blocks-05/1k/{name}',
                  'provider': 'Poly Haven',
                  'canonicalAsset': 'https://polyhaven.com/a/medieval_blocks_05',
                  'fetchUrl': url,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'license': 'CC0-1.0',
              })
          (root / 'PHASE2_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Self-remove materializer and commit assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-public-web-phase2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/public-web .github/workflows/materialize-public-web-phase2.yml
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "feat(assets): materialize phase 2 public web assets"
          git push origin HEAD:feat/public-web-assets-phase2-20260916
