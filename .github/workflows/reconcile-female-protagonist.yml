name: Reconcile Female Protagonist Branch
on:
  push:
    branches:
      - 'work/female-protagonist-blender-refinement-20260921'
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ contains(github.event.head_commit.message, '[reconcile-develop]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge latest develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          git push origin HEAD:work/female-protagonist-blender-refinement-20260921
