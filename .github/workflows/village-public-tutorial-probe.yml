name: Village public tutorial probe
run-name: Village public tutorial probe ${{ github.sha }}
on:
  push:
    branches: [probe/village-public-tutorial-20260921]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Probe public Village tutorial
        env:
          URL: https://soul-lineage-village-dev.c-okamoto.workers.dev/
        run: |
          mkdir -p test-results/village-public-probe
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          const out='test-results/village-public-probe';
          const url=process.env.URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,locale:'ja-JP'});
          const page=await context.newPage();
          const report={url,steps:[],errors:[]};
          page.on('pageerror',e=>report.errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')report.errors.push(m.text())});
          try {
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            report.http=response?.status();
            await page.waitForFunction(()=>window.village&&document.querySelector('#loading')?.hidden===true,null,{timeout:60000});
            report.commit=await page.locator('#game').getAttribute('data-commit');
            report.initial={
              entry:await page.locator('#muraEntry').count(),
              reset:await page.locator('#muraResetVillage').count(),
              guide:await page.locator('#muraFirstRunGuide').count(),
              finger:await page.locator('.muraFirstRunFinger').count(),
              touch:await page.locator('.muraFirstRunTouch').count(),
              tutorialText:await page.locator('#tutorial').textContent().catch(()=>null),
            };
            await page.screenshot({path:`${out}/01-initial.png`,fullPage:true});
            if(await page.locator('#muraResetVillage').count()){
              await page.locator('#muraResetVillage').click();
              await page.locator('#muraResetConfirm [data-reset]').click();
              await page.waitForFunction(()=>window.village&&document.querySelector('#loading')?.hidden===true,null,{timeout:60000});
              report.afterReset={
                entry:await page.locator('#muraEntry').count(),
                guide:await page.locator('#muraFirstRunGuide').count(),
                firstRunDataset:await page.locator('#game').getAttribute('data-first-run-tutorial')
              };
              await page.screenshot({path:`${out}/02-after-reset-title.png`,fullPage:true});
            }
            if(await page.locator('#muraEnterVillage').count()) await page.locator('#muraEnterVillage').click();
            await page.waitForTimeout(500);
            report.afterEnter={
              guide:await page.locator('#muraFirstRunGuide').count(),
              guideVisible:await page.locator('#muraFirstRunGuide').isVisible().catch(()=>false),
              stage:await page.locator('#muraFirstRunGuide').getAttribute('data-stage').catch(()=>null),
              finger:await page.locator('.muraFirstRunFinger').count(),
              touch:await page.locator('.muraFirstRunTouch').count(),
              tutorialVisible:await page.locator('#tutorial').isVisible().catch(()=>false),
            };
            await page.screenshot({path:`${out}/03-after-enter.png`,fullPage:true});
            if(await page.locator('.muraFirstRunStart').count()){
              await page.locator('.muraFirstRunStart').click();
              await page.waitForFunction(()=>document.querySelector('#muraFirstRunGuide')?.dataset.stage==='build');
              let fingerVisible=false;
              try{await page.waitForFunction(()=>{const n=document.querySelector('.muraFirstRunFinger');return !!n&&!n.hidden&&getComputedStyle(n).display!=='none';},null,{timeout:5000});fingerVisible=true;}catch{}
              report.buildStage={
                stage:await page.locator('#muraFirstRunGuide').getAttribute('data-stage'),
                fingerExists:await page.locator('.muraFirstRunFinger').count(),
                fingerVisible,
                touchExists:await page.locator('.muraFirstRunTouch').count(),
                buildHighlighted:await page.locator('#build').evaluate(el=>el.classList.contains('mura-first-run-target'))
              };
              await page.screenshot({path:`${out}/04-build-finger.png`,fullPage:true});
            }
          } finally {
            await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
            await browser.close();
          }
          console.log(JSON.stringify(report));
          if(report.errors.length)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-public-tutorial-probe-${{ github.sha }}
          path: test-results/village-public-probe/
          if-no-files-found: error
          retention-days: 7
