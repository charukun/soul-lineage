name: Temporary PR1203 Freshness Reconcile
run-name: Reconcile PR1203 freshness ${{ github.sha }}
on:
  push:
    branches: ['work/asset-library-expansion-20260921']
    paths: ['.github/workflows/pr1203-freshness-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ contains(github.event.head_commit.message, '[pr1203-freshness]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 256
          persist-credentials: true
      - name: Merge current develop and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git switch -c "$GITHUB_REF_NAME"
          git merge --no-edit origin/develop
          git rm .github/workflows/pr1203-freshness-reconcile.yml
          git commit -m 'chore(assets): contain current develop before final validation'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
