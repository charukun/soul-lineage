name: RINNE Dispatch Handoff

on:
  pull_request:
    types: [opened]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: rinne-dispatch-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handoff:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dispatch/') &&
      contains(github.event.pull_request.body, 'RINNE-Dispatch: implementation') &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout dispatched branch for contract validation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate dispatch request
        env:
          HANDOFF_FILE: ${{ runner.temp }}/rinne-work-handoff.txt
        run: |
          node scripts/rinne-dispatch-prompt.mjs "$GITHUB_EVENT_PATH" "$HANDOFF_FILE" "$GITHUB_REPOSITORY"
          test -s "$HANDOFF_FILE"

      - name: Record ChatGPT Work handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=dispatch/handoff \
            -f description='Eligible for ChatGPT Work event task' \
            -f target_url="$RUN_URL" >/dev/null
          gh pr comment "$PR_NUMBER" --body "RINNE Dispatch: QUEUED FOR CHATGPT WORK\n\nbranch: \`$HEAD_REF\`\ncommit: \`$HEAD_SHA\`\nPR: $PR_URL\n\nThis repository workflow performs handoff validation only. It does not invoke the OpenAI API, does not use \`OPENAI_API_KEY\`, and does not incur platform API credits. A configured ChatGPT Work GitHub pull-request event task owns implementation on this same Draft PR/branch."
