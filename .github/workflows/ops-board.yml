name: Rinne Ops Board

on:
  push:
    branches:
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
    paths:
      - 'ops-board/**'
      - 'scripts/application-catalog.mjs'
      - 'apps/*/package.json'
      - 'tests/pulse-*.test.mjs'
      - 'wrangler.ops.jsonc'
      - '.github/workflows/ops-board.yml'
      - 'tests/ops-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rinne-ops-board
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fast PULSE verification
        run: |
          node --check ops-board/model.mjs
          node --check ops-board/pulls.mjs
          node --check ops-board/applications.mjs
          node --check ops-board/worker.mjs
          node --check ops-board/deployment-url.mjs
          node --check ops-board/public/app.js
          node --check ops-board/public/app-board.js
          node --check ops-board/public/pull-board.js
          node --test tests/ops-board.test.mjs tests/ops-applications.test.mjs tests/pulse-*.test.mjs
          grep -q '<title>PULSE</title>' ops-board/public/index.html
          grep -q 'favicon.svg' ops-board/public/index.html
          grep -q '要対応タスク' ops-board/public/index.html
          grep -q '公開・自動処理の状態' ops-board/public/index.html
          grep -q 'diagnostic-grid' ops-board/public/index.html
          grep -q 'アプリ別の公開状況' ops-board/public/index.html
          grep -q 'ゲーム / 専用開発版' ops-board/public/app-board.js
          grep -q 'APP_ICONS' ops-board/public/app-board.js
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' ops-board/public/app-board.css
          test -f ops-board/public/icons/rinne.svg
          test -f ops-board/public/icons/village.svg
          test -f ops-board/public/icons/demon.svg
          test -f ops-board/public/icons/wayfinder.svg
          ! grep -q 'summary-grid' ops-board/public/index.html
          ! grep -q 'rel="manifest"' ops-board/public/index.html
          test ! -e ops-board/public/manifest.webmanifest
      - name: Derive server-only refresh credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          refresh_token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$refresh_token"
          echo "OPS_REFRESH_TOKEN=$refresh_token" >> "$GITHUB_ENV"
      - name: Deploy PULSE to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.ops.jsonc --var "OPS_REFRESH_TOKEN:$OPS_REFRESH_TOKEN"
      - name: Use stable Workers URL
        id: public
        if: steps.deploy.outcome == 'success'
        run: |
          echo "url=https://rinne-ops.c-okamoto.workers.dev/" >> "$GITHUB_OUTPUT"
          echo "PULSE: https://rinne-ops.c-okamoto.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
      - name: Prime GitHub-backed state immediately
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
        run: |
          curl -fsS --retry 2 -X POST \
            -H "Authorization: Bearer $OPS_REFRESH_TOKEN" \
            "${OPS_URL}api/refresh" >/dev/null
      - name: Verify public PULSE and application matrix
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
        run: |
          page=$(curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}")
          printf '%s' "$page" | grep -q '<title>PULSE</title>'
          printf '%s' "$page" | grep -q '要対応タスク'
          printf '%s' "$page" | grep -q '公開・自動処理の状態'
          printf '%s' "$page" | grep -q 'diagnostic-grid'
          ! printf '%s' "$page" | grep -q 'summary-grid'
          ! printf '%s' "$page" | grep -q 'rel="manifest"'
          curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}favicon.svg" | grep -q '<svg'
          curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}icons/rinne.svg" | grep -q '<svg'
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch(`${process.env.OPS_URL}api/state`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200);
          const x = await response.json();
          assert.equal(x.repository, 'charukun/soul-lineage');
          for (const list of [x.environments, x.pullRequests?.normal, x.pullRequests?.visualReview, x.applications]) assert.ok(Array.isArray(list));
          for (const [id, name] of Object.entries({ rinne: '輪廻転焦', demon: '尽喰廻遊', village: 'MURAAAAAAA', portal: 'WAYFINDER', 'ops-board': 'PULSE' })) {
            const app = x.applications.find(a => a.id === id);
            assert.equal(app?.name, name, `${id} display name`);
            if (app.kind === 'game') assert.deepEqual(app.targets.map(t => t.environment), ['dev', 'staging', 'prod']);
          }
          const visual = x.applications.find(a => a.id === 'visual-review');
          if (visual) assert.equal(visual.name, 'Visual Review Lab');
          console.log('PULSE_PUBLIC_VERIFIED', JSON.stringify(x.applications.map(({id,name,targets}) => ({id,name,targets:targets.map(({environment,state,url,commit})=>({environment,state,url,commit}))}))));
          JS
      - name: Record public PULSE status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.public.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="PULSE deployment failed"
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PUBLIC_URL" ]; then
            state=success
            description="PULSE is live; names and environment matrix verified"
            target_url="$PUBLIC_URL"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=ops-board/public \
            -f description="$description" \
            -f target_url="$target_url"
