name: Rinne Ops Board

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
    paths:
      - 'ops-board/**'
      - 'scripts/application-catalog.mjs'
      - 'scripts/integration-rescue-*.mjs'
      - 'wrangler.rescue-watchdog.jsonc'
      - 'tests/fixtures/integration-rescue-state.mjs'
      - 'apps/*/package.json'
      - 'tests/pulse-*.test.mjs'
      - 'wrangler.ops.jsonc'
      - '.github/workflows/ops-board.yml'
      - 'tests/ops-*.test.mjs'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

env:
  OPS_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: rinne-ops-board-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan PULSE publication
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      relevant_count: ${{ steps.plan.outputs.relevant_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.OPS_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compare current source with the deployed PULSE runtime
        id: plan
        env:
          OPS_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
            echo 'relevant_count=manual' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(curl -fsS --connect-timeout 5 --max-time 15 "${OPS_URL}api/version" 2>/dev/null | node --input-type=module -e "let s='';for await(const c of process.stdin)s+=c;try{const v=JSON.parse(s);if(/^[0-9a-f]{40}$/.test(v.commit||''))process.stdout.write(v.commit)}catch{}" || true)
          if ! [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'PULSE deployed source is unavailable; deploy conservatively.'
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
            echo 'relevant_count=unknown' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$deployed" || true
          fi
          node ops-board/publication-plan.mjs "$deployed" "$OPS_SOURCE_SHA"

  verify:
    name: PULSE verification
    needs: plan
    if: needs.plan.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.OPS_SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fast PULSE verification
        run: |
          for file in ops-board/*.mjs ops-board/public/*.js ops-board/public/*.mjs; do node --check "$file"; done
          node --test tests/ops-*.test.mjs tests/pulse-*.test.mjs
          grep -q '<title>PULSE</title>' ops-board/public/index.html
          grep -q 'favicon.svg' ops-board/public/index.html
          grep -q '要対応タスク' ops-board/public/index.html
          grep -q '技術詳細' ops-board/public/index.html
          grep -q 'diagnostic-grid' ops-board/public/index.html
          grep -q 'アプリの公開状況' ops-board/public/index.html
          grep -q 'ゲーム / 専用開発版' ops-board/public/app-board.js
          grep -q 'APP_ICONS' ops-board/public/app-board.js
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' ops-board/public/app-board.css
          for icon in rinne village demon lanternfell visual-review wayfinder ops-board default; do test -f "ops-board/public/icons/$icon.svg"; done
          ! grep -q 'summary-grid' ops-board/public/index.html
          ! grep -q 'rel="manifest"' ops-board/public/index.html
          ! grep -q 'api.github.com' ops-board/public/pull-board.js
          test ! -e ops-board/public/manifest.webmanifest
      - name: Prepare focused UI verification
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify changed interactions before publication
        env:
          OPS_URL: http://127.0.0.1:8765/
          OPS_FIXTURE: '1'
          OPS_REPORT_DIR: ops-review-results/preflight
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ops-board/public > /tmp/ops-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do curl -fsS "$OPS_URL" >/dev/null && break; sleep 1; done
          node ops-board/browser-check.mjs
      - name: Verify Rescue cockpit with parallel/stale/manual fixtures on mobile
        run: node ops-board/rescue-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-board-preflight-review
          path: ops-review-results/
          retention-days: 7

  deploy:
    name: Publish PULSE
    needs: [plan, verify]
    if: github.ref == 'refs/heads/develop' && needs.plan.outputs.deploy_required == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.OPS_SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Reject stale publication source
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/branches/develop --jq .commit.sha)" = "$OPS_SOURCE_SHA"
      - name: Derive server-only refresh credential
        # Rescue fixtures run only in this local test harness; they are never deployed.
        id: refresh-credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          refresh_token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$refresh_token"
          echo "OPS_REFRESH_TOKEN=$refresh_token" >> "$GITHUB_ENV"
      - name: Stamp the actual publication source
        run: |
          node --input-type=module -e "import fs from 'node:fs';fs.writeFileSync('ops-board/public/version.json',JSON.stringify({app:'ops-board',commit:process.env.OPS_SOURCE_SHA,builtAt:new Date().toISOString()}))"
      - name: Deploy PULSE to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.ops.jsonc --var "OPS_REFRESH_TOKEN:$OPS_REFRESH_TOKEN" --var "OPS_BUILD_SHA:$OPS_SOURCE_SHA"
      - name: Use stable Workers URL
        id: public
        if: steps.deploy.outcome == 'success'
        run: |
          echo "url=https://rinne-ops.c-okamoto.workers.dev/" >> "$GITHUB_OUTPUT"
          echo "PULSE: https://rinne-ops.c-okamoto.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact Worker and Static Assets source after propagation
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
        run: node ops-board/publication-check.mjs version
      - name: Prime GitHub state and cached target attribution
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: node ops-board/prime.mjs
      - name: Verify public board and API
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
        run: |
          page=$(curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}")
          printf '%s' "$page" | grep -q '<title>PULSE</title>'
          printf '%s' "$page" | grep -q '要対応タスク'
          printf '%s' "$page" | grep -q '技術詳細'
          printf '%s' "$page" | grep -q 'diagnostic-grid'
          printf '%s' "$page" | grep -q 'sync-freshness'
          ! printf '%s' "$page" | grep -q 'summary-grid'
          ! printf '%s' "$page" | grep -q 'rel="manifest"'
          curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}favicon.svg" | grep -q '<svg'
          curl -fsS --retry 4 --retry-delay 2 "${OPS_URL}icons/rinne.svg" | grep -q '<svg'
          node ops-board/publication-check.mjs
      - name: Operate the deployed board with a mobile browser
        if: steps.public.outputs.url != ''
        env:
          OPS_URL: ${{ steps.public.outputs.url }}
          OPS_REPORT_DIR: ops-review-results/public
        run: node ops-board/browser-check.mjs
      - name: Record public Ops Board status
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.deploy.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.public.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="PULSE deployment or verification failed"
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PUBLIC_URL" ]; then
            state=success
            description="PULSE is live and browser-verified"
            target_url="$PUBLIC_URL"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$OPS_SOURCE_SHA" \
            -f state="$state" -f context=ops-board/public \
            -f description="$description" -f target_url="$target_url"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-board-focused-review
          path: ops-review-results/
          retention-days: 7

  refresh:
    name: Refresh existing PULSE state
    needs: plan
    if: github.ref == 'refs/heads/develop' && needs.plan.outputs.deploy_required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - name: Refresh state with this Actions token, without redeploying PULSE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OPS_URL: https://rinne-ops.c-okamoto.workers.dev/
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          refresh_token=$(printf '%s' "$CLOUDFLARE_API_TOKEN|$GITHUB_REPOSITORY|rinne-ops-refresh-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$refresh_token"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "${OPS_URL}api/refresh" \
            -H "Authorization: Bearer $refresh_token" \
            -H "x-ops-github-token: $GH_TOKEN" \
            -H 'x-ops-refresh-reason: deployment' \
            -o /tmp/pulse-refresh.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('/tmp/pulse-refresh.json','utf8'));
          if(s.repository!=='charukun/soul-lineage'||s.schemaVersion!==2||s.syncStatus!=='ok') throw new Error(`PULSE refresh not healthy: ${s.syncError||s.syncStatus||'invalid'}`);
          console.log(`PULSE refresh: ${s.githubApi?.scope||'?'} ${s.githubApi?.requests??'?'} requests, ${s.githubApi?.cacheHits??0} cache hits`);
          JS
      - name: Record reused PULSE runtime for this develop source
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ env.OPS_SOURCE_SHA }}
        with:
          script: |
            const success = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.SOURCE_SHA, context: 'ops-board/public',
              state: success ? 'success' : 'failure',
              description: success ? 'PULSE runtime unchanged; authenticated state refresh passed' : 'PULSE state refresh failed',
              target_url: success ? 'https://rinne-ops.c-okamoto.workers.dev/' : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
