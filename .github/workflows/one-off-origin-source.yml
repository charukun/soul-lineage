name: PR1222 one-time source materializer
on:
  push:
    branches: [feat/rinne-soul-origin-20260921]
permissions:
  contents: write
jobs:
  source:
    if: contains(github.event.head_commit.message, '[origin-materialize]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Transform pinned bulk runtime without changing refs
        run: node scripts/one-off-origin-source.mjs
      - name: Materialize source blobs for Connector tree assembly
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const paths = JSON.parse(await fs.readFile('/tmp/origin-materialized-paths.json','utf8'));
            const output=[];
            for(const path of paths){
              const content=await fs.readFile(path,'utf8');
              const {data}=await github.rest.git.createBlob({...context.repo,content,encoding:'utf-8'});
              output.push({path,sha:data.sha});
            }
            core.info('ORIGIN_MATERIALIZED_BLOBS '+JSON.stringify(output));
            await core.summary.addHeading('PR #1222 materialized source blobs').addCodeBlock(JSON.stringify({source:context.sha,files:output},null,2),'json').write();
