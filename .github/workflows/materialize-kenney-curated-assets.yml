name: Materialize curated Kenney assets
on:
  push:
    branches: [asset/kenney-world-audio-20260920]
permissions:
  contents: write
jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-kenney-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Materialize pinned upstream assets
        run: python3 .github/scripts/materialize-kenney-curated-assets.py
      - name: Verify generated asset contract
        run: |
          python3 -m py_compile .github/scripts/materialize-kenney-curated-assets.py
          git diff --check
      - name: Commit assets and remove one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/review/public/library apps/rinne/src apps/rinne/tests docs/ASSET_ORIGIN.md
          git rm .github/workflows/materialize-kenney-curated-assets.yml .github/scripts/materialize-kenney-curated-assets.py
          git commit -m "Materialize curated Kenney world and audio assets [astra-validate]" -m "Astra-Test: apps/rinne/tests/curated-asset-library.test.mjs" -m "Astra-Test: apps/rinne/tests/review-sound-catalog.test.mjs" -m "Astra-Build: rinne" -m "Astra-Build: review"
          git push origin HEAD
