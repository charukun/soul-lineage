name: One-shot BGM150 commercial render

on:
  push:
    branches:
      - fix/bgm150-commercial-clearance-20260918
    paths:
      - '.github/workflows/bgm150-commercial-render.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned renderer and SoundFont
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth ffmpeg musescore-general-soundfont-small=0.2.1-1
          fluidsynth -V
          ffmpeg -version | head -1
          dpkg-query -W -f='${Package}=${Version}\n' musescore-general-soundfont-small
      - name: Preserve license and source evidence
        run: |
          mkdir -p packages/audio/assets/licenses
          cp /usr/share/doc/musescore-general-soundfont-small/copyright packages/audio/assets/licenses/MuseScore_General_License.txt
          gzip -dc /usr/share/doc/musescore-general-soundfont-small/MuseScore_General_Sample_Sources.csv.gz > packages/audio/assets/licenses/MuseScore_General_Sample_Sources.csv
          rm -f packages/audio/assets/licenses/TimGM6mb_Copyright.txt packages/audio/assets/licenses/GPL-2.0.txt
      - name: Install repository dependencies
        run: npm ci
      - name: Render and validate 150 Production tracks
        run: |
          node packages/audio/tools/rerender-commercial.mjs \
            --soundfont /usr/share/sounds/sf3/MuseScore_General_Lite.sf3 \
            --license packages/audio/assets/licenses/MuseScore_General_License.txt \
            --sample-sources packages/audio/assets/licenses/MuseScore_General_Sample_Sources.csv \
            --soundfont-url https://packages.ubuntu.com/noble/musescore-general-soundfont-small \
            --license-url https://sources.debian.org/copyright/license/musescore-general-soundfont-small/0.2.1-1/ \
            --sample-sources-url https://packages.debian.org/bookworm/all/musescore-general-soundfont-small/filelist \
            --source-package musescore-general-soundfont-small=0.2.1-1
          node --test packages/audio/tests/source-midi.test.mjs packages/audio/tests/catalog.test.mjs
          git diff --check
      - name: Persist generated Production audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bgm150-commercial-render.yml
          git add packages/audio
          git commit -m 'fix(audio): replace audition renders with MIT-cleared BGM'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Reconcile current develop
        run: |
          git fetch origin develop
          git merge --no-edit origin/develop
      - name: Validate reconciled BGM consumers
        run: |
          node --test packages/audio/tests/source-midi.test.mjs packages/audio/tests/catalog.test.mjs
          npm run build:rinne
          npm run build:village
          npm run build:demon
          git diff --check
      - name: Push reconciled head
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
