<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>Rinne Ops Board</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">輪廻転焦 / Development Operations</p>
        <h1>Rinne Ops Board</h1>
      </div>
      <button id="reload" class="reload" type="button">再読込</button>
    </header>

    <section id="hero" class="hero skeleton" aria-live="polite">
      <div class="hero-status"><span class="dot"></span><strong>同期中</strong></div>
      <p>GitHub / 公開環境の正本を確認しています</p>
    </section>

    <section id="alerts" class="alerts" hidden></section>

    <section>
      <div class="section-head"><h2>公開環境</h2><span id="env-count" class="muted"></span></div>
      <div id="environments" class="stack"></div>
    </section>

    <section>
      <div class="section-head"><h2>環境差分</h2></div>
      <div id="diff" class="card"></div>
    </section>

    <section>
      <div class="section-head"><h2>Integration</h2></div>
      <div id="integration" class="card"></div>
    </section>

    <section>
      <div class="section-head"><h2>Actions / 障害</h2></div>
      <div id="failures" class="card"></div>
    </section>

    <footer>
      <p id="last-updated">最終更新: --</p>
      <p id="source" class="muted">GitHub API / deployment manifests</p>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
