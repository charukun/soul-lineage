<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>Character References · PULSE</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./character-references.css">
</head>
<body>
  <main class="shell reference-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PULSE / CHARACTER LIBRARY</p>
        <h1>キャラクターリファレンス</h1>
      </div>
      <div class="refresh-area"><button id="reload" class="reload" type="button">最新に更新</button>
        <p id="sync-freshness" class="sync-freshness" role="status">最終取得 未取得</p></div>
    </header>

    <nav class="reference-nav" aria-label="PULSE ナビゲーション">
      <a href="./index.html">← PULSEへ戻る</a>
      <a href="https://github.com/charukun/soul-lineage/tree/develop/docs/characters/references" target="_blank" rel="noreferrer">Repository</a>
    </nav>

    <section class="reference-intro card">
      <div><p class="reference-kicker">SOURCE OF TRUTH</p><strong>docs/characters/references/</strong></div>
      <p>Repositoryに置かれているキャラクターReferenceを、セット単位で一覧表示します。画像をタップすると原寸を開けます。</p>
      <div class="reference-summary"><span id="reference-count">確認中</span><span id="reference-state" class="muted"></span></div>
    </section>

    <section id="reference-groups" class="reference-groups" aria-live="polite">
      <div class="card"><p class="empty">キャラクターリファレンスを確認中</p></div>
    </section>

    <footer>
      <p id="last-updated">最終更新: --</p>
      <p id="source" class="muted">PULSE同期データから取得</p>
    </footer>
  </main>
  <script type="module" src="./character-references.js"></script>
</body>
</html>
