<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>PULSE Iterations</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./iterations.css">
</head>
<body>
  <main class="iteration-shell">
    <header class="iteration-topbar">
      <div>
        <a class="iteration-back" href="./">← PULSE</a>
        <p class="iteration-eyebrow">AUTONOMOUS DEVELOPMENT</p>
        <h1>ITERATIONS</h1>
        <p class="iteration-lead">1 iteration単位で、改修内容・現在地・各stepの所要時間を確認します。</p>
      </div>
      <button id="reload" class="iteration-reload" type="button">再読込</button>
    </header>

    <section class="iteration-summary" aria-label="イテレーション集計">
      <div><span>進行中</span><strong id="iteration-running-count">--</strong></div>
      <div><span>完了</span><strong id="iteration-complete-count">--</strong></div>
      <div><span>並行Session</span><strong id="iteration-session-count">--</strong></div>
      <div><span>最終同期</span><strong id="iteration-updated-at">--</strong></div>
    </section>

    <section class="iteration-toolbar" aria-label="表示フィルタ">
      <label>Game
        <select id="iteration-game-filter">
          <option value="all">すべて</option>
          <option value="kuumetsu">喰滅廻遊</option>
          <option value="rinne">百年転生</option>
          <option value="village">村づくり</option>
        </select>
      </label>
      <label>Status
        <select id="iteration-status-filter">
          <option value="all">すべて</option>
          <option value="active">進行中</option>
          <option value="problem">異常</option>
          <option value="complete">完了</option>
        </select>
      </label>
    </section>

    <div id="iteration-sync-state" class="iteration-sync-state" role="status" aria-live="polite">状態を取得しています</div>
    <section id="iteration-list" class="iteration-list" aria-label="自律イテレーション一覧"></section>
  </main>
  <script type="module" src="./iterations.js"></script>
</body>
</html>
