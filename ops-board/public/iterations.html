<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>PULSE 自律改善</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./iterations.css">
  <link rel="stylesheet" href="./iteration-summary.css" data-iteration-readable-style>
</head>
<body>
  <main class="iteration-shell">
    <header class="iteration-topbar">
      <div>
        <a class="iteration-back" href="./">← PULSE</a>
        <p class="iteration-eyebrow">改善の記録と現在地</p>
        <h1>自律改善</h1>
        <p class="iteration-lead">何を改善し、どこまで進み、次に何を確認するか。反映結果と公開状況を分けて表示します。</p>
      </div>
      <button id="reload" class="iteration-reload" type="button">再読込</button>
    </header>
    <section class="iteration-summary" aria-label="取得した改善記録の内訳">
      <div><span>実行中</span><strong id="iteration-running-count">--</strong></div>
      <div><span>待機・未確認</span><strong id="iteration-waiting-count">--</strong></div>
      <div><span>要対応</span><strong id="iteration-problem-count">--</strong></div>
      <div><span>取込済み</span><strong id="iteration-complete-count">--</strong></div>
      <div><span>実行IDの記録数</span><strong id="iteration-session-count">--</strong></div>
      <div><span>最終同期</span><strong id="iteration-updated-at">--</strong></div>
    </section>
    <section class="iteration-toolbar" aria-label="表示フィルタ">
      <label>ゲーム
        <select id="iteration-game-filter">
          <option value="all">すべて</option>
          <option value="kuumetsu">喰滅廻遊</option>
          <option value="rinne">百年転生</option>
          <option value="village">村づくり</option>
        </select>
      </label>
      <label>状態
        <select id="iteration-status-filter">
          <option value="all">すべて</option>
          <option value="active">未反映すべて</option>
          <option value="running">実行中</option>
          <option value="waiting">待機・未確認</option>
          <option value="problem">要対応</option>
          <option value="complete">develop反映済み</option>
        </select>
      </label>
    </section>
    <div id="iteration-sync-state" class="iteration-sync-state" role="status" aria-live="polite">状態を取得しています</div>
    <section id="iteration-list" class="iteration-list" aria-label="自律イテレーション一覧"></section>
  </main>
  <script type="module" src="./iterations.js"></script>
</body>
</html>
