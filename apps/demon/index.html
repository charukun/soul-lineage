<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png?v=1"><link rel="icon" type="image/svg+xml" sizes="any" href="./icons/app-icon.svg?v=1"><meta name="theme-color" content="#090708"><title>尽喰廻遊 | 人間狩りの夜</title><link rel="stylesheet" href="./src/web/style.css">
<link rel="stylesheet" href="./src/web/play-clarity.css"><link rel="stylesheet" href="./src/web/title-ominous.css"></head><body>
<canvas id="game" aria-label="狩場。指を滑らせて移動します。"></canvas><div class="vignette"></div><div class="grain"></div><div id="labels"></div>
<div id="boot"><div class="sigil">◈</div><p id="boot-message">夜をひらいています</p><progress id="boot-progress" max="3" value="0" aria-label="読み込み進捗"></progress><small id="boot-detail">狩場と記憶を読み込みます</small><button id="boot-retry" hidden>再試行</button><a href="../rinne/">輪廻転焦へ</a></div>
<section id="title" hidden><div class="title-top"><span>輪廻転焦 外伝</span><button id="connection" class="text-button">単独狩り · 接続なし</button></div><div class="brand"><small>DEVOUR · WANDER · RETURN</small><h1 aria-label="尽喰廻遊"><span class="brand-kanji">尽喰</span><span class="brand-kanji brand-kanji-lower">廻遊</span></h1><div class="brand-curse" aria-hidden="true">喰　廻　喰　廻　喰</div><p>喰らい尽くせ。夜は、まだ廻る。</p></div><div class="title-actions"><p class="whisper">喰らった命が、次の夜を穢す。</p><button id="begin" class="primary">狩夜へ<span>◈</span></button><button id="title-character" class="text-button">狩る姿 · 夜の魔物</button><div class="title-links"><button id="title-memory">肉体の記憶</button><button id="title-settings">記録と連携</button></div><small class="one-way">一度喰らった村へは、二度と戻れない。</small></div><div class="build"><img id="emblem" alt="輪廻転焦の紋章"> 尽喰廻遊 · NIGHT HUNT 2.0 · WEBGL / TIDEBREAK CORE</div></section>
<section id="hud" hidden><header><div class="life"><span id="form-name">虚ろ仔</span><div class="life-track"><i id="life-fill"></i></div><small id="life-text"></small></div><div class="location"><small id="night-label"></small><b id="village-name"></b></div><button id="pause" class="small-button" aria-label="一時停止">Ⅱ</button></header><div class="danger"><div id="alarm-fill"></div><span id="alarm-label">まだ、気づかれていない</span></div><div id="objective"><small>今夜の獲物</small><span></span><p id="first-hunt-guide" role="status" aria-live="polite" hidden></p></div><div id="battle"><div class="phases"><span data-phase="jo">序</span><i></i><span data-phase="ha">破</span><i></i><span data-phase="kyu">急</span></div><div id="enemy-name"></div><div id="skill-name"></div><div id="enemy-health-track" aria-label="敵の生命"><div id="enemy-health"></div></div></div><div id="toast" role="status"></div><div id="swipe-hint">指を滑らせて移動 · 素早く弾くと走る</div><div id="return-hint" hidden></div><div class="controls"><button id="scent" class="seal"><b>嗅</b><span>嗅覚</span></button><button id="memory" class="seal secondary"><b>憶</b><span>肉体</span></button><button id="return" class="seal locked" aria-disabled="true"><b id="return-arrow">×</b><span id="return-label">捕食後</span></button></div><button id="dash-stop" hidden>走るのをやめる</button><div class="footer-status"><span id="eaten-label"></span><span>単独狩り</span></div></section>
<div id="move-pad" hidden><div></div><i id="move-nub"></i></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-content"><div class="sheet-heading"><small id="sheet-kicker"></small><button id="sheet-close" aria-label="閉じる">×</button></div><h2 id="sheet-title"></h2><div id="sheet-body"></div></div></div>
<div id="drag-ghost" hidden></div><input type="file" id="import-file" accept="application/json,.json" hidden><script type="module" src="./src/main.js"></script></body></html>
