<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1110"><title>デザインギャラリー · Visual Review Lab</title><link rel="stylesheet" href="./src/gallery.css"></head>
<body><main class="gallery">
<header><a href="./">← Visual Review Lab</a><small>DESIGN REFERENCES · DEVELOP</small><h1>デザインギャラリー</h1><p>実装前のキャラクター、風景、プレイ画面のラフを並べて確認する。</p></header>
<section class="toolbar" aria-label="表示の絞り込み"><label>ゲーム<select id="game-filter"><option value="">すべて</option><option value="rinne">百年転生</option><option value="village">宝満叡智</option><option value="demon">喰滅廻遊</option><option value="shared">共通</option></select></label><label>種別<select id="kind-filter"><option value="">すべて</option><option value="character">キャラクター</option><option value="scene">プレイ画面</option><option value="interface">UI</option><option value="world">世界観</option><option value="other">その他</option></select></label><button id="add-button" type="button">＋ 画像を追加</button></section>
<p id="status" role="status" aria-live="polite"></p><section id="gallery-grid" class="gallery-grid" aria-label="デザイン画像"></section>
<dialog id="upload"><form id="upload-form"><h2>画像を追加</h2><label>画像（PNG・JPEG・WebP、5MBまで）<input name="image" type="file" accept="image/png,image/jpeg,image/webp" multiple required></label><label>タイトル<input name="title" maxlength="80" placeholder="空欄ならファイル名" autocomplete="off"></label><label>対象ゲーム<select name="game"><option value="rinne">百年転生</option><option value="village">宝満叡智</option><option value="demon">喰滅廻遊</option><option value="shared">共通</option></select></label><label>種別<select name="kind"><option value="character">キャラクター</option><option value="scene">プレイ画面</option><option value="interface">UI</option><option value="world">世界観</option><option value="other">その他</option></select></label><label>メモ<textarea name="note" maxlength="500" rows="3"></textarea></label><p id="upload-progress" role="status"></p><div class="actions"><button type="button" data-close="upload">キャンセル</button><button type="submit">追加する</button></div></form></dialog>
<dialog id="viewer"><div class="viewer-head"><button type="button" data-close="viewer" aria-label="閉じる">×</button><strong id="viewer-title"></strong><button type="button" id="delete-button">画像を削除</button></div><div class="viewer-stage"><button type="button" id="previous" aria-label="前の画像">‹</button><img id="viewer-image" alt=""><button type="button" id="next" aria-label="次の画像">›</button></div><p id="viewer-meta"></p><p id="viewer-note"></p></dialog>
</main><script type="module" src="./src/gallery.js"></script></body></html>
