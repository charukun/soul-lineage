<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f0e">
<title>Visual Review｜序破急バトル</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./src/battle2.css"><link rel="stylesheet" href="./src/nocturne/johakyu-p7-readout.css">
</head>
<body>
<main class="battle2-review review-surface review-workbench" aria-label="序破急バトルレビュー">
<header class="battle-bar review-surface__header"><div class="review-surface__title"><a class="review-surface__back" href="./" aria-label="Visual Reviewへ戻る">‹ 戻る</a><div><span class="review-surface__eyebrow">NOCTURNE RUNTIME PROBE</span><h1>序破急バトル</h1></div></div><span id="battle2-version" class="battle2-version" aria-label="ビルドバージョン"></span></header>
<section class="review-surface__workspace">
<div class="review-surface__stage-column"><section class="nocturne-stage review-surface__stage" data-review-surface="battle2" data-runtime="nocturne-native" data-state="BOOT">
<canvas id="world" aria-label="序破急 canonical 自動戦闘"></canvas><canvas id="effects" aria-hidden="true"></canvas><div class="nocturne-vignette" aria-hidden="true"></div>
<button id="battle2-start" class="battle2-start" type="button" disabled aria-describedby="battle2-status"><span>タップで開始</span><small>音を有効にして戦闘を開始</small></button>
<div id="battle-sequence-hud" class="battle-sequence-hud" aria-live="polite" hidden>
<aside id="battle-phase" class="battle-sequence-hud__phase combat-sequence combat-sequence--flat" data-combat-sequence data-combat-sequence-phase="idle" data-phase="idle" aria-label="間合いから残心までの序破急">
<span class="battle-sequence-hud__edge battle-sequence-hud__edge--maai" aria-hidden="true"><svg viewBox="0 0 38 14" focusable="false"><path d="M1 7h7c3 0 3-5 6-5s3 10 6 10 3-8 6-8 3 3 5 3h6"/></svg></span><span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="jo" data-active="false">序</span><i class="battle-sequence-hud__wave combat-sequence__link" data-combat-link="jo-ha" aria-hidden="true"></i><span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="ha" data-active="false">破</span><i class="battle-sequence-hud__wave combat-sequence__link" data-combat-link="ha-kyu" aria-hidden="true"></i><span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="kyu" data-active="false">急</span><span class="battle-sequence-hud__edge battle-sequence-hud__edge--zanshin" aria-hidden="true"><svg viewBox="0 0 38 14" focusable="false"><path d="M1 7h6c2 0 2-3 5-3s3 8 6 8 3-10 6-10 3 5 6 5h7"/></svg></span>
</aside>
<strong id="battle-sequence-current" class="battle-sequence-current" data-kind="idle"></strong>
<div id="battle-sequence-history" class="battle-sequence-history" aria-label="使用した技と動作の履歴"></div>
</div>
<p id="battle2-status" role="status" aria-live="polite">戦闘を準備中…</p>
</section></div>
<section class="controls review-surface__panel review-workbench__panel-host" aria-label="戦闘人数の切替"><div class="battle-stage-switch"><div class="battle-mode-switch" role="group" aria-label="戦闘人数"><button type="button" data-battle-mode="duel" aria-pressed="true">1v1</button><button type="button" data-battle-mode="oneVsThree" aria-pressed="false">1v3</button></div></div></section>
</section>
</main>
<script type="module" src="./src/battle2-shell.js"></script><script type="module" src="./src/nocturne-stage.js"></script>
</body></html>
