<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f0e">
<title>Visual Review｜序破急バトル</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./src/battle2.css"><link rel="stylesheet" href="./src/nocturne/johakyu-p7-readout.css">
</head>
<body>
<main class="battle2-review review-surface review-workbench" aria-label="序破急バトルレビュー">
<header class="battle-bar review-surface__header"><div class="review-surface__title"><a class="review-surface__back" href="./" aria-label="Visual Reviewへ戻る">‹ 戻る</a><div><span class="review-surface__eyebrow">NOCTURNE RUNTIME PROBE</span><h1>序破急バトル</h1></div></div><span id="battle2-version" class="battle2-version" aria-label="ビルドバージョン"></span></header>
<section class="review-surface__workspace">
<div class="review-surface__stage-column"><section class="nocturne-stage review-surface__stage" data-review-surface="battle2" data-runtime="nocturne-native" data-state="BOOT">
<canvas id="world" aria-label="序破急 canonical 自動戦闘"></canvas><canvas id="effects" aria-hidden="true"></canvas><div class="nocturne-vignette" aria-hidden="true"></div>
<div class="battle2-camera-control-host" data-battle2-camera-host aria-label="カメラ操作"></div>
<aside id="battle2-player-hud" class="battle2-player-hud-host" aria-label="プレイヤー情報HUD"></aside>
<aside id="battle2-body-hud" class="battle2-body-hud-host" aria-label="プレイヤー身体部位HUD" hidden></aside>
<aside id="battle2-inspiration" class="battle2-inspiration" role="status" aria-live="assertive" hidden><b aria-hidden="true">閃</b><strong id="battle2-inspiration-name"></strong></aside>
<button id="battle2-start" class="battle2-start" type="button" disabled aria-describedby="battle2-status"><span>タップで開始</span><small>音を有効にして戦闘を開始</small></button>
<div id="battle-sequence-mount"></div>
<p id="battle2-status" role="status" aria-live="polite">戦闘を準備中…</p>
</section></div>
<div class="battle-stage-switch" data-review-stage-control data-battle-mode-control><span class="battle-stage-setting__label">戦闘人数</span><div class="battle-mode-switch" role="group" aria-label="戦闘人数"><button type="button" data-battle-mode="duel" aria-pressed="true">1v1</button><button type="button" data-battle-mode="oneVsThree" aria-pressed="false">1v3</button></div></div>
<div class="battle-stage-switch" data-review-stage-control data-battle-technique-mode-control><span class="battle-stage-setting__label">技使用</span><div class="battle-mode-switch" role="group" aria-label="技使用"><button type="button" data-battle-technique-mode="random" aria-pressed="false">ランダム</button><button type="button" data-battle-technique-mode="set" aria-pressed="true">設定技</button></div></div>
<div class="battle-stage-switch" data-review-stage-control data-battle-inspiration-rate-control><span class="battle-stage-setting__label">閃き確率</span><div class="battle-mode-switch" role="group" aria-label="閃き確率"><button type="button" data-battle-inspiration-rate="normal" aria-pressed="true">通常</button><button type="button" data-battle-inspiration-rate="high" aria-pressed="false">高確率</button></div></div>
</section>
</main>
<script type="module" src="./src/battle2-shell.js"></script><script type="module" src="./src/nocturne-stage.js"></script>
</body></html>
