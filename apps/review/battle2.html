<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<title>Visual Review｜序破急バトルシステム</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/battle2.css">
</head>
<body>
<main class="battle2-review review-surface" aria-label="序破急バトルシステムレビュー">
  <header class="battle-bar review-surface__header">
    <div class="review-surface__title">
      <a class="review-surface__back" href="./" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <div><span class="review-surface__eyebrow">NOCTURNE RUNTIME PROBE</span><h1>序破急バトルシステム</h1></div>
    </div>
  </header>
  <section class="review-surface__workspace" aria-label="戦闘描画エリア">
    <div class="review-surface__stage-column">
      <section class="nocturne-stage review-surface__stage" data-review-surface="battle2" data-runtime="nocturne-native" data-state="BOOT">
        <canvas id="world" aria-label="NOCTURNE 自動戦闘"></canvas>
        <canvas id="effects" aria-hidden="true"></canvas>
        <div class="nocturne-vignette" aria-hidden="true"></div>
        <p id="battle2-status" role="status" aria-live="polite">戦闘を準備中…</p>
      </section>
    </div>
  </section>
</main>
<script type="module" src="./src/battle2-shell.js"></script>
<script type="module" src="./src/nocturne-stage.js"></script>
</body>
</html>
