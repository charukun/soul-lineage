<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>img2threejs · 単体モデル確認</title>
<style>body{margin:0;background:#e6e7e6;font:14px system-ui;color:#243038}main{display:grid;grid-template-columns:minmax(230px,1fr) minmax(230px,1fr);gap:12px;max-width:1150px;margin:auto;padding:12px}figure{margin:0;min-width:0;background:white;border-radius:12px;overflow:hidden}figcaption{padding:10px}img{display:block;width:100%;height:min(80vh,900px);object-fit:contain}canvas{display:block;width:100%;height:min(80vh,900px)}nav{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 16px}small{grid-column:1/-1}@media(max-width:650px){main{grid-template-columns:1fr 1fr}img,canvas{height:70vh}}</style></head><body><main><nav><button data-view="front">正面</button><button data-view="right">右側</button><button data-view="back">背面</button><button data-view="left">左側</button><button data-view="three-quarter">斜め</button><button id="spin">360°回転</button></nav><figure><img src="/img2threejs-bald-chibi/reference.jpg" alt="参照画像"><figcaption>添付画像 · 正面のみ観測</figcaption></figure><figure><canvas id="model"></canvas><figcaption id="status">モデル生成中…</figcaption></figure><small>左右・背面と奥行きは一枚の正面像から推定。ドラッグでも回転できます。</small></main><script type="module" src="/src/img2threejs-preview.js"></script></body></html>
