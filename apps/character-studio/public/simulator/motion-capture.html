<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18252b">
<title>Shino Motion Capture | 輪廻転焦 QA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18252b;color:#e8eef0;font-family:system-ui,sans-serif}
main{position:relative;width:100%;height:100%}
#motion-capture-stage{display:block;width:100%;height:100%;touch-action:none}
#motion-capture-status{position:absolute;left:18px;top:14px;margin:0;padding:6px 9px;border-radius:4px;background:#0d171bcc;font-size:12px;letter-spacing:.03em;pointer-events:none}
#motion-capture-status[data-ready="true"]{color:#b9ead9}
</style>
</head>
<body>
<main>
<canvas id="motion-capture-stage" width="1280" height="720" aria-label="しのちゃん30秒演武 録画用WebGL"></canvas>
<p id="motion-capture-status" data-ready="false">しのちゃんを準備中</p>
</main>
<script type="module" src="./src/motion-capture.js"></script>
</body>
</html>
