<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml">
<title>Visual Review｜戦闘演出</title>
<link rel="stylesheet" href="./src/typography.css">
<link rel="stylesheet" href="./src/review-battle.css">
</head>
<body>
<main class="battle-review review-surface review-workbench" aria-label="戦闘演出レビュー。攻撃・被弾・身体部位・技・連・序破急の実演を確認します。本編の閃き判定や保存データは変更しません。">
  <header class="battle-bar review-surface__header">
    <div class="review-surface__title">
      <a class="review-surface__back" href="https://soul-lineage-review-dev.c-okamoto.workers.dev/" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <div><span class="review-surface__eyebrow">RINNE RUNTIME PROBE</span><h1>戦闘演出</h1></div>
    </div>
    <div class="battle-state"><strong id="battle-result">準備中</strong><span id="battle-time">0.0秒</span><button id="battle-sound" type="button" data-enabled="true" aria-pressed="true" aria-label="戦闘音の切替">音</button></div>
  </header>
  <section class="review-surface__workspace">
  <div class="review-surface__stage-column">
  <section class="stage review-surface__stage" data-review-stage-panel-host=".controls.review-surface__panel">
    <canvas id="battle-canvas" aria-label="実モデルで動くTidebreak自動戦闘"></canvas>
    <aside id="battle-body-hud" class="combat-body-hud-host" aria-label="プレイヤー身体部位HUD"></aside>
    <output id="battle-model-status" class="model-status" role="status">モデル準備中</output>
    <span class="note">Tidebreak接触同期</span>
    <output id="battle-sign" class="battle-sign" role="status" aria-live="polite" hidden></output>
    <output id="battle-lightbulb" class="battle-lightbulb" role="status" aria-label="閃きの予兆" hidden></output>
    <aside id="battle-inspiration" class="battle-inspiration" role="status" aria-live="assertive" hidden><span class="battle-inspiration-mark" aria-hidden="true">閃</span><strong id="battle-inspiration-name"></strong><small id="battle-inspiration-phase"></small></aside>
    <div id="battle-sequence-hud" class="battle-sequence-hud" aria-live="polite">
      <aside id="battle-phase" class="battle-sequence-hud__phase combat-sequence combat-sequence--flat" data-combat-sequence data-combat-sequence-phase="idle" data-phase="idle" aria-label="序破急の現在状態">
        <span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="jo" data-active="false">序</span>
        <i class="battle-sequence-hud__wave combat-sequence__link" data-combat-link="jo-ha" aria-hidden="true"></i>
        <span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="ha" data-active="false">破</span>
        <i class="battle-sequence-hud__wave combat-sequence__link" data-combat-link="ha-kyu" aria-hidden="true"></i>
        <span class="battle-sequence-hud__step combat-sequence__step" data-combat-phase="kyu" data-active="false">急</span>
      </aside>
      <strong id="battle-sequence-current" class="battle-sequence-current" data-kind="idle">間合いを測っている…</strong>
    </div>
    <div id="battle-technique-composition" class="technique-composition" aria-label="段・技・連・序破急の構成"></div>
    <section id="battle-inspiration-history" class="inspiration-history" aria-label="閃いた技の履歴" hidden>
      <header><div><span>閃き履歴</span><strong>この戦闘で閃いた技</strong></div><button id="battle-history-close" type="button" aria-label="閃き履歴を閉じる">閉じる</button></header>
      <div id="battle-inspiration-history-list" class="inspiration-history__list"></div>
    </section>
  </section>
  </div>
  <section class="controls review-surface__panel review-workbench__panel-host">
    <div class="inspiration-mode" role="group" aria-label="閃き確認モード"><button type="button" data-inspiration-mode="normal" aria-pressed="true">通常</button><button type="button" data-inspiration-mode="boost" aria-pressed="false">閃き 高確率</button></div>
    <div class="battle-stage-switch" aria-label="戦闘人数の切替"><div class="battle-mode-switch" role="group" aria-label="戦闘人数"><button type="button" data-battle-mode="duel" aria-pressed="true">1v1</button><button type="button" data-battle-mode="one-v-three" aria-pressed="false">1v3</button></div></div>
    <div class="battle-shortcuts">
      <button id="battle-history-open" class="battle-history-open" type="button">閃き履歴 <span id="battle-history-count">0</span></button>
    <details class="review-settings" data-review-stage-control>
      <summary>設定 <small>モデル・人数・カメラ</small></summary>
      <div class="review-settings-body">
        <div class="pickers">
          <div class="hero-model-lock" aria-label="左モデルは主人公固定"><span>左モデル</span><strong>主人公</strong></div>
          <div class="hero-model-lock"><span>敵モデル</span><strong>スケルトン</strong></div><label class="weapon-picker">所持武器<select id="battle-weapon"><option value="sword">剣</option><option value="dagger">短剣</option><option value="spear">槍</option><option value="great">大剣</option><option value="axe">戦斧</option><option value="staff">杖</option><option value="fist">徒手</option></select></label>
        </div>
        <div class="choreography-review-settings" aria-label="殺陣検証設定">
          <label>戦略A<select id="battle-strategy-a"><option value="balanced">均衡</option><option value="aggressive">攻勢</option><option value="patient">慎重</option><option value="counter">返し</option><option value="evasive">回避</option></select></label>
          <label>戦略B<select id="battle-strategy-b"><option value="patient">慎重</option><option value="balanced">均衡</option><option value="aggressive">攻勢</option><option value="counter">返し</option><option value="evasive">回避</option></select></label>
          <button id="battle-ab-toggle" type="button" aria-label="戦略A/B切替">A</button>
          <label>固定Seed<input id="battle-review-seed" type="number" min="1" value="6197"></label>
          <label>初期負傷<select id="battle-injury-preset"><option value="none">なし</option><option value="rightArm">右腕重傷</option><option value="leftArm">左腕重傷</option><option value="rightLeg">右脚重傷</option><option value="leftLeg">左脚重傷</option><option value="torso">胴重傷</option></select></label>
        </div>
        <div class="review-modes">

          <div class="skin-switch" role="group" aria-label="序破急UIスキン">
            <button type="button" data-battle-skin="rinne" aria-pressed="true">百年転生</button>
            <button type="button" data-battle-skin="jinku" aria-pressed="false">喰滅廻遊</button>
          </div>
        </div>
      </div>
    </details>
    </div>

  </section>
  </section>
</main>
<script type="module" src="./src/review-battle.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
