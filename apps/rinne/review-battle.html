<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<title>実戦 | Visual Review</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ece9df;background:#0b1110;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1110}.battle-review{min-height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr) auto}.battle-bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #29322f;background:#0d1211}.battle-bar a{color:#ece9df;text-decoration:none;font-size:15px}.battle-bar strong{text-align:center;font-size:15px}.battle-state{display:flex;gap:8px;align-items:center;color:#9ba59e;font-size:12px}.battle-state strong{color:#ece9df}.stage{position:relative;min-height:0;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;min-height:360px;touch-action:none}.model-status{position:absolute;z-index:4;left:12px;top:12px;padding:7px 9px;border-radius:8px;background:#0b1110cc;color:#cbd2cd;font-size:11px}.note{position:absolute;z-index:4;right:12px;top:12px;color:#8e9993;font-size:10px;background:#0b1110aa;padding:6px 8px;border-radius:8px}.phase-panel{position:absolute;z-index:3;pointer-events:none;transition:width .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;backdrop-filter:blur(10px)}.phase-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.phase-brand{font-size:10px;font-weight:700;letter-spacing:.18em}.phase-current{font-size:29px;line-height:1}.phase-track{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.phase-step{display:grid;place-items:center;min-height:34px;border:1px solid transparent;transition:transform .14s ease,background .14s ease,border-color .14s ease,opacity .14s ease}.phase-step b{font-size:16px}.phase-step small{font-size:8px;letter-spacing:.12em;opacity:.64}.phase-meta{display:block;margin-top:6px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.72}.phase-panel[data-skin="rinne"]{left:50%;bottom:14px;transform:translateX(-50%);width:min(370px,calc(100% - 28px));padding:10px 12px;border:1px solid #92aaa266;border-radius:14px;background:linear-gradient(180deg,#17211fcc,#0d1412e6);box-shadow:0 12px 35px #0007,inset 0 1px #dce8df1a}.phase-panel[data-skin="rinne"] .phase-brand{color:#c4d9cf}.phase-panel[data-skin="rinne"] .phase-current{font-family:serif;color:#e3cf98;text-shadow:0 0 18px #d6ba6b44}.phase-panel[data-skin="rinne"] .phase-step{border-color:#72847d3d;border-radius:9px;background:#eef5ef08;color:#8f9b95}.phase-panel[data-skin="rinne"] .phase-step[data-active="true"]{transform:translateY(-2px);border-color:#d9c27f9c;background:linear-gradient(180deg,#d8c98c22,#76a28c22);color:#f3ead2;box-shadow:inset 0 0 18px #d5bd6c16}.phase-panel[data-skin="jinku"]{right:14px;bottom:14px;width:min(245px,calc(100% - 28px));padding:10px 11px 11px 14px;border:1px solid #6a2025;border-left:4px solid #a62d32;background:linear-gradient(135deg,#1c0b0de8,#090909ed 58%,#21090bed);clip-path:polygon(5px 0,100% 0,100% calc(100% - 9px),calc(100% - 10px) 100%,0 100%,0 7px);box-shadow:0 12px 34px #000a,inset 14px 0 34px #8e172014}.phase-panel[data-skin="jinku"] .phase-brand{color:#d5b7aa;letter-spacing:.25em}.phase-panel[data-skin="jinku"] .phase-current{font-family:serif;font-size:34px;color:#f0dfc7;text-shadow:2px 1px #731319,0 0 18px #a51e2666}.phase-panel[data-skin="jinku"] .phase-track{gap:3px;border-top:1px solid #6c252a;padding-top:6px}.phase-panel[data-skin="jinku"] .phase-step{min-height:31px;border-right:1px solid #4a1b1f;color:#765d59;transform:skewX(-5deg)}.phase-panel[data-skin="jinku"] .phase-step:last-child{border-right:0}.phase-panel[data-skin="jinku"] .phase-step[data-active="true"]{background:linear-gradient(135deg,#8d1824,#3e0a0e);color:#fff1da;box-shadow:inset 0 0 16px #d1464655}.controls{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px 10px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid #29322f;background:#0d1211}.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1}.pickers label{display:grid;gap:4px;color:#9ba59e;font-size:10px}.pickers select,.actions button,.review-modes button{width:100%;border:1px solid #39413e;border-radius:9px;background:#171d1b;color:#ece9df;padding:9px 10px;font:inherit}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1}.hud article{display:grid;gap:4px;padding:8px;border:1px solid #29322f;border-radius:9px;background:#121817}.hud span,.hud small{font-size:10px;color:#9ba59e}.hud strong{font-size:13px}.hud progress{width:100%;height:7px}.review-modes{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;grid-column:1}.skin-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px}.review-modes button{padding:8px 10px;font-size:11px;white-space:nowrap}.skin-switch button[aria-pressed="true"]{border-color:#c7b77a;background:#ded5b9;color:#111714}.review-modes>button[aria-pressed="true"]{border-color:#6e8e82;background:#21302b}.actions{display:grid;gap:6px;grid-column:2;grid-row:1/4}.actions button{min-width:96px}.actions button:last-child{align-self:end}@media(max-width:680px){.battle-review{grid-template-rows:44px minmax(0,1fr) auto}.battle-bar{padding:0 8px}.stage canvas{min-height:0}.model-status,.note{font-size:9px;top:8px}.model-status{left:8px}.note{right:8px}.phase-panel[data-skin="rinne"]{bottom:8px;width:min(330px,calc(100% - 16px));padding:8px 9px}.phase-panel[data-skin="jinku"]{right:8px;bottom:8px;width:min(220px,calc(100% - 16px));padding:8px 9px 9px 12px}.phase-current{font-size:25px}.phase-panel[data-skin="jinku"] .phase-current{font-size:29px}.phase-track{margin-top:5px}.phase-step{min-height:29px}.phase-step b{font-size:14px}.phase-meta{font-size:8px}.controls{grid-template-columns:1fr;padding:8px}.pickers,.hud,.review-modes,.actions{grid-column:1}.actions{grid-row:auto;grid-template-columns:1fr 1fr}.hud article{padding:7px}.review-modes{grid-template-columns:1fr 1fr}.skin-switch{grid-column:1/3}.battle-state{font-size:10px}}
</style>
</head>
<body>
<main class="battle-review">
  <header class="battle-bar">
    <a href="/" aria-label="Visual Reviewへ戻る">← Review</a>
    <strong>実戦</strong>
    <div class="battle-state"><strong id="battle-result">準備中</strong><span id="battle-time">0.0秒</span></div>
  </header>
  <section class="stage">
    <canvas id="battle-canvas" aria-label="実モデルで動くTidebreak自動戦闘"></canvas>
    <output id="battle-model-status" class="model-status" role="status">モデル準備中</output>
    <span class="note">モデル切替は表示のみ</span>
    <aside id="battle-phase" class="phase-panel" data-skin="rinne" data-phase="idle" aria-label="序破急の現在状態" aria-live="polite">
      <div class="phase-head"><span id="phase-brand" class="phase-brand">輪廻転焦</span><strong id="phase-current" class="phase-current">待</strong></div>
      <div class="phase-track" aria-label="序破急">
        <span class="phase-step" data-phase-step="jo" data-active="false"><b>序</b><small>JO</small></span>
        <span class="phase-step" data-phase-step="ha" data-active="false"><b>破</b><small>HA</small></span>
        <span class="phase-step" data-phase-step="kyu" data-active="false"><b>急</b><small>KYU</small></span>
      </div>
      <small id="phase-meta" class="phase-meta">LEFT — · RIGHT —</small>
    </aside>
  </section>
  <section class="controls">
    <div class="pickers">
      <label>左モデル<select id="battle-hero-model"></select></label>
      <label>右モデル<select id="battle-enemy-model"></select></label>
    </div>
    <div class="hud">
      <article><span>LEFT</span><strong id="hero-action">-</strong><progress id="hero-hp" max="1" value="1"></progress><small id="hero-meta">-</small></article>
      <article><span>RIGHT</span><strong id="enemy-action">-</strong><progress id="enemy-hp" max="1" value="1"></progress><small id="enemy-meta">-</small></article>
    </div>
    <div class="review-modes">
      <div class="skin-switch" role="group" aria-label="序破急UIスキン">
        <button type="button" data-battle-skin="rinne" aria-pressed="true">輪廻転焦</button>
        <button type="button" data-battle-skin="jinku" aria-pressed="false">尽喰廻遊</button>
      </div>
      <button id="battle-loop" type="button" aria-pressed="true">ループ ON</button>
      <button id="battle-camera" type="button" aria-pressed="true">追従 ON</button>
    </div>
    <div class="actions"><button id="battle-toggle" type="button">一時停止</button><button id="battle-restart" type="button">最初から</button></div>
  </section>
</main>
<script type="module" src="./src/review-battle.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
