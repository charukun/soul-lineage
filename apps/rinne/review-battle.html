<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<title>実戦 | Visual Review</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ece9df;background:#0b1110;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1110}.battle-review{min-height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr) auto}.battle-bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #29322f;background:#0d1211}.battle-bar a{color:#ece9df;text-decoration:none;font-size:15px}.battle-bar strong{text-align:center;font-size:15px}.battle-state{display:flex;gap:8px;align-items:center;color:#9ba59e;font-size:12px}.battle-state strong{color:#ece9df}.stage{position:relative;min-height:0;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;min-height:360px;touch-action:none}.model-status{position:absolute;z-index:4;left:12px;top:12px;padding:7px 9px;border-radius:8px;background:#0b1110cc;color:#cbd2cd;font-size:11px}.note{position:absolute;z-index:4;right:12px;top:12px;color:#8e9993;font-size:10px;background:#0b1110aa;padding:6px 8px;border-radius:8px}.controls{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px 10px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid #29322f;background:#0d1211}.pickers{grid-column:1}.pickers label{display:grid;gap:4px;color:#9ba59e;font-size:10px}.pickers select,.actions button,.review-modes button{width:100%;border:1px solid #39413e;border-radius:9px;background:#171d1b;color:#ece9df;padding:9px 10px;font:inherit}.review-modes{grid-column:1}.skin-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px}.review-modes button{padding:8px 10px;font-size:11px;white-space:nowrap}.skin-switch button[aria-pressed="true"]{border-color:#c7b77a;background:#ded5b9;color:#111714}.actions{display:grid;gap:6px;grid-column:2;grid-row:1/3}.actions button{min-width:96px}.actions button:last-child{align-self:end}@media(max-width:680px){.battle-review{grid-template-rows:44px minmax(0,1fr) auto}.battle-bar{padding:0 8px}.stage canvas{min-height:0}.model-status,.note{font-size:9px;top:8px}.model-status{left:8px}.note{right:8px}.controls{grid-template-columns:1fr;padding:8px}.pickers,.review-modes,.actions{grid-column:1}.actions{grid-row:auto;grid-template-columns:1fr 1fr}.battle-state{font-size:10px}}
</style>
</head>
<body>
<main class="battle-review">
  <header class="battle-bar">
    <a href="/" aria-label="Visual Reviewへ戻る">← Review</a>
    <strong>実戦</strong>
    <div class="battle-state"><strong id="battle-result">準備中</strong><span id="battle-time">0.0秒</span></div>
  </header>
  <section class="stage">
    <canvas id="battle-canvas" aria-label="実モデルで動くTidebreak自動戦闘"></canvas>
    <output id="battle-model-status" class="model-status" role="status">モデル準備中</output>
    <span class="note">自プレイヤーモデルのみ切替</span>
    <aside id="battle-phase" aria-label="序破急の現在状態" aria-live="polite"></aside>
  </section>
  <section class="controls">
    <div class="pickers"><label>自プレイヤーモデル<select id="battle-hero-model"></select></label></div>
    <div class="review-modes">
      <div class="skin-switch" role="group" aria-label="序破急UIスキン">
        <button type="button" data-battle-skin="rinne" aria-pressed="true">輪廻転焦</button>
        <button type="button" data-battle-skin="jinku" aria-pressed="false">尽喰廻遊</button>
      </div>
    </div>
    <div class="actions"><button id="battle-toggle" type="button">一時停止</button><button id="battle-restart" type="button">最初から</button></div>
  </section>
</main>
<script type="module" src="./src/review-battle.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
