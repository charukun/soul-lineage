<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml">
<title>Visual Review｜技演出</title>
<link rel="stylesheet" href="./src/typography.css">
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ece9df;background:#0b1110;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1110}.battle-review{min-height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr) auto}.battle-bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #29322f;background:#0d1211}.battle-bar a{color:#ece9df;text-decoration:none;font-size:15px}.battle-bar strong{text-align:center;font-size:15px}.battle-state{display:flex;gap:8px;align-items:center;color:#9ba59e;font-size:12px}.battle-state strong{color:#ece9df}.stage{position:relative;min-height:0;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;min-height:360px;touch-action:none}.model-status{position:absolute;z-index:4;left:12px;top:12px;padding:7px 9px;border-radius:8px;background:#0b1110cc;color:#cbd2cd;font-size:11px}.note{position:absolute;z-index:4;right:12px;top:12px;color:#8e9993;font-size:10px;background:#0b1110aa;padding:6px 8px;border-radius:8px}.phase-panel{position:absolute;z-index:3;pointer-events:none;left:50%;bottom:8px;width:min(238px,calc(100% - 24px));transform:translateX(-50%);padding:8px 10px 10px;background:linear-gradient(90deg,transparent,rgba(7,19,22,.86) 18%,rgba(7,19,22,.86) 82%,transparent);backdrop-filter:blur(10px)}.phase-meta{max-width:210px}.phase-history{position:absolute;left:50%;top:100%;width:260px;height:70px;transform:translateX(-50%);overflow:hidden}.battle-state button{border:0;background:transparent;color:#c9d0cc;font:inherit;padding:4px 2px;min-width:26px}.battle-state button[data-enabled="false"]{color:#69736d}.controls{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px 10px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid #29322f;background:#0d1211}.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1}.pickers label{display:grid;gap:4px;color:#9ba59e;font-size:10px}.pickers select,.actions button,.review-modes button{width:100%;border:1px solid #39413e;border-radius:9px;background:#171d1b;color:#ece9df;padding:9px 10px;font:inherit}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1}.hud article{display:grid;gap:4px;padding:8px;border:1px solid #29322f;border-radius:9px;background:#121817}.hud span,.hud small{font-size:10px;color:#9ba59e}.hud strong{font-size:13px}.hud progress{width:100%;height:7px}.review-modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-column:1}.battle-mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px}.battle-mode-switch button[aria-pressed="true"]{border-color:#c7b77a;background:#ded5b9;color:#111714}.skin-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px}.review-modes button{padding:8px 10px;font-size:11px;white-space:nowrap}.skin-switch button[aria-pressed="true"]{border-color:#c7b77a;background:#ded5b9;color:#111714}.review-modes>button[aria-pressed="true"]{border-color:#6e8e82;background:#21302b}.actions{display:grid;gap:6px;grid-column:2;grid-row:1/4}.actions button{min-width:96px}.actions button:last-child{align-self:end}@media(max-width:680px){.battle-review{grid-template-rows:44px minmax(0,1fr) auto}.battle-bar{padding:0 8px}.stage canvas{min-height:0}.model-status,.note{font-size:9px;top:8px}.model-status{left:8px}.note{right:8px}.phase-panel[data-skin="rinne"]{bottom:8px;width:min(330px,calc(100% - 16px));padding:8px 9px}.phase-panel[data-skin="jinku"]{right:8px;bottom:8px;width:min(220px,calc(100% - 16px));padding:8px 9px 9px 12px}.phase-current{font-size:25px}.phase-panel[data-skin="jinku"] .phase-current{font-size:29px}.phase-track{margin-top:5px}.phase-step{min-height:29px}.phase-step b{font-size:14px}.phase-meta{font-size:8px}.controls{grid-template-columns:1fr;padding:8px}.pickers,.hud,.review-modes,.actions{grid-column:1}.actions{grid-row:auto;grid-template-columns:1fr 1fr}.hud article{padding:7px}.review-modes{grid-template-columns:1fr 1fr}.skin-switch{grid-column:1/3}.battle-state{font-size:10px}}
.battle-review{height:100dvh;overflow:hidden;grid-template-rows:44px minmax(0,1fr) auto}.battle-bar{padding-inline:max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-right))}.battle-bar a{font-weight:700}.model-status,.note{display:none!important}.stage canvas{min-height:0}.phase-panel[data-skin="jinku"]{left:50%;right:auto;bottom:8px;width:min(220px,calc(100% - 24px));transform:translateX(-50%)}.controls{grid-template-columns:1fr;gap:7px;padding:7px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#0d1211f5}.hud{grid-column:1;gap:10px}.hud article{padding:6px 8px;background:transparent;border-color:#29322f99}.hud article>strong{display:none}.hud span{font-size:11px;font-weight:700;color:#d9dedb}.hud small{font-size:9px}.hud progress{height:5px}.actions{grid-column:1;grid-row:auto;display:flex;justify-content:center}.actions button:first-child{width:min(220px,64vw);min-width:0;padding:8px 12px}.battle-state{white-space:nowrap}@media(max-height:700px){.battle-review{grid-template-rows:40px minmax(0,1fr) auto}.controls{padding-top:5px;gap:5px}.hud article{padding:4px 7px}.actions button:first-child{padding:6px 10px}.phase-panel[data-skin="jinku"]{bottom:5px}}

/* Review-only inspiration trigger. The sequence HUD mirrors the current RINNE combat surface. */
:root{--rinne-gold:#c7a15d;--rinne-gold-hi:#e3c77f;--rinne-blue:#73bce5;--rinne-ink:#f4ead0;--rinne-muted:#9eb0bf;--rinne-line:rgba(199,161,93,.52);--rinne-line-soft:rgba(199,161,93,.22)}
.phase-panel[data-skin="rinne"]{left:50%;right:auto;top:17%;bottom:auto;width:auto;transform:translateX(-50%);display:grid;grid-template-columns:36px 28px 36px 28px 36px;align-items:center;gap:0;padding:0 0 7px!important;border:1px solid var(--rinne-line);border-radius:999px;background:rgba(6,19,33,.92);box-shadow:0 4px 10px rgba(0,0,0,.28);filter:drop-shadow(0 5px 5px rgba(0,0,0,.38));backdrop-filter:none}
.phase-panel[data-skin="rinne"]::before{display:none}
.phase-panel[data-skin="rinne"] .phase-step{position:relative;display:grid;place-items:center;width:36px;min-width:36px;height:29px;min-height:29px;margin-left:-2px;border:1px solid #665239;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);background:linear-gradient(180deg,#313739,#171c1d);color:#9a917e;font:700 14px/1 ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;box-shadow:inset 0 1px rgba(255,255,255,.06),inset 0 -3px rgba(0,0,0,.28);transition:color .22s ease,opacity .22s ease,text-shadow .22s ease,transform .22s ease}
.phase-panel[data-skin="rinne"] .phase-step:first-child{clip-path:polygon(22% 0,100% 0,88% 100%,0 100%)}.phase-panel[data-skin="rinne"] .phase-step[data-active="true"]{z-index:2;border-color:#d0a15a;background:radial-gradient(circle at 50% 28%,rgba(255,229,169,.18),transparent 35%),linear-gradient(180deg,#98693a,#51331e);color:#ffe3a4;text-shadow:0 0 8px #efb25acc,0 0 18px #d6733f88;transform:translateY(-2px) scale(1.09)}
.phase-panel[data-skin="rinne"] .phase-step[data-completed="true"]{color:#d9b66f;opacity:.78;text-shadow:0 0 7px #d29b4f55;transform:translateY(-1px)}
.phase-panel[data-skin="rinne"][data-combo-active="false"] .phase-step{color:#756f66;opacity:.42;text-shadow:none;transform:none;filter:saturate(.45)}
.phase-panel[data-skin="rinne"] .phase-link{display:block;width:28px;height:18px;flex:0 0 28px;margin:0 -1px;color:#75634c;opacity:.55}
.phase-panel[data-skin="rinne"][data-combo-active="false"] .phase-link{color:#655d52;opacity:.24;animation:none;filter:none}
.phase-panel[data-skin="rinne"][data-phase="jo"] [data-link="jo-ha"],.phase-panel[data-skin="rinne"][data-phase="ha"] [data-link="ha-kyu"],.phase-panel[data-skin="rinne"][data-phase="kyu"] .phase-link{color:#efb25a;opacity:1;filter:drop-shadow(0 0 6px #e9a64fbb)}
.phase-panel[data-skin="rinne"] .phase-meta{display:block;grid-column:1/6;position:static;transform:none;justify-self:center;margin-top:8px;padding:2px 10px;min-width:max-content;max-width:220px;background:linear-gradient(90deg,transparent,#111c 18%,#111c 82%,transparent);color:#f2dfb6;font:700 10px/1.4 ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.08em;text-shadow:0 2px 4px #000}
.phase-panel[data-skin="rinne"] .phase-history{display:block;grid-column:1/6;position:relative;left:auto;top:auto;transform:none;justify-self:center;margin-top:3px;width:220px;height:50px;overflow:hidden}
.phase-panel[data-skin="rinne"] .phase-history span{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;max-width:210px;padding:2px 7px;background:linear-gradient(90deg,transparent,rgba(18,15,12,.56),transparent);font-size:9px}.phase-panel[data-skin="rinne"] .phase-history span b{color:#d9a75b;font-size:10px}
.battle-inspiration{position:absolute;z-index:8;left:50%;top:31%;transform:translate(-50%,-50%);display:grid;place-items:center;min-width:min(300px,78vw);padding:11px 18px 12px;border-top:1px solid rgba(227,199,127,.64);border-bottom:1px solid rgba(199,161,93,.42);background:linear-gradient(90deg,transparent,rgba(6,19,33,.92) 16%,rgba(10,31,50,.96) 50%,rgba(6,19,33,.92) 84%,transparent);pointer-events:none;filter:drop-shadow(0 7px 10px rgba(0,0,0,.48))}
.battle-inspiration[hidden]{display:none}.battle-inspiration span{color:var(--rinne-blue);font-size:9px;font-weight:800;letter-spacing:.28em}.battle-inspiration strong{margin-top:3px;color:var(--rinne-gold-hi);font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:22px;letter-spacing:.12em;text-shadow:0 0 13px rgba(199,161,93,.3)}.battle-inspiration small{margin-top:3px;color:var(--rinne-muted);font-size:9px;letter-spacing:.12em}
.actions{display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr)!important;gap:7px!important;width:min(390px,100%);justify-self:center}.actions button{width:100%!important;min-width:0!important}
#battle-inspire{border-color:var(--rinne-gold)!important;background:linear-gradient(180deg,#173c59,#0b2338)!important;color:var(--rinne-gold-hi)!important;font-weight:800;letter-spacing:.08em;box-shadow:inset 0 1px rgba(255,255,255,.07),0 0 0 1px rgba(199,161,93,.08)}
#battle-inspire:active{transform:translateY(1px);filter:brightness(1.08)}#battle-inspire:disabled{opacity:.5}
.technique-loadout{grid-column:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.technique-loadout span{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;padding:7px 9px;border:1px solid var(--rinne-line-soft);border-radius:8px;background:#081523;color:var(--rinne-muted);font-size:9px}.technique-loadout b{color:var(--rinne-gold-hi);font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:14px}.technique-loadout strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--rinne-ink);font-size:10px}
.inspiration-mode{grid-column:1;display:grid;grid-template-columns:1fr 1fr;gap:5px}.inspiration-mode button{border:1px solid #39413e;border-radius:9px;background:#171d1b;color:#9ba59e;padding:7px 9px;font:inherit;font-size:10px}.inspiration-mode button[aria-pressed="true"]{border-color:var(--rinne-gold);background:#173c59;color:var(--rinne-gold-hi)}
.stage[data-inspiration-cinematic="true"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 46% 52%,transparent 0 18%,rgba(3,10,18,.08) 45%,rgba(3,10,18,.38) 100%);z-index:2}
@media(max-width:680px){.phase-panel[data-skin="rinne"]{top:18%;width:auto;padding-bottom:7px}.battle-inspiration{top:34%}.battle-inspiration strong{font-size:19px}.actions{width:100%}}


/* RINNE battle-review mobile composition. Keep this in the document so the
   standalone review deploy cannot drop it while publishing selected files. */
:root{--rinne-navy-980:#06101d;--rinne-navy-950:#081523;--rinne-navy-900:#0b1b2e;--rinne-navy-700:#1b3d5b;--rinne-gold:#c7a15d;--rinne-gold-hi:#e3c77f;--rinne-blue:#73bce5;--rinne-blue-soft:#9bd7f1;--rinne-ink:#f4ead0;--rinne-muted:#9eb0bf;--rinne-line:rgba(199,161,93,.52);--rinne-line-soft:rgba(199,161,93,.22)}
.battle-review{grid-template-rows:50px minmax(0,1fr) auto!important;background:var(--rinne-navy-980)!important}.battle-bar{height:50px!important;border-bottom-color:var(--rinne-line-soft)!important;background:linear-gradient(180deg,var(--rinne-navy-900),var(--rinne-navy-980))!important}.review-surface__eyebrow{color:var(--rinne-blue-soft)!important}.review-surface__title h1{font-family:var(--font-rinne-display)!important;color:var(--rinne-gold-hi)!important;font-size:18px!important}.review-surface__workspace{height:100%!important;min-height:0!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;overflow:hidden!important}.review-surface__stage-column,.stage{min-height:0!important;height:100%!important}.stage canvas{height:100%!important;min-height:0!important}.controls{position:relative!important;z-index:10!important;display:grid!important;grid-template-columns:1fr!important;gap:6px!important;padding:8px 10px max(9px,env(safe-area-inset-bottom))!important;border-top:1px solid var(--rinne-line)!important;background:linear-gradient(180deg,rgba(8,21,35,.99),rgba(6,16,29,.995))!important}
.battle-vitals{position:absolute!important;left:10px!important;right:10px!important;bottom:100%!important;transform:translateY(-6px)!important;z-index:12!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;pointer-events:none}.battle-vitals article{padding:5px 8px!important;border:0!important;background:linear-gradient(90deg,rgba(6,16,29,.82),rgba(6,16,29,.22))!important}.battle-vitals article:last-child{text-align:right;background:linear-gradient(270deg,rgba(6,16,29,.82),rgba(6,16,29,.22))!important}.battle-vitals span{font-family:var(--font-rinne-display)!important;color:var(--rinne-ink)!important}.battle-vitals progress{height:4px!important;accent-color:var(--rinne-blue)}
.technique-loadout{order:1!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:4px!important}.technique-loadout span{padding:6px 7px!important;border-color:var(--rinne-line-soft)!important;background:linear-gradient(180deg,rgba(16,36,58,.95),rgba(8,21,35,.97))!important}.technique-loadout b{font-family:var(--font-rinne-display)!important;color:var(--rinne-gold-hi)!important;font-size:15px!important}.technique-loadout strong{color:var(--rinne-ink)!important;font-size:9px!important}.inspiration-mode{order:2!important;display:grid!important;grid-template-columns:1fr 1fr!important}.inspiration-mode button{min-height:36px!important;border-color:var(--rinne-line-soft)!important;background:var(--rinne-navy-950)!important;color:var(--rinne-muted)!important}.inspiration-mode button[aria-pressed="true"]{border-color:var(--rinne-gold)!important;background:linear-gradient(180deg,var(--rinne-navy-700),var(--rinne-navy-900))!important;color:var(--rinne-gold-hi)!important}.actions{order:3!important;display:grid!important;grid-template-columns:minmax(0,1.45fr) minmax(0,.55fr)!important;width:100%!important;gap:6px!important}.actions button{min-height:40px!important}.review-settings{order:4!important;border-top:1px solid rgba(199,161,93,.12)!important}.review-settings summary{display:flex!important;justify-content:center!important;gap:8px!important;padding:3px!important;color:var(--rinne-muted)!important;font-size:9px!important;list-style:none}.review-settings summary::-webkit-details-marker{display:none}.review-settings-body{display:grid!important;gap:6px!important;padding-top:7px!important}.review-settings .pickers{display:grid!important;grid-template-columns:1fr 1fr!important}.review-settings .review-modes{display:grid!important;grid-template-columns:1fr 1fr!important}.review-settings:not([open]) .review-settings-body{display:none!important}
.phase-panel[data-skin="rinne"]{top:10%!important}.battle-inspiration{top:23%!important;width:min(280px,72vw)!important;min-width:0!important;padding:7px 14px!important;border:0!important;border-left:2px solid var(--rinne-blue)!important;background:linear-gradient(90deg,rgba(6,19,33,.9),rgba(10,31,50,.72) 70%,transparent)!important}.battle-inspiration strong{font-family:var(--font-rinne-display)!important;font-size:18px!important}
@media(max-width:680px){.review-surface__workspace{grid-template-rows:minmax(320px,1fr) auto!important}.controls{max-height:35dvh!important;overflow:auto!important;overscroll-behavior:contain!important}.phase-panel[data-skin="rinne"]{top:8%!important}.battle-inspiration{top:20%!important}}

</style>
</head>
<body>
<main class="battle-review review-surface" aria-label="技演出レビュー。モーション・VFX・SFXと接触を確認します。本編の閃き判定や保存データは変更しません。">
  <header class="battle-bar review-surface__header">
    <div class="review-surface__title">
      <div><span class="review-surface__eyebrow">RINNE RUNTIME PROBE</span><h1>技演出</h1></div>
    </div>
    <div class="battle-state"><strong id="battle-result">準備中</strong><span id="battle-time">0.0秒</span><button id="battle-sound" type="button" data-enabled="true" aria-pressed="true" aria-label="戦闘音の切替">音</button></div>
  </header>
  <section class="review-surface__workspace">
  <div class="review-surface__stage-column">
  <section class="stage review-surface__stage">
    <canvas id="battle-canvas" aria-label="実モデルで動くTidebreak自動戦闘"></canvas>
    <output id="battle-model-status" class="model-status" role="status">モデル準備中</output>
    <span class="note">モデル切替は表示のみ</span>
    <aside id="battle-inspiration" class="battle-inspiration" role="status" aria-live="assertive" hidden><span>閃き</span><strong id="battle-inspiration-name"></strong><small id="battle-inspiration-phase"></small></aside>
    <aside id="battle-phase" class="phase-panel combat-phase-indicator combat-sequence combat-sequence--flat" data-combat-sequence data-combat-sequence-phase="idle" data-combo-active="false" data-phase="idle" aria-label="序破急の現在状態" aria-live="polite">
      <span class="phase-step combat-sequence__step" data-phase-id="jo" data-phase-step="jo" data-combat-phase="jo" data-active="false">序</span><i class="phase-link phase-pulse combat-sequence__link" data-link="jo-ha" data-combat-link="jo-ha" aria-hidden="true"></i><span class="phase-step combat-sequence__step" data-phase-id="ha" data-phase-step="ha" data-combat-phase="ha" data-active="false">破</span><i class="phase-link phase-pulse combat-sequence__link" data-link="ha-kyu" data-combat-link="ha-kyu" aria-hidden="true"></i><span class="phase-step combat-sequence__step" data-phase-id="kyu" data-phase-step="kyu" data-combat-phase="kyu" data-active="false">急</span>
      <strong id="phase-meta" class="phase-meta combat-phase-action combat-sequence__action">間合いを測る</strong><div id="phase-history" class="phase-history combat-phase-history combat-sequence__history" aria-hidden="true"></div>
    </aside>
  </section>
  </div>
  <section class="controls review-surface__panel">
    <div class="hud battle-vitals">
      <article><span id="hero-name">Rogue</span><strong id="hero-action">-</strong><progress id="hero-hp" max="1" value="1"></progress><small id="hero-meta">-</small></article>
      <article><span id="enemy-name">Knight</span><strong id="enemy-action">-</strong><progress id="enemy-hp" max="1" value="1"></progress><small id="enemy-meta">-</small></article>
    </div>
    <details class="review-settings">
      <summary>設定 <small>モデル・人数・カメラ</small></summary>
      <div class="review-settings-body">
        <div class="pickers">
          <label>左モデル<select id="battle-hero-model"></select></label>
          <label>右モデル<select id="battle-enemy-model"></select></label>
        </div>
        <div class="review-modes">
          <div class="battle-mode-switch" role="group" aria-label="戦闘人数"><button type="button" data-battle-mode="duel" aria-pressed="true">タイマン</button><button type="button" data-battle-mode="melee" aria-pressed="false">乱戦 3v3</button></div>
          <div class="skin-switch" role="group" aria-label="序破急UIスキン">
            <button type="button" data-battle-skin="rinne" aria-pressed="true">百年転生</button>
            <button type="button" data-battle-skin="jinku" aria-pressed="false">喰滅廻遊</button>
          </div>
        </div>
      </div>
    </details>
    <div id="battle-technique-loadout" class="technique-loadout" aria-label="現在の序破急セット技"><span><b>序</b><strong data-loadout-phase="jo">基本技</strong></span><span><b>破</b><strong data-loadout-phase="ha">基本技</strong></span><span><b>急</b><strong data-loadout-phase="kyu">基本技</strong></span></div>
    <div class="inspiration-mode" role="group" aria-label="閃き確認モード"><button type="button" data-inspiration-mode="normal" aria-pressed="true">通常モード</button><button type="button" data-inspiration-mode="boost" aria-pressed="false">閃きモード · 高確率</button></div>
    <div class="actions"><button id="battle-inspire" type="button">閃きシーケンス確認</button><button id="battle-restart" type="button">組み直す</button></div>
  </section>
  </section>
</main>
<script type="module" src="./src/review-battle.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
