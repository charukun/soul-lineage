<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml"><title>Visual Review｜装備</title>
</head>
<body>
<main class="asset-review review-surface review-workbench">
  <header class="review-header review-surface__header">
    <div class="review-title review-surface__title">
      <a class="review-lab-back review-surface__back" data-review-back href="https://soul-lineage-review-dev.c-okamoto.workers.dev/" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <h1>装備</h1>
    </div>
    <div class="review-surface__stats">
      <output aria-label="装備素材数">EQUIPMENT <strong id="asset-item-count">…</strong></output>
    </div>
  </header>

  <section class="asset-workspace review-surface__workspace" aria-label="装備レビュー">
    <div class="asset-preview-pane review-surface__stage-column">
      <section class="asset-stage-shell review-surface__stage" data-review-stage-panel-host=".asset-library" aria-label="キャラクター装備のプレビュー">
        <canvas id="asset-stage" aria-label="装備プレビュー。ドラッグで自由回転、ピンチで拡大"></canvas>

        <div class="asset-stage-slot review-workbench__stage-caption" aria-live="polite">
          <small id="asset-stage-slot-label">右手</small>
          <strong id="asset-combination">読み込み中</strong>
        </div>
        <div class="asset-stage-hint" aria-hidden="true">ドラッグで回転 · ピンチで拡大</div>
        <div id="asset-stage-loading" class="asset-stage-loading" hidden aria-live="polite" aria-hidden="true">
          <span class="asset-loading-spinner" aria-hidden="true"></span>
          <strong>武器を準備中…</strong>
        </div>
        <div class="asset-camera-strip asset-stage-cameras review-workbench__camera" data-review-stage-control aria-label="表示方向">
          <button type="button" data-asset-camera="front" aria-pressed="true">正面</button>
          <button type="button" data-asset-camera="left" aria-pressed="false">左</button>
          <button type="button" data-asset-camera="right" aria-pressed="false">右</button>
          <button type="button" data-asset-camera="back" aria-pressed="false">背面</button>
        </div>
      </section>
    </div>

    <aside class="asset-catalog review-surface__panel" aria-label="装備レビュー操作">
      <section class="asset-section asset-equipment-section asset-library review-workbench__library review-workbench__panel-host" aria-labelledby="asset-library-title">
        <div class="asset-library-head review-workbench__library-head">
          <div><span class="control-label review-workbench__kicker">EQUIPMENT LIBRARY</span><strong id="asset-library-title">装備を選ぶ</strong></div>
          <small>種別 → カテゴリ → 装備</small>
        </div>
        <div id="asset-equipment-tabs" class="asset-equipment-tabs" role="group" aria-label="装備種別">
          <button type="button" data-equipment-section="weapon" aria-pressed="true">武器</button>
          <button type="button" data-equipment-section="armor" aria-pressed="false">防具</button>
        </div>
        <div class="asset-filter-row">
          <div id="asset-filters" class="asset-filters review-filter-tabs review-workbench__filters" role="group" aria-label="装備分類"></div>
          <button id="asset-recommended-toggle" class="asset-recommended-toggle" type="button" aria-pressed="true" aria-label="おすすめ装備だけ表示">おすすめ</button>
        </div>
        <div id="asset-grid-summary" class="asset-grid-title review-workbench__grid-title">候補一覧</div>
        <div id="asset-weapon-types" class="asset-weapon-types review-choice-grid" role="group" aria-label="装備候補"></div>
      </section>

      <section class="asset-section asset-equipped-summary" aria-labelledby="asset-equipment-title">
        <div class="asset-primary-head">
          <h2 id="asset-equipment-title">現在の装備</h2>
          <button id="asset-reset" class="asset-reset" type="button">すべて外す</button>
        </div>
        <div id="asset-slot-tabs" class="asset-slot-tabs asset-slot-statuses" aria-label="現在の装備">
          <div data-asset-slot="main"><small>右手</small><strong id="asset-current-main">空き</strong></div>
          <div data-asset-slot="off"><small>左手</small><strong id="asset-current-off">空き</strong></div>
          <div data-asset-slot="head"><small>頭</small><strong id="asset-current-head">空き</strong></div>
          <div data-asset-slot="body"><small>胴</small><strong id="asset-current-body">空き</strong></div>
          <div data-asset-slot="arms"><small>腕</small><strong id="asset-current-arms">空き</strong></div>
          <div data-asset-slot="legs"><small>脚</small><strong id="asset-current-legs">空き</strong></div>
          <div data-asset-slot="back"><small>背中</small><strong id="asset-current-back">空き</strong></div>
        </div>
      </section>

      <details class="asset-provenance-shell review-surface__meta">
        <summary>出典・素材情報</summary>
        <p id="asset-provenance">装備を選ぶと出典を表示します。</p>
      </details>
      <output id="asset-status" class="asset-status review-workbench__status" role="status" aria-live="polite">モデルを読み込んでいます。</output>

    </aside>
  </section>

</main>
<script type="module" src="../src/review/equipment/entrypoint.js"></script>
</body>
</html>
