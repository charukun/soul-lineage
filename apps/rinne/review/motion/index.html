<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml">
<title>Visual Review｜モーション</title>
<link rel="stylesheet" href="../../src/review/motion/index.css">
</head>
<body>
<main class="motion-review review-surface">
  <header class="review-surface__header">
    <div class="review-surface__title">
      <a class="motion-back review-surface__back" href="https://soul-lineage-review-dev.c-okamoto.workers.dev/" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <div><span class="motion-eyebrow review-surface__eyebrow">RINNE RUNTIME PROBE</span><h1>モーション</h1></div>
    </div>
    <div class="review-surface__stats">
      <output id="motion-count" aria-label="異なるソースモーション数">MOTION CLIPS <strong id="motion-count-value">…</strong></output>
    </div>
  </header>
  <section class="review-surface__workspace">
  <div class="review-surface__stage-column">
  <section class="motion-stage review-surface__stage" data-review-stage-panel-host=".motion-library-primary" aria-label="モーション表示">
    <canvas id="motion-stage" aria-label="主人公モデルのモーション。ドラッグで回転、ピンチで拡大"></canvas>
    <div class="motion-stage-caption" aria-live="polite">
      <strong id="motion-selected">モーション準備中</strong>
      <small id="motion-source">pinned CC0</small>
    </div>
    <div class="motion-stage-status">
      <output id="motion-status" role="status" aria-live="polite">モーションを読み込んでいます。</output>
      <progress id="motion-load" max="1" value="0" aria-label="モデル読込状況"></progress>
    </div>
    <div class="motion-camera-strip" data-review-stage-control aria-label="表示方向">
      <button type="button" data-motion-camera="front" aria-pressed="false">正面</button>
      <button type="button" data-motion-camera="three-quarter" aria-pressed="true">斜め</button>
      <button type="button" data-motion-camera="side" aria-pressed="false">横</button>
      <button type="button" data-motion-camera="back" aria-pressed="false">背面</button>
    </div>
  </section>
  </div>

  <section class="motion-controls review-surface__panel" aria-label="モーション選択と再生">

    <section class="motion-library motion-library-primary" aria-label="モーションを選ぶ">
      <div class="motion-library-head">
        <div><span class="control-label">MOTION LIBRARY</span><strong>モーションを選ぶ</strong></div>
        <small>カテゴリ → 動き</small>
      </div>
      <div id="motion-filters" class="motion-filters review-filter-tabs" role="group" aria-label="モーション分類"></div>
      <div id="motion-grid-summary" class="motion-grid-title">候補一覧</div>
      <div id="motion-grid" class="motion-grid review-choice-grid" role="group" aria-label="モーション候補"></div>
    </section>

    <div class="motion-playback" aria-label="再生コントロール">
      <button id="motion-restart" type="button" aria-label="最初から">↺</button>
      <button id="motion-play" class="primary" type="button">▶ 再生</button>
      <label class="speed-control"><span>速度</span>
        <select id="motion-speed" aria-label="再生速度">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <label class="loop-toggle"><input id="motion-loop" type="checkbox" checked> ループ</label>
    </div>

    <div class="motion-timeline">
      <button id="motion-prev-frame" type="button" aria-label="1フレーム戻す">‹ 1F</button>
      <input id="motion-time" class="motion-time" type="range" min="0" max="1" step="0.0001" value="0" aria-label="モーション時刻">
      <button id="motion-next-frame" type="button" aria-label="1フレーム進む">1F ›</button>
      <output id="motion-time-label">0.00 / 0.00秒</output>
    </div>

    <details class="motion-models">
      <summary><span class="control-label">表示モデル</span><strong>素体を変更</strong></summary>
      <div id="motion-model-grid" class="motion-model-grid review-choice-grid" role="group" aria-label="キャラクターモデル"></div>
    </details>

    <details class="motion-legacy">
      <summary>既存の原版・ポーズ・部分クリップ</summary>
      <p>以前の埋め込みクリップを保持しています。反復・部分・モデル違いは上の件数に加算しません。</p>
      <select id="motion-legacy" aria-label="既存の原版クリップ"><option value="">原版クリップを選択</option></select>
    </details>
    <details class="motion-meta review-surface__meta">
      <summary>出典・不変ハッシュ</summary>
      <p id="motion-meta"></p>
      <a id="motion-license" href="./simulator/licenses/REVIEW_MOTION_SOURCES.txt" target="_blank" rel="noopener">ライセンス</a>
      ·
      <a id="motion-origin" href="./simulator/licenses/REVIEW_MOTION_SOURCES.txt" target="_blank" rel="noopener">作者の配布元</a>
    </details>
  </section>
  </section>
</main>
<script type="module" src="../../src/review/motion/entrypoint.js"></script>
</body>
</html>
