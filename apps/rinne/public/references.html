<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>Character References · Visual Review Lab</title>
  <link rel="icon" href="./review-icons/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./references.css" />
</head>
<body>
  <main class="reference-shell">
    <header class="reference-topbar">
      <a class="back-link" href="./">← Visual Review Lab</a>
      <div>
        <p class="eyebrow">VISUAL REVIEW LAB / CHARACTER LIBRARY</p>
        <h1>キャラクターリファレンス</h1>
        <p class="lead">develop の <code>docs/characters/references/</code> を一覧表示します。</p>
      </div>
      <button id="reload" type="button">再読込</button>
    </header>

    <section class="summary-card" aria-live="polite">
      <div><strong id="reference-count">確認中</strong><span id="reference-status">Repositoryを確認しています</span></div>
      <a href="https://github.com/charukun/soul-lineage/tree/develop/docs/characters/references" target="_blank" rel="noreferrer">Repositoryを開く</a>
    </section>

    <section id="reference-groups" class="reference-groups">
      <div class="loading-card">キャラクターリファレンスを読み込んでいます。</div>
    </section>
  </main>
  <script type="module" src="./references.js"></script>
</body>
</html>
