<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f7">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-r97sOZFoQTHhRIeBeh/poASMCNtyM8aRwo+87GuuoFM='; style-src 'sha256-UfhCOVecqV+D7XDy3vOXT/W4fL8BzfMGL6l7nn4tm7s='; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>タスク</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:light;--bg:#f8f8f7;--paper:#fff;--ink:#252824;--muted:#6b706a;--line:#e6e8e2;--accent:#29634b;--amber:#8b5e24;--red:#a64139}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}button,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default;opacity:.4}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button,textarea,a{ -webkit-tap-highlight-color:transparent}svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}main{width:100%;max-width:660px;margin:auto;padding:12px 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px;color:var(--muted);font-size:12px}.tools{display:flex;align-items:center;gap:4px}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}.icon[aria-pressed=true]{background:#e8ece6;color:var(--ink)}#notice{font-size:12px;color:var(--amber);margin:0 0 16px}#list{display:grid;gap:11px}.task{display:block;width:100%;padding:19px 19px 15px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px}.task:active{background:#f0f3ee}.meta{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:11px;color:var(--muted);line-height:1.4}.place{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.when{white-space:nowrap;flex-shrink:0}.task h2{font-size:17px;font-weight:650;line-height:1.55;letter-spacing:-.025em;margin:10px 0 6px;overflow-wrap:anywhere}.summary{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.state{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}.state::before{content:"";display:block;width:6px;height:6px;background:currentColor;border-radius:50%}.state.running{color:var(--accent)}.state.waiting,.state.review{color:var(--amber)}.state.blocked{color:var(--red)}.state.done{color:var(--accent)}.reply-mark{color:#626d61}.reply-mark svg{width:19px;height:19px}.empty{min-height:55dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:14px;gap:17px;text-align:center;padding:20px}.empty p{margin:0}.empty>svg{width:27px;height:27px;color:#8b9389}.reload{min-height:44px;min-width:72px;border:1px solid var(--line);border-radius:30px;padding:8px 20px;background:var(--paper);font-size:13px}.loader{height:24px;width:24px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:spin .9s linear infinite}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.sr:focus{position:static;width:auto;height:auto;clip:auto}.sheet{padding:0;border:1px solid var(--line);border-radius:23px;width:calc(100% - 24px);max-width:620px;max-height:88dvh;background:var(--paper);color:var(--ink);box-shadow:0 20px 100px #1c241c26}.sheet::backdrop{background:#14201760}.inside{padding:16px 20px 20px}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.sheet-head h2{font-size:19px;font-weight:650;line-height:1.6;margin:7px 0;overflow-wrap:anywhere}.close{flex:none;margin-right:-9px}.detail-meta{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:14px}.latest{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 22px;max-height:27dvh;overflow:auto}.composer{display:flex;align-items:flex-end;gap:9px;padding:12px;background:#f5f6f2;border:1px solid #e1e5da;border-radius:16px}.composer textarea{display:block;width:100%;min-height:52px;max-height:24dvh;resize:none;border:0;border-radius:4px;padding:8px 4px;background:transparent;line-height:1.65;color:var(--ink);font-size:16px;outline-offset:0}.composer textarea::placeholder{color:#7a8175}.send{height:44px;width:44px;flex:none;background:var(--accent);color:white;border-radius:50%;display:grid;place-items:center;margin-bottom:2px}.send svg{width:20px;height:20px}.receipt{font-size:12px;color:var(--muted);margin:11px 3px 0}.receipt.error{color:var(--red)}.receipt-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.receipt-row .quiet{min-height:44px;padding:7px 2px;color:var(--accent);font-size:12px}.original{margin-top:14px;display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:12px;color:var(--muted);text-decoration:none}.original svg{width:13px;height:13px}.refreshing{opacity:.5}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:700px){main{padding-top:28px}.task{padding:21px 23px 18px}.task h2{font-size:18px}.inside{padding:20px 26px 24px}}@media(max-width:360px){main{padding-inline:12px}.task{padding:16px}.inside{padding:14px}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}
</style>
</head>
<body>
<main>
<div class="top" id="top" hidden><span id="count"></span><div class="tools"><button id="history" class="icon" aria-label="過去のタスク" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v5l3 2"/></svg></button><button id="refresh" class="icon" aria-label="更新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 8a7 7 0 0 1 11.5-3L20 8M4 16l3.4 3A7 7 0 0 0 18.9 16"/></svg></button></div></div>
<p id="notice" role="status" hidden></p>
<section id="list" aria-label="依頼したタスク"></section>
<div class="empty" id="empty"><div class="loader" aria-hidden="true"></div><p role="status">接続を確認中</p></div>
</main>
<dialog class="sheet" id="thread" aria-labelledby="threadTitle"><div class="inside"><div class="sheet-head"><h2 id="threadTitle"></h2><button class="icon close" id="close" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="detail-meta"><span id="threadState" class="state"></span><span id="threadWhen"></span></div><p class="latest" id="latest"></p><form id="compose"><label class="sr" for="message">このタスクへ続けて伝える</label><div class="composer"><textarea id="message" rows="2" maxlength="8000" placeholder="続けて伝える…"></textarea><button class="send" id="send" type="submit" aria-label="送信" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form><div class="receipt-row"><p class="receipt" id="receipt" role="status"></p><button class="quiet" id="checkReceipt" hidden>送信結果を確認</button></div><a class="original" id="original" target="_blank" rel="noopener noreferrer" hidden>元の会話<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></svg></a></div></dialog>
<script>
'use strict';
// This is our proposed same-origin broker contract, NOT an OpenAI endpoint.
// No session registration, token collection, credential scraping or demo fallback.
const DAY=86400000, STALE_RUNNING=120000, MAX_SESSIONS=1000;
const LABEL={running:'進行中',waiting:'返事待ち',review:'確認待ち',blocked:'中断',done:'完了',unknown:'状況未確認'};
const cut=(v,n)=>typeof v==='string'?v.slice(0,n):'';
function stamp(v,now=Date.now()){
  const t=typeof v==='string'?Date.parse(v):typeof v==='number'?v:NaN;
  return Number.isFinite(t)&&t>0&&t<=now+60000?Math.min(t,now):0;
}
function safeUrl(v){
  try{const u=new URL(v);if(u.protocol!=='https:'||u.username||u.password||u.port||!['chatgpt.com','chat.openai.com'].includes(u.hostname))return '';
    if(!/^\/(?:g\/[^/]+\/)?c\/[a-zA-Z0-9_-]+\/?$/.test(u.pathname))return '';
    return 'https://chatgpt.com'+u.pathname;
  }catch{return '';}
}
function normalizeSession(s,now=Date.now()){
  if(!s||typeof s!=='object'||!/^[-a-zA-Z0-9_]{1,160}$/.test(s.id||''))throw Error('INVALID_SESSION');
  const state=Object.hasOwn(LABEL,s.state)?s.state:'unknown';
  return {id:s.id,title:cut(s.title,180)||'名称未取得',project:cut(s.project,80),mode:['Chat','WORK'].includes(s.mode)?s.mode:'',summary:cut(s.summary,3000),state,
    activityAt:stamp(s.activityAt,now),stateObservedAt:stamp(s.stateObservedAt,now),stateEvidence:['runtime','verified_task','assistant_report'].includes(s.stateEvidence)?s.stateEvidence:'unknown',
    url:safeUrl(s.url),canSend:s.canSend===true};
}
function normalizeFeed(p,now=Date.now()){
  if(!p||p.version!==1||p.source!=='chatgpt'||p.connected!==true||!['complete','partial'].includes(p.coverage)||!Array.isArray(p.sessions)||p.sessions.length>MAX_SESSIONS)throw Error('UNCONNECTED');
  // Reject an invalid snapshot instead of calling a silently dropped list complete.
  const sessions=p.sessions.map(s=>normalizeSession(s,now));
  if(new Set(sessions.map(s=>s.id)).size!==sessions.length)throw Error('DUPLICATE_SESSION');
  const accountId=cut(p.accountId,160);if(!accountId)throw Error('MISSING_ACCOUNT');
  return {sessions,accountId,coverage:p.coverage,canSend:p.capabilities?.sendToExistingSession===true};
}
function visualState(s,now=Date.now(),online=true){
  if(s.state==='running'&&(!online||s.stateEvidence!=='runtime'||!s.stateObservedAt||now-s.stateObservedAt>STALE_RUNNING))return 'unknown';
  if(s.state==='done'&&s.stateEvidence!=='verified_task')return 'unknown';
  if(s.stateEvidence==='unknown')return 'unknown';
  return s.state;
}
function isOld(s,now=Date.now()){
  if(!s.activityAt)return false;
  return now-s.activityAt>=(s.state==='done'&&s.stateEvidence==='verified_task'?DAY:7*DAY);
}
function visibleSessions(sessions,now=Date.now(),past=false){
  return sessions.filter(s=>isOld(s,now)===past).sort((a,b)=>b.activityAt-a.activityAt||a.id.localeCompare(b.id));
}
function relative(t,now=Date.now()){
  if(!t)return '日時未確認';const sec=Math.max(0,(now-t)/1000);
  if(sec<60)return 'たった今';if(sec<3600)return Math.floor(sec/60)+'分前';if(sec<86400)return Math.floor(sec/3600)+'時間前';return Math.floor(sec/86400)+'日前';
}
function delivery(p,sessionId,requestId){
  if(!p||p.sessionId!==sessionId||p.clientRequestId!==requestId)return 'unknown';
  if(p.status==='delivered'&&p.source==='chatgpt'&&typeof p.messageId==='string'&&p.messageId.length>0)return 'delivered';
  if(p.status==='queued')return 'queued';if(p.status==='rejected')return 'rejected';return 'unknown';
}
/* BOOT */
const $=id=>document.getElementById(id);
const endpoint=new URL('./api/sessions',location.href);
let feed=null,online=false,past=false,selected=null,syncing=false,timer=0,pollDelay=30000,lastFocused=null;
const drafts=new Map(),requests=new Map();
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function stateText(s){const v=visualState(s,Date.now(),online);return {kind:v,text:LABEL[v]};}
function notice(text){$('notice').textContent=text;$('notice').hidden=!text;}
function empty(text,retry=false){const n=$('empty');n.replaceChildren(el('p','',text));n.hidden=false;if(retry){const b=el('button','reload','再接続');b.addEventListener('click',()=>sync());n.append(b);}}
function render(){
  const list=$('list');list.replaceChildren();
  if(!feed){$('top').hidden=true;return;}
  $('top').hidden=false;const rows=visibleSessions(feed.sessions,Date.now(),past);const old=feed.sessions.some(s=>isOld(s));
  $('count').textContent=(past?'過去 · ':'')+rows.length+'件'+(feed.coverage==='partial'?'（取得分）':'');
  $('history').hidden=!old&&!past;$('history').setAttribute('aria-pressed',String(past));$('history').setAttribute('aria-label',past?'最近のタスク':'過去のタスク');
  $('empty').hidden=rows.length>0;if(!rows.length)empty(past?'過去のタスクはありません':'最近動きのあるタスクはありません');
  for(const s of rows){
    const st=stateText(s),b=el('button','task');b.dataset.session=s.id;b.setAttribute('aria-label',s.title+' · '+st.text+' · 続けて伝える');
    const meta=el('div','meta');meta.append(el('span','place',[s.project,s.mode].filter(Boolean).join(' · ')),el('span','when',relative(s.activityAt)));
    const foot=el('div','foot'),arrow=el('span','reply-mark','↗');arrow.setAttribute('aria-hidden','true');foot.append(el('span','state '+st.kind,st.text),arrow);
    b.append(meta,el('h2','',s.title));if(s.summary)b.append(el('p','summary',s.summary));b.append(foot);
    b.addEventListener('click',()=>openThread(s.id,b));list.append(b);
  }
  if(selected)updateThread();
}
function current(){return feed?.sessions.find(s=>s.id===selected);}
function openThread(id,button){selected=id;lastFocused=button;$('message').value=drafts.get(id)||'';updateThread();$('thread').showModal();$('message').focus({preventScroll:true});}
function updateThread(){
  const s=current();if(!s){$('message').disabled=true;$('send').disabled=true;$('receipt').textContent='このタスクの接続を確認できません';return;}
  const st=stateText(s);$('threadTitle').textContent=s.title;$('threadState').className='state '+st.kind;$('threadState').textContent=st.text;$('threadWhen').textContent=relative(s.activityAt);
  $('latest').textContent=s.summary;$('latest').hidden=!s.summary;$('original').hidden=!s.url;if(s.url)$('original').href=s.url;else $('original').removeAttribute('href');
  const req=requests.get(s.id),pending=req&&['sending','queued','unknown'].includes(req.state);
  $('message').disabled=!!pending;const canSend=online&&feed.canSend&&s.canSend;
  $('send').disabled=!canSend||pending||!$('message').value.trim();$('checkReceipt').hidden=!req||!['queued','unknown'].includes(req.state);
  let text='',error=false;
  if(req){
    if(req.state==='sending')text='送信中';
    if(req.state==='delivered')text='この会話へ送信しました';
    if(req.state==='queued')text='送信待ち';
    if(req.state==='unknown'){text='送信結果を確認できていません';error=true;}
    if(req.state==='rejected'){text='送信されませんでした';error=true;}
  }
  if(!canSend&&!pending&&req?.state!=='delivered'){text='この会話への送信は未接続です';error=true;}
  $('receipt').textContent=text;$('receipt').className='receipt'+(error?' error':'');
}
function closeThread(){if(selected)drafts.set(selected,$('message').value);$('thread').close();selected=null;const target=[...$('list').children].find(n=>n.dataset.session===lastFocused?.dataset.session);target?.focus({preventScroll:true});}
async function json(url,options={}){
  const controller=new AbortController(),abort=setTimeout(()=>controller.abort(),12000);
  try{const r=await fetch(url,{credentials:'same-origin',cache:'no-store',redirect:'error',...options,headers:{Accept:'application/json',...options.headers},signal:controller.signal});
    if(!r.ok)throw Error('HTTP_'+r.status);if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('INVALID_CONTENT_TYPE');
    const raw=await r.text();if(raw.length>1500000)throw Error('OVERSIZE');return JSON.parse(raw);
  }finally{clearTimeout(abort);}
}
function schedule(){clearTimeout(timer);if(!document.hidden)timer=setTimeout(()=>sync(),pollDelay);}
async function sync(){
  if(syncing){schedule();return;}syncing=true;$('refresh').disabled=true;
  try{
    const next=normalizeFeed(await json(endpoint));
    if(feed&&feed.accountId!==next.accountId){if($('thread').open)closeThread();selected=null;drafts.clear();requests.clear();}
    feed=next;online=true;pollDelay=30000;notice(feed.coverage==='partial'?'一部のタスクのみ取得しています':'');render();
  }catch(e){
    online=false;pollDelay=Math.min(pollDelay*2,300000);
    // Authentication loss must not leave the previous account's content visible.
    if(/^HTTP_40[13]$/.test(e.message)){feed=null;if($('thread').open)closeThread();selected=null;drafts.clear();requests.clear();$('list').replaceChildren();}
    if(feed){notice('更新を確認できていません');render();}else{notice('');render();empty('ChatGPTに接続できていません',true);}
  }finally{syncing=false;$('refresh').disabled=false;schedule();}
}
async function send(){
  const s=current(),text=$('message').value.trim();if(!s||!text||!online||!feed.canSend||!s.canSend)return;
  const previous=requests.get(s.id);if(previous&&['sending','queued','unknown'].includes(previous.state))return;
  const req={id:crypto.randomUUID(),sessionId:s.id,text,state:'sending',accountId:feed.accountId};requests.set(s.id,req);drafts.set(s.id,text);updateThread();
  try{const p=await json(new URL(endpoint.pathname+'/'+encodeURIComponent(s.id)+'/messages',endpoint),{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':req.id},body:JSON.stringify({text,clientRequestId:req.id})});
    if(feed?.accountId!==req.accountId)return;req.state=delivery(p,s.id,req.id);
  }catch{req.state='unknown';}
  settled(req);
}
function settled(req){
  if(feed?.accountId!==req.accountId||requests.get(req.sessionId)!==req)return;
  if(req.state==='delivered'){drafts.delete(req.sessionId);if(selected===req.sessionId)$('message').value='';void sync();}
  if(selected===req.sessionId)updateThread();
}
async function checkReceipt(){
  const req=requests.get(selected);if(!req||!['queued','unknown'].includes(req.state))return;$('checkReceipt').disabled=true;
  try{const p=await json(new URL(endpoint.pathname+'/'+encodeURIComponent(req.sessionId)+'/requests/'+encodeURIComponent(req.id),endpoint));if(feed?.accountId===req.accountId)req.state=delivery(p,req.sessionId,req.id);}catch{req.state='unknown';}
  finally{$('checkReceipt').disabled=false;settled(req);}
}
$('history').addEventListener('click',()=>{past=!past;render();window.scrollTo({top:0});});
$('refresh').addEventListener('click',()=>sync());$('close').addEventListener('click',closeThread);
$('thread').addEventListener('cancel',e=>{e.preventDefault();closeThread();});
$('message').addEventListener('input',()=>{if(selected)drafts.set(selected,$('message').value);updateThread();});
$('compose').addEventListener('submit',e=>{e.preventDefault();void send();});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.isComposing){e.preventDefault();void send();}});
$('checkReceipt').addEventListener('click',()=>checkReceipt());
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)void sync();});
window.addEventListener('offline',()=>{online=false;notice('更新を確認できていません');if(feed)render();});
window.addEventListener('online',()=>sync());
// Polling never writes activity timestamps and never sends messages.
void sync();
</script>
</body>
</html>
