<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182329"><title>剣の演武 | Visual Review Lab</title>
<link rel="stylesheet" href="./src/motion-review.css">
</head>
<body>
<main>
<header><a href="../" aria-label="Visual Review Labに戻る">‹ Labへ</a><h1>剣の演武 <small>SHINO</small></h1></header>
<section class="stage" aria-label="演武の表示"><section id="reference-panel" hidden aria-label="参考動画"><video id="reference-video" muted playsinline preload="metadata" aria-label="提供動画の2.5秒から6.5秒"></video><span>参考動画 · 2.5–6.5秒</span><p id="reference-error" hidden>参考動画を読み込めませんでした。</p></section><div class="render-view"><canvas id="motion-stage" aria-label="しのちゃんの全身演武。ドラッグで視点を変更"></canvas><output id="phase-label">準備中</output></div></section>
<section class="controls" aria-label="モーションの確認">
<p id="motion-status" role="status" aria-live="polite">しのちゃんと斬撃を読み込んでいます。</p>
<div class="mode-row"><label>演目 <select id="mode"><option value="sequence">既存の技で30秒演武</option><option value="combination">既存4技をつなぐ</option><option value="baseline">各技を最後まで再生</option><option value="single">技を単体で確認</option></select></label><output id="time-label">0.0 / 30.0 秒</output></div>
<label id="single-kind-row" hidden>技<select id="single-kind"><option value="slash">流し斬り</option><option value="back">斬り返し</option><option value="thrust">刺し貫く</option><option value="uppercut">斬り上げる</option><option value="heavy">叩き斬る</option></select></label>
<div class="buttons"><button id="play" disabled>一時停止</button><button id="restart" disabled>最初から</button><label>速さ<select id="speed"><option value="1">通常</option><option value="0.5">1/2</option><option value="0.25">1/4</option></select></label><label class="compare-toggle"><input id="compare-reference" type="checkbox">参考動画と並べる</label></div>
<div class="timeline"><button id="previous-frame" aria-label="1コマ戻る" disabled>−1</button><input id="timeline" aria-label="モーションの再生位置" type="range" min="0" max="1" step="0.001" value="0" disabled><button id="next-frame" aria-label="1コマ進む" disabled>＋1</button></div>
<div class="buttons views" aria-label="視点"><button data-view="three" aria-pressed="true">斜め</button><button data-view="front" aria-pressed="false">正面</button><button data-view="side" aria-pressed="false">横</button><button data-view="back" aria-pressed="false">背面</button></div>
<details><summary>この動きについて</summary><p>技構成で選べる既存の技を組み合わせています。単体の改善は技構成と演武の両方に反映されます。「既存4技をつなぐ」では戻りと次の準備を重ね、「各技を最後まで再生」と比較できます。参考動画は4秒の比較モードで並べられます。</p><div class="options"><label><input id="repeat" type="checkbox" checked> 繰り返す</label><label><input id="trail" type="checkbox" checked> 刀の軌跡</label></div><p id="motion-version"></p></details>
<button id="retry" hidden>再読み込み</button>
</section>
</main><script type="module" src="./src/motion-review.js"></script>
</body></html>
