<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0d10" />
  <title>輪廻転焦 Visual Review Lab</title>
</head>
<body>
  <main class="review-shell">
    <header class="topbar">
      <div class="title"><strong>Visual Review Lab</strong><span>3D / Motion / VFX</span></div>
      <div class="telemetry"><span id="fps">— FPS</span><span id="clip-label">No clip</span></div>
    </header>

    <section class="viewport">
      <canvas id="review-canvas"></canvas>
      <div class="hud">
        <div class="badge" id="review-status">Review Lab starting…</div>
        <div class="badge" id="source-label">No source</div>
      </div>
    </section>

    <aside class="panel">
      <div class="field">
        <label for="preset">Preset</label>
        <select id="preset"><option value="">手動 / fallback</option></select>
      </div>
      <div class="source-tools">
        <input id="model-url" type="text" inputmode="url" placeholder="GLB / glTF URL" autocomplete="off" />
        <button class="btn tiny" id="load-url" type="button">読込</button>
        <label class="btn tiny file-button">GLB<input id="model-file" type="file" accept=".glb,model/gltf-binary" /></label>
      </div>
      <div class="row compact"><button class="btn tiny ghost" id="fallback" type="button">Fallback rig</button><span class="hint">実ゲームAssetが未接続でも操作系を検証できます。</span></div>

      <div class="divider"></div>
      <div class="clip-tools">
        <select id="clip"><option value="">Animation clipなし</option></select>
        <select id="speed" aria-label="再生速度">
          <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </div>
      <div class="timeline-wrap">
        <span class="time" id="current-time">0.000s</span>
        <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" />
        <span class="time" id="duration">0.000s</span>
      </div>
      <div class="row compact">
        <button class="btn tiny" id="restart" type="button">↺</button>
        <button class="btn tiny" id="step-back" type="button">−1f</button>
        <button class="btn tiny primary" id="play-toggle" type="button">一時停止</button>
        <button class="btn tiny" id="step-forward" type="button">+1f</button>
        <label class="toggle"><input id="loop-toggle" type="checkbox" checked />Loop</label>
      </div>

      <div class="divider"></div>
      <div class="camera-strip">
        <button class="btn tiny" data-camera="front" type="button">前</button><button class="btn tiny" data-camera="back" type="button">後</button><button class="btn tiny" data-camera="left" type="button">左</button><button class="btn tiny" data-camera="right" type="button">右</button><button class="btn tiny" data-camera="top" type="button">上</button><button class="btn tiny" data-camera="three" type="button">斜</button>
      </div>
      <div class="row compact">
        <label class="toggle"><input id="skeleton-toggle" type="checkbox" />Skeleton</label>
        <label class="toggle"><input id="bounds-toggle" type="checkbox" />Bounds</label>
        <label class="toggle"><input id="wireframe-toggle" type="checkbox" />Wire</label>
        <label class="toggle"><input id="grid-toggle" type="checkbox" checked />Grid</label>
      </div>

      <div class="divider"></div>
      <div class="row">
        <div class="field"><label for="overlay-time">VFX review marker / sec</label><input id="overlay-time" type="number" min="0" step="0.001" value="0.420" /></div>
        <label class="toggle"><input id="overlay-toggle" type="checkbox" checked />marker</label>
        <button class="btn tiny" id="trigger-overlay" type="button">発火</button>
      </div>
      <p class="hint">markerはタイミング確認用オーバーレイです。実ゲームVFXは review-adapter.js から同じ実装を接続します。</p>

      <div class="divider"></div>
      <div class="field"><label for="review-note">指摘メモ</label><textarea id="review-note" placeholder="例: Attack_02 0.428s。右肘が高い。ヒットVFXを0.08秒遅らせる。"></textarea></div>
      <div class="review-note-actions">
        <button class="btn primary" id="copy-review" type="button">レビュー情報をコピー</button>
        <button class="btn" id="copy-link" type="button">状態URL</button>
        <button class="btn" id="capture" type="button">画像</button>
      </div>
    </aside>
  </main>
  <script type="module" src="./src/review/main.js"></script>
</body>
</html>
