<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b0d10"/><link rel="icon" href="./review-icons/app-icon.svg" type="image/svg+xml"/><link rel="manifest" href="./visual-review.webmanifest"/><title>輪廻転焦 Visual Review Lab</title></head><body><main class="review-shell">
<header class="topbar"><div class="title"><strong>Visual Review Lab</strong><span id="build-label">3D / Motion / VFX</span></div><div class="telemetry"><span id="fps">0 FPS</span><span id="clip-label">No clip</span></div></header>
<section class="viewport"><canvas id="review-canvas"></canvas><div class="hud"><div class="badge" id="review-status" role="status">Review Lab starting…</div><div class="badge" id="source-label">No source</div></div></section><aside class="panel">
<nav class="review-tabs" aria-label="レビュー表示"><button class="tab active" type="button" data-tab="simple">確認</button><button class="tab" type="button" data-tab="advanced">詳細</button></nav>
<section class="tab-page active simple-page" data-page="simple">
<div class="primary-controls"><div class="field source-field"><label for="preset">モーションソース</label><select id="preset" aria-label="モーションソース"></select></div><div class="field clip-field"><label for="clip">技を選ぶ</label><select id="clip" aria-label="技モーション"><option value="">素材未読込</option></select></div></div>
<div class="simple-actions"><button class="btn primary skill-fire" id="skill-fire">技を発動</button><label class="toggle repeat-toggle"><input id="loop-toggle" type="checkbox" checked/>繰り返す</label></div>
<div class="motion-nav"><button class="btn" id="prev-motion">◀ 前</button><button class="btn" id="rest-pose">静止</button><button class="btn" id="next-motion">次 ▶</button></div>
<div id="weapon-controls" class="weapon-controls"><div class="field"><label for="weapon-select">武器</label><select id="weapon-select" aria-label="レビュー武器"><option value="greatsword">大剣</option><option value="sword">片手剣</option><option value="axe">片手斧</option><option value="greataxe">両手斧</option><option value="dagger">短剣</option><option value="crossbow">クロスボウ</option><option value="staff">杖</option><option value="wand">ワンド</option></select></div><label class="toggle"><input id="weapon-toggle" type="checkbox" checked/>表示</label></div>
<div class="motion-card compact-card"><span class="eyebrow">現在のモーション</span><strong id="motion-name">素材読込中</strong><span id="motion-meta">技を選択してください</span><button class="btn tiny" id="copy-motion">情報コピー</button></div><p class="hint" id="family-summary">実素材の収録内容を照合します。</p>
</section>
<section class="tab-page" data-page="advanced"><p class="advanced-note">時刻・フレーム・読み込み・武器角度・VFX・レビュー記録はここで調整します。</p><div class="source-tools"><input id="model-url" type="text" inputmode="url" placeholder="GLB / glTF / VRM URL"/><button class="btn tiny" id="load-url">読込</button><label class="btn tiny file-button">GLB/VRM<input id="model-file" type="file" accept=".glb,.vrm"/></label></div><div class="row compact"><button class="btn tiny" id="retry">再試行</button><select id="speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div><div class="timeline-wrap"><span class="time" id="current-time">0.000s</span><input id="timeline" type="range" min="0" max="1" step="0.001" value="0"/><span class="time" id="duration">0.000s</span></div><div class="row compact"><button class="btn tiny" id="restart">↺</button><button class="btn tiny" id="step-back">−1f</button><button class="btn tiny" id="play-toggle">再生</button><button class="btn tiny" id="step-forward">+1f</button></div><label class="toggle"><input id="in-place" type="checkbox" checked/>その場で再生</label><div class="divider"></div><div class="camera-strip"><button class="btn tiny" data-camera="front">前</button><button class="btn tiny" data-camera="back">後</button><button class="btn tiny" data-camera="left">左</button><button class="btn tiny" data-camera="right">右</button><button class="btn tiny" data-camera="top">上</button><button class="btn tiny" data-camera="three">斜</button></div><div class="row compact"><label class="toggle"><input id="skeleton-toggle" type="checkbox"/>Skeleton</label><label class="toggle"><input id="bounds-toggle" type="checkbox"/>Bounds</label><label class="toggle"><input id="wireframe-toggle" type="checkbox"/>Wire</label><label class="toggle"><input id="grid-toggle" type="checkbox" checked/>Grid</label></div><div class="divider"></div><div class="row compact"><label>倍率<input id="weapon-scale" type="number" min="0.1" max="1" step="0.05" value="0.5"/></label><label>X°<input id="weapon-x" type="number" value="0" step="5"/></label><label>Y°<input id="weapon-y" type="number" value="0" step="5"/></label><label>Z°<input id="weapon-z" type="number" value="-90" step="5"/></label></div><div class="divider"></div><div class="row"><div class="field"><label for="overlay-time">VFXマーカー / 秒</label><input id="overlay-time" type="number" min="0" step="0.001" value="0.420"/></div><label class="toggle"><input id="overlay-toggle" type="checkbox"/>VFX</label><button class="btn tiny" id="trigger-overlay">発火</button></div><div class="field"><label for="review-note">指摘メモ</label><textarea id="review-note" placeholder="例：剣攻撃の振り終わりが固い。"></textarea></div><div class="review-note-actions"><button class="btn primary" id="copy-review">レビュー情報</button><button class="btn" id="capture">画像</button><button class="btn" id="copy-link">状態URL</button></div><p class="hint"><a href="./asset-review/CREDITS.txt" target="_blank" rel="noopener">素材・ライセンス</a> · <a href="./asset-review/manifest.json" target="_blank" rel="noopener">版・ハッシュ・収録一覧</a></p></section></aside></main>
<script>(()=>{const $=s=>document.querySelector(s),clip=$('#clip'),motion=$('#motion-name'),meta=$('#motion-meta');const sync=()=>{const name=clip.value||'静止比較';motion.textContent=name;meta.textContent=clip.value?`収録モーション: ${name}`:'モーションなし / 元モデル比較';};document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab-page').forEach(x=>x.classList.toggle('active',x.dataset.page===b.dataset.tab));}));clip.addEventListener('change',()=>setTimeout(sync));new MutationObserver(sync).observe(clip,{childList:true,subtree:true});$('#skill-fire').addEventListener('click',()=>{if(!clip.value)return;$('#restart').click();setTimeout(()=>{if($('#play-toggle').textContent==='再生')$('#play-toggle').click();},0);});const move=step=>{const options=[...clip.options].filter(o=>o.value&&!o.disabled);if(!options.length)return;let i=Math.max(0,options.findIndex(o=>o.value===clip.value));i=(i+step+options.length)%options.length;clip.value=options[i].value;clip.dispatchEvent(new Event('change'));};$('#prev-motion').addEventListener('click',()=>move(-1));$('#next-motion').addEventListener('click',()=>move(1));$('#copy-motion').addEventListener('click',async()=>{const text=[`Motion: ${clip.value||'rest'}`,`Source: ${$('#source-label').textContent}`,`Duration: ${$('#duration').textContent}`,`Build: ${$('#build-label').textContent}`].join('\n');await navigator.clipboard.writeText(text);$('#review-status').textContent='モーション情報をコピーしました';});sync();})();</script><script type="module" src="./src/review/main.js"></script></body></html>
