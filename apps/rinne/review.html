<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#152a2b"/><link rel="icon" href="./review-icons/app-icon.svg" type="image/svg+xml"/><title>輪廻転焦 Visual Review Lab</title></head><body>
<main class="review-shell">
<header class="topbar"><div class="title"><strong>Visual Review Lab</strong><span id="build-label">3D / Motion / VFX</span></div><div class="telemetry"><span id="fps">0 FPS</span><span id="clip-label">No clip</span></div></header>
<div id="load-progress-wrap" class="load-progress"><div class="load-progress-copy"><strong id="load-progress-label">素材を準備しています</strong><span id="load-progress-detail">0%</span></div><progress id="load-progress" max="100" value="0"></progress></div>
<section class="viewport"><canvas id="review-canvas"></canvas><div class="stage-header"><span class="eyebrow">MOTION REVIEW</span><strong id="motion-name">素材読込中</strong><span id="motion-meta">読み込み済みから確認できます</span></div><div class="hud"><div class="badge" id="review-status" role="status">Review Lab starting…</div><div class="badge" id="source-label">No source</div></div></section>
<aside class="panel">
<select id="preset" hidden aria-hidden="true"></select><select id="clip" hidden aria-hidden="true"><option value="">素材未読込</option></select>
<div class="notebook-head"><div class="book-title"><span class="notebook-kicker">輪廻転焦 / モーション確認</span><h1>技帳</h1></div><div class="model-strip" aria-label="キャラモデル"><button class="model-chip active" data-model="SHINO" type="button">SHINO</button><button class="model-chip" data-model="A" type="button">A</button><button class="model-chip" data-model="B" type="button">B</button><button class="model-chip" data-model="C" type="button">C</button><button class="model-chip" data-model="TSUKU" type="button">TSUKU</button></div><div class="transport-mini"><button class="mini" id="rest-pose" type="button">静止</button><label class="toggle"><input id="loop-toggle" type="checkbox" checked/>反復</label></div></div>
<nav class="review-tabs" aria-label="レビュー用途"><button class="tab active" type="button" data-review-tab="skill">技構成</button><button class="tab" type="button" data-review-tab="reaction">被弾</button><button class="tab" type="button" data-review-tab="stance">構え</button><button class="tab" type="button" data-review-tab="parry">パリィ</button><button class="tab" type="button" data-review-tab="axis">心技体</button><button class="tab" type="button" data-review-tab="move">移動</button><button class="tab detail-tab" type="button" data-review-tab="advanced">詳細</button></nav>
<div class="notebook-scroll">
<section class="review-page active" data-review-page="skill"><div class="section-heading">技の構成 <small>序・破・急</small></div><div class="stage-titles"><span>段</span><span>モーション</span><span>操作</span></div>
<div class="stage-row"><b class="stage-mark">序</b><select class="review-select" id="stage-jo" data-filter="skill"></select><button class="play-slot" data-play-select="stage-jo">再生</button></div>
<div class="stage-row"><b class="stage-mark">破</b><select class="review-select" id="stage-ha" data-filter="skill"></select><button class="play-slot" data-play-select="stage-ha">再生</button></div>
<div class="stage-row"><b class="stage-mark">急</b><select class="review-select" id="stage-kyu" data-filter="skill"></select><button class="play-slot" data-play-select="stage-kyu">再生</button></div></section>
<section class="review-page" data-review-page="reaction"><div class="section-heading">被弾モーション</div><div class="single-review"><select class="review-select" id="reaction-select" data-filter="reaction"></select><button class="play-slot strong" data-play-select="reaction-select">被弾を確認</button></div></section>
<section class="review-page" data-review-page="stance"><div class="section-heading">構えモーション</div><div class="single-review"><select class="review-select" id="stance-select" data-filter="stance"></select><button class="play-slot strong" data-play-select="stance-select">構えを確認</button></div></section>
<section class="review-page" data-review-page="parry"><div class="section-heading">パリィモーション</div><div class="single-review"><select class="review-select" id="parry-select" data-filter="parry"></select><button class="play-slot strong" data-play-select="parry-select">パリィを確認</button></div></section>
<section class="review-page" data-review-page="axis"><div class="section-heading">心技体 <small>設定候補</small></div><div class="stage-titles"><span>軸</span><span>モーション</span><span>操作</span></div>
<div class="stage-row axis-row"><b class="stage-mark">心</b><select class="review-select" id="axis-shin" data-filter="shin"></select><button class="play-slot" data-play-select="axis-shin">再生</button></div>
<div class="stage-row axis-row"><b class="stage-mark">技</b><select class="review-select" id="axis-gi" data-filter="gi"></select><button class="play-slot" data-play-select="axis-gi">再生</button></div>
<div class="stage-row axis-row"><b class="stage-mark">体</b><select class="review-select" id="axis-tai" data-filter="tai"></select><button class="play-slot" data-play-select="axis-tai">再生</button></div></section>
<section class="review-page" data-review-page="move"><div class="section-heading">移動系</div><div class="motion-pair"><div><label>移動</label><select class="review-select" id="move-select" data-filter="move"></select><button class="play-slot strong" data-play-select="move-select">移動を確認</button></div><div><label>ダッシュ</label><select class="review-select" id="dash-select" data-filter="dash"></select><button class="play-slot strong" data-play-select="dash-select">ダッシュを確認</button></div></div></section>
<section class="review-page advanced-page" data-review-page="advanced"><div class="section-heading">詳細調整</div><div class="source-tools"><input id="model-url" type="text" inputmode="url" placeholder="GLB / glTF / VRM URL"/><button class="btn tiny" id="load-url">読込</button><label class="btn tiny file-button">GLB/VRM<input id="model-file" type="file" accept=".glb,.vrm"/></label></div><div class="row compact"><button class="btn tiny" id="retry">再読込</button><select id="speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div><div class="timeline-wrap"><span class="time" id="current-time">0.000s</span><input id="timeline" type="range" min="0" max="1" step="0.001" value="0"/><span class="time" id="duration">0.000s</span></div><div class="row compact"><button class="btn tiny" id="restart">↺</button><button class="btn tiny" id="step-back">−1f</button><button class="btn tiny" id="play-toggle">再生</button><button class="btn tiny" id="step-forward">+1f</button><button class="btn tiny" id="prev-motion">◀</button><button class="btn tiny" id="next-motion">▶</button></div><label class="toggle"><input id="in-place" type="checkbox" checked/>その場で再生</label><div class="divider"></div><div class="camera-strip"><button class="btn tiny" data-camera="front">前</button><button class="btn tiny" data-camera="back">後</button><button class="btn tiny" data-camera="left">左</button><button class="btn tiny" data-camera="right">右</button><button class="btn tiny" data-camera="top">上</button><button class="btn tiny" data-camera="three">斜</button></div><div class="row compact"><label class="toggle"><input id="skeleton-toggle" type="checkbox"/>Skeleton</label><label class="toggle"><input id="bounds-toggle" type="checkbox"/>Bounds</label><label class="toggle"><input id="wireframe-toggle" type="checkbox"/>Wire</label><label class="toggle"><input id="grid-toggle" type="checkbox" checked/>Grid</label></div><div id="weapon-controls" class="weapon-controls"><div class="field"><label for="weapon-select">武器</label><select id="weapon-select"><option value="greatsword">大剣</option><option value="sword">片手剣</option><option value="axe">片手斧</option><option value="greataxe">両手斧</option><option value="dagger">短剣</option><option value="crossbow">クロスボウ</option><option value="staff">杖</option><option value="wand">ワンド</option></select></div><label class="toggle"><input id="weapon-toggle" type="checkbox"/>表示</label></div><div class="row compact"><label>倍率<input id="weapon-scale" type="number" min="0.1" max="1" step="0.05" value="0.5"/></label><label>X°<input id="weapon-x" type="number" value="0" step="5"/></label><label>Y°<input id="weapon-y" type="number" value="0" step="5"/></label><label>Z°<input id="weapon-z" type="number" value="-90" step="5"/></label></div><div class="divider"></div><div class="row"><div class="field"><label for="overlay-time">VFX / 秒</label><input id="overlay-time" type="number" min="0" step="0.001" value="0.420"/></div><label class="toggle"><input id="overlay-toggle" type="checkbox"/>VFX</label><button class="btn tiny" id="trigger-overlay">発火</button></div><div class="field"><label for="review-note">指摘メモ</label><textarea id="review-note"></textarea></div><div class="review-note-actions"><button class="btn primary" id="copy-review">レビュー情報</button><button class="btn" id="capture">画像</button><button class="btn" id="copy-link">状態URL</button></div></section>
</div><footer class="panel-footer"><span id="family-summary">軽い素材から順次読み込みます。</span><button class="btn tiny" id="copy-motion">現在情報</button><button class="btn primary" id="skill-fire" hidden>技を発動</button></footer>
</aside></main>
<div class="picker-backdrop" id="picker-backdrop" hidden><section class="picker-sheet" role="dialog" aria-modal="true"><header><strong id="picker-title">モーション選択</strong><button id="picker-close" type="button">閉じる</button></header><div id="picker-list" class="picker-list"></div></section></div>
<script>(()=>{const $=s=>document.querySelector(s),master=$('#clip');const filters={skill:/Attack|Sword|Slash|Melee|Punch|Kick|Strike|Skill|技|攻撃/i,reaction:/Hit|Damage|Hurt|Reaction|Startle|被弾|驚/i,stance:/Idle|Ready|Stance|Guard|Pose|構え|待機/i,parry:/Parry|Guard|Block|Deflect|Counter|受け|防御/i,shin:/Idle|Talk|Speak|Reaction|Emote|Pose|心/i,gi:/Attack|Sword|Slash|Melee|Parry|Skill|技/i,tai:/Walk|Run|Sprint|Dash|Hit|Body|体/i,move:/Walk|Jog|Move|歩行|移動/i,dash:/Run|Sprint|Dash|Jog|走行|ダッシュ/i};
const allOptions=()=>[...master.options].filter(o=>o.value&&!o.disabled).map(o=>({value:o.value,label:o.textContent||o.value}));
function fill(select,kind){const current=select.value,all=allOptions(),re=filters[kind],matched=all.filter(o=>re.test(o.value+' '+o.label)),use=matched.length?matched:all;select.replaceChildren(...use.map(o=>new Option(o.label,o.value)));if(use.some(o=>o.value===current))select.value=current;syncTrigger(select);}
function refreshSelectors(){document.querySelectorAll('.review-select').forEach(s=>fill(s,s.dataset.filter));const opts=allOptions();if(opts.length){const pick=(id,re,fallback=0)=>{const s=$(id);if(!s||s.dataset.seeded)return;const found=opts.find(o=>re.test(o.value+' '+o.label))||opts[fallback]||opts[0];if(found){s.value=found.value;s.dataset.seeded='1';syncTrigger(s);}};pick('#stage-jo',/Idle|Ready|Stance/i,0);pick('#stage-ha',/Attack|Sword|Slash|Melee/i,1);pick('#stage-kyu',/Attack|Sprint|Run|Dash/i,2);pick('#reaction-select',/Hit|Damage|Hurt|Reaction/i,0);pick('#stance-select',/Idle|Ready|Stance|Guard|Pose/i,0);pick('#parry-select',/Parry|Guard|Block|Deflect/i,0);pick('#axis-shin',/Idle|Talk|Speak|Reaction|Emote|Pose/i,0);pick('#axis-gi',/Attack|Sword|Slash|Melee|Parry/i,0);pick('#axis-tai',/Walk|Run|Sprint|Dash|Hit/i,0);pick('#move-select',/Walk|Jog|Move/i,0);pick('#dash-select',/Run|Sprint|Dash|Jog/i,0);}}
function playValue(value){if(!value)return;master.value=value;master.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>{const p=$('#play-toggle');if(p&&p.textContent==='再生')p.click();},0);}
function copyValue(value){const opt=[...master.options].find(o=>o.value===value);const text=[`Motion: ${value||'rest'}`,`Label: ${opt?.textContent||value||'rest'}`,`Source: ${$('#source-label').textContent}`,`Build: ${$('#build-label').textContent}`].join('\n');return navigator.clipboard.writeText(text).then(()=>{$('#review-status').textContent='モーション情報をコピーしました';});}
const backdrop=$('#picker-backdrop'),list=$('#picker-list'),title=$('#picker-title');let activeSelect=null;function syncTrigger(s){const b=document.querySelector(`[data-picker-for="${s.id}"]`);if(b)b.textContent=s.selectedOptions[0]?.textContent||'選択';}
function openPicker(s){activeSelect=s;title.textContent=`${s.closest('.stage-row,.single-review,.motion-pair>div')?.querySelector('.stage-mark,label')?.textContent||'モーション'}を選択`;list.replaceChildren(...[...s.options].map(o=>{const b=document.createElement('button');b.type='button';b.className='picker-item'+(o.value===s.value?' active':'');b.innerHTML=`<span>${o.textContent}</span><small>${o.value}</small>`;b.onclick=()=>{s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));syncTrigger(s);backdrop.hidden=true;};return b;}));backdrop.hidden=false;}
document.querySelectorAll('.review-select').forEach(s=>{s.hidden=true;const b=document.createElement('button');b.type='button';b.className='picker-trigger';b.dataset.pickerFor=s.id;b.textContent='選択';b.onclick=()=>openPicker(s);s.after(b);});$('#picker-close').onclick=()=>backdrop.hidden=true;backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.hidden=true;});
document.querySelectorAll('[data-play-select]').forEach(b=>{const id=b.dataset.playSelect;b.addEventListener('click',()=>playValue($('#'+id)?.value));const c=document.createElement('button');c.type='button';c.className='copy-slot';c.textContent='コピー';c.onclick=()=>copyValue($('#'+id)?.value||'');b.after(c);});
document.querySelectorAll('[data-review-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-review-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-review-page]').forEach(x=>x.classList.toggle('active',x.dataset.reviewPage===b.dataset.reviewTab));}));
const modelUrls={A:'./simulator/assets/A_review.vrm',B:'./simulator/assets/B_review.vrm',C:'./simulator/assets/C_review.vrm',TSUKU:'./simulator/assets/TSUKU_review.vrm'};document.querySelectorAll('.model-chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.model-chip').forEach(x=>x.classList.toggle('active',x===b));const id=b.dataset.model;if(id==='SHINO'){ $('#model-url').value=''; $('#retry').click(); }else{ $('#model-url').value=modelUrls[id]; $('#load-url').click(); }}));
const motion=$('#motion-name'),meta=$('#motion-meta');const sync=()=>{motion.textContent=master.value||'静止比較';meta.textContent=master.value?'選択中のモーション':'元モデル静止比較';refreshSelectors();};master.addEventListener('change',()=>setTimeout(sync));new MutationObserver(sync).observe(master,{childList:true,subtree:true});$('#copy-motion').addEventListener('click',()=>copyValue(master.value||''));sync();})();</script>
<script type="module" src="./src/review/main.js"></script></body></html>
