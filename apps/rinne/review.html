<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1211">
<title>輪廻転焦 Visual Review</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ece9df;background:#0d1211;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1211}.review-launcher{min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}.launcher-inner{width:min(100%,420px)}h1{margin:0 0 22px;font-size:clamp(28px,8vw,42px);letter-spacing:-.025em}.launcher-list{display:grid;gap:8px}.review-link{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;border:1px solid #303835;border-radius:12px;background:#141a18;color:#ece9df;text-decoration:none;font-size:17px;font-weight:680}.review-link-label{min-width:0}.review-link::after{content:'›';flex:0 0 auto;color:#77827c;font-size:25px;font-weight:400}.review-link:active{transform:scale(.99);background:#1b2320}.review-link.primary{border-color:#6f6a59;background:#211f18}.review-preload-state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;color:#8f9994;font-size:10px;font-weight:620;letter-spacing:.02em}.review-preload-state::before{content:'';width:7px;height:7px;border:1px solid currentColor;border-radius:50%}.review-link[data-preload-state="loading"] .review-preload-state{color:#d8c58d}.review-link[data-preload-state="loading"] .review-preload-state::before{border-width:2px;border-color:#59635f;border-top-color:currentColor;animation:review-preload-spin .9s linear infinite}.review-link[data-preload-state="ready"] .review-preload-state{color:#a9bdab}.review-link[data-preload-state="ready"] .review-preload-state::before{background:currentColor;border-color:currentColor}.review-link[data-preload-state="error"] .review-preload-state{color:#c89e90}@keyframes review-preload-spin{to{transform:rotate(360deg)}}@media(max-width:520px){.review-launcher{place-items:start center;padding-top:max(28px,env(safe-area-inset-top))}.launcher-inner{width:100%}h1{font-size:32px;margin-bottom:18px}.review-link{min-height:62px;font-size:18px}.review-preload-state{font-size:9px}}@media(prefers-reduced-motion:reduce){.review-link[data-preload-state="loading"] .review-preload-state::before{animation:none}}
</style>
</head>
<body>
<main class="review-launcher">
  <div class="launcher-inner">
    <h1>Visual Review</h1>
    <nav class="launcher-list" aria-label="確認項目">
      <a class="review-link" data-review-target="characters" data-preload-state="queued" href="./characters.html?review=character"><span class="review-link-label">キャラ確認</span><small class="review-preload-state" data-review-preload-state>準備待ち</small></a>
      <a class="review-link" data-review-target="motion" data-preload-state="queued" href="./characters.html?review=motion"><span class="review-link-label">モーション確認</span><small class="review-preload-state" data-review-preload-state>準備待ち</small></a>
      <a class="review-link" data-review-target="assets" data-preload-state="queued" href="./review-assets.html"><span class="review-link-label">装備・物体</span><small class="review-preload-state" data-review-preload-state>準備待ち</small></a>
      <a class="review-link" data-review-target="effects" data-preload-state="queued" href="./review-effects.html"><span class="review-link-label">エフェクト</span><small class="review-preload-state" data-review-preload-state>準備待ち</small></a>
      <a class="review-link primary" data-review-target="battle" data-preload-state="queued" href="./review-battle.html"><span class="review-link-label">実戦</span><small class="review-preload-state" data-review-preload-state>準備待ち</small></a>
    </nav>
  </div>
</main>
<script type="module" src="./src/review-preloader.js"></script>
</body>
</html>
