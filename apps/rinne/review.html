<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1211">
  <title>輪廻転焦 Visual Review</title>
</head>
<body>
  <main class="review-shell">
    <header class="review-header">
      <div><p class="eyebrow">RINNE · DEVELOP</p><h1>Visual Review</h1></div>
      <div class="source"><span>source</span><strong id="build-source">develop</strong></div>
    </header>

    <section id="review-home" class="review-home" aria-label="確認項目を選ぶ">
      <div class="home-lead">
        <div><p class="eyebrow">CHOOSE ONE</p><h2>何を見る？</h2></div>
        <div class="app-context" aria-label="確認するアプリ文脈">
          <span>文脈</span>
          <div class="app-context-buttons">
            <button type="button" class="active" data-app-context="rinne">輪廻転焦</button>
            <button type="button" data-app-context="village">MURAAAAAAA</button>
            <button type="button" data-app-context="demon">尽喰廻遊</button>
          </div>
        </div>
      </div>
      <p id="context-summary" class="context-summary">輪廻転焦の通常文脈</p>

      <nav class="review-launcher" aria-label="確認項目">
        <button type="button" data-view="characters"><strong>キャラ</strong><span>見た目・年齢・役割・カメラ</span></button>
        <button type="button" data-view="motion"><strong>モーション</strong><span>演舞・技・接触タイミング</span></button>
        <button type="button" data-view="assets"><strong>装備・物体</strong><span>装着とワールド物体</span></button>
        <button type="button" data-view="effects"><strong>エフェクト</strong><span>原本VFX・派手さ・負荷</span></button>
        <button type="button" data-view="battle" class="launcher-primary"><strong>実戦</strong><span>実モデル × Tidebreak</span></button>
      </nav>

      <details class="review-info">
        <summary>対象・正本を見る</summary>
        <div class="info-grid">
          <section>
            <div class="section-head compact"><div><p class="eyebrow">SHARED HUMAN</p><h3>3アプリ共通</h3></div><div class="catalog-meta"><strong id="foundation-id">-</strong><span id="foundation-rig">-</span></div></div>
            <div id="app-status-grid" class="app-status-grid"></div>
          </section>
          <section>
            <div class="section-head compact"><div><p class="eyebrow">CANONICAL MOTION</p><h3>技・閃き候補</h3></div><div class="catalog-meta"><strong id="catalog-revision">-</strong><span id="motion-count">-</span></div></div>
            <div id="weapon-tabs" class="weapon-tabs" role="tablist"></div>
            <div id="inspiration-phases" class="phase-grid"></div>
          </section>
          <section class="object-catalog"><h3>共有ワールド物体 / 素材</h3><div id="world-object-grid"></div></section>
        </div>
      </details>
    </section>

    <section id="focus-shell" class="focus-shell" hidden>
      <header class="focus-bar">
        <button id="focus-back" type="button" class="back-button" aria-label="確認項目へ戻る">←</button>
        <strong id="focus-title">確認</strong>
        <label class="focus-context">文脈
          <select id="focus-app-context">
            <option value="rinne">輪廻転焦</option>
            <option value="village">MURAAAAAAA</option>
            <option value="demon">尽喰廻遊</option>
          </select>
        </label>
        <a id="focus-open" class="focus-open" href="#" target="_blank" rel="noopener">別画面</a>
      </header>

      <section class="review-view framed" data-panel="characters" data-title="キャラ" data-open="./characters.html">
        <iframe title="キャラクター確認" data-src="./characters.html"></iframe>
      </section>

      <section class="review-view framed" data-panel="motion" data-title="モーション" data-open="./characters.html?review=motion">
        <iframe title="演舞・モーション確認" data-src="./characters.html?review=motion"></iframe>
      </section>

      <section class="review-view framed" data-panel="assets" data-title="装備・物体" data-open="./review-assets.html">
        <iframe title="モデル・装備確認" data-src="./review-assets.html"></iframe>
      </section>

      <section class="review-view framed" data-panel="effects" data-title="エフェクト" data-open="./review-effects.html">
        <iframe title="戦闘エフェクト確認" data-src="./review-effects.html"></iframe>
      </section>

      <section class="review-view battle-view" data-panel="battle" data-title="実戦" data-open="">
        <div class="battle-stage-shell">
          <canvas id="battle-canvas" aria-label="実モデルで動くTidebreak自動戦闘"></canvas>
          <div class="battle-topline">
            <div class="battle-state"><strong id="battle-result">準備中</strong><span id="battle-time">0.0秒</span></div>
            <output id="battle-model-status" role="status">モデル準備中</output>
          </div>
          <div class="battle-model-pickers">
            <label>左モデル<select id="battle-hero-model"></select></label>
            <span>表示だけ切替</span>
            <label>右モデル<select id="battle-enemy-model"></select></label>
          </div>
        </div>
        <div class="battle-hud">
          <article><span>LEFT · DEMON</span><strong id="hero-action">-</strong><progress id="hero-hp" max="1" value="1"></progress><small id="hero-meta">-</small></article>
          <article><span>RIGHT · HUMAN</span><strong id="enemy-action">-</strong><progress id="enemy-hp" max="1" value="1"></progress><small id="enemy-meta">-</small></article>
          <div class="battle-actions"><button id="battle-restart" type="button">最初から</button><button id="battle-toggle" type="button">一時停止</button></div>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="./src/develop-review.js"></script>
</body>
</html>
