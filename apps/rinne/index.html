<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7896a1">
  <meta name="description" content="100年人生 — 輪廻転焦。暮らし、戦い、遺し、また生まれる。">
  <title>100年人生 — 輪廻転焦</title>
  <link rel="icon" href="./favicon.svg?v=1" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/rebuild/app.css">
  <link rel="stylesheet" href="./src/rebuild/pop.css">
  <link rel="stylesheet" href="./src/rebuild/birth-tour.css">
  <link rel="stylesheet" href="./src/consumer-game-ui.css">
  <link rel="stylesheet" href="./src/rebuild/button-help.css">
  <link rel="stylesheet" href="./src/typography.css">
</head>
<body>
<main id="app" data-screen="loading">
  <section id="title-screen" class="title-screen" aria-labelledby="title-mark" hidden>
    <div class="title-rune" aria-hidden="true"></div>
    <div class="title-lockup">
      <div class="crest-ring"><img class="crest" src="./title-assets/crest.svg" alt=""></div>
      <p class="eyebrow">A LIFE, THEN ANOTHER</p>
      <h1 id="title-mark">100年人生</h1>
      <p class="subtitle">輪廻転焦</p>
      <p class="tagline">暮らし、戦い、遺し、また生まれる。</p>
    </div>
    <div class="title-actions" aria-label="ゲーム開始">
      <label class="name-field"><span>名</span><input id="life-name" maxlength="12" autocomplete="off" value="旅人"></label>
      <button id="continue-life" class="primary" type="button" hidden><strong>つづきから</strong><small id="continue-detail"></small></button>
      <button id="new-life" class="primary" type="button"><strong>新しい人生</strong><small>0歳</small></button>
      <a class="secondary" href="./simulator/index.html"><strong>稽古場</strong><small>技・装備</small></a>
      <button id="open-village" class="secondary" type="button"><strong>友達と遊ぶ</strong><small>試遊の村</small></button>
    </div>
    <p id="boot-status" class="boot-status" role="status" aria-live="polite">世界を準備しています</p>
    <footer><span id="build-label">LOCAL</span><span>輪廻転焦</span></footer>
  </section>

  <section id="game-screen" class="game-screen is-loading" data-world-tone="village" aria-busy="true" aria-label="100年人生 本編">
    <canvas id="game" aria-label="村と旅人の世界"></canvas>
    <div class="world-vignette" aria-hidden="true"></div>
    <div id="actor-status-layer" class="actor-status-layer" aria-hidden="true"></div>
    <div id="chapter-mark" class="chapter-mark" hidden aria-hidden="true"><span>輪廻転焦</span><strong id="chapter-title"></strong><i></i></div>
    <div id="loading-card" class="loading-card" aria-live="polite">
      <div class="loading-emblem" aria-hidden="true"><span></span><i></i></div>
      <strong id="loading-title">世界をつくっています</strong>
      <small id="loading-message">人生の入口を開いています</small>
      <div class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <button id="boot-retry" class="primary loading-retry" type="button" hidden><strong>もう一度</strong><small>世界を開き直す</small></button>
    </div>
    <header class="hud-top">
      <button id="back-title" class="icon-button" type="button" aria-label="タイトルへ戻る">‹</button>
      <button id="open-coop-game" class="icon-button" type="button" hidden>友達</button>
      <div class="life-chip ornate"><span id="generation">1代目</span><strong id="age">0歳</strong></div>
      <div class="bars ornate"><label><span>命</span><i><b id="hp-bar"></b></i></label><label><span>息</span><i><b id="stamina-bar"></b></i></label></div>
      <label class="clock-rate ornate"><span>時</span><select id="clock-rate" aria-label="世界時計の速さ"><option value="1">1×</option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option></select></label>
    </header>
    <aside class="objective-card ornate">
      <div class="objective-meta"><span id="life-stage">1/6 誕生</span><small id="objective-badge">自立 4歳</small></div>
      <strong id="objective">村を知る</strong>
    </aside>
    <div id="dialogue" class="dialogue ornate" hidden><span id="speaker">母</span><p id="dialogue-text"></p></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <button id="move-hint" class="move-hint" type="button" aria-label="動きかた。押すと移動操作の説明を表示します">スワイプで移動</button>
    <p id="coop-people" aria-live="polite"></p>
    <div id="coop-darkness" hidden role="status"><p>世界は闇に包まれています</p><span>村とのつながりを待っています</span><button id="coop-leave" type="button">タイトルへ</button></div>
  </section>
</main>
<dialog id="village-dialog" aria-labelledby="village-dialog-title">
  <form method="dialog"><button id="close-village" type="button" aria-label="村への参加を閉じる">閉じる</button></form>
  <h2 id="village-dialog-title">友達と遊ぶ</h2>
  <div id="village-panel"></div>
</dialog>
<noscript>100年人生を開くにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
