<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101816">
  <meta name="description" content="100年人生 — 輪廻転焦。暮らし、戦い、遺し、また生まれる。">
  <title>100年人生 — 輪廻転焦</title>
  <link rel="icon" href="./title-assets/crest.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/rebuild/app.css">
</head>
<body>
<main id="app" data-screen="title">
  <section id="title-screen" class="title-screen" aria-labelledby="title-mark">
    <div class="title-lockup">
      <img class="crest" src="./title-assets/crest.svg" alt="">
      <p class="eyebrow">A LIFE, THEN ANOTHER</p>
      <h1 id="title-mark">100年人生</h1>
      <p class="subtitle">輪廻転焦</p>
      <p class="tagline">暮らし、戦い、遺し、また生まれる。</p>
    </div>
    <div class="title-actions" aria-label="ゲーム開始">
      <label class="name-field"><span>名</span><input id="life-name" maxlength="12" autocomplete="off" value="旅人"></label>
      <button id="continue-life" class="primary" type="button" hidden><strong>つづきから</strong><small id="continue-detail"></small></button>
      <button id="new-life" class="primary" type="button"><strong>新しい人生</strong><small>0歳から100歳まで、一つの生を歩く</small></button>
      <a class="secondary" href="./simulator/index.html"><strong>稽古場</strong><small>技と装備の調整</small></a>
      <button id="open-village" class="secondary" type="button"><strong>村へ参加</strong><small>村長の参加コードでつながる</small></button>
    </div>
    <p id="boot-status" class="boot-status" role="status" aria-live="polite">準備できています</p>
    <footer><span id="build-label">LOCAL</span><span>輪廻転焦</span></footer>
  </section>

  <section id="game-screen" class="game-screen" hidden aria-label="100年人生 本編">
    <canvas id="game" aria-label="村と旅人の世界"></canvas>
    <div id="loading-card" class="loading-card" aria-live="polite"><strong id="loading-title">世界を開いています</strong><small id="loading-message">共有の村を読み込んでいます</small></div>
    <header class="hud-top">
      <button id="back-title" class="icon-button" type="button" aria-label="タイトルへ戻る">‹</button>
      <div class="life-chip"><span id="generation">1代目</span><strong id="age">0歳</strong></div>
      <div class="bars"><label><span>命</span><i><b id="hp-bar"></b></i></label><label><span>息</span><i><b id="stamina-bar"></b></i></label></div>
      <label class="clock-rate"><span>時</span><select id="clock-rate" aria-label="世界時計の速さ"><option value="1">1×</option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option></select></label>
    </header>
    <aside class="objective-card" aria-live="polite">
      <div class="objective-meta"><span id="life-stage">人生 1/6 · 誕生</span><small id="place">MURAAAAAAA</small></div>
      <strong id="objective">母と村を歩き、世界を知る</strong>
      <small id="objective-detail">4歳になると自分の足で村の暮らしが始まります</small>
      <div id="waypoint" class="waypoint" hidden><b id="waypoint-arrow" aria-hidden="true">↑</b><span><strong id="waypoint-label"></strong><small id="waypoint-distance"></small></span></div>
    </aside>
    <div id="dialogue" class="dialogue" hidden><span id="speaker">母</span><p id="dialogue-text"></p></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <button id="talk" class="talk-button" type="button"><span>話</span><small>話す</small></button>
    <p id="move-hint" class="move-hint">スワイプした方向へ歩く</p>
  </section>
</main>
<dialog id="village-dialog" aria-labelledby="village-dialog-title">
  <form method="dialog"><button id="close-village" type="button" aria-label="村への参加を閉じる">閉じる</button></form>
  <h2 id="village-dialog-title">村へ参加</h2>
  <div id="village-panel"></div>
</dialog>
<noscript>100年人生を開くにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
