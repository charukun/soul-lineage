<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111716"><title>着せ替え確認 | 輪廻転焦</title>
</head>
<body>
<main class="asset-review">
<header class="asset-topbar">
<a class="asset-back" href="./review.html" aria-label="確認メニューへ戻る">‹</a>
<h1>着せ替え確認</h1>
</header>
<section class="asset-stage" aria-label="キャラクターと装備のプレビュー">
<div class="asset-canvas-wrap"><canvas id="asset-stage"></canvas></div>
<nav id="asset-camera-strip" class="asset-camera-strip" aria-label="カメラの向き">
<button type="button" data-asset-camera="front">正面</button>
<button type="button" data-asset-camera="side">横</button>
<button type="button" data-asset-camera="back">背面</button>
<button type="button" data-asset-camera="full">全身</button>
</nav>
</section>
<aside class="asset-controls">
<header class="asset-heading">
<p>キャラクターと装備を選んで、見た目を確認します。</p>
<small>ドラッグ: 回転　ピンチ: 拡大</small>
</header>
<h2>キャラクター</h2>
<div id="model-options" class="model-options" role="group" aria-label="Skeletonモデル"></div>
<h2>装備</h2>
<div class="slot-grid">
<label>右手<select id="slot-main" aria-label="右手装備"></select></label>
<label>左手<select id="slot-off" aria-label="左手装備"></select></label>
<label>背中<select id="slot-back" aria-label="背中装備"></select></label>
</div>
<button id="asset-reset" class="asset-reset" type="button">すべて外す</button>
<output id="asset-status" class="asset-status" role="status" aria-live="polite">読み込み中…</output>
<details class="asset-details"><summary>素材情報</summary><p id="asset-provenance" class="asset-provenance"></p></details>
</aside>
</main>
<script type="module" src="./src/review-asset-library.js"></script>
</body>
</html>
