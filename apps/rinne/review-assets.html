<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110"><title>装備確認 | 輪廻転焦</title>
</head>
<body>
<main class="asset-review">
<header class="asset-topbar">
  <div class="asset-title"><small>EQUIPMENT PROBE</small><h1>装備確認</h1></div>
  <div id="asset-load-state" class="asset-load-state" data-state="loading" aria-live="polite"><span aria-hidden="true"></span><strong>準備中</strong></div>
</header>

<section class="asset-stage" aria-label="キャラクター装備のプレビュー">
  <div class="asset-canvas-wrap"><canvas id="asset-stage" aria-label="装備プレビュー。ドラッグで自由回転、ピンチで拡大"></canvas></div>
  <div class="asset-stage-readout">
    <span>CURRENT SET</span>
    <strong id="asset-combination">読み込み中</strong>
    <small id="asset-stage-hint">ドラッグ: 自由回転 · ピンチ: 拡大</small>
  </div>
  <div class="asset-view-tools" aria-label="確認視点">
    <div class="asset-view-group">
      <span>向き</span>
      <nav id="asset-camera-strip" class="asset-camera-strip" aria-label="カメラの向き">
        <button type="button" data-asset-camera="front">正面</button>
        <button type="button" data-asset-camera="side">横</button>
        <button type="button" data-asset-camera="back">背面</button>
      </nav>
    </div>
    <div class="asset-view-group">
      <span>注視</span>
      <nav id="asset-focus-strip" class="asset-focus-strip" aria-label="注視する装備位置">
        <button type="button" data-asset-focus="full">全身</button>
        <button type="button" data-asset-focus="main">右手</button>
        <button type="button" data-asset-focus="off">左手</button>
        <button type="button" data-asset-focus="back">背中</button>
      </nav>
    </div>
  </div>
</section>

<aside class="asset-controls">
  <section id="asset-review-points" class="asset-review-points" aria-labelledby="asset-review-points-title">
    <header><span>REVIEW POINTS</span><h2 id="asset-review-points-title">ここを見る</h2></header>
    <div class="asset-review-point-grid">
      <div><b>01</b><strong>装着位置</strong><small>手・背中のアンカー位置と角度</small></div>
      <div><b>02</b><strong>干渉</strong><small>手指・腕・身体へのめり込み</small></div>
      <div><b>03</b><strong>尺度</strong><small>モデルを替えても大きさが自然か</small></div>
      <div><b>04</b><strong>裏側</strong><small>横・背面から破綻していないか</small></div>
    </div>
  </section>

  <section class="asset-section" aria-labelledby="asset-model-title">
    <header class="asset-section-head"><div><span>BASE MODEL</span><h2 id="asset-model-title">検証モデル</h2></div><small>装備の適合を見るための素体</small></header>
    <div id="model-options" class="model-options" role="group" aria-label="検証モデル"></div>
  </section>

  <section class="asset-section asset-equipment-section" aria-labelledby="asset-equipment-title">
    <header class="asset-section-head"><div><span>EQUIPMENT</span><h2 id="asset-equipment-title">装備スロット</h2></div><button id="asset-reset" class="asset-reset" type="button">全解除</button></header>
    <div id="asset-slot-tabs" class="asset-slot-tabs" role="tablist" aria-label="装備スロット">
      <button type="button" data-asset-slot="main" role="tab" aria-selected="true"><small>右手</small><strong id="asset-current-main">なし</strong></button>
      <button type="button" data-asset-slot="off" role="tab" aria-selected="false"><small>左手</small><strong id="asset-current-off">なし</strong></button>
      <button type="button" data-asset-slot="back" role="tab" aria-selected="false"><small>背中</small><strong id="asset-current-back">なし</strong></button>
    </div>
    <div class="asset-candidate-head"><span id="asset-candidate-label">右手の候補</span><small>タップで即時反映</small></div>
    <div id="asset-equipment-options" class="asset-equipment-options" role="listbox" aria-label="右手装備の候補"></div>
    <div class="asset-native-selects" hidden>
      <label>右手<select id="slot-main" aria-label="右手装備"></select></label>
      <label>左手<select id="slot-off" aria-label="左手装備"></select></label>
      <label>背中<select id="slot-back" aria-label="背中装備"></select></label>
    </div>
  </section>

  <output id="asset-status" class="asset-status" role="status" aria-live="polite">モデルを読み込んでいます。</output>
  <details class="asset-details"><summary>出典・素材情報</summary><p id="asset-provenance" class="asset-provenance"></p></details>
</aside>
</main>
<script type="module" src="./src/review-asset-library.js"></script>
</body>
</html>
