<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111716"><title>モデル・装備 | 輪廻転焦 Visual Review</title>
</head>
<body>
<main class="asset-review">
<section class="asset-stage" aria-label="Review専用モデル・装備プレビュー">
<canvas id="asset-stage"></canvas><p class="asset-badge">CURRENT DEVELOP · REVIEW ONLY</p>
</section>
<aside class="asset-controls">
<h1>モデル・装備</h1>
<p>現行developに接続しないReview専用ライブラリです。gameplay・inventory・save・Production stage・visualApprovalは変更しません。</p>
<h2>モデル</h2><div id="model-options" class="model-options" role="group" aria-label="Skeletonモデル"></div>
<h2>装備</h2>
<div class="slot-grid">
<label>右手<select id="slot-main" aria-label="右手装備"></select></label>
<label>左手<select id="slot-off" aria-label="左手装備"></select></label>
<label>背中<select id="slot-back" aria-label="背中装備"></select></label>
</div>
<button id="asset-reset" class="asset-reset" type="button">装備を外して全身表示</button>
<output id="asset-status" class="asset-status" role="status" aria-live="polite">準備中</output>
<p id="asset-provenance" class="asset-provenance"></p>
</aside>
</main>
<script type="module" src="./src/review-asset-library.js"></script>
</body>
</html>
