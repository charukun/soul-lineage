<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml"><title>Visual Review｜装備</title>
</head>
<body>
<main class="asset-review review-surface">
  <header class="review-header review-surface__header">
    <div class="review-title review-surface__title">
      <a class="review-lab-back review-surface__back" data-review-back href="https://soul-lineage-review-dev.c-okamoto.workers.dev/" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <h1>装備</h1>
    </div>
  </header>

  <section class="asset-workspace review-surface__workspace" aria-label="装備レビュー">
    <div class="asset-preview-pane review-surface__stage-column">
      <section class="asset-stage-shell review-surface__stage" aria-label="キャラクター装備のプレビュー">
        <canvas id="asset-stage" aria-label="装備プレビュー。ドラッグで自由回転、ピンチで拡大"></canvas>

        <div class="asset-stage-slot" aria-live="polite">
          <strong id="asset-combination">読み込み中</strong>
        </div>
        <div class="asset-camera-strip asset-stage-cameras" aria-label="表示方向">
          <button type="button" data-asset-camera="front" aria-pressed="true">正面</button>
          <button type="button" data-asset-camera="left" aria-pressed="false">左</button>
          <button type="button" data-asset-camera="right" aria-pressed="false">右</button>
          <button type="button" data-asset-camera="back" aria-pressed="false">背面</button>
        </div>
      </section>
    </div>

    <aside class="asset-catalog review-surface__panel" aria-label="装備レビュー操作">
      <section class="asset-section asset-equipment-section asset-primary-selection" aria-labelledby="asset-equipment-title">
        <div class="asset-primary-head">
          <h2 id="asset-equipment-title">装備</h2>
          <button id="asset-reset" class="asset-reset" type="button">全解除</button>
        </div>
        <div id="asset-slot-tabs" class="asset-slot-tabs review-slot-tabs" style="--review-slot-columns:3" role="tablist" aria-label="装備スロット">
          <button type="button" data-asset-slot="main" role="tab" aria-selected="true"><small>右手</small><strong id="asset-current-main">なし</strong></button>
          <button type="button" data-asset-slot="off" role="tab" aria-selected="false"><small>左手</small><strong id="asset-current-off">なし</strong></button>
          <button type="button" data-asset-slot="back" role="tab" aria-selected="false"><small>背中</small><strong id="asset-current-back">なし</strong></button>
        </div>

        <div class="asset-candidate-head review-selection-current"><strong id="asset-candidate-label">右手</strong></div>
        <div id="asset-equipment-options" class="asset-equipment-options review-choice-grid" role="listbox" aria-label="右手装備の候補"></div>
        <button id="asset-clear-slot" class="asset-clear-slot" type="button">右手の装備を外す</button>

        <div class="asset-native-selects" hidden>
          <label>右手<select id="slot-main" aria-label="右手装備"></select></label>
          <label>左手<select id="slot-off" aria-label="左手装備"></select></label>
          <label>背中<select id="slot-back" aria-label="背中装備"></select></label>
        </div>
      </section>

      <section class="asset-section asset-model-section" aria-labelledby="asset-model-title">
        <h2 id="asset-model-title">素体選択</h2>
        <button id="asset-model-trigger" class="asset-model-trigger" type="button" aria-haspopup="dialog" aria-controls="asset-model-picker" aria-expanded="false">
          <strong id="asset-model-current">読み込み中</strong><span aria-hidden="true">⌄</span>
        </button>
      </section>

      <output id="asset-status" class="asset-status" role="status" aria-live="polite">モデルを読み込んでいます。</output>

    </aside>
  </section>

  <div id="asset-model-picker" class="asset-model-picker" hidden role="dialog" aria-modal="true" aria-labelledby="asset-model-picker-title">
    <button class="asset-model-picker-backdrop" type="button" data-model-picker-close aria-label="素体選択を閉じる"></button>
    <section class="asset-model-picker-sheet">
      <div class="asset-model-picker-head">
        <h2 id="asset-model-picker-title">素体を選択</h2>
        <button type="button" class="asset-model-picker-close" data-model-picker-close aria-label="閉じる">×</button>
      </div>
      <div id="model-options" class="model-options review-choice-grid" role="listbox" aria-label="検証モデル"></div>
    </section>
  </div>
</main>
<script type="module" src="./src/review-asset-library.js"></script>
</body>
</html>
