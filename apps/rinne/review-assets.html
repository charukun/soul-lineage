<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1110">
<link rel="icon" href="./review-favicon.svg?v=1" type="image/svg+xml"><title>Visual Review｜装備</title>
</head>
<body>
<main class="asset-review review-surface">
  <header class="review-header review-surface__header">
    <div class="review-title review-surface__title">
      <a class="review-lab-back review-surface__back" data-review-back href="https://soul-lineage-review-dev.c-okamoto.workers.dev/" aria-label="Visual Reviewへ戻る">‹ 戻る</a>
      <h1>装備</h1>
    </div>
  </header>

  <section class="asset-workspace review-surface__workspace" aria-label="装備レビュー">
    <div class="asset-preview-pane review-surface__stage-column">
      <section class="asset-stage-shell review-surface__stage" aria-label="キャラクター装備のプレビュー">
        <canvas id="asset-stage" aria-label="装備プレビュー。ドラッグで自由回転、ピンチで拡大"></canvas>

        <button class="asset-stage-front" type="button" data-asset-camera="front" aria-pressed="true" aria-label="正面に戻す">正面</button>
      </section>
    </div>

    <aside class="asset-catalog review-surface__panel" aria-label="装備レビュー操作">
      <section class="asset-section asset-weapon-section" aria-label="主人公の武器種">
        <div id="asset-weapon-types" class="asset-weapon-types review-choice-grid" role="listbox" aria-label="主人公の武器種"></div>
      </section>

      <details class="asset-equipment-details">
        <summary>詳細装備</summary>
        <section class="asset-section asset-equipment-section" aria-label="詳細装備">
          <div id="asset-slot-tabs" class="asset-slot-tabs review-slot-tabs" style="--review-slot-columns:3" role="tablist" aria-label="装備スロット">
            <button type="button" data-asset-slot="main" role="tab" aria-selected="true"><small>右手</small><strong id="asset-current-main">なし</strong></button>
            <button type="button" data-asset-slot="off" role="tab" aria-selected="false"><small>左手</small><strong id="asset-current-off">なし</strong></button>
            <button type="button" data-asset-slot="back" role="tab" aria-selected="false"><small>背中</small><strong id="asset-current-back">なし</strong></button>
          </div>
          <div id="asset-equipment-options" class="asset-equipment-options review-choice-grid" role="listbox" aria-label="右手装備の候補"></div>
          <button id="asset-reset" class="asset-reset" type="button">全解除</button>

          <div class="asset-native-selects" hidden>
            <label>右手<select id="slot-main" aria-label="右手装備"></select></label>
            <label>左手<select id="slot-off" aria-label="左手装備"></select></label>
            <label>背中<select id="slot-back" aria-label="背中装備"></select></label>
          </div>
        </section>
      </details>

      <output id="asset-status" class="asset-status" role="status" aria-live="polite">モデルを読み込んでいます。</output>

    </aside>
  </section>

</main>
<script type="module" src="./src/review-asset-library.js"></script>
</body>
</html>
