<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111716"><title>着せ替え確認 | 輪廻転焦</title>
</head>
<body>
<main class="asset-review">
<section class="asset-stage" aria-label="キャラクターと装備のプレビュー">
<canvas id="asset-stage"></canvas>
<p class="asset-badge">プレビュー</p>
<p class="asset-help">ドラッグで回転 · ピンチで拡大</p>
</section>
<aside class="asset-controls">
<header class="asset-heading">
<h1>着せ替え確認</h1>
<p>キャラクターと装備を選んで、見た目を確認できます。ゲーム本編のデータは変わりません。</p>
</header>
<h2><span class="asset-step">1</span>キャラクターを選ぶ</h2>
<div id="model-options" class="model-options" role="group" aria-label="Skeletonモデル"></div>
<h2><span class="asset-step">2</span>装備を選ぶ</h2>
<div class="slot-grid">
<label>右手<select id="slot-main" aria-label="右手装備"></select></label>
<label>左手<select id="slot-off" aria-label="左手装備"></select></label>
<label>背中<select id="slot-back" aria-label="背中装備"></select></label>
</div>
<button id="asset-reset" class="asset-reset" type="button">装備をすべて外す</button>
<output id="asset-status" class="asset-status" role="status" aria-live="polite">読み込み中…</output>
<details class="asset-details"><summary>素材情報</summary><p id="asset-provenance" class="asset-provenance"></p></details>
</aside>
</main>
<script type="module" src="./src/review-asset-library.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
