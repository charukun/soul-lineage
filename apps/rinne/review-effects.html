<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d0d"><title>戦闘エフェクト確認 | Visual Review</title>
<link rel="stylesheet" href="./src/review-effects.css">
</head>
<body>
<main class="fx-review">
<header><div><p class="eyebrow">AUTHORED RUNTIME VFX</p><h1>戦闘エフェクト</h1></div><output id="fx-status" role="status">原本を準備中</output></header>
<section class="stage-shell"><canvas id="fx-stage" aria-label="派手な戦闘エフェクト確認。ドラッグで回転、ピンチで拡大"></canvas><div class="stage-label"><span>HUMAN</span><span>CONTACT</span><span>ENEMY</span></div></section>
<section class="controls" aria-label="エフェクト確認操作">
<div class="preset-grid">
<button type="button" data-preset="slash" class="primary">斬撃＋命中</button>
<button type="button" data-preset="impact">被弾</button>
<button type="button" data-preset="finisher">急・大技</button>
<button type="button" data-preset="storm">派手さ確認</button>
</div>
<div class="control-row">
<label>再生速度<select id="fx-speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
<label>負荷tier<select id="fx-tier"><option value="0">FULL</option><option value="1">MID</option><option value="2">LOW</option><option value="3">MIN</option></select></label>
<label class="check"><input id="fx-loop" type="checkbox">反復</label>
<label class="check"><input id="fx-reduced" type="checkbox">Reduced motion</label>
</div>
<div class="control-row actions"><button id="fx-pause" type="button">一時停止</button><button id="fx-clear" type="button">消去</button><button id="fx-camera" type="button">カメラを戻す</button></div>
<output id="fx-metrics">backend: loading</output>
<details><summary>原本・確認境界</summary><p id="fx-provenance"></p><p>この画面はゲーム本体と同じ authored effect player / Effekseer backend を使います。レビュー用イベントは見た目を発火するためだけの入力で、ダメージ判定や戦闘ルールを複製しません。</p></details>
</section>
</main>
<script type="module" src="./src/review-effects.js"></script>
<script type="module" src="./src/review-slot-auto.js"></script>
</body>
</html>
