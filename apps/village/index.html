<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2"><link rel="shortcut icon" href="./favicon.svg?v=2"><meta name="theme-color" content="#879a7a"><title>MURAAAAAAA | 輪廻転焦 Village</title><link rel="stylesheet" href="./src/web/style.css"><link rel="stylesheet" href="./src/web/tactile.css"></head><body>
<canvas id="game" aria-label="村。指でなぞって移動、二本指で拡大縮小。建物をタップすると編集できます。"></canvas>
<div id="loading"><span class="eyebrow">輪廻転焦 VILLAGE</span><p class="loadingTitle">MURAAAAAAA</p><p id="loadText">暮らしと守りが、道をつくる。</p><progress id="progress" max="100" value="5"></progress><button id="retry" hidden>再試行</button><button id="recover" hidden>復旧</button></div>
<header id="title"><img id="emblem" alt="輪廻転焦の紋章"><span class="eyebrow">輪廻転焦 VILLAGE</span><h1>MURAAAAAAA</h1><p id="calendar"></p><p id="status" role="status" aria-live="polite"></p></header>
<section id="idleStatus" aria-label="無操作中の村の状況"><span class="eyebrow">村 の い ま</span><p id="idleMood"></p><div class="idleFacts"><span><b id="idlePopulation"></b>暮らす人</span><span><b id="idleSafety"></b>村の守り</span><span><b id="idleBeds"></b>空き寝床</span></div><p id="idleResources"></p><p id="idleNote"></p></section>
<p id="idleMoment"></p><div id="speechLayer" aria-hidden="true"></div>
<div id="tutorial" hidden><button id="tutorialAction"><small id="tutorialCount"></small><span id="tutorialText"></span><span class="tutorialArrow">›</span></button><button id="dismissTutorial" aria-label="はじめの案内を閉じる">×</button></div>
<div id="muraModeControls"><button id="leaveRoom" hidden>村へ戻る</button><button id="muraEndObservation" hidden>俯瞰</button></div>
<div id="drawer" class="glass" hidden><p id="stockTray"></p><div id="tabs"></div><div id="catalog"></div><footer><small>タップで選択 · 長押しで移動</small><div><button id="undo">取り消す</button></div></footer></div>
<button id="build" class="glass" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m14 3 7 7-3 3-3-3-9 10-3-3 10-9-2-2z"/></svg><span>つくる</span></button>
<div id="context" class="glass" hidden><div class="contextTop"><span id="objectLabel"></span><button id="deselect" aria-label="選択を解除">×</button></div><p id="objectInfo"></p><div class="actions"><button id="move">移動</button><button id="enter">内装</button><button id="details">詳細</button></div></div>
<div id="placement" class="glass" hidden><span id="placementText"></span><div id="materialChoices"></div><small id="placementCost"></small><div class="rotationControl"><label for="muraRotation">回転</label><output id="muraRotationValue">0°</output><input id="muraRotation" type="range" min="0" max="360" step="1" value="0"></div><div class="actions"><button id="rotate" aria-label="90度回転">90°</button><button id="muraCancelPlacement">取消</button><button id="cancelPlace">配置</button></div></div>
<div id="toast" hidden><span id="toastText"></span></div>
<dialog id="dialog"><div id="dialogContent"></div><footer class="dialogNavigation"><button type="button" id="muraDialogBack" hidden>戻る</button><form method="dialog"><button class="dialogClose">閉じる</button></form></footer></dialog>
<dialog id="onlineDialog"><p>参加コードでつなぐ共通村の対戦です。建築・住民の生活シミュレーションとは別に進行します。</p><main id="onlineHost"></main><form method="dialog"><button>村へ戻る</button></form></dialog>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT'&&!window.village){document.getElementById('loadText').textContent='起動用ファイルを取得できませんでした。通信状態を確認して再試行してください。';document.getElementById('retry').hidden=false;document.getElementById('game').dataset.renderer='error';}},true);
document.getElementById('retry').onclick=function(){location.reload();};
</script>
<script type="module" src="./src/main.js"></script></body></html>
