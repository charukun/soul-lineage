<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="公開プロジェクトを歩くように巡る、動くリンクギャラリー。">
  <title>WAYFINDER — A Moving Directory</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="light-vignette" aria-hidden="true"></div>

  <div class="orbit-mark" aria-hidden="true">
    <span class="orbit-dot"></span>
    <span id="room-counter">00 / 00</span>
  </div>

  <div class="global-actions" aria-label="このページを共有">
    <button id="share-page" class="global-action global-share" type="button">
      <span>↗</span><b>SHARE</b>
    </button>
    <button id="copy-page" class="global-action" type="button">
      <span>⧉</span><b>COPY URL</b>
    </button>
  </div>

  <div id="journey">
    <section class="arrival" data-scene="intro">
      <div class="arrival-core">
        <p class="arrival-code">WAYFINDER / 00</p>
        <div class="arrival-title" aria-label="Wayfinder">
          <span>WAY</span><span class="outline">FINDER</span>
        </div>
        <p class="arrival-copy">リンク集ではなく、移動するギャラリー。<br>スクロールすると次の「部屋」へ歩いていきます。</p>
        <div class="scroll-instruction"><i></i><span>SCROLL TO WALK</span></div>
      </div>
    </section>

    <div id="rooms" aria-live="polite">
      <section class="room loading-room">
        <div class="room-stage">
          <p>EXHIBITION LOADING</p>
        </div>
      </section>
    </div>

    <section class="departure" data-scene="outro">
      <div class="departure-copy">
        <p>END OF CURRENT EXHIBITION</p>
        <strong>まだ増える。</strong>
        <span>新しい公開先が増えたら、この廊下の続きを伸ばします。</span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="room-template">
    <section class="room" data-scene="room">
      <div class="room-stage">
        <div class="room-copy">
          <p class="room-code"></p>
          <p class="room-site"></p>
          <h2></h2>
          <p class="room-description"></p>
          <div class="room-actions"></div>
        </div>

        <div class="art-wall">
          <div class="frame-shadow" aria-hidden="true"></div>
          <figure class="preview-frame">
            <div class="preview-loading"><span></span></div>
            <img class="preview-image" alt="" loading="lazy">
            <video class="preview-video" muted loop playsinline preload="metadata"></video>
            <figcaption>
              <span class="preview-type"></span>
              <span class="preview-domain"></span>
            </figcaption>
          </figure>
          <div class="preview-meta">
            <p class="preview-title"></p>
            <p class="preview-description"></p>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
