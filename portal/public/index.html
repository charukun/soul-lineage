<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="description" content="輪廻転焦と関連プロジェクトの公開アプリ・開発ラボへの入口">
  <title>RINNE GATE — Public Builds & Labs</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="shell">
    <header class="masthead">
      <a class="brand" href="#top" aria-label="RINNE GATE top">
        <span class="brand-mark">輪</span>
        <span><b>RINNE GATE</b><small>PUBLIC DIRECTORY</small></span>
      </a>
      <div class="live-indicator"><span></span> PUBLIC</div>
    </header>

    <section id="top" class="hero">
      <p class="hero-kicker">ONE GATE. MANY WORLDS.</p>
      <h1>遊ぶ。見る。<br><em>確かめる。</em></h1>
      <p class="hero-copy">輪廻転焦と、その周辺で生まれているゲーム、ラボ、開発ツールをひとつの入口に。</p>
      <div class="hero-meta">
        <span id="live-count">公開先を確認中</span>
        <span>NO LOGIN REQUIRED</span>
      </div>
    </section>

    <nav class="filters" aria-label="カテゴリ">
      <button class="filter active" type="button" data-filter="all">ALL</button>
      <button class="filter" type="button" data-filter="play">PLAY</button>
      <button class="filter" type="button" data-filter="lab">LAB</button>
      <button class="filter" type="button" data-filter="tools">TOOLS</button>
      <button class="filter" type="button" data-filter="source">SOURCE</button>
    </nav>

    <section class="directory" aria-live="polite">
      <div id="cards" class="cards">
        <article class="loading-card"><span></span><p>公開ディレクトリを読み込み中</p></article>
      </div>
    </section>

    <aside class="notice">
      <span class="notice-index">NOTE</span>
      <p><b>DEV</b> は開発中の公開版です。URLが確認できない別プロジェクトはLIVE扱いにせず、公開Repositoryとして分けています。</p>
    </aside>

    <footer>
      <div><b>RINNE GATE</b><span>Public builds / labs / tools</span></div>
      <a href="https://github.com/charukun/soul-lineage" target="_blank" rel="noreferrer">SOURCE ↗</a>
    </footer>
  </main>

  <template id="card-template">
    <article class="portal-card">
      <div class="card-glow" aria-hidden="true"></div>
      <header>
        <div>
          <p class="card-eyebrow"></p>
          <h2></h2>
        </div>
        <span class="arrow" aria-hidden="true">↗</span>
      </header>
      <p class="card-description"></p>
      <div class="card-tags"></div>
      <div class="card-links"></div>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
